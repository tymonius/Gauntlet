name: Render v0.6.1 Rulebook and Reference Guide

on:
  pull_request:
    branches:
      - main
    paths:
      - "releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.md"
      - "releases/v0.6.1/Gauntlet_v0.6.1_Reference_Guide.md"
      - "scripts/build_v061_documents.py"
      - ".github/workflows/render-v061-documents.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-v061-documents-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer poppler-utils fonts-liberation
          python -m pip install python-docx pypdf pymupdf

      - name: Build DOCX and PDF files
        run: python scripts/build_v061_documents.py

      - name: Validate generated documents
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          from pypdf import PdfReader

          release = Path('releases/v0.6.1')
          pairs = [
              ('Gauntlet_v0.6.1_Rulebook', 20),
              ('Gauntlet_v0.6.1_Reference_Guide', 3),
          ]
          for stem, minimum_pages in pairs:
              docx_path = release / f'{stem}.docx'
              pdf_path = release / f'{stem}.pdf'
              if docx_path.stat().st_size < 20_000:
                  raise SystemExit(f'{docx_path} is unexpectedly small')
              if pdf_path.stat().st_size < 20_000:
                  raise SystemExit(f'{pdf_path} is unexpectedly small')

              document = Document(docx_path)
              docx_text = '\n'.join(paragraph.text for paragraph in document.paragraphs)
              if 'v0.6.0' in docx_text or 'Battle Hand' in docx_text or 'hand commitment' in docx_text:
                  raise SystemExit(f'Obsolete text found in {docx_path}')
              if 'Gambit' not in docx_text or 'Tactic' not in docx_text or 'Aftermath' not in docx_text:
                  raise SystemExit(f'Core v0.6.1 terms missing from {docx_path}')

              reader = PdfReader(pdf_path)
              if len(reader.pages) < minimum_pages:
                  raise SystemExit(f'{pdf_path} has only {len(reader.pages)} pages')
              pdf_text = '\n'.join((page.extract_text() or '') for page in reader.pages)
              if 'v0.6.0' in pdf_text or 'Battle Hand' in pdf_text or 'hand commitment' in pdf_text:
                  raise SystemExit(f'Obsolete text found in {pdf_path}')
              if 'Gambit' not in pdf_text or 'Tactic' not in pdf_text or 'Aftermath' not in pdf_text:
                  raise SystemExit(f'Core v0.6.1 terms missing from {pdf_path}')
              print(f'Validated {stem}: {len(reader.pages)} PDF pages, {len(pdf_text)} extracted characters.')
          PY

      - name: Render PDF pages for visual inspection
        run: |
          mkdir -p /tmp/v061-render/rulebook /tmp/v061-render/reference
          pdftoppm -png -r 110 \
            releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.pdf \
            /tmp/v061-render/rulebook/page
          pdftoppm -png -r 130 \
            releases/v0.6.1/Gauntlet_v0.6.1_Reference_Guide.pdf \
            /tmp/v061-render/reference/page

      - name: Commit generated release documents when changed
        run: |
          git add \
            releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.docx \
            releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.pdf \
            releases/v0.6.1/Gauntlet_v0.6.1_Reference_Guide.docx \
            releases/v0.6.1/Gauntlet_v0.6.1_Reference_Guide.pdf
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Render v0.6.1 Rulebook and Reference Guide"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

      - name: Upload documents and rendered pages
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-v061-documents
          path: |
            releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.docx
            releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.pdf
            releases/v0.6.1/Gauntlet_v0.6.1_Reference_Guide.docx
            releases/v0.6.1/Gauntlet_v0.6.1_Reference_Guide.pdf
            /tmp/v061-render/rulebook/*.png
            /tmp/v061-render/reference/*.png
          if-no-files-found: error
