name: Validate v0.6.1 Rulebook content

on:
  pull_request:
    branches:
      - main
    paths:
      - "releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.md"
      - "releases/v0.6.1/faction-guides/**"
      - "scripts/restructure_v061_rulebook.py"
      - "scripts/sync_v061_rulebook.py"
      - "scripts/normalize_v061_rulebook_content.py"
      - "scripts/validate_v061_rulebook_content.py"
      - ".github/workflows/render-v061-documents.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-v061-rulebook-content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Rulebook content tools
        run: |
          python -m py_compile \
            scripts/restructure_v061_rulebook.py \
            scripts/sync_v061_rulebook.py \
            scripts/normalize_v061_rulebook_content.py \
            scripts/validate_v061_rulebook_content.py

      - name: Restructure shared rules into teaching order
        run: python scripts/restructure_v061_rulebook.py

      - name: Synchronize faction subsections from definitive guides
        run: python scripts/sync_v061_rulebook.py

      - name: Normalize headings and remove first-use leaks
        run: python scripts/normalize_v061_rulebook_content.py

      - name: Validate teaching order and first-use discipline
        run: python scripts/validate_v061_rulebook_content.py

      - name: Commit synchronized Rulebook source when changed
        run: |
          git add releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restructure v0.6.1 Rulebook for sequential learning"
          git pull --rebase origin ${{ github.head_ref || github.ref_name }}
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

      - name: Verify source is idempotent and current
        run: |
          python scripts/restructure_v061_rulebook.py --check
          python scripts/sync_v061_rulebook.py --check
          python scripts/normalize_v061_rulebook_content.py --check
          python scripts/validate_v061_rulebook_content.py
          git diff --exit-code -- releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.md

      - name: Upload content-review source
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-v061-rulebook-content
          path: releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.md
          if-no-files-found: error
