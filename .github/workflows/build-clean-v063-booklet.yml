name: Build clean v0.6.3 rulebook booklet

on:
  pull_request:
    paths:
      - '.github/workflows/build-clean-v063-booklet.yml'
      - 'scripts/render-clean-v063-booklet.mjs'
      - 'scripts/validate-clean-v063-booklet.mjs'
      - 'scripts/materialize-clean-v063-booklet.mjs'
      - 'artifacts/reconstruction/clean-v0.6.3/rulebook/Gauntlet_v0.6.3_Rulebook.md'
      - 'releases/v0.6.3-reconstructed/Gauntlet_v0.6.3_Rulebook.md'
      - 'rulebook/markdown.js'
      - 'images/sketches/hero-sketches/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-clean-v063-booklet.yml'
      - 'scripts/render-clean-v063-booklet.mjs'
      - 'scripts/validate-clean-v063-booklet.mjs'
      - 'scripts/materialize-clean-v063-booklet.mjs'
      - 'artifacts/reconstruction/clean-v0.6.3/rulebook/Gauntlet_v0.6.3_Rulebook.md'
      - 'releases/v0.6.3-reconstructed/Gauntlet_v0.6.3_Rulebook.md'
      - 'rulebook/markdown.js'
      - 'images/sketches/hero-sketches/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out booklet inputs
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install repository dependencies
        run: npm install

      - name: Install PDF build dependencies
        run: npm install --no-save pdf-lib

      - name: Install Chromium and PDF inspection tools
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Syntax-check booklet scripts
        run: |
          node --check scripts/render-clean-v063-booklet.mjs
          node --check scripts/validate-clean-v063-booklet.mjs
          node --check scripts/materialize-clean-v063-booklet.mjs

      - name: Render clean booklet
        run: node scripts/render-clean-v063-booklet.mjs

      - name: Validate clean booklet
        run: node scripts/validate-clean-v063-booklet.mjs

      - name: Preflight PDFs
        run: |
          set -euo pipefail
          out='artifacts/reconstruction/clean-v0.6.3/booklet/generated'
          pdfinfo "$out/Gauntlet_v0.6.3_Rulebook_Booklet_Reading_Order.pdf"
          pdfinfo "$out/Gauntlet_v0.6.3_Rulebook_Booklet.pdf"
          logical_pages=$(pdfinfo "$out/Gauntlet_v0.6.3_Rulebook_Booklet_Reading_Order.pdf" | awk '/^Pages:/ {print $2}')
          imposed_pages=$(pdfinfo "$out/Gauntlet_v0.6.3_Rulebook_Booklet.pdf" | awk '/^Pages:/ {print $2}')
          middle=$(( (logical_pages + 1) / 2 ))
          last=$logical_pages
          imposed_last=$imposed_pages
          mkdir -p /tmp/gauntlet-clean-v063-booklet-previews
          pdftoppm -png -r 130 -f 1 -singlefile "$out/Gauntlet_v0.6.3_Rulebook_Booklet_Reading_Order.pdf" /tmp/gauntlet-clean-v063-booklet-previews/logical-001-cover
          pdftoppm -png -r 130 -f "$middle" -singlefile "$out/Gauntlet_v0.6.3_Rulebook_Booklet_Reading_Order.pdf" /tmp/gauntlet-clean-v063-booklet-previews/logical-middle
          pdftoppm -png -r 130 -f "$last" -singlefile "$out/Gauntlet_v0.6.3_Rulebook_Booklet_Reading_Order.pdf" /tmp/gauntlet-clean-v063-booklet-previews/logical-last
          pdftoppm -png -r 130 -f 1 -singlefile "$out/Gauntlet_v0.6.3_Rulebook_Booklet.pdf" /tmp/gauntlet-clean-v063-booklet-previews/imposed-001
          pdftoppm -png -r 130 -f "$imposed_last" -singlefile "$out/Gauntlet_v0.6.3_Rulebook_Booklet.pdf" /tmp/gauntlet-clean-v063-booklet-previews/imposed-last

      - name: Upload booklet review package
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-clean-v063-rulebook-booklet
          path: |
            artifacts/reconstruction/clean-v0.6.3/booklet/generated/**
            /tmp/gauntlet-clean-v063-booklet-previews/**
          if-no-files-found: error

      - name: Materialize reviewed release booklet
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/v063-clean-rulebook-booklet'
        run: node scripts/materialize-clean-v063-booklet.mjs

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit reviewed release booklet
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/v063-clean-rulebook-booklet'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            releases/v0.6.3-reconstructed/Gauntlet_v0.6.3_Rulebook_Booklet.pdf \
            releases/v0.6.3-reconstructed/Gauntlet_v0.6.3_Manifest.json
          if git diff --cached --quiet; then
            echo 'Reviewed booklet already materialized.'
          else
            git commit -m 'Publish v0.6.3 printable rulebook booklet'
            git push origin HEAD:${{ github.head_ref }}
          fi
