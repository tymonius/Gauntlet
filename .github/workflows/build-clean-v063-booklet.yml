name: Build current Rulebook booklet

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-booklet:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out approved Rulebook production inputs
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /brand.css
            /assets/wordmark/
            /config/release-lifecycle.json
            /scripts/build-v063-rulebook-production.py
            /scripts/run-v063-rulebook-renderer.mjs
            /scripts/render-clean-v063-booklet.mjs
            /scripts/validate-clean-v063-booklet.mjs
            /scripts/validate-v063-rulebook-wordmark.mjs
            /scripts/materialize-clean-v063-booklet.mjs
            /scripts/publication-utils.mjs
            /rules-assistant/v063-last-stand-language.js
            /rulebook/index.html
            /rulebook/player-facing/chapter-11.md
            /rulebook/player-facing/corrections.js
            /rulebook-design/
            /rulebook-production/
            /releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.md
            /artifacts/reconstruction/clean-v0.6.3/rulebook/Gauntlet_v0.6.3_Rulebook.md
            /releases/v0.6.3/**
            /images/sketches/

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rulebook production dependencies
        run: |
          npm install
          npm install --no-save --package-lock=false pdf-lib
          npx playwright install --with-deps chromium

      - name: Install publication utility font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-inter
          fc-match Inter

      - name: Build and validate approved-design booklet
        run: |
          set -euo pipefail
          python -m py_compile scripts/build-v063-rulebook-production.py
          node --check scripts/run-v063-rulebook-renderer.mjs
          node --check scripts/render-clean-v063-booklet.mjs
          node --check scripts/validate-clean-v063-booklet.mjs
          node --check scripts/validate-v063-rulebook-wordmark.mjs
          node scripts/validate-v063-rulebook-wordmark.mjs
          node scripts/render-clean-v063-booklet.mjs
          node scripts/validate-clean-v063-booklet.mjs

      - name: Exercise historical v0.6.3 materialization
        shell: bash
        run: |
          set -euo pipefail
          node scripts/materialize-clean-v063-booklet.mjs

      - name: Upload current booklet review artifact
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-current-rulebook-booklet
          path: |
            artifacts/reconstruction/clean-v0.6.3/booklet/generated/**
            /tmp/rulebook-production-fidelity/**
            /tmp/rulebook-production/**
          if-no-files-found: error
