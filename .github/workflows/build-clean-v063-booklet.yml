name: Build clean v0.6.3 rulebook booklet

on:
  pull_request:
    paths:
      - '.github/workflows/build-clean-v063-booklet.yml'
      - 'scripts/render-clean-v063-booklet.mjs'
      - 'scripts/validate-clean-v063-booklet.mjs'
      - 'scripts/materialize-clean-v063-booklet.mjs'
      - 'artifacts/reconstruction/clean-v0.6.3/rulebook/Gauntlet_v0.6.3_Rulebook.md'
      - 'releases/v0.6.3-reconstructed/Gauntlet_v0.6.3_Rulebook.md'
      - 'rulebook/markdown.js'
      - 'images/sketches/hero-sketches/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-booklet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install booklet build dependencies
        run: |
          npm install
          npm install --no-save --package-lock=false pdf-lib
          npx playwright install --with-deps chromium

      - name: Build, validate, and materialize booklet
        run: |
          node --check scripts/render-clean-v063-booklet.mjs
          node --check scripts/validate-clean-v063-booklet.mjs
          node --check scripts/materialize-clean-v063-booklet.mjs
          node scripts/render-clean-v063-booklet.mjs
          node scripts/validate-clean-v063-booklet.mjs
          node scripts/materialize-clean-v063-booklet.mjs
          git diff --check

      - name: Upload booklet review artifact
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-clean-v063-rulebook-booklet
          path: artifacts/reconstruction/clean-v0.6.3/booklet/generated/**
          if-no-files-found: error

      - name: Commit reviewed booklet binary and manifest
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/v063-clean-rulebook-booklet'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            releases/v0.6.3-reconstructed/Gauntlet_v0.6.3_Rulebook_Booklet.pdf \
            releases/v0.6.3-reconstructed/Gauntlet_v0.6.3_Manifest.json
          if git diff --cached --quiet; then
            echo 'Reviewed booklet is already materialized.'
          else
            git commit -m 'Materialize v0.6.3 rulebook booklet'
            git push origin HEAD:${{ github.head_ref }}
          fi
