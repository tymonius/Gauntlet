name: Build clean v0.6.3 rulebook booklet

on:
  pull_request:
    paths:
      - '.github/workflows/build-clean-v063-booklet.yml'
      - 'scripts/render-clean-v063-booklet.mjs'
      - 'scripts/validate-clean-v063-booklet.mjs'
      - 'artifacts/reconstruction/clean-v0.6.3/rulebook/Gauntlet_v0.6.3_Rulebook.md'
      - 'releases/v0.6.3-reconstructed/Gauntlet_v0.6.3_Rulebook.md'
      - 'rulebook/markdown.js'
      - 'images/sketches/hero-sketches/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-booklet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out booklet inputs only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /scripts/render-clean-v063-booklet.mjs
            /scripts/validate-clean-v063-booklet.mjs
            /rulebook/markdown.js
            /artifacts/reconstruction/clean-v0.6.3/rulebook/Gauntlet_v0.6.3_Rulebook.md
            /releases/v0.6.3-reconstructed/Gauntlet_v0.6.3_Rulebook.md
            /images/sketches/hero-sketches/

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install booklet build dependencies
        run: |
          npm install
          npm install --no-save --package-lock=false pdf-lib
          npx playwright install --with-deps chromium

      - name: Build and validate booklet
        run: |
          set -euo pipefail
          node --check scripts/render-clean-v063-booklet.mjs
          node --check scripts/validate-clean-v063-booklet.mjs
          node scripts/render-clean-v063-booklet.mjs
          node scripts/validate-clean-v063-booklet.mjs

      - name: Verify same-input booklet reproducibility
        run: |
          set -euo pipefail
          out='artifacts/reconstruction/clean-v0.6.3/booklet/generated'
          cp "$out/Gauntlet_v0.6.3_Rulebook_Booklet_Reading_Order.pdf" /tmp/reading-first.pdf
          cp "$out/Gauntlet_v0.6.3_Rulebook_Booklet.pdf" /tmp/booklet-first.pdf
          node scripts/render-clean-v063-booklet.mjs
          node scripts/validate-clean-v063-booklet.mjs
          cmp /tmp/reading-first.pdf "$out/Gauntlet_v0.6.3_Rulebook_Booklet_Reading_Order.pdf"
          cmp /tmp/booklet-first.pdf "$out/Gauntlet_v0.6.3_Rulebook_Booklet.pdf"

      - name: Upload booklet review artifact
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-clean-v063-rulebook-booklet
          path: artifacts/reconstruction/clean-v0.6.3/booklet/generated/**
          if-no-files-found: error
