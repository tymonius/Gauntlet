name: Inspect legacy render workflow

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate v0.6.0 render workflow
        run: |
          echo '=== WORKFLOW FILES ==='
          find .github/workflows -maxdepth 1 -type f -print | sort
          echo '=== MATCHES ==='
          grep -R -n -B 4 -A 35 'Render v0.6.0 card sheets\|Commit rendered card PDFs' .github/workflows || true
