name: Run public rules synchronization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: run-public-rules-sync
  cancel-in-progress: true

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/sync-website-rules-terminology
          fetch-depth: 1

      - name: Reconcile generator variants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          public_path = Path("scripts/sync_v061_public_rules.py")
          public_text = public_path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'\n        "faction-sheets/v061-release-runtime\.js": \[\n'
              r'(?:            .*\n)+'
              r'        \],\n'
          )
          public_updated, count = pattern.subn("\n", public_text, count=1)
          if count:
              public_path.write_text(public_updated, encoding="utf-8")
          else:
              print("Optional release-renderer migration block already absent.")

          print_path = Path("scripts/sync_v061_print_supplementals.py")
          print_text = print_path.read_text(encoding="utf-8")
          print_updated = print_text.replace(
              "no deckbuilding value",
              "not a Playable Deck card",
          )
          if print_updated != print_text:
              print_path.write_text(print_updated, encoding="utf-8")
          PY

      - name: Synchronize public website and printable references
        run: |
          python scripts/sync_v061_deckbuilder.py
          python scripts/sync_v061_public_rules.py
          python scripts/sync_v061_print_supplementals.py
          rm -f deckbuilder/.rules-sync-trigger

      - name: Verify idempotent synchronization
        run: |
          git diff --binary > /tmp/public-rules-before.patch
          python scripts/sync_v061_deckbuilder.py
          python scripts/sync_v061_public_rules.py
          python scripts/sync_v061_print_supplementals.py
          git diff --binary > /tmp/public-rules-after.patch
          cmp /tmp/public-rules-before.patch /tmp/public-rules-after.patch

      - name: Package synchronized files and patch
        run: |
          mkdir -p public-rules-sync/files
          git diff --name-only --diff-filter=ACM > public-rules-sync/changed-files.txt
          git diff --name-only --diff-filter=D > public-rules-sync/deleted-files.txt
          git diff --binary > public-rules-sync/changes.patch
          git rev-parse HEAD > public-rules-sync/base-head.txt
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            mkdir -p "public-rules-sync/files/$(dirname "$file")"
            cp "$file" "public-rules-sync/files/$file"
          done < public-rules-sync/changed-files.txt
          cat public-rules-sync/changed-files.txt
          sed 's/^/DELETE /' public-rules-sync/deleted-files.txt

      - name: Upload synchronized sources
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-public-rules-sync
          path: public-rules-sync/
          if-no-files-found: error
