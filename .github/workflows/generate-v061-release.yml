name: Audit website rules terminology

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1

      - name: Inventory website pages and terminology
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          tracked = []
          for raw in subprocess.check_output(['git', 'ls-files'], text=True).splitlines():
              p = Path(raw)
              if p.suffix.lower() in {'.html', '.js', '.ts', '.json'}:
                  tracked.append(p)

          html = sorted(p for p in tracked if p.suffix.lower() == '.html')
          print('=== TRACKED HTML PAGES ===')
          for p in html:
              print(p)

          patterns = {
              'without_using_opportunity': re.compile(r'without using (?:an |another )?Action Opportunit', re.I),
              'opportunity_as_cost': re.compile(r'(?:uses?|using|consume[sd]?|spend[sd]?) (?:one |an |the )?Action Opportunit', re.I),
              'additional_opportunity_only': re.compile(r'(?:take|gain) (?:one )?(?:another|additional) Action Opportunit', re.I),
              'activate_heading_or_verb': re.compile(r'\bActivate\b|Activate:', re.I),
              'deckbuilding_value': re.compile(r'deckbuilding value', re.I),
              'as_an_asset': re.compile(r'as an Asset', re.I),
              'destination_language': re.compile(r'\bdestinations?\b', re.I),
              'occupier_noun': re.compile(r'\boccupier\b', re.I),
              'occupation_term': re.compile(r'\bOccupation\b', re.I),
              'sleeper_beneath': re.compile(r'(?:beneath Sleeper Network|cards? beneath it|cards? beneath this)', re.I),
              'sleeper_old_timing': re.compile(r'At the start of your turn.{0,220}Sleeper Network|Sleeper Network.{0,220}At the start of your turn', re.I),
          }

          print('\n=== TARGETED TERMINOLOGY HITS ===')
          for p in sorted(tracked):
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for number, line in enumerate(text.splitlines(), 1):
                  labels = [name for name, rx in patterns.items() if rx.search(line)]
                  if labels:
                      print(f"{p}:{number}: [{','.join(labels)}] {line[:1000]}")

          print('\n=== FILES CONTAINING ACTION OPPORTUNITY ===')
          for p in sorted(tracked):
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              count = len(re.findall(r'Action Opportunit(?:y|ies)', text, re.I))
              if count:
                  print(f'{count:4d}  {p}')

          print('\n=== FILES CONTAINING BIND / BOUND / BENEATH ===')
          for p in sorted(tracked):
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              count = len(re.findall(r'\b(?:bind|binding|bound|beneath)\b', text, re.I))
              if count:
                  print(f'{count:4d}  {p}')
          PY
