name: Apply Sleeper fixture correction

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sleeper-fixture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update stale fixture
        run: python scripts/fix_sleeper_subversion_fixture.py

      - name: Install dependencies
        run: npm install

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Restore workflow and remove temporary script
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/generate-v061-release.yml
          rm -f package-lock.json scripts/fix_sleeper_subversion_fixture.py

      - name: Commit fixture correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Sleeper Network Subversion fixture"
          git pull --rebase origin ${{ github.head_ref || github.ref_name }}
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
