name: Generate v0.6.1 release data

on:
  pull_request:
    paths:
      - "docs/Gauntlet_v0.6.1_Neutral_Card_Pool.md"
      - "docs/Gauntlet_v0.6.1_Territory_Pool.md"
      - "releases/v0.6.1/**"
      - "scripts/generate_v061_release.py"
      - ".github/workflows/generate-v061-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove inherited v0.6.0 source map if needed
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/generate_v061_release.py")
          text = path.read_text(encoding="utf-8")
          old = '''    data = copy.deepcopy(baseline)
              data.update('''.replace("              ", "    ")
          new = '''    data = copy.deepcopy(baseline)
              data.pop("source_files", None)
              data.update('''.replace("              ", "    ")
          if old in text and 'data.pop("source_files", None)' not in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit generator repair
        run: |
          if git diff --quiet -- scripts/generate_v061_release.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate_v061_release.py
          git commit -m "Remove inherited v0.6.0 source map"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

      - name: Generate and validate v0.6.1 data
        run: python scripts/generate_v061_release.py

      - name: Upload generated release data
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-v061-generated-data
          path: |
            releases/v0.6.1/Gauntlet_v0.6.1_Canonical_Data.json
            releases/v0.6.1/Gauntlet_v0.6.1_Complete_Card_Reference.md
          if-no-files-found: error
