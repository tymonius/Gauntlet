name: Generate and validate v0.6.1 sources

on:
  push:
    branches:
      - rules/v0.6.1-playtest-revision
    paths:
      - "README.md"
      - "index.html"
      - "docs/README.md"
      - "docs/Gauntlet_Development_Status.md"
      - "docs/Gauntlet_v0.6.1_Neutral_Card_Pool.md"
      - "docs/Gauntlet_v0.6.1_Territory_Pool.md"
      - "releases/v0.6.1/**"
      - "rules-assistant/**"
      - "workers/playtest-sessions/**"
      - "playtest/session/**"
      - "playtest/batch/**"
      - "playtest/onboarding/**"
      - "playtest/player-mat/**"
      - "start/**"
      - "factions/**"
      - "faction-sheets/**"
      - "deckbuilder/**"
      - "package.json"
      - "tests/player-facing-terminology.test.ts"
      - "scripts/finalize_v061_publication.py"
      - "scripts/generate_v061_release.py"
      - "scripts/sync_v061_deckbuilder.py"
      - "scripts/sync_v061_print_supplementals.py"
      - "scripts/sync_v061_public_rules.py"
      - "scripts/sync_v061_rules_assistant.py"
      - "scripts/validate_v061_release.py"
      - "scripts/validate_v061_playtest_sessions.py"
      - "scripts/test_v061_formal_session_e2e.mjs"
      - ".github/workflows/generate-v061-release.yml"
  pull_request:
    branches:
      - main
    paths:
      - "README.md"
      - "index.html"
      - "docs/README.md"
      - "docs/Gauntlet_Development_Status.md"
      - "docs/Gauntlet_v0.6.1_Neutral_Card_Pool.md"
      - "docs/Gauntlet_v0.6.1_Territory_Pool.md"
      - "releases/v0.6.1/**"
      - "rules-assistant/**"
      - "workers/playtest-sessions/**"
      - "playtest/session/**"
      - "playtest/batch/**"
      - "playtest/onboarding/**"
      - "playtest/player-mat/**"
      - "start/**"
      - "factions/**"
      - "faction-sheets/**"
      - "deckbuilder/**"
      - "package.json"
      - "tests/player-facing-terminology.test.ts"
      - "scripts/finalize_v061_publication.py"
      - "scripts/generate_v061_release.py"
      - "scripts/sync_v061_deckbuilder.py"
      - "scripts/sync_v061_print_supplementals.py"
      - "scripts/sync_v061_public_rules.py"
      - "scripts/sync_v061_rules_assistant.py"
      - "scripts/validate_v061_release.py"
      - "scripts/validate_v061_playtest_sessions.py"
      - "scripts/test_v061_formal_session_e2e.mjs"
      - ".github/workflows/generate-v061-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-v061-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply governed source migrations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          card_source = Path("docs/Gauntlet_v0.6.1_Neutral_Card_Pool.md")
          card_text = card_source.read_text(encoding="utf-8")
          if "Siege Weaponry" in card_text:
              card_source.write_text(card_text.replace("Siege Weaponry", "Bombardment"), encoding="utf-8")

          validator = Path("scripts/validate_v061_release.py")
          validator_text = validator.read_text(encoding="utf-8")
          obsolete = '            \'main = "worker-v061.js"\','
          current = '            \'main = "worker-entry.js"\','
          if obsolete in validator_text:
              validator.write_text(validator_text.replace(obsolete, current, 1), encoding="utf-8")
          elif current not in validator_text:
              raise SystemExit("Could not reconcile Rules Arbiter deployment marker in release validator")

          public_path = Path("scripts/sync_v061_public_rules.py")
          public_text = public_path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'\n        "faction-sheets/v061-release-runtime\.js": \[\n'
              r'(?:            .*\n)+'
              r'        \],\n'
          )
          public_updated, count = pattern.subn("\n", public_text, count=1)
          if count:
              public_path.write_text(public_updated, encoding="utf-8")

          print_path = Path("scripts/sync_v061_print_supplementals.py")
          print_text = print_path.read_text(encoding="utf-8")
          print_updated = print_text.replace(
              "no deckbuilding value",
              "not a Playable Deck card",
          )
          if print_updated != print_text:
              print_path.write_text(print_updated, encoding="utf-8")

          approved_cards = {
              Path("releases/v0.6.1/faction-guides/intelligence/Gauntlet_v0.6.1_Intelligence_Faction_Guide.md"): (
                  re.compile(r"^## Sleeper Network\n.*?(?=^# 8\. Quick reference)", re.MULTILINE | re.DOTALL),
                  """## Sleeper Network

**Cost:** 5  
**Unique:** Maximum one copy per Playable Deck  
**Card form:** Asset

> **Action:** Bank this card and bind another card from your Hand to it face down.
>
> **Asset:** At the end of each later turn, you may bind a card from your Hand to it face down, up to the number of Territories you control. Before an opposing effect causes this card to leave play, reveal its bound cards. You may play one whose Action effect can apply now without spending an Action. Discard the rest.
>
> **Use:** During an Action Opportunity, spend 1 Action to put this card in your Graveyard and reveal its bound cards. Play each whose Action effect can apply now, one at a time and in any order, without spending additional Actions. Discard the rest.

If Sleeper Network has more bound cards than Territories you control, immediately discard bound cards of your choice until within the limit. If it leaves play without revealing its bound cards through its own effect, discard all cards bound to it.

""",
              ),
              Path("releases/v0.6.1/faction-guides/military/Gauntlet_v0.6.1_Military_Faction_Guide.md"): (
                  re.compile(r"^## Shock and Awe\n.*?(?=^# 7\. Quick reference)", re.MULTILINE | re.DOTALL),
                  """## Shock and Awe

**Cost:** 5  
**Unique:** Maximum one copy per Playable Deck

> **Action:** Bank this card.
>
> **Asset:** During opening effects when attacking on an enemy-controlled Territory, you may put this card in your Graveyard to apply its Battle effect.
>
> **Battle:** When attacking on an enemy-controlled Territory, after Tactics are revealed, you may play an eligible card from your Hand face up as an additional Tactic. If you lose, retreat one additional position. If you win, choose one:
> Breakthrough — Choose only if the opponent can retreat one additional position. After their normal retreat, they do so, then you advance one. This cannot start a battle.
> Consolidate — Capture the contested Territory and set your Command to 2.
> After either option, you cannot move again, capture another Territory, or use an Order from that victory. In the Aftermath, put any card played this way and this card, if still in play, in your Graveyard.

""",
              ),
          }
          for path, (card_pattern, replacement) in approved_cards.items():
              source = path.read_text(encoding="utf-8")
              updated, count = card_pattern.subn(replacement, source, count=1)
              if count != 1:
                  raise SystemExit(f"Could not locate approved card section in {path}")
              path.write_text(updated, encoding="utf-8")
          PY

      - name: Finalize publication metadata
        run: python scripts/finalize_v061_publication.py

      - name: Synchronize browser, print, and Rules Arbiter sources
        run: |
          python scripts/sync_v061_deckbuilder.py
          python scripts/sync_v061_public_rules.py
          python scripts/sync_v061_print_supplementals.py
          python scripts/sync_v061_rules_assistant.py
          rm -f deckbuilder/.rules-sync-trigger

      - name: Generate and validate canonical data
        run: python scripts/generate_v061_release.py

      - name: Commit synchronized and generated outputs when changed
        run: |
          git add \
            README.md \
            index.html \
            docs/README.md \
            docs/Gauntlet_Development_Status.md \
            docs/Gauntlet_v0.6.1_Neutral_Card_Pool.md \
            scripts/finalize_v061_publication.py \
            scripts/generate_v061_release.py \
            scripts/sync_v061_print_supplementals.py \
            scripts/sync_v061_public_rules.py \
            scripts/validate_v061_release.py \
            start/ \
            playtest/onboarding/ \
            playtest/player-mat/ \
            factions/ \
            faction-sheets/ \
            deckbuilder/ \
            rules-assistant/ \
            releases/v0.6.1/
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish and synchronize Gauntlet v0.6.1"
          git pull --rebase origin ${{ github.head_ref || github.ref_name }}
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

      - name: Verify generated outputs are current
        run: |
          python scripts/finalize_v061_publication.py
          python scripts/sync_v061_deckbuilder.py
          python scripts/sync_v061_public_rules.py
          python scripts/sync_v061_print_supplementals.py
          python scripts/sync_v061_rules_assistant.py
          python scripts/generate_v061_release.py --check
          git diff --exit-code -- README.md index.html docs/README.md docs/Gauntlet_Development_Status.md docs/Gauntlet_v0.6.1_Neutral_Card_Pool.md scripts/finalize_v061_publication.py scripts/generate_v061_release.py scripts/sync_v061_print_supplementals.py scripts/sync_v061_public_rules.py scripts/validate_v061_release.py start/ playtest/onboarding/ playtest/player-mat/ factions/ faction-sheets/ deckbuilder/ rules-assistant/ releases/v0.6.1/

      - name: Install test dependencies
        run: npm install

      - name: Test Rules Arbiter retrieval and worker helpers
        run: npm run test:rules-assistant

      - name: Test playtest session service
        run: npm run test:playtest-sessions

      - name: Test formal coded-sheet lifecycle
        run: npm run test:formal-session-e2e

      - name: Test Deckbuilder data
        run: npm run test:deckbuilder

      - name: Validate v0.6.1 source package
        run: |
          python scripts/validate_v061_release.py
          python scripts/validate_v061_playtest_sessions.py

      - name: Upload generated release data
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-v061-generated-data
          path: |
            releases/v0.6.1/Gauntlet_v0.6.1_Canonical_Data.json
            releases/v0.6.1/Gauntlet_v0.6.1_Complete_Card_Reference.md
          if-no-files-found: error
