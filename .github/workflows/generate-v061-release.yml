name: Generate and validate v0.6.1 sources

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: action-terminology-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply asserted terminology migration
        run: |
          set +e
          python scripts/apply_action_terminology_migration.py > /tmp/action-migration.log 2>&1
          status=$?
          set -e
          cat /tmp/action-migration.log
          exit "$status"

      - name: Upload migration failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: action-terminology-migration-failure
          path: /tmp/action-migration.log
          if-no-files-found: error

      - name: Synchronize governed and generated sources
        run: |
          python scripts/sync_v061_rulebook.py
          python scripts/normalize_v061_rulebook_content.py
          python scripts/sync_v061_print_supplementals.py
          python scripts/finalize_v061_publication.py
          python scripts/sync_v061_deckbuilder.py
          python scripts/sync_v061_rules_assistant.py
          python scripts/generate_v061_release.py

      - name: Validate synchronized sources
        run: |
          python scripts/sync_v061_rulebook.py --check
          python scripts/normalize_v061_rulebook_content.py --check
          python scripts/sync_v061_print_supplementals.py --check
          python scripts/sync_v061_deckbuilder.py --check
          python scripts/sync_v061_rules_assistant.py --check
          python scripts/generate_v061_release.py --check
          python scripts/validate_v061_rulebook_content.py
          python scripts/validate_v061_release.py

      - name: Install and test
        run: |
          npm install
          npm test

      - name: Restore workflows and remove migration material
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/generate-v061-release.yml
          rm -f \
            package-lock.json \
            .github/workflows/apply-action-terminology-migration.yml \
            scripts/apply_action_terminology_migration.py \
            tmp/action-terminology-audit.txt \
            tmp/v061-generation-audit.txt \
            tmp/sleeper-action-hook-audit.txt \
            tmp/special-action-opportunities-audit.txt \
            tmp/action-migration-failure.txt

      - name: Commit migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Distinguish Actions from Action Opportunities"
          git pull --rebase origin ${{ github.head_ref || github.ref_name }}
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
