name: Generate v0.6.1 release data

on:
  pull_request:
    paths:
      - "docs/Gauntlet_v0.6.1_Neutral_Card_Pool.md"
      - "docs/Gauntlet_v0.6.1_Territory_Pool.md"
      - "releases/v0.6.1/**"
      - "scripts/generate_v061_release.py"
      - ".github/workflows/generate-v061-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate and validate v0.6.1 data
        run: python scripts/generate_v061_release.py

      - name: Commit generated outputs when changed
        run: |
          git add \
            releases/v0.6.1/Gauntlet_v0.6.1_Canonical_Data.json \
            releases/v0.6.1/Gauntlet_v0.6.1_Complete_Card_Reference.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate v0.6.1 canonical data and card reference"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

      - name: Verify generated outputs are current
        run: python scripts/generate_v061_release.py --check

      - name: Upload generated release data
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-v061-generated-data
          path: |
            releases/v0.6.1/Gauntlet_v0.6.1_Canonical_Data.json
            releases/v0.6.1/Gauntlet_v0.6.1_Complete_Card_Reference.md
          if-no-files-found: error
