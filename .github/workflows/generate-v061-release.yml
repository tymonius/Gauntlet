name: Generate and validate v0.6.1 sources

on:
  push:
    branches:
      - rules/v0.6.1-playtest-revision
    paths:
      - "README.md"
      - "index.html"
      - "docs/README.md"
      - "docs/Gauntlet_Development_Status.md"
      - "docs/Gauntlet_v0.6.1_Neutral_Card_Pool.md"
      - "docs/Gauntlet_v0.6.1_Territory_Pool.md"
      - "releases/v0.6.1/**"
      - "rules-assistant/**"
      - "workers/playtest-sessions/**"
      - "playtest/session/**"
      - "playtest/batch/**"
      - "playtest/onboarding/**"
      - "playtest/player-mat/**"
      - "start/**"
      - "factions/**"
      - "faction-sheets/**"
      - "deckbuilder/**"
      - "package.json"
      - "tests/player-facing-terminology.test.ts"
      - "scripts/finalize_v061_publication.py"
      - "scripts/finalize_v061_rulebook_publication.py"
      - "scripts/generate_v061_release.py"
      - "scripts/sync_v061_deckbuilder.py"
      - "scripts/sync_v061_print_supplementals.py"
      - "scripts/sync_v061_public_rules.py"
      - "scripts/sync_v061_rules_assistant.py"
      - "scripts/validate_v061_release.py"
      - "scripts/validate_v061_playtest_sessions.py"
      - "scripts/test_v061_formal_session_e2e.mjs"
      - ".github/workflows/generate-v061-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-v061-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply governed source migrations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          card_source = Path("docs/Gauntlet_v0.6.1_Neutral_Card_Pool.md")
          card_text = card_source.read_text(encoding="utf-8")
          if "Siege Weaponry" in card_text:
              card_source.write_text(card_text.replace("Siege Weaponry", "Bombardment"), encoding="utf-8")

          validator = Path("scripts/validate_v061_release.py")
          validator_text = validator.read_text(encoding="utf-8")
          validator_updated = validator_text
          obsolete = '            \'main = "worker-v061.js"\','
          current = '            \'main = "worker-entry.js"\','
          if obsolete in validator_updated:
              validator_updated = validator_updated.replace(obsolete, current, 1)
          elif current not in validator_updated:
              raise SystemExit("Could not reconcile Rules Arbiter deployment marker in release validator")

          # The public Card Reference tracks the current release (v0.6.2+). The
          # historical v0.6.1 release validator must not pin that live surface
          # back to v0.6.1; its own frozen release artifacts remain validated.
          card_reference_pattern = re.compile(
              r'\n        "card-reference/app\.js": \[\n'
              r'(?:            .*\n)+'
              r'        \],\n'
          )
          validator_updated, _ = card_reference_pattern.subn("\n", validator_updated, count=1)
          if validator_updated != validator_text:
              validator.write_text(validator_updated, encoding="utf-8")

          public_path = Path("scripts/sync_v061_public_rules.py")
          public_text = public_path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'\n        "faction-sheets/v061-release-runtime\.js": \[\n'
              r'(?:            .*\n)+'
              r'        \],\n'
          )
          public_updated, count = pattern.subn("\n", public_text, count=1)
          if count:
              public_path.write_text(public_updated, encoding="utf-8")

          print_path = Path("scripts/sync_v061_print_supplementals.py")
          print_text = print_path.read_text(encoding="utf-8")
          print_updated = print_text.replace(
              "no deckbuilding value",
              "not a Playable Deck card",
          )
          if print_updated != print_text:
              print_path.write_text(print_updated, encoding="utf-8")
          PY

      - name: Finalize publication metadata
        run: |
          python scripts/finalize_v061_publication.py
          python scripts/finalize_v061_rulebook_publication.py

      - name: Synchronize browser, print, and Rules Arbiter sources
        run: |
          python scripts/sync_v061_deckbuilder.py
          python scripts/sync_v061_public_rules.py
          python scripts/sync_v061_print_supplementals.py
          python scripts/sync_v061_rules_assistant.py
          rm -f deckbuilder/.rules-sync-trigger

      - name: Generate and validate canonical data
        run: python scripts/generate_v061_release.py

      - name: Commit synchronized and generated outputs when changed
        run: |
          git add \
            README.md \
            index.html \
            docs/README.md \
            docs/Gauntlet_Development_Status.md \
            docs/Gauntlet_v0.6.1_Neutral_Card_Pool.md \
            scripts/finalize_v061_publication.py \
            scripts/finalize_v061_rulebook_publication.py \
            scripts/generate_v061_release.py \
            scripts/sync_v061_print_supplementals.py \
            scripts/sync_v061_public_rules.py \
            scripts/validate_v061_release.py \
            start/ \
            playtest/onboarding/ \
            playtest/player-mat/ \
            factions/ \
            faction-sheets/ \
            deckbuilder/ \
            rules-assistant/ \
            releases/v0.6.1/
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish and synchronize Gauntlet v0.6.1"
          git pull --rebase origin ${{ github.head_ref || github.ref_name }}
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

      - name: Verify generated outputs are current
        run: |
          python scripts/finalize_v061_publication.py
          python scripts/finalize_v061_rulebook_publication.py
          python scripts/sync_v061_deckbuilder.py
          python scripts/sync_v061_public_rules.py
          python scripts/sync_v061_print_supplementals.py
          python scripts/sync_v061_rules_assistant.py
          python scripts/generate_v061_release.py --check
          git diff --exit-code -- README.md index.html docs/README.md docs/Gauntlet_Development_Status.md docs/Gauntlet_v0.6.1_Neutral_Card_Pool.md scripts/finalize_v061_publication.py scripts/finalize_v061_rulebook_publication.py scripts/generate_v061_release.py scripts/sync_v061_print_supplementals.py scripts/sync_v061_public_rules.py scripts/validate_v061_release.py start/ playtest/onboarding/ playtest/player-mat/ factions/ faction-sheets/ deckbuilder/ rules-assistant/ releases/v0.6.1/

      - name: Install test dependencies
        run: npm install

      - name: Test Rules Arbiter retrieval and worker helpers
        run: npm run test:rules-assistant

      - name: Test playtest session service
        run: npm run test:playtest-sessions

      - name: Test formal coded-sheet lifecycle
        run: npm run test:formal-session-e2e

      - name: Test Deckbuilder data
        run: npm run test:deckbuilder

      - name: Validate v0.6.1 source package
        run: |
          python scripts/validate_v061_release.py
          python scripts/validate_v061_playtest_sessions.py

      - name: Upload generated release data
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-v061-generated-data
          path: |
            releases/v0.6.1/Gauntlet_v0.6.1_Canonical_Data.json
            releases/v0.6.1/Gauntlet_v0.6.1_Complete_Card_Reference.md
          if-no-files-found: error
