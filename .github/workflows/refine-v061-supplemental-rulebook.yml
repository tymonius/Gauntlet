name: Refine v0.6.1 supplemental-component guide

on:
  push:
    branches:
      - rules/v0.6.1-playtest-revision
    paths:
      - ".github/workflows/refine-v061-supplemental-rulebook.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rules/v0.6.1-playtest-revision

      - name: Refine rulebook language
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.md")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              "Supplemental cards, reference cards, trackers, Deeds, Proposals, Rites, Missions, and similar components are part of the Deck but are not part of the Playable Deck unless a rule explicitly says otherwise.\n\n### Faction supplemental cards and trackers",
              "Supplemental cards, reference cards, trackers, Deeds, Proposals, Rites, and similar components are part of the Deck but are not part of the Playable Deck unless a rule explicitly says otherwise. Missions and Special Operations are eligible cards from the Intelligence player's Playable Deck, not supplemental cards.\n\nTogether, both players' Territory Cards form the **Gauntlet**, a single six-Territory column.\n\n### Faction supplemental cards and trackers",
              1,
          )
          text = text.replace(
              "Begin at 1 Influence and place every Proposal Proposal-side up.",
              "Begin at 1 Influence and place every Proposal with its Proposal side up.",
              1,
          )
          text = text.replace(
              "\nTogether, both players' Territory Cards form the **Gauntlet**, a single six-Territory column.\n\n---\n\n# 2. Building a Deck",
              "\n---\n\n# 2. Building a Deck",
              1,
          )

          required = [
              "Missions and Special Operations are eligible cards from the Intelligence player's Playable Deck, not supplemental cards.",
              "place every Proposal with its Proposal side up",
              "### Faction supplemental cards and trackers",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"Rulebook refinement failed; missing: {missing}")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove one-shot workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refine-v061-supplemental-rulebook.yml
          git add releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.md
          git commit -m "Refine supplemental-component rulebook guidance"
          git push origin HEAD:rules/v0.6.1-playtest-revision
