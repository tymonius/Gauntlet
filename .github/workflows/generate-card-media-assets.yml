name: Generate card media assets

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Output profile
        required: true
        default: all
        type: choice
        options:
          - all
          - thumbnail
          - website
          - publication
      strict_artwork:
        description: Fail when any playable card lacks artwork
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            package.json
            design-tokens.css
            scripts/generate-tts-card-assets.mjs
            scripts/generate-card-media-assets.mjs
            scripts/generate-card-media-compositions.mjs
            scripts/generate-card-media-library.mjs
            tts/renderer
            card-design
            media
            releases/v0.6.2/Gauntlet_v0.6.2_Canonical_Data.json
            images/artwork/cards
            images/artwork/card-backgrounds
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Generate card media library
        shell: bash
        run: |
          profile="${{ inputs.profile }}"
          strict=""
          if [[ "${{ inputs.strict_artwork }}" == "true" ]]; then
            strict="--strict-art"
          fi
          npm run media:build -- --profile="$profile" $strict
      - uses: actions/upload-artifact@v4
        with:
          name: gauntlet-v062-card-media-${{ inputs.profile }}
          path: media/generated/v0.6.2/
          if-no-files-found: error
      - name: Upload card composition preview
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-v062-card-compositions-${{ inputs.profile }}
          path: |
            media/generated/v0.6.2/compositions/
            media/generated/v0.6.2/compositions-manifest.json
          if-no-files-found: error
