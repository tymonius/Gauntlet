name: Verify current live publication

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-current-live-publication.yml'
      - 'config/release-lifecycle.json'
      - 'scripts/validate-current-public-contract.mjs'
      - 'releases/**'
      - 'v0.6.3/**'
      - 'changelog/**'
      - 'release-surface.css'
      - 'index.html'
      - 'start/**'
      - 'rulebook/**'
      - 'card-reference/**'
      - 'card-design/**'
      - 'game-data/current-game.json'
      - 'factions/**'
      - 'deckbuilder/**'
      - 'rules-arbiter/**'
      - 'design-tokens.css'
      - 'images/faction-symbols/**'
      - 'rules-assistant/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: verify-current-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ github.sha }}
      GITHUB_REPOSITORY_NAME: ${{ github.repository }}
    steps:
      - name: Check out deployed publication source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read current release identity
        id: release
        run: |
          current=$(node -e "const l=require('./config/release-lifecycle.json'); process.stdout.write(String(l.current_release || ''))")
          test -n "$current"
          echo "version=$current" >> "$GITHUB_OUTPUT"

      - name: Determine whether Rules Arbiter Worker needs deployment
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          worker=false
          reason=unchanged

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            worker=true
            reason=manual_dispatch
          else
            while IFS= read -r file; do
              case "$file" in
                rules-assistant/worker-entry.js|rules-assistant/worker-v*.js|rules-assistant/v*-public-corpus.js|rules-assistant/local-search.js|rules-assistant/smart-worker.js|rules-assistant/reliable-worker.js|rules-assistant/admin-*.js|rules-assistant/review-*.js|rules-assistant/wrangler.toml)
                  worker=true
                  reason=worker_inputs_changed
                  ;;
              esac
            done < <(git diff --name-only HEAD^ HEAD)
          fi

          local_revision=$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const source = readFileSync('rules-assistant/worker-v071.js', 'utf8');
          const match = source.match(/export const BEHAVIOR_REVISION\s*=\s*["']([^"']+)["']/);
          if (!match) {
            console.error('Could not read BEHAVIOR_REVISION from rules-assistant/worker-v071.js.');
            process.exit(1);
          }
          process.stdout.write(match[1]);
          NODE
          )

          live_revision=$(node --input-type=module <<'NODE'
          try {
            const response = await fetch('https://gauntlet-rules-assistant.tymon-scott.workers.dev/api/health', { cache: 'no-store' });
            if (!response.ok) process.exit(0);
            const payload = await response.json();
            process.stdout.write(String(payload?.behaviorRevision || ''));
          } catch {
            process.exit(0);
          }
          NODE
          )

          if [[ -z "$live_revision" ]]; then
            worker=true
            reason=live_revision_unavailable
          elif [[ "$live_revision" != "$local_revision" ]]; then
            worker=true
            reason=behavior_revision_mismatch
          fi

          {
            echo "worker=$worker"
            echo "reason=$reason"
            echo "local_revision=$local_revision"
            echo "live_revision=$live_revision"
          } >> "$GITHUB_OUTPUT"
          echo "Rules Arbiter Worker deployment: $worker ($reason; local=$local_revision; live=${live_revision:-unavailable})"

      - name: Install verification and Worker dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.scope.outputs.worker }}" == "true" ]]; then
            npm install --no-save --package-lock=false pdf-lib wrangler@4
          else
            npm install --no-save --package-lock=false pdf-lib
          fi

      - name: Verify Worker deployment secrets
        if: steps.scope.outputs.worker == 'true'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

      - name: Deploy current Rules Arbiter Worker when deployment is required
        if: steps.scope.outputs.worker == 'true'
        run: npx wrangler deploy --config rules-assistant/wrangler.toml

      - name: Wait for current Rules Arbiter health
        env:
          CURRENT_RELEASE: ${{ steps.release.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const expected = process.env.CURRENT_RELEASE;
          async function wait(url, predicate, label) {
            let last = '';
            for (let attempt = 1; attempt <= 30; attempt += 1) {
              try {
                const response = await fetch(url, { cache: 'no-store' });
                last = await response.text();
                if (response.ok && predicate(JSON.parse(last))) {
                  console.log(`${label} verified on attempt ${attempt}.`);
                  return;
                }
              } catch (error) {
                last = String(error);
              }
              if (attempt < 30) await sleep(3000);
            }
            throw new Error(`${label} did not become healthy: ${last}`);
          }
          const base = 'https://gauntlet-rules-assistant.tymon-scott.workers.dev';
          await wait(
            `${base}/api/health`,
            (value) => value?.ok === true && value.version === expected && value.currentPublicRelease === expected,
            `Current Rules Arbiter (${expected})`
          );
          await wait(
            `${base}/api/v061/health`,
            (value) => value?.ok === true && value.version === 'v0.6.1',
            'Historical v0.6.1 Rules Arbiter compatibility route'
          );
          NODE

      - name: Verify deployed site against the current-publication contract
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            if GAUNTLET_PUBLIC_BASE_URL=https://gauntlet.run GAUNTLET_CONTRACT_BUST="$EXPECTED_SHA" node scripts/validate-current-public-contract.mjs; then
              echo "Live public contract verified on attempt $attempt."
              exit 0
            fi
            if [[ "$attempt" -lt 120 ]]; then sleep 5; fi
          done
          echo 'Live public contract did not converge after the Actions-driven Pages deployment window.' >&2
          exit 1

      - name: Refresh current Rules Arbiter corpus against published authority
        if: steps.release.outputs.version == 'v0.7.1'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const expected = JSON.parse(readFileSync('releases/v0.7.1/Gauntlet_v0.7.1_Manifest.json', 'utf8')).authority_set_id;
          if (!expected) throw new Error('Local v0.7.1 manifest has no authority_set_id.');
          const endpoint = 'https://gauntlet-rules-assistant.tymon-scott.workers.dev/api/v071/corpus-health';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let last = '';
          for (let attempt = 1; attempt <= 20; attempt += 1) {
            try {
              const response = await fetch(`${endpoint}?publication=${encodeURIComponent(process.env.EXPECTED_SHA)}&attempt=${attempt}`, { cache: 'no-store' });
              last = await response.text();
              const payload = response.ok ? JSON.parse(last) : null;
              if (response.ok && payload?.ok === true && payload.authoritySetId === expected) {
                console.log(`Rules Arbiter loaded published authority set ${expected} on attempt ${attempt}.`);
                process.exit(0);
              }
            } catch (error) {
              last = String(error);
            }
            if (attempt < 20) await sleep(3000);
          }
          throw new Error(`Rules Arbiter did not load published authority set ${expected}: ${last}`);
          NODE
