name: Fix r7 reminder

on:
  push:
    branches: [rules-arbiter-gate2-r7]
    paths: [.github/workflows/fix-r7-question-reminder.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rules-arbiter-gate2-r7
      - name: Fix worker
        run: |
          sed -i 's/? `${questionText}/? `${question}/' rules-assistant/worker-v071.js
          sed -i 's/`QUESTION\\n${question}`/`QUESTION\\n${questionText}`/' rules-assistant/worker-v071.js
          grep -F '? `${question}' rules-assistant/worker-v071.js
          grep -F '`QUESTION\n${questionText}`' rules-assistant/worker-v071.js
          rm .github/workflows/fix-r7-question-reminder.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix r7 adjudication reminder wiring'
          git push origin HEAD:rules-arbiter-gate2-r7
