name: Apply terminology refinement

on:
  push:
    branches:
      - agent/terminology-refinement
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[terminology-applied]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/terminology-refinement
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Correct glossary anchors in one-use script
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply_terminology_refinement.py')
          text = path.read_text(encoding='utf-8')
          old = '''    occupation_glossary_anchor = "**Occupation:** The position currently held by a Player Token. Occupation and control are separate.\\n"
              occupation_glossary_replacement = """**Occupation:** The state in which a player's token is on an opposing Territory that player does not control.

          **Occupier:** A player in Occupation.
          """
              text = replace_once(text, occupation_glossary_anchor, occupation_glossary_replacement, "Occupation glossary")

              counterattack_anchor = "**Control:** The player a Territory faces controls it.\\n"
              text = replace_once(
                  text,
                  counterattack_anchor,
                  counterattack_anchor + "\\n**Counterattack:** A battle initiated by the controller of a Territory against the occupier of that Territory.\\n",
                  "Counterattack glossary",
              )

              position_glossary_old = "**Position:** A Territory or off-board location a Player Token may occupy.\\n"
              position_glossary_new = "**Position:** A Territory or off-board space where a Player Token may be placed.\\n"
              text = replace_once(text, position_glossary_old, position_glossary_new, "Position glossary")
          '''
          new = '''    glossary_core_old = """**Control:** Ownership of a Territory for rules purposes, shown by the direction the Territory faces.

          **Gambit:** An optional battle card set from Hand. It normally goes to the Graveyard during the Aftermath.

          **Occupation:** The position currently held by a Player Token. A player may occupy a Territory they do not control.
          """
              glossary_core_new = """**Control:** Ownership of a Territory for rules purposes, shown by the direction the Territory faces.

          **Counterattack:** A battle initiated by the controller of a Territory against the occupier of that Territory.

          **Gambit:** An optional battle card set from Hand. It normally goes to the Graveyard during the Aftermath.

          **Occupation:** The state in which a player's token is on an opposing Territory that player does not control.

          **Occupier:** A player in Occupation.

          **Position:** A Territory or off-board space where a Player Token may be placed.
          """
              text = replace_once(text, glossary_core_old, glossary_core_new, "Territory glossary")
          '''
          if old not in text:
              raise SystemExit('Expected glossary patch block was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply structural terminology changes
        run: python scripts/apply_terminology_refinement.py || true

      - name: Finish contextual wording and audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          paths = [
              root / 'README.md',
              root / 'releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.md',
              root / 'releases/v0.6.1/Gauntlet_v0.6.1_First_Game_Guide.md',
              root / 'releases/v0.6.1/Gauntlet_v0.6.1_Faction_Introductions.md',
              root / 'docs/Gauntlet_v0.6.1_Neutral_Card_Pool.md',
              root / 'docs/Gauntlet_v0.6.1_Territory_Pool.md',
          ]
          paths.extend(sorted((root / 'releases/v0.6.1/faction-guides').glob('**/*.md')))

          exact = {
              'Record unresolved testing concerns in `docs/Gauntlet_Development_Status.md`; do not silently resolve them in generated data or production artifacts.':
                  'Record open testing concerns in `docs/Gauntlet_Development_Status.md`; do not silently settle them in generated data or production artifacts.',
              'Resolve any battle caused by movement immediately.': 'Conduct any battle caused by movement immediately.',
              'resolve any battle immediately.': 'conduct any battle immediately.',
              'Resolve end-of-turn effects': 'Apply end-of-turn effects',
              'resolve end-of-turn effects': 'apply end-of-turn effects',
              'Its effect must still be able to resolve at that timing.': 'Its effect must still be applicable at that timing.',
              'its effect must still be able to resolve at that timing.': 'its effect must still be applicable at that timing.',
              'Apply only combinations of effects that can legally resolve together.': 'Apply only combinations of effects that can legally be applied together.',
              'Only the selected Proposal resolves or may become ratified.': 'Only the selected Proposal takes effect or may become ratified.',
              'The other Proposal does not resolve or become ratified.': 'The other Proposal does not take effect or become ratified.',
              'Effects that permit several purchases resolve each purchase completely before recalculating the next cost.': 'When an effect permits several purchases, complete each purchase before recalculating the next cost.',
              'Resolve each purchase completely before calculating the next cost.': 'Complete each purchase before calculating the next cost.',
              'Replacing Margin Loan before resolution causes default.': 'Replacing Margin Loan before the loan is settled causes default.',
              'If Margin Loan leaves play before the loan resolves, you default.': 'If Margin Loan leaves play before the loan is settled, you default.',
              'After you resolve any Interference against that revealed Gambit': 'After you use any Interference against that revealed Gambit',
              'After you resolve any Interference against those revealed Tactics': 'After you use any Interference against those revealed Tactics',
              'Once per turn, when an Arcane card you play, set, or choose resolves its Action, Gambit, Tactic, or Battle effect': 'Once per turn, when the Action, Gambit, Tactic, or Battle effect of an Arcane card you play, set, or choose takes effect',
              'A copied effect does not trigger Invocation unless the Arcane card itself resolves another printed effect through being played, set, or chosen again.': 'A copied effect does not trigger Invocation unless the Arcane card itself applies another printed effect through being played, set, or chosen again.',
              "when another card with the bound Hand card's title resolves its Gambit, Tactic, or Battle effect": "when the Gambit, Tactic, or Battle effect of another card with the bound Hand card's title takes effect",
              '- resolve the completing card normally; and': '- apply the completing card normally; and',
              'An entry trigger still resolves even if the card immediately leaves.': 'An entry trigger still applies even if the card immediately leaves.',
              'An Arcane card resolved only through a copied effect is not played or revealed as a Gambit or Tactic': 'An Arcane card whose effect is applied only through a copied effect is not played or revealed as a Gambit or Tactic',
              'The normal Conviction gain from that battle may resolve before Final Judgment.': 'The normal Conviction gain from that battle may occur before Final Judgment.',
              'Reveal and resolve Gambits.': 'Reveal Gambits and apply their effects.',
              'Reveal and resolve Tactics.': 'Reveal Tactics and apply their effects.',
              'Resolve pre-dice effects, roll, and determine the winner.': 'Apply pre-dice effects, roll, and determine the winner.',
              'Resolve the Aftermath.': 'Proceed to the Aftermath.',
              '**Reveal Gambits.** Turn all Gambits face up and resolve them.': '**Reveal Gambits.** Turn all Gambits face up and apply their effects.',
              '**Reveal Tactics.** Turn all Tactics face up and resolve them.': '**Reveal Tactics.** Turn all Tactics face up and apply their effects.',
              '**conduct the battle.** Resolve before-dice effects, roll, and compare battle totals.': '**Determine the Outcome.** Apply before-dice effects, roll, and compare battle totals.',
              '**Aftermath.** Resolve retreat, occupation, other result effects, card destinations, and follow-up movement.': '**Aftermath.** Carry out retreat and Occupation, apply other result effects, move cards to their destinations, and carry out follow-up movement.',
              'Effects already resolved are not undone.': 'Effects already applied are not undone.',
              'after the capture resolves': 'after the capture is completed',
              'Resolve it one position at a time.': 'Move one position at a time.',
              'Resolve movement one position at a time.': 'Move one position at a time.',
              'After the Terms resolve': 'After the Terms conclude',
              'after the Terms resolve': 'after the Terms conclude',
              'After the accepted Terms resolve': 'After the accepted Terms conclude',
              'after the accepted Terms resolve': 'after the accepted Terms conclude',
              'The Battle gain resolves during the Aftermath': 'The Battle gain occurs during the Aftermath',
              'after that Order resolves': 'after that Order is used',
              'If Assassins is revealed with Gambits, resolve this before other Gambit effects.': 'If Assassins is revealed with Gambits, apply this before other Gambit effects.',
              'After you resolve any Interference': 'After you use any Interference',
              'resolve that printed effect as though you controlled it': 'apply that printed effect as though you controlled it',
              'Resolve that printed effect as though you controlled it': 'Apply that printed effect as though you controlled it',
              'Resolve that effect as though you played it.': 'Apply that effect as though you played it.',
              'resolve its Battle effect as though you played it': 'apply its Battle effect as though you played it',
              'Resolve its Battle effect as though you played it': 'Apply its Battle effect as though you played it',
              'Resolve that effect one additional time.': 'Apply that effect one additional time.',
              'resolve its effect immediately after Black Covenant': 'apply its effect immediately after Black Covenant',
              'Resolve each purchase completely': 'Complete each purchase',
              'resolve each purchase completely': 'complete each purchase',
          }

          for path in paths:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              for old, new in exact.items():
                  text = text.replace(old, new)

              # Effects and timings.
              text = re.sub(r'before other effects at (that|the same) reveal stage resolve', r'before other effects at \1 reveal stage are applied', text, flags=re.I)
              text = re.sub(r'before other effects at that stage resolve', 'before other effects at that stage are applied', text, flags=re.I)
              text = re.sub(r'whose effect has not resolved', 'whose effect has not yet been applied', text, flags=re.I)
              text = re.sub(r'effect has not resolved', 'effect has not yet been applied', text, flags=re.I)
              text = re.sub(r'effect that already resolved', 'effect that has already been applied', text, flags=re.I)
              text = re.sub(r'effect has already resolved', 'effect has already been applied', text, flags=re.I)
              text = re.sub(r'effect already resolved', 'effect already applied', text, flags=re.I)
              text = re.sub(r'effect can still resolve', 'effect can still be applied', text, flags=re.I)
              text = re.sub(r'effect can legally resolve', 'effect can legally be applied', text, flags=re.I)
              text = re.sub(r'effect can resolve now', 'effect can be applied now', text, flags=re.I)
              text = re.sub(r'effect would resolve', 'effect would apply', text, flags=re.I)
              text = re.sub(r'effects cannot resolve', 'effects cannot be applied', text, flags=re.I)
              text = re.sub(r'effect cannot resolve', 'effect cannot be applied', text, flags=re.I)
              text = re.sub(r'can legally resolve together', 'can legally be applied together', text, flags=re.I)
              text = re.sub(r'can still resolve', 'can still be applied', text, flags=re.I)
              text = re.sub(r'can resolve now', 'can be applied now', text, flags=re.I)
              text = re.sub(r'unresolved opposing Battle effect', 'opposing Battle effect that has not yet been applied', text, flags=re.I)
              text = re.sub(r'unresolved delayed Gambit effect', 'delayed Gambit effect that has not yet been applied', text, flags=re.I)
              text = re.sub(r'unresolved Battle effect', 'Battle effect that has not yet been applied', text, flags=re.I)
              text = re.sub(r'unresolved opposing effect', 'opposing effect that has not yet been applied', text, flags=re.I)
              text = re.sub(r'played or revealed as a Gambit or Tactic and does not trigger', 'played or revealed as a Gambit or Tactic and does not trigger', text)

              # Named procedures and ordinary verbs.
              text = text.replace('Only the selected Proposal resolves', 'Only the selected Proposal takes effect')
              text = text.replace('The other Proposal does not resolve', 'The other Proposal does not take effect')
              text = text.replace('The selected Proposal resolves', 'The selected Proposal takes effect')
              text = text.replace('a Proposal resolves', 'a Proposal takes effect')
              text = text.replace('the Proposal resolves', 'the Proposal takes effect')
              text = text.replace('accepted Terms resolve', 'accepted Terms conclude')
              text = text.replace('Terms resolve', 'Terms conclude')
              text = text.replace('gain may resolve', 'gain may occur')
              text = text.replace('gain resolves', 'gain occurs')
              text = text.replace('trigger still resolves', 'trigger still applies')
              text = text.replace('Order resolves', 'Order is used')
              text = text.replace('activated or resolved', 'activated or had its effect applied')
              text = text.replace('was activated or resolved', 'was activated or had its effect applied')
              text = text.replace('were activated or resolved', 'were activated or had their effects applied')
              text = text.replace('card resolved only through a copied effect', 'card whose effect was applied only through a copied effect')
              text = text.replace('Resolve the completing card normally', 'Apply the completing card normally')
              text = text.replace('resolve the completing card normally', 'apply the completing card normally')
              text = text.replace('Resolve movement one position at a time', 'Move one position at a time')
              text = text.replace('resolve movement one position at a time', 'move one position at a time')
              text = text.replace('Resolve this before', 'Apply this before')
              text = text.replace('resolve this before', 'apply this before')
              text = text.replace('Resolve that effect', 'Apply that effect')
              text = text.replace('resolve that effect', 'apply that effect')
              text = text.replace('Resolve its effect', 'Apply its effect')
              text = text.replace('resolve its effect', 'apply its effect')
              text = text.replace('Resolve the printed effect', 'Apply the printed effect')
              text = text.replace('resolve the printed effect', 'apply the printed effect')

              path.write_text(text, encoding='utf-8')

          rulebook = Path('releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.md').read_text(encoding='utf-8')
          required = [
              'A **position** is any space where a Player Token may be placed:',
              "**Occupation** is the state in which a player's token is on an opposing Territory",
              'A **Counterattack** is a battle initiated by the controller of a Territory',
              'A **Faction Ability** is any special rule granted by a faction.',
              'A **Faction Action** is a Faction Ability that explicitly uses an Action Opportunity.',
              '### 7. Determine the Outcome',
              'During the Aftermath, follow these steps in order:',
              'no more than **60 total card value**',
          ]
          missing = [item for item in required if item not in rulebook]
          if missing:
              raise SystemExit(f'Missing agreed terminology: {missing}')

          leftovers = []
          pattern = re.compile(r'\b(?:un)?resolve(?:s|d|ing)?\b|\bresolution\b', re.I)
          for path in paths:
              if not path.exists():
                  continue
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  audit_line = line.replace('Nonbinding Resolution', '')
                  if pattern.search(audit_line):
                      leftovers.append(f'{path}:{number}: {line}')
          if leftovers:
              raise SystemExit('Unreworded terminology remains:\n' + '\n'.join(leftovers[:250]))

          stale = [str(path) for path in paths if path.exists() and re.search(r'deckbuilding value', path.read_text(encoding='utf-8'), re.I)]
          if stale:
              raise SystemExit(f'Stale deckbuilding-value terminology remains: {stale}')
          PY

      - name: Regenerate canonical data when supported
        shell: bash
        run: |
          set -euxo pipefail
          for candidate in \
            scripts/generate_v061_canonical_data.py \
            scripts/generate-v061-canonical-data.py \
            scripts/generate_v0_6_1_canonical_data.py \
            scripts/generate_v061_release.py \
            scripts/generate-v061-release.py
          do
            if [[ -f "$candidate" ]]; then
              python "$candidate"
            fi
          done

      - name: Install dependencies
        run: npm install

      - name: Validate governance
        run: npm run governance:check

      - name: Validate deck data
        run: npm run test:deckbuilder

      - name: Run tests
        run: npm test

      - name: Remove one-use automation
        run: |
          rm scripts/apply_terminology_refinement.py
          rm .github/workflows/apply-terminology-refinement.yml

      - name: Commit generated terminology update
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[terminology-applied] Refine game terminology"
          git push origin HEAD:agent/terminology-refinement
