name: Rules Arbiter next reviewed context scan

on:
  push:
    branches:
      - ops/rules-arbiter-reviewed-backlog-scan
    paths:
      - '.github/workflows/rules-arbiter-next-reviewed-context-scan.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Read reviewed conversations without model calls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/next-reviewed-context
          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant --remote --config rules-assistant/wrangler.toml --json --command "SELECT id, session_id, sequence_index, created_at, question, answer, game_version, COALESCE(ruling_status_v2, ruling_status) AS ruling_status, confidence, source_count, review_status, issue_types_json, feedback_rating FROM rules_interactions WHERE session_id IN (SELECT session_id FROM rules_interactions WHERE id IN ('7f152009-3543-4637-808c-3e1ececc3a51','9b1b6d36-4122-4c35-bfb6-6274a36be26a')) ORDER BY session_id, sequence_index, created_at" > .tmp/next-reviewed-context/interactions.json
          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant --remote --config rules-assistant/wrangler.toml --json --command "SELECT * FROM rules_interaction_audits WHERE interaction_id IN ('7f152009-3543-4637-808c-3e1ececc3a51','9b1b6d36-4122-4c35-bfb6-6274a36be26a') ORDER BY reviewed_at DESC" > .tmp/next-reviewed-context/audits.json
          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant --remote --config rules-assistant/wrangler.toml --json --command "SELECT * FROM rules_interaction_diagnostics WHERE interaction_id IN ('7f152009-3543-4637-808c-3e1ececc3a51','9b1b6d36-4122-4c35-bfb6-6274a36be26a') ORDER BY created_at DESC" > .tmp/next-reviewed-context/diagnostics.json
      - name: Upload context
        uses: actions/upload-artifact@v4
        with:
          name: rules-arbiter-next-reviewed-context
          path: .tmp/next-reviewed-context
          retention-days: 1
