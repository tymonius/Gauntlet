name: Apply Neutral Attrition implementation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/neutral-attrition' || github.ref_name == 'agent/neutral-attrition'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/neutral-attrition
          fetch-depth: 0

      - name: Verify and apply implementation patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/neutral-attrition-implementation-piece-*.b64 > /tmp/neutral-attrition.patch.b64
          echo "51ac3a39234163b8413ed9cb508d14ed5f982a424f7e408a74eac4e1dfe3442f  /tmp/neutral-attrition.patch.b64" | sha256sum --check
          base64 --decode /tmp/neutral-attrition.patch.b64 > /tmp/neutral-attrition.patch
          patch -p1 < /tmp/neutral-attrition.patch

      - name: Remove temporary staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/neutral-attrition-piece-*.b64
          rm -f .github/neutral-attrition-implementation-piece-*.b64
          rm -f .github/neutral-attrition-implementation.patch.b64
          rm -f .github/workflows/export-neutral-attrition-base.yml

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
          else
            git commit -m "Implement Neutral Attrition"
            git push origin HEAD:agent/neutral-attrition
          fi
