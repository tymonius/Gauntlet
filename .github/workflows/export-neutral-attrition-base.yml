name: Apply Neutral Attrition implementation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/neutral-attrition' || github.ref_name == 'agent/neutral-attrition'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/neutral-attrition
          fetch-depth: 0

      - name: Verify and apply implementation patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/neutral-attrition-piece-checksums <<'EOF'
          6ada0c7cf6c5e2fdaebbc08d1f49ea89d48858000c0fd4e54ed3d0e8818c01bb  .github/neutral-attrition-implementation-piece-00.b64
          e14bbc76e753a232b1ff8e70a07db800352da8fa059e031617f8272517885d5e  .github/neutral-attrition-implementation-piece-01a.b64
          dfe23e12342db0cb04b5c43931f4cba82d8b27ed36b06c693d4eda58ef97da0d  .github/neutral-attrition-implementation-piece-01b.b64
          0c11b871984cf29de51dbb5aeb2cff0f6c73a23125bfca4899cf8f40d021599b  .github/neutral-attrition-implementation-piece-01c.b64
          19543c2abd0301b6d6bfb1a05ee1f789528df2c34f62c688bc613c1c3b78e1f2  .github/neutral-attrition-implementation-piece-02.b64
          d161449560e65a1446036569b92e64143d5dbd81443eec7800b080aede835a9c  .github/neutral-attrition-implementation-piece-03.b64
          217e7cf991983f6c306a8ec5853771d8243960e53dfd079fd7927003f54ad7b8  .github/neutral-attrition-implementation-piece-04.b64
          763a7ef1a167929b4c442a751cd209605989ce5d26f64d3612c0bde1861ce375  .github/neutral-attrition-implementation-piece-05a1x1a.b64
          1408a03d56abff3e75fda8da887bc5b27f778ac10f3210f39d76dfcbefdfa089  .github/neutral-attrition-implementation-piece-05a1x1b.b64
          2b7838726525033bc008c4d9463df267c5cf7d3db4514b18c19bba4fa4bbc728  .github/neutral-attrition-implementation-piece-05a1x2.b64
          463d8b19ec6d57b7dd3efc975b8043f680e8c1a0a1245c45e6bc4723e0320cb1  .github/neutral-attrition-implementation-piece-05a2.b64
          f07736592d8088c230c67e1ea2312c3490f3e943c83159d91d5d2233b90bd08b  .github/neutral-attrition-implementation-piece-05b.b64
          ef02c3ed01088b19970fde77f4a127d29b6cf707cc1bfe1b8dbeb0e21a64daf5  .github/neutral-attrition-implementation-piece-05c.b64
          9b46adb9eb5f157cd05c07d6acd084dd07f0b967f6d91eac2018bd2c9c6c225c  .github/neutral-attrition-implementation-piece-06.b64
          EOF
          sha256sum --check /tmp/neutral-attrition-piece-checksums
          cat .github/neutral-attrition-implementation-piece-*.b64 \
            | base64 --decode > /tmp/neutral-attrition.patch
          patch -p1 < /tmp/neutral-attrition.patch

      - name: Remove temporary staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/neutral-attrition-piece-*.b64
          rm -f .github/neutral-attrition-implementation-piece-*.b64
          rm -f .github/neutral-attrition-implementation.patch.b64
          rm -f .github/workflows/export-neutral-attrition-base.yml

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
          else
            git commit -m "Implement Neutral Attrition"
            git push origin HEAD:agent/neutral-attrition
          fi
