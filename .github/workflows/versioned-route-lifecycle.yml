name: Validate versioned route lifecycle

on:
  pull_request:
    paths:
      - 'config/release-lifecycle.json'
      - 'scripts/validate-versioned-release-route-lifecycle.mjs'
      - 'v*/**'
      - '.github/workflows/versioned-route-lifecycle.yml'
  push:
    branches:
      - main
    paths:
      - 'config/release-lifecycle.json'
      - 'scripts/validate-versioned-release-route-lifecycle.mjs'
      - 'v*/**'
      - '.github/workflows/versioned-route-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate lifecycle semantics on versioned public routes
        run: node scripts/validate-versioned-release-route-lifecycle.mjs
