name: Repair v0.7.2 Intelligence Rulebook fact markers

on:
  push:
    branches:
      - v072-intelligence-intel-generation

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v072-intelligence-intel-generation
          fetch-depth: 1

      - name: Apply Rulebook markers
        run: node scripts/apply-v072-intelligence-rulebook-markers.mjs

      - name: Validate Rulebook authority
        run: npm run rules:facts:check

      - name: Commit repair and remove helper files
        run: |
          set -euo pipefail
          rm scripts/apply-v072-intelligence-rulebook-markers.mjs
          rm .github/workflows/v072-intelligence-rulebook-marker-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rulebook/player-facing/current-rulebook.md scripts/apply-v072-intelligence-rulebook-markers.mjs .github/workflows/v072-intelligence-rulebook-marker-repair.yml
          git commit -m "Track v0.7.2 Intelligence Rulebook facts"
          git push origin HEAD:v072-intelligence-intel-generation
