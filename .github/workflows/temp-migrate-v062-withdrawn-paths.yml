name: One-time v0.6.2 withdrawn-path migration

on:
  push:
    branches:
      - agent/normalize-release-paths

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/normalize-release-paths

      - name: Rewrite controlled v0.6.2 consumers
        shell: python
        run: |
          from pathlib import Path

          old = 'releases/v0.6.2/'
          new = 'releases/v0.6.2-withdrawn/'
          files = [
              '.github/workflows/generate-card-media-assets.yml',
              'rules-assistant/v062-published-corpus.js',
              'config/reconstruction-ledger.json',
              'docs/Gauntlet_v0.6.2_Release_Closeout_Checklist.md',
              'docs/Gauntlet_v0.6.3_Cross_Surface_Closeout_Matrix.md',
              'docs/Gauntlet_v0.6.3_Implementation_Ledger.md',
              'docs/Gauntlet_v0.6.3_Shared_Rules_Candidate.md',
              'docs/Gauntlet_v0.6.3_Shared_Rules_Test_Matrix.md',
              'docs/arena/Gauntlet_Arena_Working_Design.md',
              'v0.6.2/deckbuilder/app.js',
              'v0.6.2/index.html',
              'v0.6.2/print/document-manifest.json',
              'v0.6.2/print/index.html',
              'v0.6.2/reference/app.js',
              'v0.6.2/release-manifest.json',
              'v0.6.2/start/app.js',
              'tests/manifest-destiny-renderer.test.ts',
              'tests/v062-published-player-surfaces.test.ts',
              'tests/v062-release-rulebook-integrity.test.ts',
              'scripts/build-clean-v062-faction-authority.mjs',
              'scripts/build-clean-v062-rulebook.mjs',
              'scripts/build-clean-v063-complete-authority.mjs',
              'scripts/certify-clean-v062-authority.mjs',
              'scripts/validate-clean-v062-certification.mjs',
              'scripts/validate-clean-v062-faction-authority.mjs',
              'scripts/validate-clean-v063-complete-authority.mjs',
              'scripts/validate-v062-withdrawn-release.mjs',
          ]

          changed = []
          for name in files:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  continue
              path.write_text(text.replace(old, new), encoding='utf-8')
              changed.append(name)

          if not changed:
              print('No controlled v0.6.2 consumers needed migration.')
          else:
              print('Migrated controlled v0.6.2 consumers:')
              print('\n'.join(f'- {name}' for name in changed))

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/generate-card-media-assets.yml \
            rules-assistant/v062-published-corpus.js \
            config/reconstruction-ledger.json \
            docs/Gauntlet_v0.6.2_Release_Closeout_Checklist.md \
            docs/Gauntlet_v0.6.3_Cross_Surface_Closeout_Matrix.md \
            docs/Gauntlet_v0.6.3_Implementation_Ledger.md \
            docs/Gauntlet_v0.6.3_Shared_Rules_Candidate.md \
            docs/Gauntlet_v0.6.3_Shared_Rules_Test_Matrix.md \
            docs/arena/Gauntlet_Arena_Working_Design.md \
            v0.6.2/deckbuilder/app.js \
            v0.6.2/index.html \
            v0.6.2/print/document-manifest.json \
            v0.6.2/print/index.html \
            v0.6.2/reference/app.js \
            v0.6.2/release-manifest.json \
            v0.6.2/start/app.js \
            tests/manifest-destiny-renderer.test.ts \
            tests/v062-published-player-surfaces.test.ts \
            tests/v062-release-rulebook-integrity.test.ts \
            scripts/build-clean-v062-faction-authority.mjs \
            scripts/build-clean-v062-rulebook.mjs \
            scripts/build-clean-v063-complete-authority.mjs \
            scripts/certify-clean-v062-authority.mjs \
            scripts/validate-clean-v062-certification.mjs \
            scripts/validate-clean-v062-faction-authority.mjs \
            scripts/validate-clean-v063-complete-authority.mjs \
            scripts/validate-v062-withdrawn-release.mjs
          git commit -m 'Migrate controlled v0.6.2 consumers to withdrawn path'
          git push origin HEAD:agent/normalize-release-paths
