name: Synchronize main into v0.6.1 revision

on:
  push:
    branches:
      - rules/v0.6.1-playtest-revision
    paths:
      - ".github/workflows/sync-main-into-v061.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout revision branch with full history
        uses: actions/checkout@v4
        with:
          ref: rules/v0.6.1-playtest-revision
          fetch-depth: 0

      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff --no-edit origin/main
          git push origin HEAD:rules/v0.6.1-playtest-revision
