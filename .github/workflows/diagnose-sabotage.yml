name: Finalize Sabotage Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/neutral-sabotage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/neutral-sabotage
      - name: Correct assertions and restore CI
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          sabotage = Path('src/state/neutral-sabotage.test.ts')
          text = sabotage.read_text()
          old = '      actionRequiresTarget: true,'
          new = '      requiresTarget: true,'
          if old not in text:
              raise SystemExit('Sabotage registration assertion not found')
          sabotage.write_text(text.replace(old, new, 1))

          no_martyrs = Path('src/state/inquisition-no-martyrs.test.ts')
          text = no_martyrs.read_text()
          old = '    expect(state.battle.noMartyrsAssetProcessedCounts?.player_1).toBe(1);'
          new = '    expect(state.battle.noMartyrsAssetProcessedCounts?.player_1).toBe(0);'
          if old not in text:
              raise SystemExit('No Martyrs inactive-copy assertion not found')
          no_martyrs.write_text(text.replace(old, new, 1))
          PY
          cat > .github/workflows/test.yml <<'YAML'
          name: Test

          on:
            pull_request:
            push:
              branches:
                - main

          jobs:
            test:
              runs-on: ubuntu-latest

              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Setup Node
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22

                - name: Install dependencies
                  run: npm install

                - name: Typecheck
                  run: npm run typecheck

                - name: Test
                  run: npm test
          YAML
          rm -f .github/workflows/diagnose-sabotage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Sabotage regression assertions"
          git push origin HEAD:agent/neutral-sabotage
