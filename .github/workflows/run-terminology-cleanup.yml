name: Run terminology cleanup

on:
  push:
    branches:
      - agent/terminology-refinement
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[terminology-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/terminology-refinement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/cleanup_terminology_refinement.py
      - run: rm -f package-lock.json .github/workflows/inspect-terminology-pipeline.yml
      - run: npm install --no-package-lock
      - run: npm run test:deckbuilder
      - run: npm test
      - run: rm scripts/cleanup_terminology_refinement.py .github/workflows/run-terminology-cleanup.yml
      - name: Commit cleanup
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[terminology-cleanup] Polish terminology refinement"
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/terminology-refinement
            if git rebase origin/agent/terminology-refinement && git push origin HEAD:agent/terminology-refinement; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
