name: Materialize clean v0.7.2 Intelligence changes

on:
  push:
    branches:
      - v072-intelligence-intel-generation

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v072-intelligence-intel-generation
          fetch-depth: 1

      - name: Apply authority, rulebook, and engine changes
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          # ---- current gameplay authority ----
          authority_path = Path('game-data/current-game.json')
          data = json.loads(authority_path.read_text(encoding='utf-8'))
          data['provenance']['currentDevelopmentInputs']['v072IntelligenceEconomy'] = '/docs/v0.7.2-intelligence-intel-generation.json'

          intel_text = 'At the start of your turn, gain Intel equal to your Operation Progress. Spend Intel on Intelligence features and effects.'
          progress_text = 'Increment by 1 each time you complete a normal Mission. Operation Progress records completed normal Missions and is not normally spent.'
          capacity_text = 'If you used your normal Action during Opening, you may still spend 1 Action during Denouement to Start or Complete a Mission or Special Operation. You still cannot take more than one Action in either phase. Abort Mission does not qualify.'
          qualifying = ['Start Mission', 'Complete Mission', 'Start Special Operation', 'Complete Special Operation']
          counts = {'intel': 0, 'progress': 0, 'rules': 0, 'features': 0}

          def walk(value):
              if isinstance(value, dict):
                  if value.get('classification') == 'Resource' and value.get('name') == 'Intel':
                      value['text'] = intel_text
                      counts['intel'] += 1
                  if value.get('classification') == 'Progression' and value.get('name') == 'Operation Progress':
                      value['text'] = progress_text
                      counts['progress'] += 1
                  actions = value.get('faction_features_1_action')
                  if isinstance(actions, list) and 'Start Mission' in actions and 'Complete Special Operation' in actions:
                      value['turn_start_intel'] = 'At the start of your turn, gain Intel equal to your Operation Progress.'
                      value['operational_capacity'] = capacity_text
                      value['operational_capacity_qualifying_features'] = qualifying
                      value['operational_capacity_excluded_features'] = ['Abort Mission']
                      counts['rules'] += 1
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  names = {item.get('name') for item in value if isinstance(item, dict)}
                  if {'Missions', 'Special Operations', 'Surveillance', 'Interference'}.issubset(names):
                      if 'Operational Capacity' not in names:
                          value.append({
                              'name': 'Operational Capacity',
                              'profile': 'Automatic',
                              'timing': 'Denouement after using your normal Action during Opening',
                              'text': capacity_text,
                          })
                      counts['features'] += 1
                  for child in value:
                      walk(child)

          walk(data)
          if counts['intel'] < 2 or counts['progress'] < 2 or counts['rules'] != 1 or counts['features'] != 1:
              raise SystemExit(f'Unexpected Intelligence authority match counts: {counts}')
          authority_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # ---- maintained comprehensive rulebook ----
          rulebook_path = Path('rulebook/player-facing/current-rulebook.md')
          text = rulebook_path.read_text(encoding='utf-8')
          replacements = [
              (
                  "Intelligence pursues hidden **Missions**, earns **Intel**, and builds **Operation Progress**. Intel lets the faction reveal an opponent's hidden battle choice through **Surveillance** and remove it through **Interference**.",
                  "Intelligence pursues hidden **Missions**, earns **Intel**, and builds **Operation Progress**. At the start of each of your turns, your accumulated Operation Progress generates that much Intel. Intel lets the faction reveal an opponent's hidden battle choice through **Surveillance** and remove it through **Interference**.",
              ),
              (
                  "| Faction Features | Start / Complete / Abort Mission and Start / Complete Special Operation — 1 Action · Denouement; Surveillance and Interference — No Action at their stated battle timings. |",
                  "| Faction Features | Missions and Special Operations — 1 Action · Denouement; Operational Capacity — Automatic; Surveillance and Interference — No Action at their stated battle timings. |",
              ),
              (
                  "- **Special Operations — 1 Action · Denouement · Completion cost: Territories in the Gauntlet minus card value, minimum 1 Intel.** When ready, spend an Action to start a Special Operation. On a later Denouement, if its requirement is satisfied and readiness remains valid, spend an Action, reveal it, pay the completion cost, and win immediately.<!-- RULE-FACT:faction-features.intelligence.special-operations -->\n- **Surveillance",
                  "- **Special Operations — 1 Action · Denouement · Completion cost: Territories in the Gauntlet minus card value, minimum 1 Intel.** When ready, spend an Action to start a Special Operation. On a later Denouement, if its requirement is satisfied and readiness remains valid, spend an Action, reveal it, pay the completion cost, and win immediately.<!-- RULE-FACT:faction-features.intelligence.special-operations -->\n- **Operational Capacity — Automatic.** If you used your normal Action during Opening, you may still spend 1 Action during Denouement to Start or Complete a Mission or Special Operation. You still cannot take more than one Action in either phase. Abort Mission does not qualify.<!-- RULE-FACT:faction-features.intelligence.operational-capacity -->\n- **Surveillance",
              ),
              (
                  "A completed Mission gives 1 Operation Progress and Intel equal to the card's value. When Operation Progress exceeds the number of Territories the opponent controls, you may begin a Special Operation.",
                  "A completed Mission gives 1 Operation Progress and Intel equal to the card's value. At the start of each of your turns, gain Intel equal to your current Operation Progress. When Operation Progress exceeds the number of Territories the opponent controls, you may begin a Special Operation.",
              ),
              (
                  "Intel begins at 0, cannot fall below 0, and has no maximum. Spend it for Surveillance, Interference, Fieldcraft, Mission abortion, Special Operation completion, and card effects.",
                  "Intel begins at 0, cannot fall below 0, and has no maximum. At the start of your turn, gain Intel equal to your current Operation Progress. Spend Intel for Surveillance, Interference, Fieldcraft, Mission abortion, Special Operation completion, and card effects.",
              ),
              (
                  "Operation Progress begins at 0 and is not normally spent. Each completed normal Mission adds 1, regardless of card value.\n\n#### Starting a Mission",
                  "Operation Progress begins at 0 and is not normally spent. Each completed normal Mission adds 1, regardless of card value. It records how many normal Missions you have completed. A newly gained point of Operation Progress begins contributing to your recurring Intel at the start of your next turn; it does not create another immediate Intel payment when the Mission completes.\n\n#### Operational Capacity\n\n**Operational Capacity — Automatic.** If you used your normal Action during Opening, you may still spend 1 Action during Denouement to **Start or Complete a Mission or Special Operation**. You still cannot take more than one Action in either phase. **Abort Mission does not qualify.**\n\nStarting and completing Missions and Special Operations remain 1 Action Faction Features. Operational Capacity changes how that qualifying Denouement Action fits into the turn; it does not make those procedures No Action and cannot be converted into another ordinary Denouement Action.\n\n#### Starting a Mission",
              ),
              (
                  "During Denouement, take an Action, reveal the Active Mission, and spend Intel equal to its value to abort it. Put it in the Discard Pile. Aborting is not failure.",
                  "During Denouement, take an Action, reveal the Active Mission, and spend Intel equal to its value to abort it. Put it in the Discard Pile. Aborting is not failure. Abort Mission does not qualify for Operational Capacity.",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one rulebook match, found {count}: {old[:90]!r}')
              text = text.replace(old, new)
          rulebook_path.write_text(text, encoding='utf-8')

          # ---- current digital engine ----
          engine_path = Path('src/v070/turn-engine-core.ts')
          engine = engine_path.read_text(encoding='utf-8')

          old_import = "  completeV070ActiveMission,\n  isV070IntelligencePlayer,"
          new_import = "  completeV070ActiveMission,\n  gainV070TurnStartIntel,\n  isV070IntelligencePlayer,"
          if engine.count(old_import) != 1:
              raise SystemExit('Could not locate Intelligence import insertion point.')
          engine = engine.replace(old_import, new_import)

          helper = r'''function spendIntelligenceOperationAction(
  state: V070GameState,
  playerId: PlayerId,
  operation: 'Start Mission' | 'Complete Mission',
): void {
  try {
    spendTurnAction(state, playerId);
    return;
  } catch (error) {
    const message = error instanceof Error
      ? error.message
      : 'That Action cannot be spent now.';
    if (message !== 'No Actions remain this turn.') {
      throw error;
    }
  }

  const turnState = requireTurnState(state);
  if (turnState.phase !== 'denouement'
    || turnState.actionsTaken.opening < 1
    || turnState.actionsTaken.denouement !== 0) {
    throw new V070GameActionError('No Actions remain this turn.');
  }

  try {
    state.turnState = spendV070Action({
      ...turnState,
      actionsAvailable: turnState.actionsAvailable + 1,
    });
  } catch (error) {
    throw new V070GameActionError(
      error instanceof Error
        ? error.message
        : 'Operational Capacity cannot provide another Action in this phase.',
    );
  }

  appendV070Event(state, {
    type: 'operational_capacity_used',
    actor: playerId,
    visibility: 'public',
    payload: {
      turnNumber: state.turnNumber,
      phase: 'denouement',
      operation,
    },
  });
}

'''
          marker = 'function intelligenceStartMission(\n'
          if engine.count(marker) != 1:
              raise SystemExit('Could not locate Intelligence Mission helper insertion point.')
          engine = engine.replace(marker, helper + marker)

          start_pattern = re.compile(
              r"(function intelligenceStartMission\([\s\S]*?)(\n  spendTurnAction\(state, playerId\);)(\n  startV070MissionFromHand\()",
              re.MULTILINE,
          )
          engine, start_count = start_pattern.subn(
              lambda m: m.group(1) + "\n  spendIntelligenceOperationAction(state, playerId, 'Start Mission');" + m.group(3),
              engine,
              count=1,
          )
          if start_count != 1:
              raise SystemExit(f'Expected one Start Mission Action call, changed {start_count}.')

          complete_pattern = re.compile(
              r"(function intelligenceCompleteMission\([\s\S]*?requireIntelligenceDenouement\(state, playerId\);)(\n  spendTurnAction\(state, playerId\);)(\n  completeV070ActiveMission\()",
              re.MULTILINE,
          )
          engine, complete_count = complete_pattern.subn(
              lambda m: m.group(1) + "\n  spendIntelligenceOperationAction(state, playerId, 'Complete Mission');" + m.group(3),
              engine,
              count=1,
          )
          if complete_count != 1:
              raise SystemExit(f'Expected one Complete Mission Action call, changed {complete_count}.')

          turn_start_old = "  applyV070TurnStartTerritoryEffects(state, playerId);\n  resolveV070SpeculationsAtTurnStart(state, playerId);"
          turn_start_new = "  gainV070TurnStartIntel(state, playerId);\n  applyV070TurnStartTerritoryEffects(state, playerId);\n  resolveV070SpeculationsAtTurnStart(state, playerId);"
          if engine.count(turn_start_old) != 1:
              raise SystemExit('Could not locate canonical turn-start effect sequence.')
          engine = engine.replace(turn_start_old, turn_start_new)
          engine_path.write_text(engine, encoding='utf-8')
          PY

      - name: Sync generated rule facts
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm run rules:facts:sync

      - name: Commit materialized sources and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v072-intelligence-clean-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-data/current-game.json rulebook/player-facing/current-rulebook.md rulebook/player-facing/rule-facts.js src/v070/turn-engine-core.ts .github/workflows/v072-intelligence-clean-materialize.yml
          git commit -m "Implement v0.7.2 Intelligence economy on current main"
          git push origin HEAD:v072-intelligence-intel-generation
