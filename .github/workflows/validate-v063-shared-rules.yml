name: Validate v0.6.3 shared rules

on:
  pull_request:
    paths:
      - 'docs/Gauntlet_v0.6.3_Implementation_Ledger.md'
      - 'docs/Gauntlet_v0.6.3_Shared_Rules_Candidate.md'
      - 'docs/Gauntlet_v0.6.3_Shared_Rules_Test_Matrix.md'
      - 'scripts/validate-v063-shared-rules.mjs'
      - '.github/workflows/validate-v063-shared-rules.yml'
      - 'releases/v0.6.2/**'
  push:
    branches:
      - main
    paths:
      - 'docs/Gauntlet_v0.6.3_Implementation_Ledger.md'
      - 'docs/Gauntlet_v0.6.3_Shared_Rules_Candidate.md'
      - 'docs/Gauntlet_v0.6.3_Shared_Rules_Test_Matrix.md'
      - 'scripts/validate-v063-shared-rules.mjs'
      - '.github/workflows/validate-v063-shared-rules.yml'
      - 'releases/v0.6.2/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch pull-request base
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}:${{ github.base_ref }}" --force

      - name: Validate v0.6.3 opening and victory sources
        run: node scripts/validate-v063-shared-rules.mjs
