name: Export Scorched Earth Source

on:
  pull_request:
    branches:
      - main

jobs:
  export:
    if: github.head_ref == 'agent/neutral-scorched-earth'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/neutral-scorched-earth

      - name: Archive source
        run: tar --exclude=.git -czf /tmp/gauntlet-scorched-earth-source.tar.gz .

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-scorched-earth-source
          path: /tmp/gauntlet-scorched-earth-source.tar.gz
