name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        id: tests
        shell: bash
        run: |
          set +e
          npm test > black-covenant-test-output.txt 2>&1
          status=$?
          cat black-covenant-test-output.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload test diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: black-covenant-test-output
          path: black-covenant-test-output.txt

      - name: Preserve test result
        if: steps.tests.outputs.status != '0'
        run: exit 1
