name: Finalize Salvage Runtime Fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/neutral-salvage'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/neutral-salvage
          fetch-depth: 0

      - name: Apply fixes and restore CI
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/state/neutral-salvage.ts')
          text = path.read_text()
          old = """export interface PreparedSalvageAction {
            targetCardId: CardID;
          }"""
          new = """export interface PreparedSalvageAction {
            targetCardId: CardID;
            sourceCopiesInHandBeforePlay: number;
          }"""
          if old not in text:
              raise SystemExit('PreparedSalvageAction anchor missing')
          text = text.replace(old, new, 1)
          old = "  return { targetCardId: targets[0].cardId };"
          new = """  return {
            targetCardId: targets[0].cardId,
            sourceCopiesInHandBeforePlay: player.zones.hand.filter((cardId) => cardId === SALVAGE).length,
          };"""
          if old not in text:
              raise SystemExit('prepare return anchor missing')
          text = text.replace(old, new, 1)
          old = """  const player = game.players[playerId];
            if (!removeOne(player.zones.discard, prepared.targetCardId)) {"""
          new = """  const player = game.players[playerId];
            const sourceCopiesExpectedInHand = Math.max(0, prepared.sourceCopiesInHandBeforePlay - 1);
            let sourceCopiesInHand = player.zones.hand.filter((cardId) => cardId === SALVAGE).length;
            while (sourceCopiesInHand < sourceCopiesExpectedInHand) {
              player.zones.hand.push(SALVAGE);
              sourceCopiesInHand += 1;
            }
            if (!removeOne(player.zones.discard, prepared.targetCardId)) {"""
          if old not in text:
              raise SystemExit('apply action anchor missing')
          path.write_text(text.replace(old, new, 1))

          path = Path('src/state/neutral-salvage.test.ts')
          text = path.read_text()
          old = """  it('stacks sequentially and never re-offers a recovered card that was discarded', () => {
            let state = game();
            beginResolvedBattle("""
          new = """  it('stacks sequentially and never re-offers a recovered card that was discarded', () => {
            let state = game();
            state.players.player_1.zones.hand = [THIRD];
            beginResolvedBattle("""
          if old not in text:
              raise SystemExit('stacked fixture anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
          git fetch origin main
          git checkout origin/main -- .github/workflows/test.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Salvage duplicate and stacked cleanup cases"
          git push origin HEAD:agent/neutral-salvage
