name: Finalize Scorched Earth Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/neutral-scorched-earth'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/neutral-scorched-earth
          fetch-depth: 0
      - name: Correct fixtures and restore CI
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/state/neutral-scorched-earth.test.ts')
          text = path.read_text()
          text = text.replace("expect(location(win).overlays).toBeUndefined();", "expect(location(win).overlays ?? []).toHaveLength(0);")
          text = text.replace("expect(location(uncontrolled).overlays).toBeUndefined();", "expect(location(uncontrolled).overlays ?? []).toHaveLength(0);")
          text = text.replace("expect(location(suppressed).overlays).toBeUndefined();", "expect(location(suppressed).overlays ?? []).toHaveLength(0);")
          text = text.replace("expect(location(state).overlays).toBeUndefined();", "expect(location(state).overlays ?? []).toHaveLength(0);")
          old = "const attacker = participant('player_1', [], 1);\n    attacker.battleDraw = [SCORCHED_EARTH, SCORCHED_EARTH];"
          if old not in text:
              raise SystemExit('selection fixture anchor missing')
          text = text.replace(old, "const attacker = participant('player_1', [], 1);\n    attacker.battleDraw = [SCORCHED_EARTH, SCORCHED_EARTH];", 1)
          old = "attacker: participant('player_1', [], 1),\n      defender: participant('player_2', [], 1),"
          if old not in text:
              raise SystemExit('commit fixture anchor missing')
          text = text.replace(old, "attacker: { ...participant('player_1', [], 1), passedHandCommit: false },\n      defender: participant('player_2', [], 1),", 1)
          path.write_text(text)
          PY
          git fetch origin main
          git checkout origin/main -- .github/workflows/test.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Scorched Earth test fixtures'
          git push origin HEAD:agent/neutral-scorched-earth
