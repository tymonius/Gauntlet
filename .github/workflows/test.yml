name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Focused Sabotage test
        run: |
          set +e
          npm test -- src/state/neutral-sabotage.test.ts > sabotage-test-output.txt 2>&1
          echo "exit=$?" >> sabotage-test-output.txt
          exit 0

      - name: Upload focused output
        uses: actions/upload-artifact@v4
        with:
          name: sabotage-test-output
          path: sabotage-test-output.txt
