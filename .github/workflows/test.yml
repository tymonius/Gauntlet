name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Repair print renderer and synchronized release outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/render-v062-print-package.mjs')
          text = path.read_text()
          old = "    await page.route(/googletagmanager\\.com|google-analytics\\.com/, (route) => route.abort());"
          new = "    await page.route(/googletagmanager\\.com|google-analytics\\.com/, (route) => route.fulfill({ status: 204, contentType: 'application/javascript', body: '' }));"
          if old not in text:
              raise SystemExit('Expected analytics interception line was not found.')
          path.write_text(text.replace(old, new, 1))
          PY
          node scripts/synchronize-v062-print-release.mjs
          node scripts/synchronize-v062-print-release.mjs --check

      - name: Commit repaired publication sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/render-v062-print-package.mjs \
            releases/v0.6.2/README.md \
            releases/v0.6.2/Gauntlet_v0.6.2_Manifest.json \
            v0.6.2/release-manifest.json \
            v0.6.2/index.html
          git diff --cached --quiet && { echo "No publication changes to commit."; exit 0; }
          git commit -m "Repair v0.6.2 print publication synchronization"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
