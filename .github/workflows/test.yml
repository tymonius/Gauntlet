name: Patch and Test Bombardment

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: fix/neutral-bombardment
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Bombardment integration
        run: python .github/scripts/patch-bombardment.py

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Commit validated implementation
        run: |
          rm -f package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire canonical Neutral Bombardment" || exit 0
          git pull --rebase origin fix/neutral-bombardment
          git push origin HEAD:fix/neutral-bombardment
