name: Implement Neutral Sequestration

on:
  pull_request:

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.ref == 'agent/neutral-sequestration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wire Sequestration into engine
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one anchor, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'src/cards/playability.ts',
              "  'neutral-revolution': battleAndAction('neutral-revolution', 'discard'),",
              "  'neutral-revolution': battleAndAction('neutral-revolution', 'discard'),\n  'neutral-sequestration': battleAndAction('neutral-sequestration', 'discard'),",
          )

          replace_once(
              'src/types/neutral.ts',
              "export interface RevolutionBattleExchangeState {",
              "export interface SequestrationActionState {\n  sourcePlayerId: PlayerID;\n  playerIds: PlayerID[];\n  completedPlayerIds: PlayerID[];\n  keptCardIds: Partial<Record<PlayerID, CardID>>;\n  resumePriorityPlayer?: PlayerID;\n}\n\nexport interface PendingSequestrationActionChoice {\n  kind: 'sequestration_action';\n  playerId: PlayerID;\n  sourcePlayerId: PlayerID;\n  cardOptions: CardID[];\n  options: ['select_card'];\n  resumePriorityPlayer?: PlayerID;\n}\n\nexport interface RevolutionBattleExchangeState {",
          )
          replace_once(
              'src/types/neutral.ts',
              "  | PendingFortificationsBattleChoice\n  | PendingRevolutionBattleChoice",
              "  | PendingFortificationsBattleChoice\n  | PendingSequestrationActionChoice\n  | PendingRevolutionBattleChoice",
          )

          replace_once(
              'src/types/game.ts',
              "ReservesBattleTopdecks, RevolutionBattleExchangeState, SalvageBattleQueueEntry",
              "ReservesBattleTopdecks, RevolutionBattleExchangeState, SequestrationActionState, SalvageBattleQueueEntry",
          )
          replace_once(
              'src/types/game.ts',
              "  neutralRevolutionBattleExchange?: RevolutionBattleExchangeState;\n  neutralSabotageAssetSuppressions?:",
              "  neutralRevolutionBattleExchange?: RevolutionBattleExchangeState;\n  neutralSequestrationAction?: SequestrationActionState;\n  neutralSabotageAssetSuppressions?:",
          )

          replace_once(
              'src/state/index.ts',
              "export * from './neutral-revolution';\nexport * from './neutral-rousing-speech';",
              "export * from './neutral-revolution';\nexport * from './neutral-sequestration';\nexport * from './neutral-rousing-speech';",
          )

          replace_once(
              'src/state/views.ts',
              "    || kind === 'revolution_battle'\n    || kind === 'rousing_speech_discard',",
              "    || kind === 'revolution_battle'\n    || kind === 'sequestration_action'\n    || kind === 'rousing_speech_discard',",
          )

          replace_once(
              'src/state/battle-reveal.ts',
              "import { applyPalisadeWallBattleEffects } from './neutral-palisade-wall';",
              "import { applyPalisadeWallBattleEffects } from './neutral-palisade-wall';\nimport { applySequestrationBattleRestriction } from './neutral-sequestration';",
          )
          replace_once(
              'src/state/battle-reveal.ts',
              "  applyCapitalPunishmentBattleEffects(game, action);\n  battle.resolvedCancellations = cancellations;",
              "  applyCapitalPunishmentBattleEffects(game, action);\n  applySequestrationBattleRestriction(game);\n  battle.resolvedCancellations = cancellations;",
          )

          replace_once(
              'src/state/apply-neutral.ts',
              "} from './neutral-revolution';\nimport {\n  applyScoutingReportAction,",
              "} from './neutral-revolution';\nimport {\n  applySequestrationAction,\n  resolveSequestrationChoice,\n  SEQUESTRATION,\n} from './neutral-sequestration';\nimport {\n  applyScoutingReportAction,",
          )
          replace_once(
              'src/state/apply-neutral.ts',
              "    const resistanceDecoysBefore = pendingKind === 'resistance_battle'\n      ? captureDecoysAssetSnapshot(game)\n      : undefined;\n    const next = structuredClone(game);",
              "    const resistanceDecoysBefore = pendingKind === 'resistance_battle'\n      ? captureDecoysAssetSnapshot(game)\n      : undefined;\n    const sequestrationSourcePlayerId = pendingKind === 'sequestration_action'\n      ? game.neutralSequestrationAction?.sourcePlayerId\n      : undefined;\n    const sequestrationAssetsBefore = sequestrationSourcePlayerId\n      ? captureDecoysAssetSnapshot(game)\n      : undefined;\n    const sequestrationDiscardBefore = sequestrationSourcePlayerId\n      ? captureDiscardSnapshot(game)\n      : undefined;\n    const next = structuredClone(game);",
          )
          replace_once(
              'src/state/apply-neutral.ts',
              "                          : pendingKind === 'revolution_battle'\n                            ? (resolveRevolutionChoice(next, action), {})",
              "                          : pendingKind === 'sequestration_action'\n                            ? (resolveSequestrationChoice(next, action), {})\n                          : pendingKind === 'revolution_battle'\n                            ? (resolveRevolutionChoice(next, action), {})",
          )
          replace_once(
              'src/state/apply-neutral.ts',
              "    if (resistanceDecoysBefore) {\n      registerDecoysAssetExits(next, resistanceDecoysBefore, action.playerId);\n    }\n    reconcileSabotageAssetState(next);",
              "    if (resistanceDecoysBefore) {\n      registerDecoysAssetExits(next, resistanceDecoysBefore, action.playerId);\n    }\n    if (sequestrationAssetsBefore && sequestrationSourcePlayerId) {\n      registerDecoysAssetExits(next, sequestrationAssetsBefore, sequestrationSourcePlayerId);\n    }\n    if (sequestrationDiscardBefore && sequestrationSourcePlayerId) {\n      registerRedemptionDiscardEntries(next, sequestrationDiscardBefore, sequestrationSourcePlayerId);\n    }\n    reconcileSabotageAssetState(next);",
          )
          replace_once(
              'src/state/apply-neutral.ts',
              "  if (action.type === 'play_action_card' && action.cardId === REVOLUTION) {\n    const drawnCards = applyRevolutionAction(result.state, action.playerId);\n    result.result = { ...(result.result ?? {}), drawnCards };\n  }",
              "  if (action.type === 'play_action_card' && action.cardId === REVOLUTION) {\n    const drawnCards = applyRevolutionAction(result.state, action.playerId);\n    result.result = { ...(result.result ?? {}), drawnCards };\n  }\n  if (action.type === 'play_action_card' && action.cardId === SEQUESTRATION) {\n    applySequestrationAction(result.state, action.playerId);\n  }",
          )

          Path('.github/workflows/test.yml').write_bytes(base64.b64decode(
              ''
          ))
          PY

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Commit implementation
        shell: bash
        run: |
          rm -f package-lock.json
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Neutral Sequestration"
          git push origin HEAD:${{ github.head_ref }}
