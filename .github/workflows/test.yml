name: Diagnose Salvage Regression

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Capture full test suite
        run: |
          set +e
          npm test > salvage-full-output.txt 2>&1
          echo "exit=$?" >> salvage-full-output.txt
          exit 0

      - name: Upload full output
        uses: actions/upload-artifact@v4
        with:
          name: salvage-full-output
          path: salvage-full-output.txt
