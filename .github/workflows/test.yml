name: Diagnose Scorched Earth

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Capture focused test
        run: |
          set +e
          npx vitest run src/state/neutral-scorched-earth.test.ts > scorched-earth-output.txt 2>&1
          echo "exit=$?" >> scorched-earth-output.txt
          exit 0
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: scorched-earth-output
          path: scorched-earth-output.txt
