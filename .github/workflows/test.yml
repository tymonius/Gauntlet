name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Repair bounded browser teardown
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/render-v062-print-package.mjs')
          text = path.read_text()
          old = "} finally {\n  await browserServer.kill();\n}"
          new = "} finally {\n  try {\n    await Promise.race([\n      browser.close(),\n      new Promise((_, reject) => setTimeout(() => reject(new Error('Browser close timed out.')), 3000)),\n    ]);\n  } catch (error) {\n    console.warn(`[print] browser close fallback: ${error.message}`);\n  }\n  const browserProcess = browserServer.process();\n  if (browserProcess.exitCode === null && !browserProcess.killed) {\n    browserProcess.kill('SIGKILL');\n  }\n}"
          if old not in text:
              raise SystemExit('Expected browserServer.kill teardown not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit renderer teardown repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/render-v062-print-package.mjs
          git diff --cached --quiet && { echo "No renderer change to commit."; exit 0; }
          git commit -m "Bound v0.6.2 print renderer teardown"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
