name: Apply Spirit Hollow fixture correction

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/mystics-spirit-hollow

      - name: Correct fixture and restore workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path('src/state/mystics-spirit-hollow.test.ts')
          text = test_path.read_text()
          old = "const endpoint = state.board.spaces.find((space) => space.kind === 'endpoint')!;"
          new = "const endpoint = state.board.spaces.find((space) => space.kind !== 'territory')!;"
          if old not in text:
              raise SystemExit('Expected Spirit Hollow fixture line was not found.')
          test_path.write_text(text.replace(old, new, 1))

          Path('.github/workflows/test.yml').write_text("""name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
""")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/state/mystics-spirit-hollow.test.ts .github/workflows/test.yml
          git commit -m "Fix Spirit Hollow non-Territory fixture"
          git push origin HEAD:feature/mystics-spirit-hollow
