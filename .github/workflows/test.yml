name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck-output.txt

      - name: Focused Fate's Toll tests
        shell: bash
        run: |
          set -o pipefail
          npx vitest run src/state/mystics-fates-toll.test.ts 2>&1 | tee fates-toll-output.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fates-toll-diagnostics
          path: |
            typecheck-output.txt
            fates-toll-output.txt
          if-no-files-found: ignore
