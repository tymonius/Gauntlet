name: Diagnose Salvage Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Capture focused test
        run: |
          set +e
          npx vitest run src/state/neutral-salvage.test.ts > salvage-test-output.txt 2>&1
          echo "exit=$?" >> salvage-test-output.txt
          exit 0

      - name: Upload focused output
        uses: actions/upload-artifact@v4
        with:
          name: salvage-test-output
          path: salvage-test-output.txt
