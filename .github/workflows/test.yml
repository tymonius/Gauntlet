name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Focused Decoys diagnostics
        shell: bash
        run: |
          set -o pipefail
          git clone --quiet --depth 1 --branch agent/neutral-decoys https://github.com/tymonius/Gauntlet.git repo
          cd repo
          npm install --silent
          npm run typecheck
          npm test -- --run src/state/neutral-decoys.test.ts
