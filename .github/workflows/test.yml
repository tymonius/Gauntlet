name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture source snapshot
        run: zip -r no-martyrs-source.zip src package.json package-lock.json .github/workflows/test.yml

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: no-martyrs-source
          path: no-martyrs-source.zip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
