name: Publish Salvage

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/neutral-salvage'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/neutral-salvage
          fetch-depth: 0

      - name: Materialize verified blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          write_blob() {
            local sha="$1"
            local path="$2"
            mkdir -p "$(dirname "$path")"
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq .content | base64 -d > "$path"
          }
          write_blob e5cb7adc089afb969ed2d9c2eb70efd49f8852c8 src/cards/playability.ts
          write_blob c5efb3571c323d0b446181db521fa7e2f1d0d8ac src/state/apply-neutral.ts
          write_blob 93608800b47bddb807b3b0df36c241173d550c85 src/state/index.ts
          write_blob 15a8ab8b518b2147bca303f0bec12a791d6780be src/state/neutral-salvage.ts
          write_blob 0736195e7bdc895ce7a9661efef16b29f972c835 src/state/neutral-salvage.test.ts
          write_blob fa9aed6259d081f5915d416c61015eca46a5be50 src/types/game.ts
          write_blob d0d6ed84672ffd212b505d9a816ab849eba70e2a src/types/neutral.ts
          git fetch origin main
          git checkout origin/main -- .github/workflows/test.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Neutral Salvage"
          git push origin HEAD:agent/neutral-salvage
