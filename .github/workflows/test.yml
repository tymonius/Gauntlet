name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine relevant test scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base='${{ github.event.pull_request.base.sha }}'
          else
            base='${{ github.event.before }}'
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          else
            git fetch --no-tags --depth=1 origin "$base"
          fi
          git diff --name-only "$base" HEAD > /tmp/changed-files.txt
          cat /tmp/changed-files.txt

          : > /tmp/changed-test-files.txt
          : > /tmp/related-source-files.txt
          code=false
          types=false
          full_tests=false
          analytics=false
          tts=false
          media=false

          while IFS= read -r file; do
            case "$file" in
              *.test.ts|*.test.tsx|*.test.js|*.test.mjs|*.spec.ts|*.spec.tsx|*.spec.js|*.spec.mjs)
                code=true
                printf '%s\n' "$file" >> /tmp/changed-test-files.txt
                ;;
              *.ts|*.tsx|*.js|*.mjs)
                code=true
                printf '%s\n' "$file" >> /tmp/related-source-files.txt
                ;;
              package.json|package-lock.json|vitest.config.*)
                code=true
                full_tests=true
                ;;
            esac
            case "$file" in
              *.ts|*.tsx|package.json|package-lock.json|tsconfig*.json)
                types=true
                ;;
            esac
            case "$file" in
              scripts/sync-google-analytics.mjs|index.html|start/*.html|rulebook/*.html|card-reference/*.html|factions/*.html|factions/*/*.html|deckbuilder/*.html|rules-arbiter/*.html)
                analytics=true
                ;;
            esac
            case "$file" in
              scripts/generate-tts-*|tts/**|artifacts/tts/**|data/cards/**|data/territories/**)
                tts=true
                ;;
            esac
            case "$file" in
              scripts/generate-card-media-*|images/artwork/**|artifacts/media/**|data/cards/**)
                media=true
                ;;
            esac
          done < /tmp/changed-files.txt

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "types=$types" >> "$GITHUB_OUTPUT"
          echo "full_tests=$full_tests" >> "$GITHUB_OUTPUT"
          echo "analytics=$analytics" >> "$GITHUB_OUTPUT"
          echo "tts=$tts" >> "$GITHUB_OUTPUT"
          echo "media=$media" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: >-
          steps.scope.outputs.code == 'true' ||
          steps.scope.outputs.types == 'true' ||
          steps.scope.outputs.analytics == 'true' ||
          steps.scope.outputs.tts == 'true' ||
          steps.scope.outputs.media == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: >-
          steps.scope.outputs.code == 'true' ||
          steps.scope.outputs.types == 'true' ||
          steps.scope.outputs.analytics == 'true' ||
          steps.scope.outputs.tts == 'true' ||
          steps.scope.outputs.media == 'true'
        run: npm install

      - name: Typecheck changed TypeScript surface
        if: steps.scope.outputs.types == 'true'
        run: npm run typecheck

      - name: Run scoped code tests
        if: steps.scope.outputs.code == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.scope.outputs.full_tests }}" == "true" ]]; then
            npx vitest run
            exit 0
          fi

          if [[ -s /tmp/changed-test-files.txt ]]; then
            mapfile -t changed_tests < /tmp/changed-test-files.txt
            npx vitest run "${changed_tests[@]}"
          fi

          if [[ -s /tmp/related-source-files.txt ]]; then
            mapfile -t changed_sources < /tmp/related-source-files.txt
            npx vitest related --run --passWithNoTests "${changed_sources[@]}"
          fi

      - name: Verify analytics only when analytics-bearing pages change
        if: steps.scope.outputs.analytics == 'true'
        run: node scripts/sync-google-analytics.mjs --check

      - name: Verify TTS assets only when TTS inputs change
        if: steps.scope.outputs.tts == 'true'
        run: npm run tts:check

      - name: Verify media assets only when media inputs change
        if: steps.scope.outputs.media == 'true'
        run: npm run media:check

      - name: No generic regression work required
        if: >-
          steps.scope.outputs.code != 'true' &&
          steps.scope.outputs.types != 'true' &&
          steps.scope.outputs.analytics != 'true' &&
          steps.scope.outputs.tts != 'true' &&
          steps.scope.outputs.media != 'true'
        run: echo 'No code-owned regression checks are relevant to this change.'
