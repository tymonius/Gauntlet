name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          npx vitest run src/state/neutral-redemption-debug.test.ts --reporter=verbose 2>&1 | tee redemption-debug.log

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redemption-debug-output
          path: redemption-debug.log
