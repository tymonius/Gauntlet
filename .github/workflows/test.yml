name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Determine relevant test scope before checkout
        id: scope
        uses: actions/github-script@v7
        with:
          script: |
            let names = [];
            let activeNames = [];
            let retiredSourceNames = [];
            let uncertain = false;

            if (context.eventName === 'workflow_dispatch') {
              names = [
                'releases/v0.7.0/Gauntlet_v0.7.0_Rulebook.md',
                'releases/v0.7.0/Gauntlet_v0.7.0_Rulebook_Booklet.pdf',
                'releases/v0.7.0/Gauntlet_v0.7.0_Manifest.json',
                'v0.7.0/index.html',
              ];
              activeNames = names;
            } else if (context.eventName === 'pull_request') {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              });
              names = files.map((file) => file.filename);
              activeNames = files.filter((file) => file.status !== 'removed').map((file) => file.filename);
              retiredSourceNames = files.flatMap((file) => {
                if (file.status === 'removed') return [file.filename];
                if (file.status === 'renamed' && file.previous_filename) return [file.previous_filename];
                return [];
              });
            } else {
              const before = context.payload.before;
              if (!before || /^0+$/.test(before)) {
                uncertain = true;
              } else {
                const comparison = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: before,
                  head: context.sha,
                });
                const comparedFiles = comparison.data.files || [];
                names = comparedFiles.map((file) => file.filename);
                activeNames = comparedFiles.filter((file) => file.status !== 'removed').map((file) => file.filename);
                retiredSourceNames = comparedFiles.flatMap((file) => {
                  if (file.status === 'removed') return [file.filename];
                  if (file.status === 'renamed' && file.previous_filename) return [file.previous_filename];
                  return [];
                });
                if (comparedFiles.length >= 300) uncertain = true;
              }
            }

            const exact = (value) => names.includes(value);
            const under = (prefix) => names.some((file) => file.startsWith(prefix));
            const matches = (pattern) => names.some((file) => pattern.test(file));

            let packageRuntimeChanged = false;
            if (exact('package.json')) {
              const baseRef = context.eventName === 'pull_request'
                ? context.payload.pull_request.base.sha
                : context.payload.before;
              const headRef = context.eventName === 'pull_request'
                ? context.payload.pull_request.head.sha
                : context.sha;

              try {
                const readPackage = async (ref) => {
                  const response = await github.rest.repos.getContent({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    path: 'package.json',
                    ref,
                  });
                  if (Array.isArray(response.data) || response.data.type !== 'file' || !response.data.content) {
                    throw new Error(`package.json at ${ref} was not a file`);
                  }
                  return JSON.parse(Buffer.from(response.data.content, response.data.encoding || 'base64').toString('utf8'));
                };

                const basePackage = await readPackage(baseRef);
                const headPackage = await readPackage(headRef);
                const { scripts: baseScripts = {}, ...baseRuntime } = basePackage;
                const { scripts: headScripts = {}, ...headRuntime } = headPackage;
                const runtimeChanged = JSON.stringify(baseRuntime) !== JSON.stringify(headRuntime);
                const scriptKeys = new Set([...Object.keys(baseScripts), ...Object.keys(headScripts)]);
                const testScriptChanged = [...scriptKeys].some((key) =>
                  /^(?:test(?::|$)|typecheck$)/.test(key) && baseScripts[key] !== headScripts[key]
                );
                packageRuntimeChanged = runtimeChanged || testScriptChanged;
              } catch (error) {
                core.warning(`Unable to classify package.json change safely: ${error.message}`);
                packageRuntimeChanged = true;
              }
            }

            const testPattern = /(?:^|\/)[^/]+\.(?:test|spec)\.(?:ts|tsx|js|mjs)$/;
            const sourcePattern = /\.(?:ts|tsx|js|mjs)$/;
            const archivedEngineSnapshot = /^legacy\/digital-engine-(?:reconstruction|migration|v06)\//;
            const changedTests = activeNames.filter((file) => !archivedEngineSnapshot.test(file) && testPattern.test(file));
            const relatedSources = activeNames.filter((file) => !archivedEngineSnapshot.test(file) && sourcePattern.test(file) && !testPattern.test(file));
            const testWorkflowOnly = names.length === 1 && exact('.github/workflows/test.yml');
            const retiredSources = retiredSourceNames.filter((file) => sourcePattern.test(file) && !testPattern.test(file));

            const fullTests = uncertain || packageRuntimeChanged || exact('package-lock.json') || exact('vitest.config.ts') || exact('vitest.config.js') || exact('vitest.config.mjs') || testWorkflowOnly;
            const code = fullTests || exact('.github/workflows/test.yml') || changedTests.length > 0 || relatedSources.length > 0;
            const types = uncertain || exact('package.json') || exact('package-lock.json') || matches(/\.(?:ts|tsx)$/) || matches(/(?:^|\/)tsconfig[^/]*\.json$/);
            const analytics = uncertain || exact('scripts/sync-google-analytics.mjs') || exact('index.html') || matches(/^(?:start|rulebook|card-reference|deckbuilder|rules-arbiter)\/[^/]*\.html$/) || matches(/^factions\/(?:[^/]+\/)?[^/]*\.html$/);
            const tts = uncertain || matches(/^scripts\/generate-tts-/) || under('tts/') || under('artifacts/tts/') || under('data/cards/') || under('data/territories/');
            const media = uncertain || matches(/^scripts\/generate-card-media-/) || under('images/artwork/') || under('artifacts/media/') || under('data/cards/');
            const accessibility = uncertain || matches(/\.html$/) || exact('tests/public-static-accessibility.test.ts');
            const relevant = code || types || analytics || tts || media || accessibility;

            core.setOutput('relevant', String(relevant));
            core.setOutput('code', String(code));
            core.setOutput('types', String(types));
            core.setOutput('full_tests', String(fullTests));
            core.setOutput('analytics', String(analytics));
            core.setOutput('tts', String(tts));
            core.setOutput('media', String(media));
            core.setOutput('accessibility', String(accessibility));
            core.setOutput('changed_tests', JSON.stringify(changedTests));
            core.setOutput('related_sources', JSON.stringify(relatedSources));
            core.setOutput('retired_sources', JSON.stringify(retiredSources));
            core.summary
              .addHeading('Test routing')
              .addTable([
                [{data: 'Check', header: true}, {data: 'Run?', header: true}],
                ['Release-path normalization', 'true'],
                ['Vitest', String(code)],
                ['Retired source references', retiredSources.length ? 'scan' : 'none'],
                ['Full Vitest suite', String(fullTests)],
                ['TypeScript', String(types)],
                ['Analytics', String(analytics)],
                ['TTS', String(tts)],
                ['Media', String(media)],
                ['Public static accessibility', String(accessibility)],
              ])
              .write();

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reject references to retired source paths
        if: steps.scope.outputs.retired_sources != '[]'
        shell: bash
        env:
          RETIRED_SOURCES: ${{ steps.scope.outputs.retired_sources }}
        run: |
          set -euo pipefail
          found=0
          mapfile -t retired_sources < <(node -e "for (const file of JSON.parse(process.env.RETIRED_SOURCES || '[]')) console.log(file)")
          for retired in "${retired_sources[@]}"; do
            [[ -e "$retired" ]] && continue
            while IFS= read -r match; do
              [[ -z "$match" ]] && continue
              [[ "$match" == *"legacy/public-compatibility/$retired"* ]] && continue
              [[ "$match" == docs/recovery/frozen-scripts/* ]] && continue
              echo "Dangling reference to retired source $retired: $match" >&2
              found=1
            done < <(git grep -n -F "$retired" -- '*.js' '*.mjs' '*.ts' '*.tsx' || true)
          done
          if (( found )); then
            exit 1
          fi

      - name: Audit repository-wide release path normalization
        run: node scripts/validate-release-path-normalization.mjs

      - name: Verify tracked Rulebook facts
        run: node scripts/sync-current-rulebook-facts.mjs

      - name: Setup Node
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.scope.outputs.relevant == 'true'
        run: npm install

      - name: Typecheck changed TypeScript surface
        if: steps.scope.outputs.types == 'true'
        run: npm run typecheck

      - name: Run scoped code tests
        if: steps.scope.outputs.code == 'true'
        shell: bash
        env:
          CHANGED_TESTS: ${{ steps.scope.outputs.changed_tests }}
          RELATED_SOURCES: ${{ steps.scope.outputs.related_sources }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.scope.outputs.full_tests }}" == "true" ]]; then
            npx vitest run
            exit 0
          fi

          mapfile -t changed_tests < <(node -e "for (const file of JSON.parse(process.env.CHANGED_TESTS || '[]')) console.log(file)")
          if (( ${#changed_tests[@]} )); then
            npx vitest run "${changed_tests[@]}"
          fi

          mapfile -t related_sources < <(node -e "for (const file of JSON.parse(process.env.RELATED_SOURCES || '[]')) console.log(file)")
          if (( ${#related_sources[@]} )); then
            # These historical v0.6.4 suites still reference retired draft JSON fixtures.
            # Keep them runnable when changed directly, but do not let unrelated current
            # source changes pull them into scoped dependency testing.
            npx vitest related --run --passWithNoTests \
              --exclude 'tests/arcane-card-symbol.test.ts' \
              --exclude 'tests/v064-rules-arbiter-onset.test.ts' \
              --exclude 'tests/v064-rules-arbiter-proposals.test.ts' \
              --exclude 'tests/v064-rules-arbiter-territories.test.ts' \
              "${related_sources[@]}"
          fi

      - name: Run public static accessibility contract when HTML changes
        if: steps.scope.outputs.accessibility == 'true'
        run: npx vitest run tests/public-static-accessibility.test.ts

      - name: Verify analytics only when analytics-bearing pages change
        if: steps.scope.outputs.analytics == 'true'
        run: node scripts/sync-google-analytics.mjs --check

      - name: Verify TTS assets only when TTS inputs change
        if: steps.scope.outputs.tts == 'true'
        run: npm run tts:check

      - name: Verify media assets only when media inputs change
        if: steps.scope.outputs.media == 'true'
        run: npm run media:check

      - name: No scoped repository test work required
        if: steps.scope.outputs.relevant != 'true'
        run: echo 'Release-path normalization passed; no additional repository-owned regression checks are relevant to this change.'
