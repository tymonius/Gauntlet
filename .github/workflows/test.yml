name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Regenerate and synchronize canonical v0.6.2 print outputs
        run: |
          npm run print:v062:html
          npm run print:v062:sync
          npm run print:v062:html:check
          npm run print:v062:sync:check

      - name: Commit synchronized print outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playtest/player-mat/index.html v0.6.2/print/*.html v0.6.2/print/document-manifest.json releases/v0.6.2/README.md releases/v0.6.2/Gauntlet_v0.6.2_Manifest.json v0.6.2/release-manifest.json v0.6.2/index.html
          git diff --cached --quiet && { echo "No synchronized changes to commit."; exit 0; }
          git commit -m "Synchronize v0.6.2 print release outputs"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Run unit tests
        run: npx vitest run --reporter=json --outputFile=vitest-results.json

      - name: Upload Vitest diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: vitest-results.json
          if-no-files-found: error

      - name: Validate v0.6.2 shared rules
        run: node scripts/validate-v062-shared-rules.mjs

      - name: Validate v0.6.2 faction components
        run: node scripts/validate-v062-faction-components.mjs

      - name: Validate v0.6.2 starters and onboarding
        run: node scripts/validate-v062-starters-onboarding.mjs

      - name: Validate v0.6.2 live propagation
        run: node scripts/validate-v062-live-propagation.mjs

      - name: Validate v0.6.2 arbiter and digital surfaces
        run: node scripts/validate-v062-arbiter-digital.mjs

      - name: Validate v0.6.2 card execution
        run: node scripts/validate-v062-card-execution.mjs

      - name: Validate v0.6.2 release closeout
        run: node scripts/validate-v062-release-closeout.mjs

      - name: Check v0.6.2 public-site synchronization
        run: node scripts/synchronize-v062-public-site.mjs --check

      - name: Validate v0.6.2 published release
        run: node scripts/validate-v062-published-release.mjs

      - name: Validate v0.6.2 print package
        run: npm run print:v062:check

      - name: Validate starter decks
        run: node scripts/validate-starter-decks.mjs

      - name: Check Google Analytics synchronization
        run: node scripts/sync-google-analytics.mjs --check

      - name: Validate retired faction sheets
        run: node scripts/validate-retired-faction-sheets.mjs

      - name: Validate TTS assets
        run: npm run tts:check

      - name: Validate media assets
        run: npm run media:check
