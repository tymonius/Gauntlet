name: Implement Neutral Revolution

on:
  pull_request:

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.ref == 'agent/neutral-revolution'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wire Revolution into engine
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one anchor, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'src/cards/playability.ts',
              "  'neutral-invasion': battleAndAction('neutral-invasion', 'discard'),\n  'neutral-armistice':",
              "  'neutral-invasion': battleAndAction('neutral-invasion', 'discard'),\n  'neutral-revolution': battleAndAction('neutral-revolution', 'discard'),\n  'neutral-armistice':",
          )

          replace_once(
              'src/types/neutral.ts',
              "export interface PendingValorBattleChoice {",
              "export interface RevolutionBattleExchangeState {\n  battleId: string;\n  eligiblePlayerIds: PlayerID[];\n  decisions: Partial<Record<PlayerID, 'keep' | 'exchange'>>;\n  resumePriorityPlayer?: PlayerID;\n}\n\nexport interface PendingRevolutionBattleChoice {\n  kind: 'revolution_battle';\n  playerId: PlayerID;\n  battleId: string;\n  options: ['keep', 'exchange'];\n  resumePriorityPlayer?: PlayerID;\n}\n\nexport interface PendingValorBattleChoice {",
          )
          replace_once(
              'src/types/neutral.ts',
              "  | PendingFortificationsBattleChoice\n  | PendingValorBattleChoice",
              "  | PendingFortificationsBattleChoice\n  | PendingRevolutionBattleChoice\n  | PendingValorBattleChoice",
          )

          replace_once(
              'src/types/game.ts',
              "RousingSpeechAssetQueueEntry, NeutralSabotageAssetSuppression, ReservesBattleTopdecks, SalvageBattleQueueEntry",
              "RousingSpeechAssetQueueEntry, NeutralSabotageAssetSuppression, ReservesBattleTopdecks, RevolutionBattleExchangeState, SalvageBattleQueueEntry",
          )
          replace_once(
              'src/types/game.ts',
              "  neutralRousingSpeechAssetQueue?: RousingSpeechAssetQueueEntry[];\n  neutralSabotageAssetSuppressions?:",
              "  neutralRousingSpeechAssetQueue?: RousingSpeechAssetQueueEntry[];\n  neutralRevolutionBattleExchange?: RevolutionBattleExchangeState;\n  neutralSabotageAssetSuppressions?:",
          )

          replace_once(
              'src/state/index.ts',
              "export * from './neutral-requisition';\nexport * from './neutral-rousing-speech';",
              "export * from './neutral-requisition';\nexport * from './neutral-revolution';\nexport * from './neutral-rousing-speech';",
          )

          replace_once(
              'src/state/views.ts',
              "    || kind?.startsWith('invasion_')\n    || kind === 'rousing_speech_discard',",
              "    || kind?.startsWith('invasion_')\n    || kind === 'revolution_battle'\n    || kind === 'rousing_speech_discard',",
          )

          replace_once(
              'src/state/apply-neutral.ts',
              "} from './neutral-reserves';\nimport {\n  applyScoutingReportAction,",
              "} from './neutral-reserves';\nimport {\n  applyRevolutionAction,\n  openNextRevolutionChoice,\n  resolveRevolutionChoice,\n  REVOLUTION,\n} from './neutral-revolution';\nimport {\n  applyScoutingReportAction,",
          )
          replace_once(
              'src/state/apply-neutral.ts',
              "  openNextValorReroll(game);\n}",
              "  openNextValorReroll(game);\n  openNextRevolutionChoice(game);\n}",
          )
          replace_once(
              'src/state/apply-neutral.ts',
              "                          : pendingKind === 'valor_battle'\n                            ? (resolveValorChoice(next, action), {})",
              "                          : pendingKind === 'revolution_battle'\n                            ? (resolveRevolutionChoice(next, action), {})\n                          : pendingKind === 'valor_battle'\n                            ? (resolveValorChoice(next, action), {})",
          )
          replace_once(
              'src/state/apply-neutral.ts',
              "  if (action.type === 'play_action_card' && preparedReserves) {\n    const drawnCards = applyReservesAction(result.state, action.playerId, preparedReserves);\n    result.result = { ...(result.result ?? {}), drawnCards };\n  }",
              "  if (action.type === 'play_action_card' && preparedReserves) {\n    const drawnCards = applyReservesAction(result.state, action.playerId, preparedReserves);\n    result.result = { ...(result.result ?? {}), drawnCards };\n  }\n  if (action.type === 'play_action_card' && action.cardId === REVOLUTION) {\n    const drawnCards = applyRevolutionAction(result.state, action.playerId);\n    result.result = { ...(result.result ?? {}), drawnCards };\n  }",
          )

          Path('.github/workflows/test.yml').write_bytes(base64.b64decode(
              ''
          ))
          PY

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Commit implementation
        shell: bash
        run: |
          rm -f package-lock.json
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Neutral Revolution"
          git push origin HEAD:${{ github.head_ref }}
