name: Diagnose Salvage Typecheck

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Capture typecheck
        run: |
          set +e
          npm run typecheck > salvage-typecheck.txt 2>&1
          echo "exit=$?" >> salvage-typecheck.txt
          exit 0

      - name: Upload typecheck output
        uses: actions/upload-artifact@v4
        with:
          name: salvage-typecheck-output
          path: salvage-typecheck.txt
