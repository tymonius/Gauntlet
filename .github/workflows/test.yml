name: Diagnose Sedition Staging

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    if: github.head_ref == 'agent/neutral-sedition'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/neutral-sedition

      - name: Record staging integrity
        run: |
          set -u
          {
            for file in \
              .github/sedition-00.b64 \
              .github/sedition-00a.b64 \
              .github/sedition-00b.b64 \
              .github/sedition-01.b64 \
              .github/sedition-02.b64 \
              .github/sedition-03.b64; do
              echo "FILE $file"
              wc -c "$file"
              sha256sum "$file"
            done
            cat .github/sedition-00a.b64 \
                .github/sedition-00b.b64 \
                .github/sedition-01.b64 \
                .github/sedition-02.b64 \
                .github/sedition-03.b64 > /tmp/sedition-files.b64
            echo 'COMBINED'
            wc -c /tmp/sedition-files.b64
            sha256sum /tmp/sedition-files.b64
            base64 -d /tmp/sedition-files.b64 > /tmp/sedition-files.tar.gz 2> /tmp/decode-error.txt
            echo "DECODE_EXIT $?"
            cat /tmp/decode-error.txt
            if [ -f /tmp/sedition-files.tar.gz ]; then
              wc -c /tmp/sedition-files.tar.gz
              sha256sum /tmp/sedition-files.tar.gz
              gzip -t /tmp/sedition-files.tar.gz
              echo "GZIP_EXIT $?"
            fi
          } > sedition-staging-diagnostic.txt 2>&1

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: sedition-staging-diagnostic
          path: sedition-staging-diagnostic.txt
