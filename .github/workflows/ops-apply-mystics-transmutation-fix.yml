name: Apply Mystics Transmutation retrieval fix

on:
  push:
    branches:
      - fix/rules-arbiter-mystics-transmutation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rules-arbiter-mystics-transmutation
      - name: Apply deterministic source-first fix
        shell: python
        run: |
          from pathlib import Path
          import json
          from datetime import datetime, timezone

          worker_path = Path("rules-assistant/worker-v071.js")
          worker = worker_path.read_text()
          if 'const MYSTICS_TRANSMUTATION_AUTHORITY_IDS' not in worker:
              old_revision = 'export const BEHAVIOR_REVISION = "v071-qa-20260906-5";'
              new_revision = 'export const BEHAVIOR_REVISION = "v071-qa-20260906-6";'
              if old_revision not in worker:
                  raise SystemExit("Expected behavior revision not found")
              worker = worker.replace(old_revision, new_revision, 1)

              anchor = '''const PEACE_TREATY_AUTHORITY_IDS = [
            "rulebook:treaty-articles-and-peace-treaty"
          ];'''
              insertion = anchor + '''
          const MYSTICS_TRANSMUTATION_AUTHORITY_IDS = [
            "rulebook:progression",
            "rulebook:transmutation"
          ];'''
              if anchor not in worker:
                  raise SystemExit("Peace Treaty authority anchor not found")
              worker = worker.replace(anchor, insertion, 1)

              marker = '''const peaceTreatyAuthorityIds = peaceTreatyFocus
            ? [
                ...PEACE_TREATY_AUTHORITY_IDS,
                ...(/\\baccept(?:ed|s|ing|ance)?\\b/.test(combined) ? ["rulebook:accepted-terms"] : []),
                ...(/\\b(?:refus(?:e|es|ed|ing|al)|impos(?:e|es|ed|ing))\\b/.test(combined) ? ["rulebook:refused-terms"] : [])
              ]
            : PEACE_TREATY_AUTHORITY_IDS;
          const preferredAuthorityIds = peaceTreatyFocus
            ? peaceTreatyAuthorityIds
            : shockAndAweFocus
              ? shockAndAweAuthorityIds
              : intelligenceInterferenceFocus
                ? INTELLIGENCE_INTERFERENCE_AUTHORITY_IDS
                : destinationFocus && battleCardFocus
                  ? BATTLE_CARD_DESTINATION_AUTHORITY_IDS
                  : [];'''
              replacement = '''const peaceTreatyAuthorityIds = peaceTreatyFocus
            ? [
                ...PEACE_TREATY_AUTHORITY_IDS,
                ...(/\\baccept(?:ed|s|ing|ance)?\\b/.test(combined) ? ["rulebook:accepted-terms"] : []),
                ...(/\\b(?:refus(?:e|es|ed|ing|al)|impos(?:e|es|ed|ing))\\b/.test(combined) ? ["rulebook:refused-terms"] : [])
              ]
            : PEACE_TREATY_AUTHORITY_IDS;
          const mysticsTransmutationTopic = /\\btransmutation\\b/;
          const mysticsSecondRiteCue = /\\b(?:second|2nd|two|2)\\b[^.!?]{0,50}\\brites?\\b|\\brites?\\b[^.!?]{0,50}\\b(?:second|2nd|two|2)\\b/;
          const mysticsProcedureCue = /\\b(?:ability|feature|unlock(?:s|ed|ing)?|before dice|dice|hand|graveyard|value|spirit walker|alchemist)\\b/.test(combined);
          const mysticsFollowupCue = /\\b(?:it|that|same|ability|feature|unlock(?:s|ed|ing)?|before|dice|hand|graveyard|value)\\b/.test(current);
          const recentMysticsTransmutationTopic = mysticsTransmutationTopic.test(recent) || mysticsSecondRiteCue.test(recent);
          const mysticsTransmutationFocus = mysticsTransmutationTopic.test(current)
            || (mysticsSecondRiteCue.test(current) && mysticsProcedureCue)
            || (currentWordCount <= 9 && recentMysticsTransmutationTopic && mysticsFollowupCue);
          const mysticsTransmutationAuthorityIds = mysticsTransmutationFocus
            ? [
                ...MYSTICS_TRANSMUTATION_AUTHORITY_IDS,
                ...(/\\bspirit walker\\b/.test(combined) ? ["rulebook:spirit-walker"] : [])
              ]
            : MYSTICS_TRANSMUTATION_AUTHORITY_IDS;
          const preferredAuthorityIds = mysticsTransmutationFocus
            ? mysticsTransmutationAuthorityIds
            : peaceTreatyFocus
              ? peaceTreatyAuthorityIds
              : shockAndAweFocus
                ? shockAndAweAuthorityIds
                : intelligenceInterferenceFocus
                  ? INTELLIGENCE_INTERFERENCE_AUTHORITY_IDS
                  : destinationFocus && battleCardFocus
                    ? BATTLE_CARD_DESTINATION_AUTHORITY_IDS
                    : [];'''
              if marker not in worker:
                  raise SystemExit("Retrieval augmentation marker not found")
              worker = worker.replace(marker, replacement, 1)
              worker_path.write_text(worker)

          ledger_path = Path("artifacts/rules-refinement/resolution-ledger.json")
          ledger = json.loads(ledger_path.read_text())
          entry_id = "mystics-transmutation-progression-retrieval-v071"
          if not any(entry.get("id") == entry_id for entry in ledger.get("entries", [])):
              now = datetime.now(timezone.utc).isoformat(timespec="milliseconds").replace("+00:00", "Z")
              ledger["updatedAt"] = now
              ledger["entries"].append({
                  "id": entry_id,
                  "status": "resolved",
                  "rootCause": "retrieval",
                  "interactionIds": ["bf6b1049-6329-4ed8-87d6-f12650c820d9"],
                  "resolutionSurface": "arbiter_retrieval",
                  "summary": "Promote the current v0.7.1 Mystics progression and Transmutation procedure for second-Rite ability questions, natural procedure paraphrases, and terse follow-ups; preserve Spirit Walker authority when that Leader is part of the active topic.",
                  "resolvedAt": now,
                  "binding": {"behaviorRevision": "v071-qa-20260906-6"}
              })
              ledger_path.write_text(json.dumps(ledger, indent=2) + "\n")
      - name: Verify syntax
        run: node --check rules-assistant/worker-v071.js
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "Fix already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules-assistant/worker-v071.js artifacts/rules-refinement/resolution-ledger.json
          git commit -m "Fix Mystics Transmutation authority retrieval"
          git push origin HEAD:fix/rules-arbiter-mystics-transmutation
