name: Rules Arbiter stored-card refinement 5b7455c0

on:
  push:
    branches:
      - rules-arbiter-review-5b7455c0
    paths:
      - .github/workflows/rules-arbiter-targeted-review-5b7455c0.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Apply refinement
        run: python scripts/tmp-refine-stored-card-5b7455c0.py
      - name: Run focused regressions
        run: >-
          npx vitest run
          rules-assistant/v071-ambiguous-referent-clarification.test.mjs
          rules-assistant/v071-battle-card-replacement-retrieval.test.mjs
          rules-assistant/v071-copied-effect-retrieval-review.test.mjs
          rules-assistant/v071-fortifications-tactic-choice-review.test.mjs
          rules-assistant/v071-short-counterfactual-continuity.test.mjs
          rules-assistant/v071-strategic-withdrawal-review.test.mjs
      - name: Validate refinement contract
        run: |
          node scripts/validate-rules-refinement-source-first.mjs
          git diff --check
      - name: Commit refinement
        run: |
          git config user.name "Tymon Scott"
          git config user.email "54303549+tymonius@users.noreply.github.com"
          git rm .github/workflows/rules-arbiter-targeted-review-5b7455c0.yml
          git rm scripts/tmp-refine-stored-card-5b7455c0.py
          git add artifacts/rules-refinement/resolution-ledger.json rules-assistant/
          git diff --cached --check
          git commit -m "Clarify unidentified stored-card referents"
          git push origin HEAD:rules-arbiter-review-5b7455c0
