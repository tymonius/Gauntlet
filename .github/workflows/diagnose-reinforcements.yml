name: Diagnose Reinforcements

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    if: github.head_ref == 'agent/neutral-reinforcements'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run focused test
        run: |
          set +e
          npx vitest run src/state/neutral-reinforcements.test.ts --reporter=verbose > reinforcements-test-output.txt 2>&1
          echo "exit-code=$?" >> reinforcements-test-output.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: reinforcements-test-output
          path: reinforcements-test-output.txt
