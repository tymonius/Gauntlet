name: Diagnose Requisition Source

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    if: github.head_ref == 'agent/neutral-requisition'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/neutral-requisition
      - name: Inspect staged archive
        run: |
          set +e
          {
            for file in \
              .github/requisition-00.b64 \
              .github/requisition-01.b64 \
              .github/requisition-02.b64; do
              wc -c "$file"
              sha256sum "$file"
              head -c 32 "$file"; echo
              tail -c 32 "$file"; echo
            done
            cat \
              .github/requisition-00.b64 \
              .github/requisition-01.b64 \
              .github/requisition-02.b64 \
              > requisition-files.b64
            wc -c requisition-files.b64
            sha256sum requisition-files.b64
            base64 -d requisition-files.b64 > requisition-files.tar.gz
            echo "decode-exit=$?"
            wc -c requisition-files.tar.gz
            sha256sum requisition-files.tar.gz
            tar -tzf requisition-files.tar.gz
            echo "tar-exit=$?"
          } > requisition-diagnostic.txt 2>&1
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: requisition-staged-diagnostic
          path: |
            requisition-files.b64
            requisition-files.tar.gz
            requisition-diagnostic.txt
