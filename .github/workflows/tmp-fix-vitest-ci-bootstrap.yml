name: Temporary Vitest CI bootstrap

on:
  push:
    branches:
      - fix/vitest-ci-bootstrap
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/vitest-ci-bootstrap
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Verify clean install
        run: npm ci --no-audit --no-fund

      - name: Verify Vitest config resolution
        run: npx vitest run tests/current-game-authority.test.ts

      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git commit -m 'Add deterministic Node dependency lockfile'
          git push origin HEAD:fix/vitest-ci-bootstrap