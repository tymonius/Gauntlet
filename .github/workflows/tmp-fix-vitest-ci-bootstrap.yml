name: Temporary Vitest CI bootstrap

on:
  push:
    branches:
      - fix/vitest-ci-bootstrap
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/vitest-ci-bootstrap
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Standardize CI installs
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('.github/workflows/full-regression.yml'): [
                  ('          npm install\n', '          npm ci\n'),
              ],
              Path('.github/workflows/card-authority.yml'): [
                  ('        run: npm install --no-audit --no-fund\n', '        run: npm ci --no-audit --no-fund\n'),
              ],
          }

          for path, changes in replacements.items():
              text = path.read_text()
              original = text
              for old, new in changes:
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'Expected install command not found in {path}')
              path.write_text(text)
          PY

      - name: Verify clean install
        run: npm ci --no-audit --no-fund

      - name: Verify Vitest config resolution
        run: npx vitest run tests/current-game-authority.test.ts

      - name: Commit bootstrap fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-fix-vitest-ci-bootstrap.yml
          git add package-lock.json .github/workflows/full-regression.yml .github/workflows/card-authority.yml
          git commit -m 'Fix deterministic Vitest CI bootstrap'
          git push origin HEAD:fix/vitest-ci-bootstrap