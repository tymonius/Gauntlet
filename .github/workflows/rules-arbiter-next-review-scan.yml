name: Rules Arbiter next reviewed-case scan

on:
  push:
    branches:
      - ops/rules-arbiter-next-review-scan
    paths:
      - '.github/workflows/rules-arbiter-next-review-scan.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OUT_DIR: .tmp/rules-arbiter-next-review
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify production D1 credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

      - name: Read reviewed high-priority cases without model calls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          IDS="'74607df2-5730-4e2f-9ba4-6aede32d308d','137ee7d3-8c41-42bb-a2de-ae051657d078','cdb61fb6-d270-4452-a445-e7a0acaf29d4','a3c140c1-c03e-4e7b-8d99-27f45e77455b','016e3792-4419-4bd3-8ace-2dd16a520d84','96e17df8-212c-4252-bbe1-654cd2e96973','2207772f-cc40-48e8-8585-7df489cb3d76','6d69603b-0299-4029-a325-b45014c8f901','121ea8a8-717e-454c-a60f-491ef6f2e52f','5ea6f396-78bb-4689-8874-fa5368b83413','bc78898c-a5d8-4009-a314-5c346f54156f','bf6b1049-6329-4ed8-87d6-f12650c820d9','7f152009-3543-4637-808c-3e1ececc3a51','9b1b6d36-4122-4c35-bfb6-6274a36be26a','44f5bb3c-dc46-4db8-82c6-6ffb949f4028','91b91a64-7e4c-4f39-abf7-2fe0768213c4','6aae2d09-3e2f-444d-890b-bd07561c186c','476b8f67-9bdf-4364-8d47-add65b67707e','77507537-64d5-4c8d-a8d1-bada21f7fd44','5990af8d-4276-41a0-bebf-d4b1ff762e09','32cfc27f-1025-4868-a4e5-f97c09edd4a1','4a415d7d-e6fc-4909-8ddf-4784ddeb1ab4','999db05a-01a7-4d4d-85fc-babf8f75d5a5','cdbf21bb-83b7-479c-bca4-e303a0c25b1e','14724479-bfbd-474c-b35c-151fb0483480','cbcae027-954f-4620-a2fc-0cd7164f9762','fcd97287-272d-4a8c-8c1c-5eaa8727cbff','b2bde472-270d-4b6e-82c2-7ab6b92b58f3','332e9263-826f-448b-8ab3-4fcaa1edd90c','eb878722-a732-492f-814e-df3c5ccded9a','d90e20fe-14c2-404d-951e-0b877c18adfc','254cb085-3f0e-4a5d-853e-036568dedd1f','54962556-f04e-428b-89c5-2c193d47cf0f'"

          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant \
            --remote \
            --config rules-assistant/wrangler.toml \
            --json \
            --command "SELECT id, session_id, sequence_index, created_at, question, answer, game_version, ruling_status, ruling_status_v2, confidence, source_count, review_status, issue_types_json, feedback_rating FROM rules_interactions WHERE id IN ($IDS) ORDER BY created_at, id" \
            > "$OUT_DIR/interactions.raw.json"

          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant \
            --remote \
            --config rules-assistant/wrangler.toml \
            --json \
            --command "SELECT interaction_id, reviewed_at, historical_accuracy, current_validity, retrieval_assessment, classification_assessment, designer_review_required, recommended_action, reviewed_against_version, governing_source_ids_json FROM rules_interaction_audits WHERE interaction_id IN ($IDS) ORDER BY interaction_id, reviewed_at DESC" \
            > "$OUT_DIR/audits.raw.json"

          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant \
            --remote \
            --config rules-assistant/wrangler.toml \
            --json \
            --command "SELECT interaction_id, created_at, candidate_sources_json FROM rules_interaction_diagnostics WHERE interaction_id IN ($IDS) ORDER BY interaction_id, created_at DESC" \
            > "$OUT_DIR/diagnostics.raw.json"

      - name: Build compact unresolved-case packet
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const dir = process.env.OUT_DIR;
          const ids = [
            '74607df2-5730-4e2f-9ba4-6aede32d308d','137ee7d3-8c41-42bb-a2de-ae051657d078','cdb61fb6-d270-4452-a445-e7a0acaf29d4','a3c140c1-c03e-4e7b-8d99-27f45e77455b','016e3792-4419-4bd3-8ace-2dd16a520d84','96e17df8-212c-4252-bbe1-654cd2e96973','2207772f-cc40-48e8-8585-7df489cb3d76','6d69603b-0299-4029-a325-b45014c8f901','121ea8a8-717e-454c-a60f-491ef6f2e52f','5ea6f396-78bb-4689-8874-fa5368b83413','bc78898c-a5d8-4009-a314-5c346f54156f','bf6b1049-6329-4ed8-87d6-f12650c820d9','7f152009-3543-4637-808c-3e1ececc3a51','9b1b6d36-4122-4c35-bfb6-6274a36be26a','44f5bb3c-dc46-4db8-82c6-6ffb949f4028','91b91a64-7e4c-4f39-abf7-2fe0768213c4','6aae2d09-3e2f-444d-890b-bd07561c186c','476b8f67-9bdf-4364-8d47-add65b67707e','77507537-64d5-4c8d-a8d1-bada21f7fd44','5990af8d-4276-41a0-bebf-d4b1ff762e09','32cfc27f-1025-4868-a4e5-f97c09edd4a1','4a415d7d-e6fc-4909-8ddf-4784ddeb1ab4','999db05a-01a7-4d4d-85fc-babf8f75d5a5','cdbf21bb-83b7-479c-bca4-e303a0c25b1e','14724479-bfbd-474c-b35c-151fb0483480','cbcae027-954f-4620-a2fc-0cd7164f9762','fcd97287-272d-4a8c-8c1c-5eaa8727cbff','b2bde472-270d-4b6e-82c2-7ab6b92b58f3','332e9263-826f-448b-8ab3-4fcaa1edd90c','eb878722-a732-492f-814e-df3c5ccded9a','d90e20fe-14c2-404d-951e-0b877c18adfc','254cb085-3f0e-4a5d-853e-036568dedd1f','54962556-f04e-428b-89c5-2c193d47cf0f'
          ];

          const unwrap = (path) => {
            const payload = JSON.parse(readFileSync(path, 'utf8'));
            const batches = Array.isArray(payload) ? payload : [payload];
            return batches.flatMap((batch) => Array.isArray(batch?.results) ? batch.results : []);
          };

          const interactions = unwrap(`${dir}/interactions.raw.json`);
          const audits = unwrap(`${dir}/audits.raw.json`);
          const diagnostics = unwrap(`${dir}/diagnostics.raw.json`);
          const ledger = JSON.parse(readFileSync('artifacts/rules-refinement/resolution-ledger.json', 'utf8'));

          const resolved = new Set(
            (ledger.entries || [])
              .filter((entry) => entry.status === 'resolved')
              .flatMap((entry) => Array.isArray(entry.interactionIds) ? entry.interactionIds : [])
          );

          const latestAudit = new Map();
          for (const row of audits) if (!latestAudit.has(row.interaction_id)) latestAudit.set(row.interaction_id, row);
          const latestDiagnostic = new Map();
          for (const row of diagnostics) if (!latestDiagnostic.has(row.interaction_id)) latestDiagnostic.set(row.interaction_id, row);
          const interactionById = new Map(interactions.map((row) => [row.id, row]));

          const parseJson = (value, fallback) => {
            try { return JSON.parse(value || ''); } catch { return fallback; }
          };

          const unresolved = ids
            .filter((id) => !resolved.has(id))
            .map((id) => {
              const interaction = interactionById.get(id) || {};
              const audit = latestAudit.get(id) || {};
              const diagnostic = latestDiagnostic.get(id) || {};
              const candidates = parseJson(diagnostic.candidate_sources_json, []);
              return {
                interactionId: id,
                createdAt: interaction.created_at || null,
                question: interaction.question || null,
                answer: interaction.answer || null,
                gameVersion: interaction.game_version || null,
                rulingStatus: interaction.ruling_status_v2 || interaction.ruling_status || null,
                confidence: interaction.confidence ?? null,
                sourceCount: interaction.source_count ?? null,
                issueTypes: parseJson(interaction.issue_types_json, []),
                feedbackRating: interaction.feedback_rating ?? null,
                reviewedAt: audit.reviewed_at || null,
                historicalAccuracy: audit.historical_accuracy || null,
                currentValidity: audit.current_validity || null,
                retrievalAssessment: audit.retrieval_assessment || null,
                classificationAssessment: audit.classification_assessment || null,
                designerReviewRequired: audit.designer_review_required ?? null,
                recommendedAction: audit.recommended_action || null,
                reviewedAgainstVersion: audit.reviewed_against_version || null,
                governingSourceIds: parseJson(audit.governing_source_ids_json, []),
                candidateSources: Array.isArray(candidates) ? candidates.map((item) => ({
                  canonicalId: String(item?.canonicalId || item?.canonical_id || ''),
                  title: String(item?.title || ''),
                  kind: String(item?.kind || '')
                })).filter((item) => item.canonicalId || item.title) : []
              };
            });

          const packet = {
            generatedAt: new Date().toISOString(),
            noModelCalls: true,
            originalHighPriorityCount: ids.length,
            resolvedByLedgerCount: ids.filter((id) => resolved.has(id)).length,
            unresolvedCount: unresolved.length,
            unresolved
          };

          writeFileSync(`${dir}/next-review-scan.json`, JSON.stringify(packet, null, 2));
          console.log(JSON.stringify({
            unresolvedCount: packet.unresolvedCount,
            retrievalFixes: unresolved.filter((item) => item.recommendedAction === 'retrieval_fix').length,
            classificationFixes: unresolved.filter((item) => item.recommendedAction === 'classification_fix').length
          }));
          NODE

      - name: Upload scan packet
        uses: actions/upload-artifact@v4
        with:
          name: rules-arbiter-next-review-scan
          path: .tmp/rules-arbiter-next-review/next-review-scan.json
          if-no-files-found: error
          retention-days: 1
