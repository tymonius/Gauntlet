name: Apply source-first rules refinement v2

on:
  push:
    branches:
      - feat/source-first-rules-refinement
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout refinement branch
        uses: actions/checkout@v4
        with:
          ref: feat/source-first-rules-refinement
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Install Chromium for Rulebook rendering
        run: npx playwright install --with-deps chromium

      - name: Apply accepted rule and repair current publication compatibility
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const rulebookPath = 'rulebook/player-facing/current-rulebook.md';
          let rulebook = fs.readFileSync(rulebookPath, 'utf8').replace(/\r\n/g, '\n');
          const heading = '### Choosing among options';
          const acceptedRule = 'When a rule or effect requires a choice, choose from the options that are actually available. If no valid option is available, that choice is ignored.';
          if (rulebook.includes(heading)) {
            rulebook = rulebook.replace(
              /### Choosing among options\n\n[\s\S]*?(?=\n### Shared timing)/,
              `${heading}\n\n${acceptedRule}\n`
            );
          } else {
            const anchor = `## Simultaneous effects and choices\n\n### Shared timing`;
            const replacement = `## Simultaneous effects and choices\n\n${heading}\n\n${acceptedRule}\n\n### Shared timing`;
            if (!rulebook.includes(anchor)) throw new Error('Could not find the Chapter 11 choice-rule insertion anchor.');
            rulebook = rulebook.replace(anchor, replacement);
          }
          fs.writeFileSync(rulebookPath, rulebook);

          const renderPath = 'scripts/render-v071-booklet.mjs';
          let render = fs.readFileSync(renderPath, 'utf8');
          const importLine = `import { prepareLegacyRulebookPublicationCompatibility, cleanupLegacyRulebookPublicationCompatibility } from './legacy-rulebook-publication-compat.mjs';\n`;
          if (!render.includes(importLine.trim())) {
            const importAnchor = `import { loadPublishingAuthority } from './publishing-authority.mjs';\n`;
            if (!render.includes(importAnchor)) throw new Error('Could not find v0.7.1 renderer import anchor.');
            render = render.replace(importAnchor, importAnchor + importLine);
          }
          if (!render.includes('const publicationCompatibility = prepareLegacyRulebookPublicationCompatibility();')) {
            const setupAnchor = `writeBootstrapManifestForRulebookFigures();\n\nconst server = spawn('python', ['-m', 'http.server', '8000'], {`;
            const setupReplacement = `writeBootstrapManifestForRulebookFigures();\n\nconst publicationCompatibility = prepareLegacyRulebookPublicationCompatibility();\nconst server = spawn('python', ['-m', 'http.server', '8000'], {`;
            if (!render.includes(setupAnchor)) throw new Error('Could not find v0.7.1 publication compatibility setup anchor.');
            render = render.replace(setupAnchor, setupReplacement);
          }
          if (!render.includes('cleanupLegacyRulebookPublicationCompatibility(publicationCompatibility);')) {
            const cleanupAnchor = `} finally {\n  server.kill('SIGTERM');\n}\n\nconst reportPath`;
            const cleanupReplacement = `} finally {\n  server.kill('SIGTERM');\n  cleanupLegacyRulebookPublicationCompatibility(publicationCompatibility);\n}\n\nconst reportPath`;
            if (!render.includes(cleanupAnchor)) throw new Error('Could not find v0.7.1 publication compatibility cleanup anchor.');
            render = render.replace(cleanupAnchor, cleanupReplacement);
          }
          fs.writeFileSync(renderPath, render);
          NODE

          cat > scripts/legacy-rulebook-publication-compat.mjs <<'EOF'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';

          function lstatOrNull(file) {
            try { return fs.lstatSync(file); } catch (error) {
              if (error?.code === 'ENOENT') return null;
              throw error;
            }
          }

          export function prepareLegacyRulebookPublicationCompatibility(root = process.cwd()) {
            const legacyRoot = path.join(root, 'legacy', 'v0.6.1-rulebook-publication');
            const legacyDesign = path.join(legacyRoot, 'rulebook-design');
            const legacyProduction = path.join(legacyRoot, 'rulebook-production');
            for (const source of [legacyDesign, legacyProduction]) {
              if (!fs.statSync(source).isDirectory()) throw new Error(`Missing preserved Rulebook publication source: ${source}`);
            }

            const tempRoot = fs.mkdtempSync(path.join(os.tmpdir(), 'gauntlet-rulebook-publication-'));
            const tempDesign = path.join(tempRoot, 'rulebook-design');
            const tempProduction = path.join(tempRoot, 'rulebook-production');
            fs.cpSync(legacyDesign, tempDesign, { recursive: true });
            fs.cpSync(legacyProduction, tempProduction, { recursive: true });
            fs.symlinkSync(path.join(root, 'images'), path.join(tempRoot, 'images'), 'dir');
            fs.symlinkSync(path.join(root, 'releases'), path.join(tempRoot, 'releases'), 'dir');

            const aliases = [
              [path.join(root, 'rulebook-design'), tempDesign],
              [path.join(root, 'rulebook-production'), tempProduction],
            ];
            for (const [alias, target] of aliases) {
              const existing = lstatOrNull(alias);
              if (existing && !existing.isSymbolicLink()) {
                throw new Error(`Refusing to replace non-symlink publication path: ${alias}`);
              }
              if (existing) fs.unlinkSync(alias);
              fs.symlinkSync(target, alias, 'dir');
            }
            return { tempRoot, aliases: aliases.map(([alias]) => alias) };
          }

          export function cleanupLegacyRulebookPublicationCompatibility(state) {
            for (const alias of state?.aliases || []) {
              const existing = lstatOrNull(alias);
              if (existing?.isSymbolicLink()) fs.unlinkSync(alias);
            }
            if (state?.tempRoot) fs.rmSync(state.tempRoot, { recursive: true, force: true });
          }
          EOF

          cat > scripts/validate-available-choice-rule.test.mjs <<'EOF'
          import { readFile } from 'node:fs/promises';
          import { expect, test } from 'vitest';

          const RULE_HEADING = '### Choosing among options';
          const ACCEPTED_RULE = 'When a rule or effect requires a choice, choose from the options that are actually available. If no valid option is available, that choice is ignored.';

          async function read(path) {
            return readFile(path, 'utf8');
          }

          test('current and published v0.7.1 rulebooks define the accepted available-choice rule', async () => {
            const [current, published] = await Promise.all([
              read('rulebook/player-facing/current-rulebook.md'),
              read('releases/v0.7.1/Gauntlet_v0.7.1_Rulebook.md'),
            ]);

            for (const source of [current, published]) {
              expect(source).toContain(RULE_HEADING);
              expect(source).toContain(ACCEPTED_RULE);
            }
          });

          test('Penance and Property Dues rely on the shared choice rule instead of card-specific exceptions', async () => {
            const data = JSON.parse(await read('game-data/current-game.json'));
            const cards = data.gameplay?.cards || data.cards || [];
            const find = id => cards.find(card => card.id === id);
            const penance = find('inquisition-penance');
            const propertyDues = find('financiers-property-dues');

            expect(penance).toBeTruthy();
            expect(propertyDues).toBeTruthy();
            expect(JSON.stringify(penance)).toContain('The opponent chooses one:');
            expect(JSON.stringify(propertyDues)).toContain('choose one:');
            expect(JSON.stringify(penance)).not.toContain('if able');
            expect(JSON.stringify(propertyDues)).not.toContain('if able');
          });
          EOF

      - name: Regenerate current v0.7.1 release authority
        run: node scripts/build-v071-release-source.mjs

      - name: Regenerate current v0.7.1 Rulebook booklet and manifest
        run: node scripts/render-v071-booklet.mjs

      - name: Refresh release manifest bindings
        run: node scripts/refresh-current-release-manifest.mjs

      - name: Validate propagated authority and refinement contracts
        run: |
          npx vitest run scripts/validate-available-choice-rule.test.mjs rules-assistant/refinement-scaffold.test.mjs scripts/validate-rules-refinement-source-first.test.mjs
          npm run rules:authority:check
          npm run test:current-contract

      - name: Remove one-shot workflows
        run: rm -f .github/workflows/apply-source-first-rules-refinement.yml .github/workflows/apply-source-first-rules-refinement-v2.yml

      - name: Commit propagated authority
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Propagate legal choice rule to current authority'
          git push origin HEAD:feat/source-first-rules-refinement
