name: Render Leader card specimens

on:
  pull_request:
    paths:
      - "game-data/**"
      - "card-design/index.html"
      - "card-design/catalog-filter.js"
      - "card-design/card-catalog-shell.css"
      - "card-design/leaders.html"
      - "card-design/card-back.css"
      - "card-design/card-back.js"
      - "card-design/card-review.js"
      - "card-design/card-review.css"
      - "card-design/card-review-render.html"
      - "card-design/card-review-render.js"
      - "card-design/current-card-catalog.js"
      - "card-design/territory-review-render.html"
      - "card-design/territory-review-render.js"
      - "card-design/territories/index.html"
      - "card-design/leader-card.css"
      - "card-design/proposal-card.css"
      - "card-design/proposal-card.js"
      - "card-design/rite-card.css"
      - "card-design/rite-card.js"
      - "card-design/territory-card.css"
      - "card-design/card-design.css"
      - "card-design/card-design-refinement.css"
      - "card-design/card-design.js"
      - "card-design/card-parchment.css"
      - "card-design/card-rule-columns.css"
      - "card-design/faction-specimens.css"
      - "tts/territory-renderer/**"
      - "design-tokens.css"
      - "images/*.png"
      - "images/*.svg"
      - "images/faction-symbols/*.svg"
      - "images/artwork/territories/*"
      - "images/artwork/cards/territories/**"
      - "images/artwork/supplemental/**"
      - "scripts/render-card-back-specimen.mjs"
      - "scripts/render-leader-card-specimens.mjs"
      - "scripts/generate-print-artwork.mjs"
      - "scripts/validate-territory-mobile-render.mjs"
      - "scripts/validate-current-territory-render.mjs"
      - "scripts/validate-rite-card-render.mjs"
      - "scripts/validate-proposal-card-render.mjs"
      - "scripts/validate-current-card-render.mjs"
      - ".github/workflows/render-leader-card-specimens.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Resolve Playwright version
        id: playwright-version
        shell: bash
        run: node -e "console.log('version=' + require('playwright/package.json').version)" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Generate printer-friendly playable artwork
        run: npm run print:artwork
      - name: Render and validate card review catalog
        run: node scripts/render-leader-card-specimens.mjs
      - name: Render and validate universal card back
        run: node scripts/render-card-back-specimen.mjs
      - name: Validate current Territory specimens
        run: node scripts/validate-current-territory-render.mjs
      - name: Validate Mystics Rite card specimens
        run: node scripts/validate-rite-card-render.mjs
      - name: Validate Diplomat Proposal card specimens
        run: node scripts/validate-proposal-card-render.mjs
      - name: Validate current playable-card specimens
        run: node scripts/validate-current-card-render.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: gauntlet-card-review-specimens
          path: |
            card-design/generated/leaders/
            card-design/generated/proposals/
            card-design/generated/current-territories/
            card-design/generated/current-card-candidates/
          if-no-files-found: error

  territory-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Playwright package
        run: npm install --no-audit --no-fund --no-save playwright@1.62.1
      - name: Validate Territory mobile render stability
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/gauntlet-territory-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..50}; do
            if curl -fsS http://127.0.0.1:4173/card-design/ > /dev/null; then
              break
            fi
            sleep 0.1
          done
          TERRITORY_TEST_BASE_URL=http://127.0.0.1:4173 node scripts/validate-territory-mobile-render.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: gauntlet-territory-mobile-specimens
          path: |
            card-design/generated/leaders/territory-mobile-*.png
            card-design/generated/leaders/territory-mobile-render-metrics.json
          if-no-files-found: error
