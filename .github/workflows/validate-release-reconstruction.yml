name: Validate release reconstruction

# Historical reconstruction audit. This remains available for forensic review,
# but it is not a current-product pull-request gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconstruction target
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate reconstruction authority, containment, and quarantine ledger
        run: node scripts/validate-release-reconstruction.mjs

      - name: Validate normalized audit recommendations remain non-authoritative
        run: node scripts/validate-reconstruction-decision-candidates.mjs

      - name: Validate clean v0.6.2 / clean v0.6.3 version boundaries
        run: node scripts/validate-reconstruction-version-plan-certified.mjs

      - name: Validate recovered late clean v0.6.3 decisions
        run: node scripts/validate-v063-recovered-decisions.mjs
