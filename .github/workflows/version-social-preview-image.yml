name: Version social preview image

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'agent/version-social-preview-image'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/version-social-preview-image
          fetch-depth: 0

      - name: Create versioned image and update metadata
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          source = Path('images/social/gauntlet-og-1200x630.jpg')
          target = Path('images/social/gauntlet-og-1200x630-v2.jpg')
          index = Path('index.html')

          image = source.read_bytes()
          target.write_bytes(image)
          if target.read_bytes() != image:
              raise SystemExit('Versioned image does not match source image')

          old = 'https://gauntlet.run/images/social/gauntlet-og-1200x630.jpg'
          new = 'https://gauntlet.run/images/social/gauntlet-og-1200x630-v2.jpg'
          html = index.read_text(encoding='utf-8')
          count = html.count(old)
          if count != 3:
              raise SystemExit(f'Expected 3 metadata references, found {count}')
          index.write_text(html.replace(old, new), encoding='utf-8')

          print('source sha256:', hashlib.sha256(image).hexdigest())
          print('target sha256:', hashlib.sha256(target.read_bytes()).hexdigest())

          Path('.github/workflows/version-social-preview-image.yml').unlink()

      - name: Commit versioned image URL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Version social preview image URL"
          git push
