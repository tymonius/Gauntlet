name: v0.7.1 Rules Arbiter live answer QA

on:
  push:
    branches:
      - main
    paths:
      - 'rules-assistant/evals/rules-arbiter-evals.v071.json'
      - 'rules-assistant/local-search.js'
      - 'rules-assistant/worker-v071.js'
      - 'rules-assistant/review-intelligence.js'
      - 'scripts/run-v071-live-rules-qa.mjs'
      - '.github/workflows/v071-rules-arbiter-live-qa.yml'
  pull_request:
    paths:
      - 'rules-assistant/evals/rules-arbiter-evals.v071.json'
      - 'rules-assistant/local-search.js'
      - 'rules-assistant/worker-v071.js'
      - 'scripts/run-v071-live-rules-qa.mjs'
      - '.github/workflows/v071-rules-arbiter-live-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for deployed Rules Arbiter revision
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_BEHAVIOR_REVISION: v071-qa-20260903-2
          RULES_HEALTH_ENDPOINT: https://gauntlet-rules-assistant.tymon-scott.workers.dev/health
        run: |
          node <<'NODE'
          const expected = process.env.EXPECTED_BEHAVIOR_REVISION;
          const endpoint = process.env.RULES_HEALTH_ENDPOINT;
          const attempts = 40;
          const delayMs = 15000;

          for (let attempt = 1; attempt <= attempts; attempt += 1) {
            try {
              const response = await fetch(endpoint, { cache: "no-store" });
              const payload = response.ok ? await response.json() : null;
              const actual = payload?.behaviorRevision || "missing";
              console.log(`Deploy check ${attempt}/${attempts}: ${actual}`);
              if (response.ok && actual === expected) process.exit(0);
            } catch (error) {
              console.log(`Deploy check ${attempt}/${attempts}: ${error.message}`);
            }
            if (attempt < attempts) await new Promise((resolve) => setTimeout(resolve, delayMs));
          }

          console.error(`Production Rules Arbiter never reported behavior revision ${expected}.`);
          process.exit(1);
          NODE

      - name: Run live Rules Arbiter QA
        id: qa
        continue-on-error: true
        env:
          GAUNTLET_RULES_QA_CONCURRENCY: '2'
          GAUNTLET_RULES_QA_TIMEOUT_MS: '45000'
          GAUNTLET_RULES_QA_MAX_ATTEMPTS: '5'
        run: node scripts/run-v071-live-rules-qa.mjs

      - name: Upload live QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v071-rules-arbiter-live-qa
          path: artifacts/rules-qa/v071-live-answer-run.json
          if-no-files-found: error
          retention-days: 14

      - name: Report pull-request live QA result
        if: github.event_name == 'pull_request' && steps.qa.outcome != 'success'
        run: echo "Live production QA found failures. The report is informational on pull requests because branch Worker changes are not deployed yet."

      - name: Enforce deployed live QA result
        if: github.event_name != 'pull_request' && steps.qa.outcome != 'success'
        run: exit 1
