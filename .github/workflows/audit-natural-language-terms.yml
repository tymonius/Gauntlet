name: Audit natural-language terminology

on:
  push:
    branches:
      - agent/natural-language-cleanup

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/natural-language-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_natural_language_terms.py
