name: Deploy Neutral Valor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    if: github.head_ref == 'agent/neutral-valor'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/neutral-valor
          fetch-depth: 0

      - name: Verify and deploy Neutral Valor
        run: |
          set -euo pipefail
          echo 'bafce0d0fddbe61940da20e83c44f527f49faeeccfa2f783f7aba4e33df80e9c  .github/neutral-valor-piece-00.b64' | sha256sum -c -
          echo 'a264b41b4d482fd23731dac98b8c6cab590166bf9010e44fe1cd42be489ac223  .github/neutral-valor-piece-01.b64' | sha256sum -c -
          echo '5ff1ac907c1e726d353027641007bd25bd8404ba301eb3ca6dcf51484713be3b  .github/neutral-valor-piece-02.b64' | sha256sum -c -
          echo '9310a42973cacb7cc16ce66e4ed7ac93043bc00e6cadba1bf3f81187b89307c4  .github/neutral-valor-piece-03.b64' | sha256sum -c -
          echo '91303351abaa65ec90ac9d0fe60dd676d65314d093a2b6931e5cc9669188437f  .github/neutral-valor-piece-04.b64' | sha256sum -c -
          echo '0653420f6abad89e30c8dce29f686e3b71003669681d7457c3415469098b24c5  .github/neutral-valor-piece-05.b64' | sha256sum -c -
          echo 'e2725a0b26f1408b2ba05868a67039e68cb7ce5885940aede24c0f0998b51c42  .github/neutral-valor-piece-06.b64' | sha256sum -c -
          echo '31b93e3fb39ccb3aafac3b2149b6e3240dac4e349891d96d0727a5cadae9b1fc  .github/neutral-valor-piece-07.b64' | sha256sum -c -
          echo '39d0a813120f07851f088a054a2b3e2aa95276a3a850fbd99f0e75b35a43bf3f  .github/neutral-valor-piece-08.b64' | sha256sum -c -
          echo '29c8cbafd209007db85128350186bb3ddcac99a58d246f8f5e98fa36ec1acb9b  .github/neutral-valor-piece-09.b64' | sha256sum -c -
          echo 'fe0a0bfec87ac7d4be849e294bda3f3ee8cbbc058eb9f3f90f4078f2b997a16d  .github/neutral-valor-piece-10a.b64' | sha256sum -c -
          echo 'caf38b3badf1aabb3787697014fc3a10be3262b98cdf84892f332e778c4b0718  .github/neutral-valor-piece-10b.b64' | sha256sum -c -
          echo '6bdcdfc83d6a75b310874063938f8fea67c83e15c5355be8fc9af0195c4cc0ff  .github/neutral-valor-piece-11a.b64' | sha256sum -c -
          echo 'ecc1452f8d8077f902676a53cc684a4b2c29f84b72406d619caf2f9e16982089  .github/neutral-valor-piece-11b.b64' | sha256sum -c -
          cat \
            .github/neutral-valor-piece-{00..09}.b64 \
            .github/neutral-valor-piece-10a.b64 \
            .github/neutral-valor-piece-10b.b64 \
            .github/neutral-valor-piece-11a.b64 \
            .github/neutral-valor-piece-11b.b64 \
            > /tmp/neutral-valor-files.b64
          test "$(wc -c < /tmp/neutral-valor-files.b64)" -eq 19692
          echo '13b6e2a3e2fc339af6c861cd440ea8b5eb95665af7a84ece2e5d5b164b4d665c  /tmp/neutral-valor-files.b64' | sha256sum -c -
          base64 -d /tmp/neutral-valor-files.b64 > /tmp/neutral-valor-files.tar.gz
          test "$(wc -c < /tmp/neutral-valor-files.tar.gz)" -eq 14767
          echo 'ae024c7c63ce7b89f3aa8fb52d448b04b9ec08d5dce61ec14a648c2c42caa0b1  /tmp/neutral-valor-files.tar.gz' | sha256sum -c -
          tar -xzf /tmp/neutral-valor-files.tar.gz
          rm -f .github/neutral-valor*.b64
          rm -f .github/workflows/export-neutral-valor-base.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Neutral Valor'
          git push origin HEAD:agent/neutral-valor
