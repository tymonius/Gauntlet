name: Materialize Player Guide table tools once

on:
  push:
    branches:
      - docs/player-guide-table-tools

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/player-guide-table-tools
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate table-tool QR assets
        run: |
          npm install --no-save --package-lock=false qrcode@1.5.4
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import QRCode from 'qrcode';

          const tools = [
            ['chief-justice', 'Ask the Chief Justice', 'https://gauntlet.run/rules-arbiter/'],
            ['card-reference', 'Card Reference', 'https://gauntlet.run/card-reference/'],
            ['full-rules', 'Full Rules', 'https://gauntlet.run/rulebook/'],
            ['deckbuilder', 'Deckbuilder', 'https://gauntlet.run/deckbuilder/'],
            ['start-playing', 'Start Playing', 'https://gauntlet.run/start/'],
            ['playtest', 'Start a Playtest', 'https://gauntlet.run/playtest/'],
          ];
          const outputDir = 'rulebook/assets/qr';
          fs.mkdirSync(outputDir, { recursive: true });

          for (const [slug, label, url] of tools) {
            let svg = await QRCode.toString(url, {
              type: 'svg',
              errorCorrectionLevel: 'M',
              margin: 4,
              color: { dark: '#000000', light: '#ffffff' },
            });
            svg = svg
              .replace(/width="[^"]+"/, 'width="30mm"')
              .replace(/height="[^"]+"/, 'height="30mm"')
              .replace('<svg ', `<svg role="img" aria-labelledby="qr-${slug}-title" `)
              .replace('>', `><title id="qr-${slug}-title">${label} — ${url}</title><metadata>Destination: ${url}</metadata>`);
            fs.writeFileSync(path.join(outputDir, `${slug}.svg`), svg);
          }
          NODE

      - name: Add At the Table utility page
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const file = 'rulebook/player-guide/player-guide.md';
          let text = fs.readFileSync(file, 'utf8');
          if (text.includes('## At the Table: Digital Tools')) {
            throw new Error('At-the-table tools page already exists.');
          }

          const page = String.raw`
          
          <div class="page-break"></div>
          
          ## At the Table: Digital Tools
          
          Keep this page handy while you play. Scan the tool that matches what you are trying to do; the short address below each code works too.
          
          |  |  |
          | --- | --- |
          | ![QR code for Ask the Chief Justice](/rulebook/assets/qr/chief-justice.svg) **Ask the Chief Justice**  
          **gauntlet.run/rules-arbiter/**  
          **Use when:** a rule, timing question, or card interaction is unclear. Ask in ordinary language and get a player-friendly ruling grounded in the current rules. | ![QR code for Card Reference](/rulebook/assets/qr/card-reference.svg) **Card Reference**  
          **gauntlet.run/card-reference/**  
          **Use when:** you need the exact current text of a card, Leader, Territory, Proposal, or other game object without searching through the rulebook. |
          | ![QR code for Full Rules](/rulebook/assets/qr/full-rules.svg) **Full Rules**  
          **gauntlet.run/rulebook/**  
          **Use when:** you want to read the complete rules directly, check a definition, or see the technical rule behind a ruling. | ![QR code for Deckbuilder](/rulebook/assets/qr/deckbuilder.svg) **Deckbuilder**  
          **gauntlet.run/deckbuilder/**  
          **Use when:** you are choosing or changing a Deck, checking Deckbuilding Value and legality, or starting from a recommended starter Deck. |
          | ![QR code for Start Playing](/rulebook/assets/qr/start-playing.svg) **Start Playing**  
          **gauntlet.run/start/**  
          **Use when:** someone is new to Gauntlet or needs the guided path through faction choice, Leader choice, starter Decks, and getting a game onto the table. | ![QR code for Start a Playtest](/rulebook/assets/qr/playtest.svg) **Start a Playtest**  
          **gauntlet.run/playtest/**  
          **Use when:** this game is a playtest. Create or join a tracked session so rules questions, results, and feedback can be connected to the game. |
          `
            .replace(/^ {10}/gm, '')
            .trimEnd();

          text = `${text.trimEnd()}\n${page}\n`;
          fs.writeFileSync(file, text);
          NODE

      - name: Validate Player Guide publication
        run: |
          node scripts/validate-rules-publication-contract.mjs
          node scripts/validate-rules-publication-scaffolds.mjs
          test -s rulebook/assets/qr/chief-justice.svg
          test -s rulebook/assets/qr/card-reference.svg
          test -s rulebook/assets/qr/full-rules.svg
          test -s rulebook/assets/qr/deckbuilder.svg
          test -s rulebook/assets/qr/start-playing.svg
          test -s rulebook/assets/qr/playtest.svg
          grep -q 'Destination: https://gauntlet.run/rules-arbiter/' rulebook/assets/qr/chief-justice.svg
          grep -q 'Destination: https://gauntlet.run/card-reference/' rulebook/assets/qr/card-reference.svg
          grep -q 'Destination: https://gauntlet.run/rulebook/' rulebook/assets/qr/full-rules.svg
          grep -q 'Destination: https://gauntlet.run/deckbuilder/' rulebook/assets/qr/deckbuilder.svg
          grep -q 'Destination: https://gauntlet.run/start/' rulebook/assets/qr/start-playing.svg
          grep -q 'Destination: https://gauntlet.run/playtest/' rulebook/assets/qr/playtest.svg

      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/materialize-player-guide-table-tools-once.yml
          git config user.name 'Gauntlet publication materializer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rulebook/player-guide/player-guide.md rulebook/assets/qr .github/workflows/materialize-player-guide-table-tools-once.yml
          git commit -m 'Add at-the-table digital tools page [table-tools-materialized]'
          git push origin HEAD:docs/player-guide-table-tools
