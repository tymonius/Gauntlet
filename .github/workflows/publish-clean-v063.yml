name: Retired clean v0.6.3 publication cutover

# The clean v0.6.3 cutover completed and was production-verified on 2026-08-14.
# This file remains only as an explicit tombstone for the one-time publisher.
# Current player-facing maintenance must not re-materialize the release or push
# generated publication state back over the live site.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Publication is complete
        run: |
          echo "The one-time clean v0.6.3 publication cutover is retired."
          echo "Use current-site validation and the post-publication live verifier for maintenance work."
