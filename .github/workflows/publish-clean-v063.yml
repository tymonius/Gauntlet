name: Publish clean v0.6.3 current release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publish-clean-v063.yml'
      - '.github/workflows/validate-v063-cross-surface-closeout.yml'
      - 'scripts/build-clean-v063-publication.mjs'
      - 'scripts/publication-utils.mjs'
      - 'scripts/build-clean-v063-publication-core-web.mjs'
      - 'scripts/build-clean-v063-publication-navigation.mjs'
      - 'scripts/build-clean-v063-publication-arbiter-web.mjs'
      - 'scripts/build-clean-v063-publication-arbiter-worker.mjs'
      - 'scripts/build-clean-v063-publication-release.mjs'
      - 'scripts/render-clean-v063-publication.mjs'
      - 'scripts/validate-clean-v063-publication.mjs'
      - 'scripts/validate-clean-v063-publication-data.mjs'
      - 'scripts/validate-clean-v063-publication-surfaces.mjs'
      - 'scripts/verify-clean-v063-live-publication.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-clean-v063.yml'
      - '.github/workflows/validate-v063-cross-surface-closeout.yml'
      - 'scripts/build-clean-v063-publication.mjs'
      - 'scripts/publication-utils.mjs'
      - 'scripts/build-clean-v063-publication-core-web.mjs'
      - 'scripts/build-clean-v063-publication-navigation.mjs'
      - 'scripts/build-clean-v063-publication-arbiter-web.mjs'
      - 'scripts/build-clean-v063-publication-arbiter-worker.mjs'
      - 'scripts/build-clean-v063-publication-release.mjs'
      - 'scripts/render-clean-v063-publication.mjs'
      - 'scripts/validate-clean-v063-publication.mjs'
      - 'scripts/validate-clean-v063-publication-data.mjs'
      - 'scripts/validate-clean-v063-publication-surfaces.mjs'
      - 'scripts/verify-clean-v063-live-publication.mjs'

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-clean-v063-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLICATION_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install repository dependencies
        run: npm install --package-lock=false

      - name: Install publication renderer dependency
        run: npm install --no-save --package-lock=false pdf-lib

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Syntax-check publication scripts
        run: |
          node --check scripts/build-clean-v063-publication.mjs
          node --check scripts/publication-utils.mjs
          node --check scripts/build-clean-v063-publication-core-web.mjs
          node --check scripts/build-clean-v063-publication-navigation.mjs
          node --check scripts/build-clean-v063-publication-arbiter-web.mjs
          node --check scripts/build-clean-v063-publication-arbiter-worker.mjs
          node --check scripts/build-clean-v063-publication-release.mjs
          node --check scripts/render-clean-v063-publication.mjs
          node --check scripts/validate-clean-v063-publication.mjs
          node --check scripts/validate-clean-v063-publication-data.mjs
          node --check scripts/validate-clean-v063-publication-surfaces.mjs
          node --check scripts/verify-clean-v063-live-publication.mjs

      - name: Test authorization source before cutover
        run: npm test

      - name: Build clean print/export source material
        run: node scripts/build-clean-v063-print-export.mjs

      - name: Materialize publication preview
        run: node scripts/build-clean-v063-publication.mjs

      - name: Render publication PDFs
        run: node scripts/render-clean-v063-publication.mjs

      - name: Apply production analytics to public HTML
        run: node scripts/sync-google-analytics.mjs

      - name: Remove transient clean print/export build directory
        run: rm -rf artifacts/reconstruction/clean-v0.6.3/print-export/generated

      - name: Verify historical recovery locks
        run: node scripts/validate-release-recovery-state.mjs

      - name: Validate complete v0.6.3 publication preview
        run: node scripts/validate-clean-v063-publication.mjs

      - name: Verify analytics synchronization
        run: node scripts/sync-google-analytics.mjs --check

      - name: Typecheck
        run: npm run typecheck

      - name: Test materialized current-compatible regressions
        run: |
          npx vitest run \
            --exclude tests/deckbuilder-print-request.test.ts \
            --exclude tests/player-facing-terminology.test.ts \
            --exclude tests/deckbuilder-mystics-ritual.test.ts \
            --exclude tests/public-faction-pages.test.ts \
            --exclude tests/release-recovery-write-guards.test.ts \
            --exclude tests/standalone-new-player-onboarding.test.ts \
            --exclude tests/start-public-theme.test.ts \
            --exclude tests/tracked-playtest-system.test.ts \
            --exclude tests/v062-public-faction-overviews.test.ts \
            --exclude rules-assistant/review-intelligence.test.mjs \
            --exclude rules-assistant/v062-published-routes.test.mjs

      - name: Reject whitespace errors
        run: git diff --check

      - name: Upload publication review bundle
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-v0.6.3-publication-preview
          if-no-files-found: error
          path: |
            releases/v0.6.3-reconstructed/
            index.html
            rulebook/
            card-reference/
            factions/
            start/
            deckbuilder/
            rules-arbiter/
            config/release-lifecycle.json
            src/content/current.ts
            rules-assistant/worker-entry.js
            rules-assistant/worker-v063.js
            rules-assistant/v063-public-corpus.js
            rules-assistant/widget.js

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out authorized publication source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install repository dependencies
        run: npm install --package-lock=false

      - name: Install publication and Worker tooling
        run: npm install --no-save --package-lock=false pdf-lib wrangler@4

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Cloudflare deployment secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

      - name: Test authorization source before cutover
        run: npm test

      - name: Build clean print/export source material
        run: node scripts/build-clean-v063-print-export.mjs

      - name: Materialize current v0.6.3 release
        run: node scripts/build-clean-v063-publication.mjs

      - name: Render current v0.6.3 PDFs
        run: node scripts/render-clean-v063-publication.mjs

      - name: Apply production analytics to public HTML
        run: node scripts/sync-google-analytics.mjs

      - name: Remove transient clean print/export build directory
        run: rm -rf artifacts/reconstruction/clean-v0.6.3/print-export/generated

      - name: Verify historical recovery locks
        run: node scripts/validate-release-recovery-state.mjs

      - name: Validate materialized current release
        run: node scripts/validate-clean-v063-publication.mjs

      - name: Verify analytics synchronization
        run: node scripts/sync-google-analytics.mjs --check

      - name: Typecheck current digital pointer
        run: npm run typecheck

      - name: Test materialized current-compatible regressions
        run: |
          npx vitest run \
            --exclude tests/deckbuilder-print-request.test.ts \
            --exclude tests/player-facing-terminology.test.ts \
            --exclude tests/deckbuilder-mystics-ritual.test.ts \
            --exclude tests/public-faction-pages.test.ts \
            --exclude tests/release-recovery-write-guards.test.ts \
            --exclude tests/standalone-new-player-onboarding.test.ts \
            --exclude tests/start-public-theme.test.ts \
            --exclude tests/tracked-playtest-system.test.ts \
            --exclude tests/v062-public-faction-overviews.test.ts \
            --exclude rules-assistant/review-intelligence.test.mjs \
            --exclude rules-assistant/v062-published-routes.test.mjs

      - name: Commit atomic current-release materialization
        id: publish_commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            config/release-lifecycle.json \
            src/content/current.ts \
            index.html \
            rulebook \
            card-reference \
            factions \
            start \
            deckbuilder \
            rules-arbiter \
            releases/v0.6.3-reconstructed \
            rules-assistant/worker-entry.js \
            rules-assistant/worker-v063.js \
            rules-assistant/v063-public-corpus.js \
            rules-assistant/widget.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Publication materialization produced no changes.'
            exit 1
          fi
          git commit -m 'Publish clean v0.6.3 current release'
          published_sha=$(git rev-parse HEAD)
          echo "published_sha=$published_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main

      - name: Deploy current Rules Arbiter Worker with v0.6.1 cutover compatibility
        run: npx wrangler deploy --config rules-assistant/wrangler.toml

      - name: Request Pages build and verify production Workers + gauntlet.run
        env:
          PUBLISHED_SHA: ${{ steps.publish_commit.outputs.published_sha }}
        run: node scripts/verify-clean-v063-live-publication.mjs
