name: Finalize card wording

on:
  push:
    branches:
      - agent/shared-card-wording-templates
    paths:
      - .github/workflows/finalize-card-wording.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact wording corrections and regenerate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('docs/Gauntlet_v0.6.1_Neutral_Card_Pool.md'),
              Path('releases/v0.6.1/faction-guides/intelligence/Gauntlet_v0.6.1_Intelligence_Faction_Guide.md'),
              Path('releases/v0.6.1/faction-guides/military/Gauntlet_v0.6.1_Military_Faction_Guide.md'),
          ]
          replacements = {
              'one eligible card from your Reserve whose effect can apply.':
                  'one eligible card from your Reserve whose effect can apply now.',
              'an eligible Battle card from your Hand whose effect can apply.':
                  'an eligible Battle card from your Hand whose effect can apply now.',
              'an eligible card from your Hand whose effect can apply.':
                  'an eligible card from your Hand whose effect can apply now.',
          }

          changed = 0
          for path in paths:
              text = path.read_text(encoding='utf-8')
              before = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != before:
                  path.write_text(text, encoding='utf-8')
                  changed += 1
          if changed != 3:
              raise SystemExit(f'Expected to update 3 source files; updated {changed}.')
          PY
          python scripts/generate_v061_release.py
          git rm .github/workflows/finalize-card-wording.yml
          git add -A
          git commit -m "Align current-timing replacement wording"
          git push origin HEAD:agent/shared-card-wording-templates

# Triggered after registration.
