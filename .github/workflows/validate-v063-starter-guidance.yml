name: Validate v0.6.3 starter guidance

on:
  push:
    branches: [agent/v063-starter-territory-guidance]
    paths:
      - '.github/workflows/validate-v063-starter-guidance.yml'
      - 'docs/Gauntlet_v0.6.3_Starter_Deck_Presentation_Candidate.md'
      - 'scripts/refine-v063-browser-development.mjs'
      - 'scripts/validate-v063-starter-guidance.mjs'
      - 'v0.6.3/deckbuilder/**'
      - 'v0.6.3/data/Gauntlet_v0.6.3_Canonical_Data_Candidate.json'
      - 'releases/v0.6.2/Gauntlet_v0.6.2_Starter_Decks.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/validate-v063-starter-guidance.yml'
      - 'docs/Gauntlet_v0.6.3_Starter_Deck_Presentation_Candidate.md'
      - 'scripts/refine-v063-browser-development.mjs'
      - 'scripts/validate-v063-starter-guidance.mjs'
      - 'v0.6.3/deckbuilder/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check browser modules
        run: |
          node --check v0.6.3/deckbuilder/starter-adapter.js
          node --check v0.6.3/deckbuilder/app.js
          node --check scripts/refine-v063-browser-development.mjs
          node --check scripts/validate-v063-starter-guidance.mjs

      - name: Validate starter adaptation and Territory guidance
        run: node scripts/validate-v063-starter-guidance.mjs

      - name: Preserve published v0.6.2 starter boundary
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'releases/v0.6.2/**' 'v0.6.2/**' 'docs/Gauntlet_v0.6.2_Starter_Decks_Candidate.json' > /tmp/v062-starter-diff.txt
          if [ -s /tmp/v062-starter-diff.txt ]; then
            echo 'v0.6.3 starter guidance must not modify published or governing v0.6.2 starter surfaces:'
            cat /tmp/v062-starter-diff.txt
            exit 1
          fi
