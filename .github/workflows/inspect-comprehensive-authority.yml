name: Materialize comprehensive projection

on:
  push:
    branches: [rules/comprehensive-rebased]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render Comprehensive Rules
        run: node scripts/render-comprehensive-rules.mjs --write
      - name: Check generated projection freshness
        run: node scripts/render-comprehensive-rules.mjs
      - name: Validate publication architecture and authority
        run: |
          node scripts/validate-rules-publication-contract.mjs
          node scripts/validate-rules-publication-scaffolds.mjs
          node scripts/validate-faction-rules-authority.mjs
          node scripts/validate-shared-rules-authority.mjs
      - name: Commit generated Comprehensive Rules
        run: |
          if git diff --quiet -- rulebook/comprehensive/comprehensive-rules.md; then
            echo "Generated Comprehensive Rules already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rulebook/comprehensive/comprehensive-rules.md
          git commit -m "Render Comprehensive Rules from canonical authority"
          git push
