name: Inspect comprehensive authority

on:
  push:
    branches: [rules/comprehensive-rebased]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Print remaining direct-publication authority blocks
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const a = JSON.parse(await readFile('game-data/current-game.json', 'utf8'));
          const blocks = {
            factionFeatureTaxonomy: a.factionFeatureTaxonomy,
            componentContract: a.componentContract,
            factions: a.gameplay.factions,
          };
          for (const [name, value] of Object.entries(blocks)) {
            console.log(`\n===== ${name} =====`);
            console.log(JSON.stringify(value, null, 2));
          }
          NODE
