name: Inspect comprehensive authority

on:
  push:
    branches: [rules/comprehensive-rebased]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Print remaining shared authority shapes
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const a = JSON.parse(await readFile('game-data/current-game.json', 'utf8'));
          const blocks = {
            turn_actions: a.gameplay.turn.actions,
            movement_rules: a.gameplay.battlefield.movement_rules,
            additional_gambits: a.gameplay.card_rules.additional_gambits,
            additional_tactics: a.gameplay.card_rules.additional_tactics,
          };
          for (const [name, value] of Object.entries(blocks)) {
            console.log(`\n===== ${name} =====`);
            console.log(JSON.stringify(value, null, 2));
          }
          NODE
