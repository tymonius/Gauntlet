name: Validate comprehensive projection

on:
  push:
    branches: [rules/comprehensive-rebased]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render Comprehensive Rules
        run: node scripts/render-comprehensive-rules.mjs --write
      - name: Check generated projection freshness
        run: node scripts/render-comprehensive-rules.mjs
      - name: Validate publication architecture and authority
        run: |
          node scripts/validate-rules-publication-contract.mjs
          node scripts/validate-rules-publication-scaffolds.mjs
          node scripts/validate-faction-rules-authority.mjs
          node scripts/validate-shared-rules-authority.mjs
      - name: Upload generated Comprehensive Rules
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-rules-generated
          path: rulebook/comprehensive/comprehensive-rules.md
