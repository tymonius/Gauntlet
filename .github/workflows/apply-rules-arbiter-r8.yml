name: Apply Rules Arbiter r8 patch

on:
  push:
    branches:
      - rules-arbiter-gate2-r8
    paths:
      - .github/workflows/apply-rules-arbiter-r8.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rules-arbiter-gate2-r8
      - name: Apply r8 conflict-discipline hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('rules-assistant')
          worker_path = root / 'worker-v071.js'
          worker = worker_path.read_text(encoding='utf-8')
          worker = worker.replace('v071-qa-20260912-7', 'v071-qa-20260912-8')

          old = '''      "This retrieval contains printed named-card authority, a Rulebook authority that discusses the same named card, and the Golden Rules. Compare the material instructions before classifying. If the card and Rulebook instructions differ, apply the more-specific-rule precedence, classify the resolution inferred, and cite the printed card, the conflicting Rulebook authority, and the Golden Rules. Do not call a conflict-resolved result explicit merely because the printed card supplies the winning instruction."'''
          new = '''      "This retrieval contains printed named-card authority, a Rulebook authority that discusses the same named card, and the Golden Rules. First determine whether the card and Rulebook genuinely conflict on the same material instruction. Do not infer a conflict merely because one source is more detailed, summarizes the card, adds compatible restrictions, or states additional nonconflicting rules. If the authorities are compatible, do not invoke specificity; classify the answer normally, and it may remain explicit when every material claim is directly stated. Only when the sources are mutually incompatible on a material instruction should you apply the more-specific-rule precedence, classify the conflict-resolved result inferred, and cite the printed card, the conflicting Rulebook authority, and the Golden Rules. Do not call a genuinely conflict-resolved result explicit merely because the printed card supplies the winning instruction."'''
          if old not in worker:
              raise SystemExit('named-card adjudication reminder block was not found')
          worker = worker.replace(old, new, 1)
          worker_path.write_text(worker, encoding='utf-8')

          for test_path in root.glob('*.test.mjs'):
              text = test_path.read_text(encoding='utf-8')
              if 'v071-qa-20260912-7' in text:
                  test_path.write_text(text.replace('v071-qa-20260912-7', 'v071-qa-20260912-8'), encoding='utf-8')

          test = '''import { describe, expect, test } from "vitest";\nimport { BEHAVIOR_REVISION, buildQuestionSpecificAdjudicationReminder } from "./worker-v071.js";\n\nfunction sources(cardTitle, rulebookTitle, rulebookExcerpt) {\n  return [\n    {\n      id: "S1",\n      canonicalId: `card:test-${cardTitle.toLowerCase().replace(/[^a-z0-9]+/g, "-")}`,\n      title: `Card: ${cardTitle}`,\n      excerpt: `${cardTitle} printed component text.`\n    },\n    {\n      id: "S2",\n      canonicalId: `rulebook:test-${rulebookTitle.toLowerCase().replace(/[^a-z0-9]+/g, "-")}`,\n      title: rulebookTitle,\n      excerpt: `${cardTitle}: ${rulebookExcerpt}`\n    },\n    {\n      id: "S3",\n      canonicalId: "rulebook:golden-rules",\n      title: "Golden Rules",\n      excerpt: "When a specific rule conflicts with a general rule, the more specific rule wins."\n    }\n  ];\n}\n\ndescribe("v0.7.1 Gate 2 r8 named-card conflict discipline", () => {\n  test("pins the r8 behavior revision", () => {\n    expect(BEHAVIOR_REVISION).toBe("v071-qa-20260912-8");\n  });\n\n  test("does not equate compatible card and Rulebook coverage with a conflict", () => {\n    const reminder = buildQuestionSpecificAdjudicationReminder(\n      "What does Counterintelligence do?",\n      sources(\n        "Counterintelligence",\n        "Counterintelligence",\n        "prevents opposing revealing effects while rules-mandated reveals remain unaffected."\n      )\n    );\n    expect(reminder).toContain("Do not infer a conflict merely because");\n    expect(reminder).toContain("If the authorities are compatible, do not invoke specificity");\n    expect(reminder).toContain("it may remain explicit");\n  });\n\n  test("preserves inferred treatment for genuine named-card conflicts", () => {\n    const reminder = buildQuestionSpecificAdjudicationReminder(\n      "How does Leveraged Buyout work?",\n      sources(\n        "Leveraged Buyout",\n        "Collateral",\n        "battle collateral goes to the Graveyard after the purchase."\n      )\n    );\n    expect(reminder).toContain("mutually incompatible on a material instruction");\n    expect(reminder).toContain("classify the conflict-resolved result inferred");\n    expect(reminder).toContain("Golden Rules");\n  });\n});\n'''
          (root / 'v071-gate2-r8-conflict-discipline.test.mjs').write_text(test, encoding='utf-8')
          PY
          rm .github/workflows/apply-rules-arbiter-r8.yml
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refine named-card conflict classification"
          git push origin HEAD:rules-arbiter-gate2-r8
