name: Rules Arbiter targeted review

on:
  push:
    branches:
      - rules-arbiter-review-04b09828
    paths:
      - '.github/workflows/rules-arbiter-targeted-review.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply reviewed clarification fix
        run: python .github/scripts/apply-rules-arbiter-04b-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Run focused Rules Arbiter tests
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run \
            rules-assistant/v071-ambiguous-referent-clarification.test.mjs \
            rules-assistant/v071-battle-card-replacement-retrieval.test.mjs \
            rules-assistant/v071-short-counterfactual-continuity.test.mjs \
            rules-assistant/v071-strategic-withdrawal-review.test.mjs

          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'HEAD'], text=True
          ).splitlines())
          changed.update(subprocess.check_output(
              ['git', 'ls-files', '--others', '--exclude-standard'], text=True
          ).splitlines())
          Path('/tmp/rules-changed-files.json').write_text(
              json.dumps(sorted(path for path in changed if path)) + '\n'
          )
          PY
          node scripts/validate-rules-refinement-source-first.mjs \
            --changed-files /tmp/rules-changed-files.json

      - name: Remove review probe and commit refinement
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rules-arbiter-targeted-review.yml
          rm .github/scripts/apply-rules-arbiter-04b-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules-assistant artifacts/rules-refinement/resolution-ledger.json \
            .github/workflows/rules-arbiter-targeted-review.yml \
            .github/scripts/apply-rules-arbiter-04b-fix.py
          git diff --cached --check
          git commit -m "Fix ambiguous Rules Arbiter follow-up clarification"
          git push origin HEAD:rules-arbiter-review-04b09828
