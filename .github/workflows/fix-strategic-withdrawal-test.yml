name: Fix Strategic Withdrawal Edge Fixture

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/neutral-strategic-withdrawal'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/neutral-strategic-withdrawal
      - name: Correct legacy-board edge IDs
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/state/neutral-strategic-withdrawal.test.ts')
          text = path.read_text()
          old = """    const beyond = blocked.board.spaces.find((space) => space.id === 'player_1-beyond-gauntlet')!;
              const before = blocked.board.spaces.find((space) => space.id === 'player_1-before-gauntlet')!;
          """
          new = """    const beyond = blocked.board.spaces.find((space) => space.id === 'player_1-heartland')!;
              const before = blocked.board.spaces.find((space) => space.id === 'space-1')!;
          """
          if old not in text:
              raise SystemExit('Expected fixture lines were not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/state/neutral-strategic-withdrawal.test.ts
          git commit -m 'Correct Strategic Withdrawal edge fixture'
          git push origin HEAD:agent/neutral-strategic-withdrawal
