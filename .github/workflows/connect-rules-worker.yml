name: Connect Rules Worker

on:
  push:
    branches:
      - agent/connect-rules-worker

permissions:
  contents: write

jobs:
  update-endpoint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/connect-rules-worker
      - name: Set production Rules Arbiter endpoint
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('rules-assistant/widget.js')
          text = path.read_text(encoding='utf-8')
          old = 'const configuredApiEndpoint = window.GAUNTLET_RULES_ASSISTANT_ENDPOINT || "/api/rules";'
          new = 'const configuredApiEndpoint = window.GAUNTLET_RULES_ASSISTANT_ENDPOINT || "https://gauntlet-rules-assistant.tymon-scott.workers.dev/api/rules";'
          if old not in text:
              raise SystemExit('Expected endpoint declaration was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit endpoint configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules-assistant/widget.js
          git commit -m "Connect Rules Arbiter to production Worker"
          git push
