name: Inspect historical hero image

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'agent/fix-social-image'
    runs-on: ubuntu-latest
    steps:
      - name: Check out historical hero commit
        uses: actions/checkout@v4
        with:
          ref: f7862149557196960f7cddbdcabd0968fc754fb9

      - name: Upload historical hero for inspection
        uses: actions/upload-artifact@v4
        with:
          name: historical-hero-f786
          path: images/artwork/homepage-hero-three-leaders.webp
          if-no-files-found: error
          compression-level: 0
