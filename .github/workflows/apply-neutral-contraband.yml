name: Apply Neutral card recovery implementation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/neutral-contraband' || github.ref_name == 'agent/neutral-contraband'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/neutral-contraband
          fetch-depth: 0

      - name: Verify and apply implementation archive
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/chunk-checksums" <<'EOF'
          3aa75e716770656989c71d96f109e111f0e8231b2fa6e32df0dbcb8e1408b60d  .github/neutral-contraband-archive-00.b64
          8d77deaa21c2ba329c9a1a7d651f2ce112148b2f20bf7c9af976f176c5b21e46  .github/neutral-contraband-archive-01.b64
          d369b393a0b39588b06c2931cf1563088e06053bb7d7a97e88888ffe22971c96  .github/neutral-contraband-archive-02.b64
          614263c023d7326231a454c689af0edc6594cf29348bc7d7828add4a610500db  .github/neutral-contraband-archive-03.b64
          959e38c069efe6f200eb7dff602d1c3ee8efe641635957f0a5d62b83e5697205  .github/neutral-contraband-archive-04.b64
          4650d1a2fa5c4a0d700e5b7e4b8ce245b1dcb57340d9af977cf3c82fbc451025  .github/neutral-contraband-archive-05.b64
          fca8092c74b32cade17d02457c2064309e21cf691fe91d9ad5b34d844f160f3c  .github/neutral-contraband-archive-06.b64
          EOF
          sha256sum --check "$RUNNER_TEMP/chunk-checksums"
          cat .github/neutral-contraband-archive-*.b64 > "$RUNNER_TEMP/changes.b64"
          echo "26a52245ac11d5a318f3a35d7f868cfd51fb9b771e0a4de2d7d5acdf3d7c1d86  $RUNNER_TEMP/changes.b64" | sha256sum --check
          base64 --decode "$RUNNER_TEMP/changes.b64" > "$RUNNER_TEMP/changes.tar.gz"
          echo "cd1a2b5fe9eac888897fb41a2ef8b7ff0ea6700c57a3ddaf34fc31268881e928  $RUNNER_TEMP/changes.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/changes.tar.gz"

          cat > "$RUNNER_TEMP/fix-checksums" <<'EOF'
          64b9a150d1838d0852e30546ed7b5dc5c2baf05b25ae890e1e5b9430a707b461  .github/neutral-contraband-fix-00.b64
          55315765c3e871177bb549a031f1298d3e815f55d33b199d6ddf65e81a8d5c3a  .github/neutral-contraband-fix-01.b64
          dab3ab3c198d732e5e8b27d18c9bf3b6822c57ea329f3c7509be70b9aa9afeb6  .github/neutral-contraband-fix-02.b64
          3fc23f20b441e12c6188fa3e8fd719be280bc52ac194fe75f2940a3f71f95984  .github/neutral-contraband-fix-03.b64
          EOF
          sha256sum --check "$RUNNER_TEMP/fix-checksums"
          cat .github/neutral-contraband-fix-*.b64 > "$RUNNER_TEMP/test-fix.b64"
          echo "e47d973ac7bc037a924bf5a2d7a79a26f8490f08713150a5583a5dabcc0a37d0  $RUNNER_TEMP/test-fix.b64" | sha256sum --check
          base64 --decode "$RUNNER_TEMP/test-fix.b64" > "$RUNNER_TEMP/test-fix.tar.gz"
          echo "9c7eb0e4735f7138215e7a86db938a872d340c5aff7161e15d2f9ed93fc3b248  $RUNNER_TEMP/test-fix.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/test-fix.tar.gz"

      - name: Remove temporary staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/neutral-contraband-archive-*.b64
          rm -f .github/neutral-contraband-fix-*.b64
          rm -f .github/neutral-contraband-placeholder
          rm -f .github/workflows/apply-neutral-contraband.yml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Neutral Contraband"
          git push origin HEAD:agent/neutral-contraband
