name: Apply Rules Arbiter r6 patch

on:
  push:
    branches:
      - fix/rules-arbiter-gate2-public-availability
    paths:
      - '.github/workflows/apply-rules-arbiter-r6-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rules-arbiter-gate2-public-availability
          fetch-depth: 0
      - name: Apply focused source edits
        run: |
          python - <<'PY'
          from pathlib import Path

          worker = Path('rules-assistant/worker-v071.js')
          text = worker.read_text()
          old_revision = 'export const BEHAVIOR_REVISION = "v071-qa-20260911-5";'
          new_revision = 'export const BEHAVIOR_REVISION = "v071-qa-20260911-6";'
          if old_revision not in text:
              raise SystemExit('Expected r5 behavior revision not found')
          text = text.replace(old_revision, new_revision, 1)

          guide_line = '- Never treat an extra-Action grant as permission to use a phase-limited Feature in a different phase. When explaining a grant that supplies Actions in more than one phase, distinguish Action quantity from the Feature\'s legal timing.'
          guide_addition = '- When several granted Actions span different phases and at least one must be a phase-limited Feature, that requirement constrains which granted Action must satisfy the Feature requirement; it does not move the Feature into another phase. If only one granted phase is legal for that Feature, use the Feature in that phase and use another legal Action in the other granted phase.'
          if guide_line not in text:
              raise SystemExit('Expected adjudication timing guidance not found')
          text = text.replace(guide_line, guide_line + '\n' + guide_addition, 1)

          prompt_anchor = '17. For overview questions, summarize the directly supported mechanics without exposing retrieval coverage. Do not say that an "available passage", "available source", or retrieved excerpt omits the rest of a procedure; omit unsupported detail instead unless the player specifically asks about source coverage.'
          prompt_addition = '18. When an effect grants Actions in multiple phases and requires at least one of those Actions to be a phase-limited Feature, treat that requirement as constraining which granted Action must be used for the Feature, not as permission to change the Feature\'s timing. If only one granted phase is legal for the Feature, the Feature must be used in that phase; another legal Action must fill any other granted phase.'
          if prompt_anchor not in text:
              raise SystemExit('Expected numbered prompt anchor not found')
          text = text.replace(prompt_anchor, prompt_anchor + '\n' + prompt_addition, 1)

          text = text.replace(
              'env.ALLOWED_ORIGINS || "https://gauntlet.run,http://localhost:8000,http://127.0.0.1:8000"',
              'env.ALLOWED_ORIGINS || "https://gauntlet.run,https://www.gauntlet.run,http://localhost:8000,http://127.0.0.1:8000"'
          )
          text = text.replace('positiveInteger(env.RULES_MODEL_REQUESTS_PER_IP_HOUR, 12)', 'positiveInteger(env.RULES_MODEL_REQUESTS_PER_IP_HOUR, 24)')
          text = text.replace('positiveInteger(env.RULES_MODEL_REQUESTS_PER_DAY, 50)', 'positiveInteger(env.RULES_MODEL_REQUESTS_PER_DAY, 100)')
          text = text.replace('positiveInteger(env.RULES_MODEL_REQUESTS_PER_MONTH, 200)', 'positiveInteger(env.RULES_MODEL_REQUESTS_PER_MONTH, 500)')
          worker.write_text(text)

          for path in Path('rules-assistant').glob('*.test.mjs'):
              current = path.read_text()
              updated = current.replace('v071-qa-20260911-5', 'v071-qa-20260911-6')
              if updated != current:
                  path.write_text(updated)

          Path('.github/workflows/apply-rules-arbiter-r6-patch.yml').unlink()
          PY
      - name: Commit patch to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden Rules Arbiter timing and public availability'
          git push origin HEAD:fix/rules-arbiter-gate2-public-availability
