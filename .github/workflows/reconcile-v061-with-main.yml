name: Reconcile v0.6.1 with main

on:
  push:
    branches:
      - rules/v0.6.1-playtest-revision
    paths:
      - ".github/workflows/reconcile-v061-with-main.yml"

permissions:
  contents: write

concurrency:
  group: reconcile-v061-with-main
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v4
        with:
          ref: rules/v0.6.1-playtest-revision
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

      - name: Merge main and resolve known overlap
        run: |
          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          unexpected="$(printf '%s\n' "$conflicts" | sed '/^$/d' | grep -Ev '^(docs/Gauntlet_Development_Status\.md|docs/README\.md|package\.json|rules-assistant/wrangler\.toml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected merge conflicts:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          for path in docs/Gauntlet_Development_Status.md docs/README.md; do
            if printf '%s\n' "$conflicts" | grep -Fxq "$path"; then
              git checkout --ours -- "$path"
            fi
          done

          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          conflicts = set(subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=U"], text=True
          ).splitlines())

          if "package.json" in conflicts:
              ours = json.loads(subprocess.check_output(["git", "show", ":2:package.json"], text=True))
              theirs = json.loads(subprocess.check_output(["git", "show", ":3:package.json"], text=True))
              scripts = dict(theirs.get("scripts", {}))
              scripts.update(ours.get("scripts", {}))
              merged = dict(ours)
              merged["scripts"] = scripts
              for key in ("dependencies", "devDependencies"):
                  values = dict(theirs.get(key, {}))
                  values.update(ours.get(key, {}))
                  if values:
                      merged[key] = values
              Path("package.json").write_text(json.dumps(merged, indent=2) + "\n", encoding="utf-8")

          status_path = Path("docs/Gauntlet_Development_Status.md")
          status = status_path.read_text(encoding="utf-8")
          old = "- Build and test the card-front system using both short and text-heavy examples, then adapt it to faction cards, Assets, Overlays, Territories, Leaders, and supplemental components."
          new = "- Build and test the card-front system using both short and text-heavy examples; the initial Neutral implementation is available in the [live card-front specimen](../card-design/), after which the system should expand to faction cards, Assets, Overlays, Territories, Leaders, and supplemental components."
          if old in status:
              status = status.replace(old, new, 1)
          elif new not in status:
              raise SystemExit("Could not reconcile card-front status wording")
          status_path.write_text(status, encoding="utf-8")

          docs_path = Path("docs/README.md")
          docs = docs_path.read_text(encoding="utf-8")
          card_front = "- [Live Neutral Card-Front Prototype](../card-design/) — actual-size frame and hierarchy study using sparse, dense, and reminder-text Neutral cards."
          if card_front not in docs:
              marker = "- [Live Typography Specimen](../typography/) — internal browser specimen for P22 1722 Pro, Adobe Caslon Pro, Georgia, P22 Declaration Pro, Inter, and actual-size card typography tests.\n"
              if marker not in docs:
                  raise SystemExit("Could not locate documentation insertion point")
              docs = docs.replace(marker, marker + card_front + "\n", 1)
          docs_path.write_text(docs, encoding="utf-8")

          Path("rules-assistant/wrangler.toml").write_text('''name = "gauntlet-rules-assistant"\nmain = "worker-entry.js"\ncompatibility_date = "2026-07-29"\n\n[vars]\nSITE_ORIGIN = "https://gauntlet.run"\nALLOWED_ORIGINS = "https://gauntlet.run,http://localhost:8000,http://127.0.0.1:8000"\nOPENAI_MODEL = "gpt-5.6-luna"\nOPENAI_REASONING_EFFORT = "low"\n\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "gauntlet-rules-assistant"\ndatabase_id = "92edbc7f-f934-4260-b376-321ae1f02761"\nmigrations_dir = "migrations"\n''', encoding="utf-8")
          PY

          if [ -f rules-assistant/migrations/0002_playtest_sessions.sql ]; then
            git mv rules-assistant/migrations/0002_playtest_sessions.sql rules-assistant/migrations/0003_playtest_sessions.sql
            while IFS= read -r path; do
              sed -i 's/0002_playtest_sessions\.sql/0003_playtest_sessions.sql/g' "$path"
            done < <(git grep -l '0002_playtest_sessions\.sql' || true)
          fi

          python - <<'PY'
          from pathlib import Path
          path = Path("rules-assistant/worker-entry.js")
          text = path.read_text(encoding="utf-8")
          text = text.replace('import worker from "./worker.js";', 'import worker from "./worker-v061.js";', 1)
          if 'import worker from "./worker-v061.js";' not in text:
              raise SystemExit("Rules worker entry was not upgraded to v0.6.1")
          path.write_text(text, encoding="utf-8")
          PY

          git add docs/Gauntlet_Development_Status.md docs/README.md package.json rules-assistant/wrangler.toml rules-assistant/worker-entry.js rules-assistant/migrations scripts workers

          remaining="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$remaining" ]; then
            echo "Unresolved merge conflicts:"
            printf '%s\n' "$remaining"
            exit 1
          fi

          if [ "$merge_status" -ne 0 ] && ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo "Merge failed without leaving a resolvable merge state"
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Validate reconciled branch
        run: |
          npm run governance:check
          npm run typecheck
          npm test
          npm run test:rules-assistant
          npm run test:playtest-sessions
          npm run test:formal-session-e2e
          python scripts/validate_v061_playtest_sessions.py
          python scripts/validate_v061_release.py

      - name: Commit and push reconciliation
        run: |
          git add -A
          git commit -m "Merge main into v0.6.1 revision"
          git push origin HEAD:rules/v0.6.1-playtest-revision
