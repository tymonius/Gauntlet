name: Apply faction-sheet link retirement

on:
  push:
    branches:
      - chore/retire-printable-faction-sheets
    paths:
      - ".github/workflows/apply-faction-sheet-retirement.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout retirement branch
        uses: actions/checkout@v4
        with:
          ref: chore/retire-printable-faction-sheets

      - name: Remove active faction-sheet links
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = sorted(Path('factions').glob('*/index.html'))
          if len(pages) != 6:
              raise SystemExit(f'Expected six faction guide pages; found {len(pages)}')

          for page in pages:
              original = page.read_text(encoding='utf-8')
              lines = original.splitlines(keepends=True)
              removed = [line for line in lines if '../../faction-sheets/' in line]
              if len(removed) != 3:
                  raise SystemExit(f'{page} contained {len(removed)} active faction-sheet links instead of 3')
              page.write_text(''.join(line for line in lines if '../../faction-sheets/' not in line), encoding='utf-8')
              print(f'{page}: removed {len(removed)} links')

          workflow = Path('.github/workflows/apply-faction-sheet-retirement.yml')
          workflow.unlink()
          PY

      - name: Commit retirement updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove faction-sheet links from faction guides"
          git push origin HEAD:chore/retire-printable-faction-sheets
