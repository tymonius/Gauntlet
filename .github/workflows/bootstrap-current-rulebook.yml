name: Bootstrap current Rulebook source

on:
  push:
    branches:
      - fix/current-authority-rulebook-source
    paths:
      - scripts/bootstrap-current-rulebook.mjs
      - rulebook/release-candidate.js
      - rulebook/faction-feature-terminology.js
      - rulebook/player-facing/chapter-11.md
      - rulebook/player-facing/card-anatomy.md
      - game-data/current-game.json
      - docs/v0.6.4-rules.json
      - docs/v0.6.4-diplomat-proposals.json
      - docs/v0.6.4-arcane-symbol.json
      - releases/v0.6.3/Gauntlet_v0.6.3_Rulebook.md

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/current-authority-rulebook-source
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize current Rulebook
        run: node scripts/bootstrap-current-rulebook.mjs

      - name: Commit current Rulebook source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rulebook/player-facing/current-rulebook.md
          if git diff --cached --quiet; then
            echo "Current Rulebook source already materialized."
            exit 0
          fi
          git commit -m "Materialize current player-facing Rulebook source"
          git push
