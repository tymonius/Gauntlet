name: Apply source-first rules refinement v4

on:
  push:
    branches:
      - feat/source-first-rules-refinement
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout refinement branch
        uses: actions/checkout@v4
        with:
          ref: feat/source-first-rules-refinement
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --no-package-lock
          npm install --no-package-lock --no-save pdf-lib

      - name: Install Chromium for Rulebook rendering
        run: npx playwright install --with-deps chromium

      - name: Apply accepted rule and wire maintained renderer to preserved publication tooling
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const rulebookPath = 'rulebook/player-facing/current-rulebook.md';
          let rulebook = fs.readFileSync(rulebookPath, 'utf8').replace(/\r\n/g, '\n');
          const heading = '### Choosing among options';
          const acceptedRule = 'When a rule or effect requires a choice, choose from the options that are actually available. If no valid option is available, that choice is ignored.';
          if (rulebook.includes(heading)) {
            rulebook = rulebook.replace(/### Choosing among options\n\n[\s\S]*?(?=\n### Shared timing)/, `${heading}\n\n${acceptedRule}\n`);
          } else {
            const anchor = `## Simultaneous effects and choices\n\n### Shared timing`;
            if (!rulebook.includes(anchor)) throw new Error('Could not find Chapter 11 choice-rule insertion anchor.');
            rulebook = rulebook.replace(anchor, `## Simultaneous effects and choices\n\n${heading}\n\n${acceptedRule}\n\n### Shared timing`);
          }
          fs.writeFileSync(rulebookPath, rulebook);

          const renderPath = 'scripts/render-v071-booklet.mjs';
          let render = fs.readFileSync(renderPath, 'utf8');
          const importLine = `import { prepareLegacyRulebookPublicationCompatibility, cleanupLegacyRulebookPublicationCompatibility } from './legacy-rulebook-publication-compat.mjs';\n`;
          if (!render.includes(importLine.trim())) {
            const anchor = `import { loadPublishingAuthority } from './publishing-authority.mjs';\n`;
            if (!render.includes(anchor)) throw new Error('Could not find renderer import anchor.');
            render = render.replace(anchor, anchor + importLine);
          }
          if (!render.includes('const publicationCompatibility = prepareLegacyRulebookPublicationCompatibility();')) {
            const anchor = `fs.rmSync(PRODUCTION_DIR, { recursive: true, force: true });\nfs.mkdirSync(path.dirname(TRANSIENT_RULEBOOK_PATH), { recursive: true });`;
            if (!render.includes(anchor)) throw new Error('Could not find renderer setup anchor.');
            render = render.replace(anchor, `fs.rmSync(PRODUCTION_DIR, { recursive: true, force: true });\nconst publicationCompatibility = prepareLegacyRulebookPublicationCompatibility();\nfs.mkdirSync(path.dirname(TRANSIENT_RULEBOOK_PATH), { recursive: true });`);
          }
          if (!render.includes('cleanupLegacyRulebookPublicationCompatibility(publicationCompatibility);')) {
            const anchor = `} finally {\n  server.kill('SIGTERM');\n}\n\nconst reportPath`;
            if (!render.includes(anchor)) throw new Error('Could not find renderer cleanup anchor.');
            render = render.replace(anchor, `} finally {\n  server.kill('SIGTERM');\n  cleanupLegacyRulebookPublicationCompatibility(publicationCompatibility);\n}\n\nconst reportPath`);
          }
          fs.writeFileSync(renderPath, render);
          NODE

      - name: Regenerate current v0.7.1 release authority
        run: node scripts/build-v071-release-source.mjs

      - name: Regenerate current v0.7.1 Rulebook booklet and manifest
        run: node scripts/render-v071-booklet.mjs

      - name: Refresh release manifest bindings
        run: node scripts/refresh-current-release-manifest.mjs

      - name: Validate propagated authority and refinement contracts
        run: |
          npx vitest run scripts/validate-available-choice-rule.test.mjs rules-assistant/refinement-scaffold.test.mjs scripts/validate-rules-refinement-source-first.test.mjs
          npm run rules:authority:check
          npm run test:current-contract

      - name: Remove one-shot workflows
        run: rm -f .github/workflows/apply-source-first-rules-refinement.yml .github/workflows/apply-source-first-rules-refinement-v2.yml .github/workflows/apply-source-first-rules-refinement-v3.yml .github/workflows/apply-source-first-rules-refinement-v4.yml

      - name: Commit propagated authority
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Propagate legal choice rule to current authority'
          git push origin HEAD:feat/source-first-rules-refinement
