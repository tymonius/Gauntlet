name: Last Stand language audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 1
          show-progress: false
      - name: Inventory Last Stand language
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Last Stand language audit'
            echo
            echo '```text'
            git grep -n -i 'last stand' -- ':!*.pdf' ':!*.docx' || true
            echo '```'
            echo
            echo '### Release and rendering scripts'
            echo
            echo '```text'
            find scripts -maxdepth 2 -type f -print | sort
            echo '```'
          } > /tmp/last-stand-audit.md
          cat /tmp/last-stand-audit.md
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/last-stand-audit.md
          fi
