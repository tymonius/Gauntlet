name: Release tooling inventory

on:
  pull_request:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          show-progress: false
      - name: Inventory release tooling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Release tooling inventory'
            echo
            echo '```text'
            find scripts -maxdepth 2 -type f -print | sort
            echo '```'
          } > /tmp/release-tooling.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/release-tooling.md
