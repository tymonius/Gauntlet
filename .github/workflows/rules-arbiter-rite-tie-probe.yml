name: Rules Arbiter Rite/tiebreak probe

on:
  push:
    branches:
      - ops/rules-arbiter-rite-tie-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe deterministic v0.7.1 retrieval
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { buildRulesCorpus, retrieveRules } from './rules-assistant/local-search.js';
          import { augmentRetrievalForContext, contextualQuery } from './rules-assistant/worker-v071.js';
          const canonicalData = JSON.parse(readFileSync('./releases/v0.7.1/Gauntlet_v0.7.1_Canonical_Data.json','utf8'));
          const rulebookMarkdown = readFileSync('./releases/v0.7.1/Gauntlet_v0.7.1_Rulebook.md','utf8');
          const corpus = buildRulesCorpus({canonicalData,rulebookMarkdown,siteOrigin:'https://gauntlet.run',rulebookBrowserUrl:'https://gauntlet.run/rulebook/',canonicalDataUrl:'https://gauntlet.run/releases/v0.7.1/Gauntlet_v0.7.1_Canonical_Data.json'});
          const questions = [
            'How does Rite of Crossing complete?',
            'When does Rite of Crossing complete?',
            'When re-rolling after a tie, do gambits and tactics that add to your total or grant advantage still apply?',
            'Do advantage and card bonuses apply to a Tiebreak Roll?',
            'What happens when battle totals are tied?'
          ];
          for (const q of questions) {
            const query = contextualQuery(q, []);
            const raw = retrieveRules(corpus, query, { limit: 10, excerptLength: 1700 });
            const sources = augmentRetrievalForContext(corpus, q, [], raw);
            console.log(JSON.stringify({q,query,sources:sources.map((s,i)=>({rank:i+1,id:s.canonicalId,title:s.title,body:String(s.body||'').slice(0,1500)}))}));
          }
          NODE
