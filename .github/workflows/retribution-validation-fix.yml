name: Retribution Validation Fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.head_ref == 'feature/v070-retribution-lifecycle' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v070-retribution-lifecycle
          fetch-depth: 0
      - name: Match repository validation install procedure
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/retribution-integration-trigger.yml')
          text = path.read_text()
          old = '      - name: Validate integration\n        run: |\n          npm ci\n'
          new = "      - name: Setup Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: 22\n      - name: Validate integration\n        run: |\n          npm install\n"
          if old not in text:
              raise SystemExit('validation anchor not found')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/retribution-validation-fix.yml').unlink()
          PY
      - name: Commit validation harness fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use repository validation install procedure"
          git push origin HEAD:feature/v070-retribution-lifecycle
