name: Build v0.7.2 modular rules booklets

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Commit the generated v0.7.2 modular release package to the selected feature branch.
        required: true
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/build-v072-modular-booklets.yml'
      - 'apps/rules/booklet/**'
      - 'apps/rules/markdown.js'
      - 'config/publication-boundary.json'
      - 'legacy/rulebook-browser/**'
      - 'packages/game-data/current-game.json'
      - 'packages/rules/**'
      - 'scripts/publication-boundary.mjs'
      - 'scripts/render-v072-dedicated-booklets.mjs'
      - 'scripts/render-v072-modular-booklets.mjs'
      - 'scripts/validate-v072-modular-booklets.mjs'
      - 'scripts/promote-v072-modular-release-package.mjs'
      - 'scripts/validate-v072-release-package.mjs'
      - 'tests/v072-modular-booklet-pipeline.test.mjs'

permissions:
  contents: write

jobs:
  build-booklets:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require a feature branch for publication
        if: inputs.publish
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "::error::Publish the generated v0.7.2 package from a feature branch so it passes through review and protected-main checks."
            exit 1
          fi

      - name: Check out publication sources
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check whether the approved v0.7.2 package is already frozen
        id: publication
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lifecycle = JSON.parse(fs.readFileSync('config/release-lifecycle.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('releases/v0.7.2/Gauntlet_v0.7.2_Manifest.json', 'utf8'));
          const published = lifecycle.current_release === 'v0.7.2'
            && lifecycle.releases?.['v0.7.2']?.public_cutover === true
            && manifest.status === 'current'
            && manifest.authority_set_id === lifecycle.releases['v0.7.2'].frozen_authority_set_id;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `published=${published}\n`);
          NODE

      - name: Refuse to replace an already-published immutable package
        if: ${{ steps.publication.outputs.published == 'true' && inputs.publish }}
        run: |
          echo 'v0.7.2 is already published; its frozen rules package must not be regenerated.' >&2
          exit 1

      - name: Install JavaScript dependencies
        run: |
          npm install
          npm install --no-save --package-lock=false pdf-lib

      - name: Validate already-published frozen v0.7.2 package
        if: ${{ steps.publication.outputs.published == 'true' }}
        run: node scripts/validate-v072-release-package.mjs

      - name: Install Chromium and PDF inspection tools
        if: ${{ steps.publication.outputs.published != 'true' }}
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Check modular booklet scripts
        if: ${{ steps.publication.outputs.published != 'true' }}
        run: |
          node --check packages/rules/publication/v072-modular-booklets.mjs
          node --check scripts/render-v072-dedicated-booklets.mjs
          node --check scripts/render-v072-modular-booklets.mjs
          node --check scripts/validate-v072-modular-booklets.mjs
          node --check scripts/promote-v072-modular-release-package.mjs
          node --check scripts/validate-v072-release-package.mjs
          node --check apps/rules/booklet/booklet.js

      - name: Render all eight modular booklets
        if: ${{ steps.publication.outputs.published != 'true' }}
        run: node scripts/render-v072-dedicated-booklets.mjs

      - name: Validate booklet contract and imposition
        if: ${{ steps.publication.outputs.published != 'true' }}
        run: node scripts/validate-v072-modular-booklets.mjs

      - name: Promote modular rules into staged v0.7.2 release package
        if: ${{ steps.publication.outputs.published != 'true' }}
        run: node scripts/promote-v072-modular-release-package.mjs

      - name: Validate staged v0.7.2 release package
        if: ${{ steps.publication.outputs.published != 'true' }}
        run: node scripts/validate-v072-release-package.mjs

      - name: Render PDF review previews
        if: ${{ steps.publication.outputs.published != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/rules-booklets/v0.7.2/previews
          for pdf in artifacts/rules-booklets/v0.7.2/*_Booklet.pdf; do
            stem="$(basename "$pdf" .pdf)"
            pdfinfo "$pdf"
            text="$(pdftotext "$pdf" -)"
            fonts="$(pdffonts "$pdf")"
            grep -q '[[:alnum:]]' <<< "$text"
            if grep -Eiq 'Official Browser Rulebook|Release candidate rules|Start[[:space:]]+Playtest[[:space:]]+Rules[[:space:]]+Factions[[:space:]]+Deckbuilder' <<< "$text"; then
              echo "Browser Rulebook chrome leaked into $pdf" >&2
              exit 1
            fi
            if grep -Eiq 'DejaVuSans|LiberationSans' <<< "$fonts"; then
              echo "Sans-serif fallback font leaked into $pdf" >&2
              printf '%s\n' "$fonts" >&2
              exit 1
            fi
            if ! grep -Eiq 'Inter' <<< "$fonts"; then
              echo "Inter was not embedded in $pdf" >&2
              printf '%s\n' "$fonts" >&2
              exit 1
            fi
            pdftoppm -f 1 -l 6 -png -r 140 "$pdf" "artifacts/rules-booklets/v0.7.2/previews/${stem}-side"
          done

      - name: Upload modular booklet review artifact
        if: ${{ steps.publication.outputs.published != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-v0.7.2-modular-rules-booklets
          path: artifacts/rules-booklets/v0.7.2/
          if-no-files-found: error

      - name: Commit staged v0.7.2 modular release package
        if: ${{ inputs.publish && steps.publication.outputs.published != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/commit-generated-files.mjs "Publish v0.7.2 modular rules package" -- \
            releases/v0.7.2/Gauntlet_v0.7.2_Player_Guide.md \
            releases/v0.7.2/Gauntlet_v0.7.2_Military_Guide.md \
            releases/v0.7.2/Gauntlet_v0.7.2_Diplomats_Guide.md \
            releases/v0.7.2/Gauntlet_v0.7.2_Financiers_Guide.md \
            releases/v0.7.2/Gauntlet_v0.7.2_Intelligence_Guide.md \
            releases/v0.7.2/Gauntlet_v0.7.2_Mystics_Guide.md \
            releases/v0.7.2/Gauntlet_v0.7.2_Inquisition_Guide.md \
            releases/v0.7.2/Gauntlet_v0.7.2_Complete_Rules.md \
            releases/v0.7.2/Gauntlet_v0.7.2_Player_Guide_Booklet.pdf \
            releases/v0.7.2/Gauntlet_v0.7.2_Military_Guide_Booklet.pdf \
            releases/v0.7.2/Gauntlet_v0.7.2_Diplomats_Guide_Booklet.pdf \
            releases/v0.7.2/Gauntlet_v0.7.2_Financiers_Guide_Booklet.pdf \
            releases/v0.7.2/Gauntlet_v0.7.2_Intelligence_Guide_Booklet.pdf \
            releases/v0.7.2/Gauntlet_v0.7.2_Mystics_Guide_Booklet.pdf \
            releases/v0.7.2/Gauntlet_v0.7.2_Inquisition_Guide_Booklet.pdf \
            releases/v0.7.2/Gauntlet_v0.7.2_Complete_Rules_Booklet.pdf \
            releases/v0.7.2/Gauntlet_v0.7.2_Manifest.json
