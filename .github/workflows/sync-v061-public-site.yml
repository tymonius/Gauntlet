name: Sync public site to v0.6.1

on:
  push:
    branches:
      - rules/v0.6.1-playtest-revision
    paths:
      - ".github/workflows/sync-v061-public-site.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout revision branch
        uses: actions/checkout@v4
        with:
          ref: rules/v0.6.1-playtest-revision

      - name: Update current-release labels and links
        run: |
          python - <<'PY'
          from pathlib import Path

          for relative in ['index.html', 'README.md']:
              path = Path(relative)
              text = path.read_text(encoding='utf-8')
              text = text.replace('v0.6.0', 'v0.6.1')
              text = text.replace('Version 0.6.0', 'Version 0.6.1')
              text = text.replace('Gauntlet_v0.6.0_', 'Gauntlet_v0.6.1_')
              path.write_text(text, encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          additions = '''
                  <a class="button secondary" href="releases/v0.6.1/Gauntlet_v0.6.1_First_Game_Guide.md">First-game guide</a>
                  <a class="button secondary" href="releases/v0.6.1/Gauntlet_v0.6.1_Faction_Introductions.md">Faction introductions</a>
          '''.strip()
          if 'Gauntlet_v0.6.1_First_Game_Guide.md' not in text:
              marker = '<a class="button secondary" href="playtest/">Playtest sheet</a>'
              if marker in text:
                  text = text.replace(marker, marker + '\n              ' + additions, 1)
          index.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          if 'Gauntlet_v0.6.1_First_Game_Guide.md' not in text:
              marker = '## Current release\n'
              insertion = '''## New-player onboarding\n\n- [First-Game Guide](releases/v0.6.1/Gauntlet_v0.6.1_First_Game_Guide.md)\n- [Faction Introductions](releases/v0.6.1/Gauntlet_v0.6.1_Faction_Introductions.md)\n- [Printable Playtest Sheet](playtest/)\n- [Player Mat and Zone Reference](playtest/player-mat/)\n\n'''
              if marker in text:
                  text = text.replace(marker, insertion + marker, 1)
              else:
                  text += '\n\n' + insertion
          readme.write_text(text, encoding='utf-8')
          PY

      - name: Validate homepage links and release labels
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html').read_text(encoding='utf-8')
          readme = Path('README.md').read_text(encoding='utf-8')
          for relative, text in [('index.html', index), ('README.md', readme)]:
              if 'v0.6.0' in text:
                  raise SystemExit(f'{relative} still identifies v0.6.0 as current')
              if 'v0.6.1' not in text:
                  raise SystemExit(f'{relative} does not identify v0.6.1')
          required = [
              'rulebook/', 'card-reference/', 'deckbuilder/', 'playtest/',
              'Gauntlet_v0.6.1_First_Game_Guide.md',
              'Gauntlet_v0.6.1_Faction_Introductions.md'
          ]
          missing = [value for value in required if value not in index + readme]
          if missing:
              raise SystemExit(f'Public-site links missing: {missing}')
          print('Validated v0.6.1 public-site labels and onboarding links.')
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Serve repository
        run: python3 -m http.server 8000 >/tmp/gauntlet-http.log 2>&1 &

      - name: Smoke-test home page
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          for (const viewport of [{ width: 1440, height: 1000 }, { width: 390, height: 844 }]) {
            const page = await browser.newPage({ viewport });
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            page.on('console', message => {
              if (message.type() === 'error') errors.push(message.text());
            });
            const response = await page.goto('http://127.0.0.1:8000/', { waitUntil: 'networkidle' });
            if (!response?.ok()) throw new Error(`Home page returned ${response?.status()}`);
            const text = await page.locator('body').innerText();
            if (!text.includes('v0.6.1')) throw new Error('Home page does not identify v0.6.1');
            if (text.includes('v0.6.0')) throw new Error('Home page still identifies v0.6.0');
            for (const href of ['./rulebook/', './card-reference/', './deckbuilder/', './playtest/']) {
              const count = await page.locator(`a[href="${href}"], a[href="${href.slice(2)}"]`).count();
              if (!count) throw new Error(`Home page missing ${href} link`);
            }
            if (errors.length) throw new Error(`Home-page errors:\n${errors.join('\n')}`);
            await page.close();
          }
          await browser.close();
          NODE

      - name: Commit synchronized public site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update public site and README for v0.6.1"
          git push origin HEAD:rules/v0.6.1-playtest-revision
