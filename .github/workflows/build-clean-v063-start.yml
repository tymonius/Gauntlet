name: Build clean v0.6.3 Start

# This workflow preserves the pre-publication clean-Start reconstruction check.
# It encodes historical candidate-state assumptions and is not a current-site gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-historical-reconstruction:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconstruction state
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate preserved clean-Start reconstruction
        run: |
          node --check artifacts/reconstruction/clean-v0.6.3/start/app.js
          node --check scripts/validate-clean-v063-start.mjs
          node --check scripts/validate-clean-v063-faction-pages.mjs
          node --check scripts/sync-google-analytics.mjs
          node scripts/validate-clean-v063-start.mjs
