name: Apply Rules Arbiter triage continuity fix

on:
  push:
    branches:
      - fix/rules-arbiter-triage-continuity-classification
    paths:
      - .github/workflows/apply-rules-arbiter-triage-continuity-fix.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/rules-arbiter-triage-continuity-classification
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply refinement
        run: echo '' | base64 -d > /tmp/apply.py && python /tmp/apply.py
      - name: Run deterministic regressions
        run: npx vitest run rules-assistant/refinement-triage.test.mjs rules-assistant/v071-contextual-query.test.mjs rules-assistant/v071-retrieval-qa.test.mjs rules-assistant/v071-destination-continuity.test.mjs rules-assistant/v071-intelligence-interference.test.mjs rules-assistant/v071-qa-foundation.test.mjs
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-rules-arbiter-triage-continuity-fix.yml
      - name: Commit refinement
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rules-assistant/worker-v071.js rules-assistant/refinement-triage.js rules-assistant/refinement-triage.test.mjs rules-assistant/v071-contextual-query.test.mjs .github/workflows/apply-rules-arbiter-triage-continuity-fix.yml
          git commit -m "Correct Rules Arbiter continuity triage"
          git push origin HEAD:fix/rules-arbiter-triage-continuity-classification
