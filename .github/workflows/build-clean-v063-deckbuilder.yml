name: Build clean v0.6.3 Deckbuilder

on:
  pull_request:
    paths:
      - 'artifacts/reconstruction/clean-v0.6.3/deckbuilder/**'
      - 'artifacts/reconstruction/clean-v0.6.3/start/**'
      - 'artifacts/reconstruction/clean-v0.6.3/downstream/**'
      - 'artifacts/reconstruction/clean-v0.6.3/complete-authority/**'
      - 'config/release-lifecycle.json'
      - 'config/reconstruction-version-plan.json'
      - 'src/content/current.ts'
      - 'scripts/validate-clean-v063-deckbuilder.mjs'
      - 'scripts/validate-clean-v063-start.mjs'
      - 'scripts/sync-google-analytics.mjs'
      - '.github/workflows/build-clean-v063-deckbuilder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Deckbuilder inputs
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check Deckbuilder scripts
        run: |
          node --check artifacts/reconstruction/clean-v0.6.3/deckbuilder/app.js
          node --check scripts/validate-clean-v063-deckbuilder.mjs
          node --check scripts/validate-clean-v063-start.mjs
          node --check scripts/sync-google-analytics.mjs
      - name: Validate clean v0.6.3 Deckbuilder
        run: node scripts/validate-clean-v063-deckbuilder.mjs
      - name: Validate integrated clean Start
        run: node scripts/validate-clean-v063-start.mjs
      - name: Validate analytics isolation
        run: node scripts/sync-google-analytics.mjs --check
      - name: Reject whitespace errors
        run: git diff --check HEAD^1 HEAD
