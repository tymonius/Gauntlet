name: Bind Rules Arbiter opening-hand refinement

on:
  push:
    branches:
      - fix/rules-arbiter-opening-hand-retrieval
    paths:
      - '.github/workflows/fix-rules-arbiter-opening-hand-binding.yml'

permissions:
  contents: write

jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rules-arbiter-opening-hand-retrieval
      - name: Bind deterministic behavior revision
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import json; from pathlib import Path; p=Path("artifacts/rules-refinement/resolution-ledger.json"); data=json.loads(p.read_text()); entry=next(e for e in data["entries"] if e.get("id")=="setup-opening-hand-retrieval-v071"); entry["binding"]={"pullRequest":1557,"behaviorRevision":"v071-qa-20260908-1"}; p.write_text(json.dumps(data,indent=2)+"\n")'
      - name: Commit binding
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-rules-arbiter-opening-hand-binding.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/rules-refinement/resolution-ledger.json .github/workflows/fix-rules-arbiter-opening-hand-binding.yml
          git commit -m 'Bind opening-hand refinement behavior revision'
          git push origin HEAD:fix/rules-arbiter-opening-hand-retrieval
