# Generates/validates v0.6.2 only while it is an active release lifecycle state.
# When v0.6.2 is withdrawn, this workflow becomes a read-only evidence-preservation gate.
name: Publish v0.6.2 printed materials

on:
  push:
    branches: [agent/v062-printed-materials]
    paths:
      - ".github/workflows/publish-v062-print-package.yml"
      - "config/release-lifecycle.json"
      - "config/release-locks.json"
      - "images/sketches/**"
      - "v0.6.2/print/**"
      - "releases/v0.6.2/*.md"
      - "scripts/build-v062-print-html.mjs"
      - "scripts/commit-generated-files.mjs"
      - "scripts/render-v062-print-package.mjs"
      - "scripts/synchronize-v062-print-release.mjs"
      - "scripts/validate-v062-print-package.mjs"
      - "scripts/validate-release-recovery-state.mjs"
      - "scripts/release-lifecycle.mjs"
      - "package.json"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/publish-v062-print-package.yml"
      - "config/release-lifecycle.json"
      - "config/release-locks.json"
      - "images/sketches/**"
      - "v0.6.2/print/**"
      - "releases/v0.6.2/**"
      - "playtest/index.html"
      - "playtest/player-mat/index.html"
      - "scripts/build-v062-print-html.mjs"
      - "scripts/commit-generated-files.mjs"
      - "scripts/render-v062-print-package.mjs"
      - "scripts/synchronize-v062-print-release.mjs"
      - "scripts/validate-v062-print-package.mjs"
      - "scripts/validate-release-recovery-state.mjs"
      - "scripts/release-lifecycle.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v062-print-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read v0.6.2 lifecycle state
        id: lifecycle
        run: |
          status=$(node -e "const l=require('./config/release-lifecycle.json'); process.stdout.write(String(l.releases?.['v0.6.2']?.status || 'missing'))")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "v0.6.2 lifecycle status: $status"

      - name: Verify withdrawn v0.6.2 print evidence is frozen
        if: steps.lifecycle.outputs.status == 'withdrawn'
        run: node scripts/validate-release-recovery-state.mjs

      - name: Install dependencies and PDF tools
        if: steps.lifecycle.outputs.status != 'withdrawn'
        run: |
          npm install
          npm install --no-save pdf-lib
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Serve repository
        if: steps.lifecycle.outputs.status != 'withdrawn'
        run: |
          python -m http.server 8000 >/tmp/v062-print-server.log 2>&1 &
          echo $! > /tmp/v062-print-server.pid

      - name: Build and render printed materials
        if: steps.lifecycle.outputs.status != 'withdrawn'
        run: npm run print:v062:build

      - name: Verify reproducibility
        if: steps.lifecycle.outputs.status != 'withdrawn'
        run: npm run print:v062:check

      - name: Rasterize PDFs for visual review
        if: steps.lifecycle.outputs.status != 'withdrawn'
        run: |
          mkdir -p /tmp/gauntlet-v062-pdf-renders
          for file in releases/v0.6.2/Gauntlet_v0.6.2_*.pdf; do
            stem=$(basename "$file" .pdf)
            mkdir -p "/tmp/gauntlet-v062-pdf-renders/$stem"
            pdftoppm -png -r 110 "$file" "/tmp/gauntlet-v062-pdf-renders/$stem/page"
          done

      - name: Upload print review package
        if: steps.lifecycle.outputs.status != 'withdrawn'
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-v062-printed-materials
          path: |
            /tmp/gauntlet-v062-print-previews/**
            /tmp/gauntlet-v062-pdf-renders/**
            images/sketches/**
            releases/v0.6.2/Gauntlet_v0.6.2_*.pdf
            releases/v0.6.2/Gauntlet_v0.6.2_Print_Manifest.json
          if-no-files-found: error

      - name: Commit generated print package
        if: steps.lifecycle.outputs.status != 'withdrawn' && github.event_name == 'push' && github.ref_name == 'agent/v062-printed-materials'
        run: |
          branch="$GITHUB_REF_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- \
            releases/v0.6.0/Gauntlet_v0.6.0_Reference_Guide.docx \
            releases/v0.6.0/Gauntlet_v0.6.0_Reference_Guide.pdf \
            releases/v0.6.0/Gauntlet_v0.6.0_Rulebook.docx \
            releases/v0.6.0/Gauntlet_v0.6.0_Rulebook.pdf \
            releases/v0.6.0/Gauntlet_v0.6.0_Rulebook_Booklet.pdf \
            releases/v0.6.0/Gauntlet_v0.6.0_Rulebook_Booklet_Print.pdf
          if git ls-files --error-unmatch .github/workflows/restore-pr510-v060-binaries.yml >/dev/null 2>&1; then
            git rm .github/workflows/restore-pr510-v060-binaries.yml
          fi
          git add \
            README.md \
            package.json \
            playtest/index.html \
            playtest/player-mat/index.html \
            v0.6.2/index.html \
            v0.6.2/release-manifest.json \
            v0.6.2/print \
            releases/v0.6.0/Gauntlet_v0.6.0_Reference_Guide.docx \
            releases/v0.6.0/Gauntlet_v0.6.0_Reference_Guide.pdf \
            releases/v0.6.0/Gauntlet_v0.6.0_Rulebook.docx \
            releases/v0.6.0/Gauntlet_v0.6.0_Rulebook.pdf \
            releases/v0.6.0/Gauntlet_v0.6.0_Rulebook_Booklet.pdf \
            releases/v0.6.0/Gauntlet_v0.6.0_Rulebook_Booklet_Print.pdf \
            releases/v0.6.2/README.md \
            releases/v0.6.2/Gauntlet_v0.6.2_Manifest.json \
            releases/v0.6.2/Gauntlet_v0.6.2_*.pdf \
            releases/v0.6.2/Gauntlet_v0.6.2_Print_Manifest.json
          if git diff --cached --quiet; then
            echo "v0.6.2 printed materials are already current."
            exit 0
          fi
          git commit -m "Materialize v0.6.2 printed materials [skip ci]"
          git fetch origin "$branch"
          git rebase "origin/$branch"
          git push origin "HEAD:$branch"
