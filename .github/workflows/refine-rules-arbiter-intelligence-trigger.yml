name: Refine Intelligence retrieval trigger

on:
  push:
    branches:
      - fix/rules-arbiter-intelligence-interference
    paths:
      - '.github/workflows/refine-rules-arbiter-intelligence-trigger.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rules-arbiter-intelligence-interference
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Limit authority injection to active Intelligence topic
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const workerPath = 'rules-assistant/worker-v071.js';
          let worker = readFileSync(workerPath, 'utf8');
          const oldBlock = `  const battleCardFocus = /\\bgambits?\\b/.test(combined) && /\\btactics?\\b/.test(combined);\n  const intelligenceInterferenceFocus = /\\b(?:surveillance|interference|interfere|intel)\\b/.test(combined)\n    && /\\b(?:gambits?|tactics?|face[ -]?up|reveals?|replacements?|revis(?:e|ion))\\b/.test(combined);`;
          const newBlock = `  const battleCardFocus = /\\bgambits?\\b/.test(combined) && /\\btactics?\\b/.test(combined);\n  const intelligenceTopic = /\\b(?:surveillance|interference|interfere|intel)\\b/;\n  const intelligenceInterferenceFocus = (\n    intelligenceTopic.test(current)\n    || (currentWordCount <= 8 && intelligenceTopic.test(recent))\n  ) && /\\b(?:gambits?|tactics?|face[ -]?up|reveals?|replacements?|revis(?:e|ion))\\b/.test(combined);`;
          if (!worker.includes(oldBlock)) throw new Error('Could not find Intelligence retrieval trigger block.');
          worker = worker.replace(oldBlock, newBlock);
          writeFileSync(workerPath, worker);

          const testPath = 'rules-assistant/v071-intelligence-interference.test.mjs';
          let test = readFileSync(testPath, 'utf8');
          const needle = `  test("prompt preserves the full procedure instead of collapsing Surveillance and Interference", () => {`;
          const insertion = `  test("does not pin Intelligence authority after the conversation pivots to another topic", () => {\n    const history = [\n      { role: "user", content: "Can I use Interference on that Gambit?" },\n      { role: "assistant", content: "Yes, at the applicable Intelligence response timing." }\n    ];\n    const question = "How much does my Deed cost?";\n    const raw = retrieveRules(corpus, question, { limit: 10, excerptLength: 1300 });\n    const rawIds = raw.map((source) => source.canonicalId);\n    const augmentedIds = augmentRetrievalForContext(corpus, question, history, raw).map((source) => source.canonicalId);\n    expect(augmentedIds).toEqual(rawIds);\n  });\n\n${needle}`;
          if (!test.includes(needle)) throw new Error('Could not find test insertion point.');
          test = test.replace(needle, insertion);
          writeFileSync(testPath, test);
          NODE
      - name: Remove one-shot workflow
        run: rm .github/workflows/refine-rules-arbiter-intelligence-trigger.yml
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules-assistant/worker-v071.js rules-assistant/v071-intelligence-interference.test.mjs .github/workflows/refine-rules-arbiter-intelligence-trigger.yml
          git commit -m "Limit Intelligence retrieval augmentation to active topic"
          git push origin HEAD:fix/rules-arbiter-intelligence-interference
