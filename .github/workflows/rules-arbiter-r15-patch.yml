name: Rules Arbiter r15 one-shot patch

on:
  push:
    branches:
      - rules-arbiter-gate3-d-remediation
    paths:
      - .github/workflows/rules-arbiter-r15-patch.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: rules-arbiter-gate3-d-remediation
          fetch-depth: 0

      - name: Apply guarded Worker patch
        run: node scripts/apply-rules-arbiter-r15-worker-patch.mjs

      - name: Validate patched JavaScript
        run: |
          node --check rules-assistant/worker-v071.js
          git diff --check

      - name: Commit r15 Worker changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules-assistant/worker-v071.js \
                  rules-assistant/v071-ambiguous-referent-clarification.test.mjs \
                  rules-assistant/v071-gate3-c-worker-integration.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Harden tranche D ambiguity handling"
          git push origin HEAD:rules-arbiter-gate3-d-remediation

# One-shot workflow; remove before opening the remediation PR.
