name: Materialize v0.7.2 candidate authority

on:
  push:
    branches:
      - release/v0.7.2-rc1

permissions:
  contents: write

concurrency:
  group: materialize-v072-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promote:
    if: ${{ !contains(github.event.head_commit.message, 'Promote v0.7.2 candidate authority') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout RC branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.7.2-rc1
          fetch-depth: 1
          filter: blob:none

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Promote approved v0.7.2 design
        run: |
          node --check scripts/promote-v072-candidate.mjs
          node --check scripts/promote-v072-candidate-test-contract.mjs
          node scripts/promote-v072-candidate.mjs
          node scripts/promote-v072-candidate-test-contract.mjs

      - name: Validate current authority and v0.7.2 integration
        run: |
          node --input-type=module <<'NODE'
          import { loadCurrentGameAuthority } from './scripts/current-game-authority.mjs';
          const authority = await loadCurrentGameAuthority();
          if (authority.version !== 'v0.7.2-candidate') throw new Error(`Unexpected authority version ${authority.version}`);
          console.log(`Validated ${authority.version} current-game authority.`);
          NODE
          npx vitest run tests/v072-candidate-integration.test.ts tests/current-game-authority.test.ts

      - name: Verify frozen v0.7.1 release is untouched
        run: |
          git diff --exit-code HEAD -- releases/v0.7.1

      - name: Commit promoted candidate authority
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-data/current-game.json rulebook/player-facing/current-rulebook.md tests/current-game-authority.test.ts
          if git diff --cached --quiet; then
            echo "Candidate authority already materialized."
            exit 0
          fi
          git commit -m "Promote v0.7.2 candidate authority"
          git push origin HEAD:release/v0.7.2-rc1
