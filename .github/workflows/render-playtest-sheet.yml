name: Render printable playtest sheet

on:
  push:
    branches:
      - main
    paths:
      - apps/playtest/sheet/index.html
      - apps/playtest/styles.css
      - apps/playtest/README.md
      - config/release-lifecycle.json
      - .github/workflows/render-playtest-sheet.yml
  pull_request:
    branches:
      - main
    paths:
      - apps/playtest/sheet/index.html
      - apps/playtest/styles.css
      - apps/playtest/README.md
      - config/release-lifecycle.json
      - .github/workflows/render-playtest-sheet.yml
      - README.md
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: render-playtest-sheet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install rendering tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python3 -m pip install pypdf

      - name: Resolve current release output paths
        id: release
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lifecycle = JSON.parse(fs.readFileSync('config/release-lifecycle.json', 'utf8'));
          const version = String(lifecycle.current_release || '');
          const release = lifecycle.releases?.[version];
          if (!/^v\d+\.\d+\.\d+$/.test(version) || release?.status !== 'current' || release?.public_cutover !== true) {
            throw new Error('Release lifecycle does not identify an approved current release.');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            `version=${version}`,
            `pdf=apps/playtest/Gauntlet_${version}_Playtest_Sheet.pdf`,
            `preview=apps/playtest/Gauntlet_${version}_Playtest_Sheet_Preview.png`,
            '',
          ].join('\n'));
          NODE

      - name: Stage Playtest public path
        run: |
          rm -rf playtest
          cp -a apps/playtest playtest

      - name: Serve repository
        run: |
          python3 -m http.server 8000 >/tmp/gauntlet-http.log 2>&1 &

      - name: Render Letter-size PDF and preview
        env:
          PLAYTEST_SHEET_PDF: ${{ steps.release.outputs.pdf }}
          PLAYTEST_SHEET_PREVIEW: ${{ steps.release.outputs.preview }}
          PLAYTEST_RULES_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1275, height: 1650 }, deviceScaleFactor: 1 });
          const errors = [];
          page.on('pageerror', error => errors.push(error.message));
          page.on('console', message => {
            if (message.type() === 'error') errors.push(message.text());
          });

          const serialToken = String(process.env.PLAYTEST_RULES_VERSION || '')
            .replace(/^v/, '')
            .replace(/\./g, '');
          await page.goto(`http://127.0.0.1:8000/playtest/sheet/?serial=G${serialToken}-PREVIEW`, { waitUntil: 'networkidle' });
          await page.screenshot({
            path: process.env.PLAYTEST_SHEET_PREVIEW,
            fullPage: true
          });

          await page.emulateMedia({ media: 'print' });
          await page.pdf({
            path: process.env.PLAYTEST_SHEET_PDF,
            format: 'Letter',
            printBackground: true,
            preferCSSPageSize: true,
            margin: { top: '0', right: '0', bottom: '0', left: '0' }
          });
          await browser.close();

          if (errors.length) {
            throw new Error(`Browser rendering errors:\n${errors.join('\n')}`);
          }
          NODE

      - name: Validate PDF
        env:
          PLAYTEST_SHEET_PDF: ${{ steps.release.outputs.pdf }}
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path
          from pypdf import PdfReader

          path = Path(os.environ['PLAYTEST_SHEET_PDF'])
          if not path.exists() or path.stat().st_size < 20_000:
              raise SystemExit('Generated PDF is missing or unexpectedly small')
          reader = PdfReader(str(path))
          if len(reader.pages) != 1:
              raise SystemExit(f'Expected exactly one page, found {len(reader.pages)}')
          page = reader.pages[0]
          width = float(page.mediabox.width)
          height = float(page.mediabox.height)
          if abs(width - 612) > 2 or abs(height - 792) > 2:
              raise SystemExit(f'Expected Letter size, found {width} x {height} points')
          text = (page.extract_text() or '').strip()
          required = [
              'Gauntlet Playtest Sheet',
              'Instruction + setup',
              'External interruption',
              'Faction introduction shown?',
              'Ritual of Ascendance',
              'Arbiter questions'
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Generated PDF is missing required text: {missing}')
          if len(text) < 700:
              raise SystemExit(f'Generated PDF contains too little extractable content: {len(text)} characters')
          print(f'Validated {path}: one Letter-size page, {path.stat().st_size} bytes, {len(text)} text characters.')
          PY

      - name: Upload rendered sheet
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-current-playtest-sheet-${{ steps.release.outputs.version }}
          path: |
            ${{ steps.release.outputs.pdf }}
            ${{ steps.release.outputs.preview }}
          if-no-files-found: error

      - name: Publish generated PDF through a pull request
        if: github.event_name == 'push' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          PLAYTEST_SHEET_PDF: ${{ steps.release.outputs.pdf }}
          PLAYTEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          branch="generated/playtest-sheet-${PLAYTEST_VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -- "$PLAYTEST_SHEET_PDF"

          if git diff --cached --quiet; then
            echo "Generated playtest sheet is already current."
            exit 0
          fi

          git commit -m "Render current ${PLAYTEST_VERSION} printable playtest sheet PDF"
          git push --force origin "$branch"

          existing_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            echo "Updated existing generated-sheet PR #$existing_pr."
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --head "$branch" \
              --base main \
              --title "Render current ${PLAYTEST_VERSION} printable playtest sheet" \
              --body "Generated by the protected-main playtest-sheet publication workflow. Merging this PR publishes the validated current printable playtest sheet PDF."
          fi
