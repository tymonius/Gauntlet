name: Finalize Deck Prep branch

on:
  push:
    branches:
      - agent/deck-prep-requests

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deck-prep-requests
          fetch-depth: 0
      - name: Apply final source patches
        shell: python
        run: |
          from pathlib import Path

          start_index = Path("start/index.html")
          text = start_index.read_text(encoding="utf-8")
          old = '<script src="app.js?v=20260731-1" defer></script>'
          new = '<script src="app.js?v=20260731-2" defer></script>'
          if old not in text and new not in text:
              raise SystemExit("Start loader marker not found")
          start_index.write_text(text.replace(old, new, 1), encoding="utf-8")

          host_app = Path("deck-requests/host/app.js")
          text = host_app.read_text(encoding="utf-8")
          old_block = '''  function requestStatus(participantId) {
    const value = readStatuses()[`${activeCode}:${participantId}`];
    return STATUS_OPTIONS.includes(value) ? value : "requested";
  }

  function setRequestStatus(participantId, status) {
    if (!STATUS_OPTIONS.includes(status)) return;
    const statuses = readStatuses();
    statuses[`${activeCode}:${participantId}`] = status;
    try { localStorage.setItem(STATUSES_KEY, JSON.stringify(statuses)); } catch { /* Status remains visible until reload. */ }
  }
'''
          new_block = '''  function requestStatus(participantId) {
    const choice = state.choices.find(item => item.participantId === participantId);
    const value = readStatuses()[`${activeCode}:${participantId}`];
    if (typeof value === "string") return STATUS_OPTIONS.includes(value) ? value : "requested";
    if (!value || typeof value !== "object" || !STATUS_OPTIONS.includes(value.status)) return "requested";
    if (choice?.submittedAt && value.choiceSubmittedAt !== choice.submittedAt) return "requested";
    return value.status;
  }

  function setRequestStatus(participantId, status) {
    if (!STATUS_OPTIONS.includes(status)) return;
    const choice = state.choices.find(item => item.participantId === participantId);
    const statuses = readStatuses();
    statuses[`${activeCode}:${participantId}`] = {
      status,
      choiceSubmittedAt: choice?.submittedAt || "",
      updatedAt: new Date().toISOString()
    };
    try { localStorage.setItem(STATUSES_KEY, JSON.stringify(statuses)); } catch { /* Status remains visible until reload. */ }
  }
'''
          if old_block not in text and new_block not in text:
              raise SystemExit("Status function marker not found")
          host_app.write_text(text.replace(old_block, new_block, 1), encoding="utf-8")
      - name: Commit final branch and remove patch workflow
        run: |
          rm .github/workflows/patch-deck-prep-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "4189824+github-actions[bot]@users.noreply.github.com"
          git add start/index.html deck-requests/host/app.js .github/workflows/patch-deck-prep-final.yml
          git commit -m "Finalize Deck Prep request behavior"
          git push origin HEAD:agent/deck-prep-requests
