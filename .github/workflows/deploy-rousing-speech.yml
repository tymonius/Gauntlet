name: Diagnose Rousing Speech Staging

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    if: github.head_ref == 'agent/neutral-rousing-speech'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/neutral-rousing-speech
      - name: Inspect staged payload
        run: |
          set +e
          {
            for file in .github/rousing-{00..10}.b64; do
              wc -c "$file"
              sha256sum "$file"
            done
            cat .github/rousing-{00..10}.b64 > rousing-speech-impl.b64
            wc -c rousing-speech-impl.b64
            sha256sum rousing-speech-impl.b64
            base64 -d rousing-speech-impl.b64 > rousing-speech-impl.tar.gz
            echo "decode-exit=$?"
            wc -c rousing-speech-impl.tar.gz
            sha256sum rousing-speech-impl.tar.gz
            tar -tzf rousing-speech-impl.tar.gz
            echo "tar-exit=$?"
          } > rousing-staging-diagnostic.txt 2>&1
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: rousing-staging-diagnostic
          path: rousing-staging-diagnostic.txt
