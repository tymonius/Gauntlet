name: Deploy Rousing Speech

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    if: github.head_ref == 'agent/neutral-rousing-speech'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/neutral-rousing-speech
      - name: Apply verified implementation
        run: |
          if [ ! -f .github/rousing-00.b64 ]; then
            echo "Implementation already applied."
            exit 0
          fi
          echo "d31df07933dece9a90f61129256a14c4b4812cc86ef19630274cb4902705fcd9  .github/rousing-00.b64" | sha256sum -c -
          echo "fb9a75752781f743da9b1c53d4974be92d69b7de4739a0f4c425274195a68e96  .github/rousing-01.b64" | sha256sum -c -
          echo "d5a784797e35d78fc699e62fcb064c960cc6b59819365d50eacde621798e774a  .github/rousing-02.b64" | sha256sum -c -
          echo "837eed849af862015e823c06c5805208a36ce2cc7255f1d58f8828822213d1c2  .github/rousing-03.b64" | sha256sum -c -
          echo "b2b68aeaf73b04cb8b2a342c5b30582653363e189f858948e7b1038a228d6458  .github/rousing-04.b64" | sha256sum -c -
          echo "2314fafc249f88461a946fda659ba5f5ef9c819a9e6d160bfb58c3a895eada74  .github/rousing-05.b64" | sha256sum -c -
          echo "13357e92c97072f6bcb30ff7661a389c6ec13be10caa12bfc2f284ae17ca41a3  .github/rousing-06.b64" | sha256sum -c -
          echo "8ddd96f004e36b54f4d250e3307587f3259b427c382b14831d45404eb69e6c23  .github/rousing-07.b64" | sha256sum -c -
          echo "483be101fb41cf0f8f186774aea906f4dea1c5d6126143e452fbe7ae4f1ceeb8  .github/rousing-08.b64" | sha256sum -c -
          echo "49144a7e187ea5cb616a9c23a330dc5e4f1a2d07cb282427599afc1aebf12598  .github/rousing-09.b64" | sha256sum -c -
          echo "57ec6408c916c8f7825e73adac1e8c9251adac76e9fdda7064dc6875a9dc9015  .github/rousing-10.b64" | sha256sum -c -
          cat .github/rousing-{00..10}.b64 > /tmp/rousing-speech-impl.b64
          test "$(wc -c < /tmp/rousing-speech-impl.b64)" = "20972"
          echo "a06c570779293028d24a75eb0ef7a43afaeedb2f90c754b7313412ca648b0251  /tmp/rousing-speech-impl.b64" | sha256sum -c -
          base64 -d /tmp/rousing-speech-impl.b64 > /tmp/rousing-speech-impl.tar.gz
          echo "6ce0b4dfd7e6528f71b22e8307c67baee26d4cd8a348a9bdf554c8443dd31757  /tmp/rousing-speech-impl.tar.gz" | sha256sum -c -
          tar -xzf /tmp/rousing-speech-impl.tar.gz
          rm -f .github/rousing-{00..10}.b64 .github/workflows/deploy-rousing-speech.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Neutral Rousing Speech"
          git push origin HEAD:agent/neutral-rousing-speech
