name: Finalize terminology refinement

on:
  push:
    branches:
      - agent/terminology-refinement
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[terminology-applied]') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/terminology-refinement
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply and finish terminology pass
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import textwrap

          workflow = Path('.github/workflows/apply-terminology-refinement.yml').read_text(encoding='utf-8')

          def inline_python(step_name: str) -> str:
              start = workflow.index(f'- name: {step_name}')
              section = workflow[start:]
              marker = "python - <<'PY'\n"
              code_start = section.index(marker) + len(marker)
              remainder = section[code_start:]
              match = re.search(r'^\s{10}PY\s*$', remainder, flags=re.M)
              if not match:
                  raise RuntimeError(f'Could not extract inline Python for {step_name}')
              return textwrap.dedent(remainder[:match.start()])

          exec(inline_python('Correct glossary anchors in one-use script'), {})
          subprocess.run(['python', 'scripts/apply_terminology_refinement.py'], check=False)

          try:
              exec(inline_python('Finish contextual wording and audit'), {})
          except SystemExit:
              # The existing audit intentionally stops on the final small set below.
              pass

          paths = [
              Path('README.md'),
              Path('releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.md'),
              Path('releases/v0.6.1/Gauntlet_v0.6.1_First_Game_Guide.md'),
              Path('releases/v0.6.1/Gauntlet_v0.6.1_Faction_Introductions.md'),
              Path('docs/Gauntlet_v0.6.1_Neutral_Card_Pool.md'),
              Path('docs/Gauntlet_v0.6.1_Territory_Pool.md'),
          ]
          paths.extend(sorted(Path('releases/v0.6.1/faction-guides').glob('**/*.md')))

          replacements = {
              'Otherwise, reroll unresolved ties.': 'Otherwise, reroll until the tie is broken.',
              'The first time during each of your turns that a cost-1 card you play, set, or choose resolves its Action, Gambit, Tactic, or Battle effect, draw one card.':
                  'The first time during each of your turns that the Action, Gambit, Tactic, or Battle effect of a cost-1 card you play, set, or choose takes effect, draw one card.',
              'Treason cannot select an effect that has already resolved and follows the shared copied-effect rules.':
                  'Treason cannot select an effect that has already been applied and follows the shared copied-effect rules.',
              'provided its effect can resolve then': 'provided its effect can be applied then',
              'if it has a Tactic or Battle effect that can resolve then': 'if it has a Tactic or Battle effect that can be applied then',
              "does not resolve another card's effect or another copied effect": "does not apply another card's effect or another copied effect",
          }

          for path in paths:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          rulebook = Path('releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.md').read_text(encoding='utf-8')
          required = [
              'A **position** is any space where a Player Token may be placed:',
              "**Occupation** is the state in which a player's token is on an opposing Territory",
              'A **Counterattack** is a battle initiated by the controller of a Territory',
              'A **Faction Ability** is any special rule granted by a faction.',
              'A **Faction Action** is a Faction Ability that explicitly uses an Action Opportunity.',
              '### 7. Determine the Outcome',
              'During the Aftermath, follow these steps in order:',
              'no more than **60 total card value**',
          ]
          missing = [item for item in required if item not in rulebook]
          if missing:
              raise SystemExit(f'Missing agreed terminology: {missing}')

          pattern = re.compile(r'\b(?:un)?resolve(?:s|d|ing)?\b|\bresolution\b', re.I)
          leftovers = []
          for path in paths:
              if not path.exists():
                  continue
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  audit_line = line.replace('Nonbinding Resolution', '')
                  if pattern.search(audit_line):
                      leftovers.append(f'{path}:{number}: {line}')
          if leftovers:
              raise SystemExit('Unreworded terminology remains:\n' + '\n'.join(leftovers))

          stale = [str(path) for path in paths if path.exists() and re.search(r'deckbuilding value', path.read_text(encoding='utf-8'), re.I)]
          if stale:
              raise SystemExit(f'Stale deckbuilding-value terminology remains: {stale}')
          PY

      - name: Install dependencies
        run: npm install

      - name: Validate governance
        run: npm run governance:check

      - name: Validate deck data
        run: npm run test:deckbuilder

      - name: Run tests
        run: npm test

      - name: Remove one-use automation
        run: |
          rm scripts/apply_terminology_refinement.py
          rm .github/workflows/apply-terminology-refinement.yml
          rm .github/workflows/finalize-terminology-refinement.yml

      - name: Commit terminology update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[terminology-applied] Refine game terminology"
          git push origin HEAD:agent/terminology-refinement
