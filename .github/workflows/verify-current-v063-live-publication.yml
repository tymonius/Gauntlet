name: Verify current v0.6.3 live publication

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-current-v063-live-publication.yml'
      - 'scripts/validate-current-public-contract.mjs'
      - 'releases/v0.6.3-reconstructed/**'
      - 'index.html'
      - 'start/**'
      - 'rulebook/**'
      - 'card-reference/**'
      - 'factions/**'
      - 'deckbuilder/**'
      - 'rules-arbiter/**'
      - 'design-tokens.css'
      - 'images/faction-symbols/**'
      - 'rules-assistant/worker-entry.js'
      - 'rules-assistant/worker-v063.js'
      - 'rules-assistant/v063-public-corpus.js'
      - 'rules-assistant/wrangler.toml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-current-v063-live-publication.yml'
      - 'scripts/validate-current-public-contract.mjs'
      - 'releases/v0.6.3-reconstructed/**'
      - 'index.html'
      - 'start/**'
      - 'rulebook/**'
      - 'card-reference/**'
      - 'factions/**'
      - 'deckbuilder/**'
      - 'rules-arbiter/**'
      - 'design-tokens.css'
      - 'images/faction-symbols/**'
      - 'rules-assistant/worker-entry.js'
      - 'rules-assistant/worker-v063.js'
      - 'rules-assistant/v063-public-corpus.js'
      - 'rules-assistant/wrangler.toml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: verify-current-v063-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out proposed publication
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install contract dependency
        run: npm install --no-save --package-lock=false pdf-lib

      - name: Validate the exact current-publication contract pre-merge
        run: node scripts/validate-current-public-contract.mjs

  live:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ github.sha }}
      GITHUB_REPOSITORY_NAME: ${{ github.repository }}
    steps:
      - name: Check out deployed publication source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Determine whether Rules Arbiter deployment changed
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            worker=true
          else
            worker=false
            git diff --name-only HEAD^ HEAD | while IFS= read -r file; do
              case "$file" in
                rules-assistant/worker-entry.js|rules-assistant/worker-v063.js|rules-assistant/v063-public-corpus.js|rules-assistant/wrangler.toml)
                  echo 'worker=true' > /tmp/worker-scope
                  ;;
              esac
            done
            if [[ -f /tmp/worker-scope ]]; then worker=true; fi
          fi
          echo "worker=$worker" >> "$GITHUB_OUTPUT"

      - name: Install verification dependency
        run: npm install --no-save --package-lock=false pdf-lib

      - name: Install Worker tooling
        if: steps.scope.outputs.worker == 'true'
        run: npm install --no-save --package-lock=false wrangler@4

      - name: Verify Worker deployment secrets
        if: steps.scope.outputs.worker == 'true'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

      - name: Deploy current Rules Arbiter Worker only when its inputs changed
        if: steps.scope.outputs.worker == 'true'
        run: npx wrangler deploy --config rules-assistant/wrangler.toml

      - name: Wait for current and historical Rules Arbiter health
        run: |
          node --input-type=module <<'NODE'
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          async function wait(url, predicate, label) {
            let last = '';
            for (let attempt = 1; attempt <= 30; attempt += 1) {
              try {
                const response = await fetch(url);
                last = await response.text();
                if (response.ok && predicate(JSON.parse(last))) {
                  console.log(`${label} verified on attempt ${attempt}.`);
                  return;
                }
              } catch (error) {
                last = String(error);
              }
              if (attempt < 30) await sleep(3000);
            }
            throw new Error(`${label} did not become healthy: ${last}`);
          }
          const base = 'https://gauntlet-rules-assistant.tymon-scott.workers.dev';
          await wait(`${base}/api/health`, (v) => v?.ok === true && v.version === 'v0.6.3' && v.currentPublicRelease === 'v0.6.3', 'Current Rules Arbiter');
          await wait(`${base}/api/v061/health`, (v) => v?.ok === true && v.version === 'v0.6.1', 'Historical v0.6.1 Rules Arbiter');
          NODE

      - name: Request and verify exact GitHub Pages build
        run: |
          node --input-type=module <<'NODE'
          const repo = process.env.GITHUB_REPOSITORY_NAME;
          const token = process.env.GH_TOKEN;
          const expectedSha = process.env.EXPECTED_SHA;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'gauntlet-current-public-contract',
          };
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          async function github(url, options = {}) {
            const response = await fetch(url, { ...options, headers });
            const text = await response.text();
            if (!response.ok) throw new Error(`${options.method || 'GET'} ${url} -> ${response.status} ${text}`);
            return text ? JSON.parse(text) : null;
          }
          await github(`https://api.github.com/repos/${repo}/pages/builds`, { method: 'POST' });
          for (let attempt = 1; attempt <= 60; attempt += 1) {
            const latest = await github(`https://api.github.com/repos/${repo}/pages/builds/latest`);
            console.log(`Pages attempt ${attempt}: status=${latest.status || ''} commit=${latest.commit || ''}`);
            if (latest.commit === expectedSha && latest.status === 'built') process.exit(0);
            if (attempt < 60) await sleep(5000);
          }
          throw new Error(`GitHub Pages did not report ${expectedSha} built within the verification window.`);
          NODE

      - name: Verify the deployed site against the same current-publication contract
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if GAUNTLET_PUBLIC_BASE_URL=https://gauntlet.run node scripts/validate-current-public-contract.mjs; then
              echo "Live public contract verified on attempt $attempt."
              exit 0
            fi
            if [[ "$attempt" -lt 30 ]]; then sleep 5; fi
          done
          echo 'Live public contract did not converge after Pages reported the expected commit.' >&2
          exit 1
