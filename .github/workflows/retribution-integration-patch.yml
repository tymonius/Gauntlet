name: Retribution Integration Patch

on:
  push:
    branches:
      - feature/v070-retribution-lifecycle

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Integrate Retribution into Aftermath timing') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v070-retribution-lifecycle
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply exact Retribution integration edits
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          # --- battle-engine-core.ts ---
          path = Path('src/v070/battle-engine-core.ts')
          text = path.read_text()

          anchor = """import {
            applyV070BlasphemyForBattleReveal,
            applyV070NormalAftermathConviction,
            v070CondemnationAppliesToPlayerTactic,
          } from './inquisition';
          """
          replacement = anchor + """import {
            applyV070RetributionUse,
            markV070RetributionProcessed,
            resolveV070RetributionResponse,
            v070RetributionEligibleInstanceIds,
          } from './retribution';
          """
          text = replace_once(text, anchor, replacement, 'core import')

          anchor = """  | {
                type: 'resolve_battle_aftermath_controlled_effect';
                playerId: PlayerId;
                sourceInstanceId: string;
                replaceAssetInstanceId?: string;
              }
          """
          replacement = anchor + """  | {
                type: 'pass_retribution_asset';
                playerId: PlayerId;
                assetInstanceId: string;
              }
              | {
                type: 'resolve_retribution_response';
                playerId: PlayerId;
                choice: 'asset' | 'conviction';
                assetInstanceId?: string;
              }
          """
          text = replace_once(text, anchor, replacement, 'core action union')

          old = """  if (state.battleRuntime?.pendingBattleAftermathControlledEffectChoice
                && action.type !== 'resolve_battle_aftermath_controlled_effect') {
              throw new V070GameActionError(
                'Resolve the pending shared-timing Aftermath card effect before continuing the Aftermath.',
              );
            }
          """
          new = """  if (state.battleRuntime?.pendingBattleAftermathControlledEffectChoice
                && action.type !== 'resolve_battle_aftermath_controlled_effect'
                && action.type !== 'pass_retribution_asset') {
              throw new V070GameActionError(
                'Resolve the pending shared-timing Aftermath card effect before continuing the Aftermath.',
              );
            }
            if (state.battleRuntime?.pendingRetributionResponse
                && action.type !== 'resolve_retribution_response') {
              throw new V070GameActionError(
                'Resolve the pending Retribution response before continuing the Aftermath.',
              );
            }
          """
          text = replace_once(text, old, new, 'core blockers')

          anchor = """    case 'resolve_battle_aftermath_controlled_effect':
                resolveBattleAftermathControlledEffectChoice(
                  next,
                  action.playerId,
                  action.sourceInstanceId,
                  action.replaceAssetInstanceId,
                );
                break;
          """
          replacement = anchor + """    case 'pass_retribution_asset':
                passRetributionControlledEffect(
                  next,
                  action.playerId,
                  action.assetInstanceId,
                );
                break;
              case 'resolve_retribution_response':
                resolveRetributionResponseInAftermath(
                  next,
                  action.playerId,
                  action.choice,
                  action.assetInstanceId,
                );
                break;
          """
          text = replace_once(text, anchor, replacement, 'core switch')

          text = replace_once(
              text,
              "kind: 'overlay' | 'territory' | 'asset';",
              "kind: 'overlay' | 'territory' | 'asset' | 'retribution';",
              'controlled effect kind',
          )

          old = """function remainingBattleAftermathControlledEffects(
            state: V070GameState,
          ): V070BattleAftermathControlledEffectRef[] {
            const runtime = requireRuntime(state);
            return [
              ...runtime.battleCardAftermathOverlayPlacements.map(placement => ({
                owner: placement.owner,
                sourceInstanceId: placement.sourceInstanceId,
                kind: 'overlay' as const,
              })),
              ...runtime.battleCardAftermathTerritoryInsertions.map(insertion => ({
                owner: insertion.owner,
                sourceInstanceId: insertion.sourceInstanceId,
                kind: 'territory' as const,
              })),
              ...runtime.battleCardAftermathAssetBanks.map(bank => ({
                owner: bank.owner,
                sourceInstanceId: bank.sourceInstanceId,
                kind: 'asset' as const,
              })),
            ];
          }
          """
          new = """function remainingBattleAftermathControlledEffects(
            state: V070GameState,
          ): V070BattleAftermathControlledEffectRef[] {
            const runtime = requireRuntime(state);
            const battle = requireBattle(state);
            return [
              ...runtime.battleCardAftermathOverlayPlacements.map(placement => ({
                owner: placement.owner,
                sourceInstanceId: placement.sourceInstanceId,
                kind: 'overlay' as const,
              })),
              ...runtime.battleCardAftermathTerritoryInsertions.map(insertion => ({
                owner: insertion.owner,
                sourceInstanceId: insertion.sourceInstanceId,
                kind: 'territory' as const,
              })),
              ...runtime.battleCardAftermathAssetBanks.map(bank => ({
                owner: bank.owner,
                sourceInstanceId: bank.sourceInstanceId,
                kind: 'asset' as const,
              })),
              ...v070RetributionEligibleInstanceIds(state, battle.defender)
                .map(sourceInstanceId => ({
                  owner: battle.defender,
                  sourceInstanceId,
                  kind: 'retribution' as const,
                })),
            ];
          }
          """
          text = replace_once(text, old, new, 'remaining controlled effects')

          old = """function applyBattleAftermathControlledEffect(
            state: V070GameState,
            effect: V070BattleAftermathControlledEffectRef,
            replaceAssetInstanceId?: string,
          ): void {
            const runtime = requireRuntime(state);

            if (effect.kind !== 'asset' && replaceAssetInstanceId) {
              throw new V070GameActionError(
                'Asset replacement applies only to an Aftermath effect that banks an Asset.',
              );
            }

            if (effect.kind === 'asset') {
          """
          new = """function applyBattleAftermathControlledEffect(
            state: V070GameState,
            effect: V070BattleAftermathControlledEffectRef,
            immediateWinner: PlayerId | null,
            replaceAssetInstanceId?: string,
          ): void {
            const runtime = requireRuntime(state);

            if (effect.kind !== 'asset' && replaceAssetInstanceId) {
              throw new V070GameActionError(
                'Asset replacement applies only to an Aftermath effect that banks an Asset.',
              );
            }

            if (effect.kind === 'retribution') {
              applyV070RetributionUse(
                state,
                effect.owner,
                effect.sourceInstanceId,
                immediateWinner,
              );
              return;
            }

            if (effect.kind === 'asset') {
          """
          text = replace_once(text, old, new, 'apply controlled effect')

          old = """function battleAftermathControlledEffectNeedsChoice(
            state: V070GameState,
            effect: V070BattleAftermathControlledEffectRef,
          ): boolean {
            return effect.kind === 'asset'
              && v070ResistanceBattleBankNeedsReplacementChoice(
                state,
                effect.owner,
              );
          }
          """
          new = """function battleAftermathControlledEffectNeedsChoice(
            state: V070GameState,
            effect: V070BattleAftermathControlledEffectRef,
          ): boolean {
            if (effect.kind === 'retribution') return true;
            return effect.kind === 'asset'
              && v070ResistanceBattleBankNeedsReplacementChoice(
                state,
                effect.owner,
              );
          }
          """
          text = replace_once(text, old, new, 'choice requirement')

          text = replace_once(
              text,
              "applyBattleAftermathControlledEffect(state, candidates[0]);",
              "applyBattleAftermathControlledEffect(\n        state,\n        candidates[0],\n        immediateWinner,\n      );\n      if (runtime.pendingRetributionResponse) return true;",
              'automatic controlled effect application',
          )

          old = """  applyBattleAftermathControlledEffect(
              state,
              effect,
              replaceAssetInstanceId,
            );
            runtime.battleAftermathControlledEffectNextPlayer =
              nextBattleAftermathControlledEffectPlayer(state, playerId);
            completeAftermathInternal(state, immediateWinner);
          }

          function placeAftermathCard(
          """
          new = """  applyBattleAftermathControlledEffect(
              state,
              effect,
              immediateWinner,
              replaceAssetInstanceId,
            );
            if (runtime.pendingRetributionResponse) return;
            runtime.battleAftermathControlledEffectNextPlayer =
              nextBattleAftermathControlledEffectPlayer(state, playerId);
            completeAftermathInternal(state, immediateWinner);
          }

          function passRetributionControlledEffect(
            state: V070GameState,
            playerId: PlayerId,
            assetInstanceId: string,
          ): void {
            const runtime = requireRuntime(state);
            requireRuntimeStage(runtime, 'aftermath');
            const pending = runtime.pendingBattleAftermathControlledEffectChoice;
            if (!pending
              || pending.playerId !== playerId
              || !pending.candidateSourceInstanceIds.includes(assetInstanceId)
              || state.cardInstances[assetInstanceId]?.cardId !== 'inquisition-retribution'
            ) {
              throw new V070GameActionError(
                'That Retribution is not an eligible shared-timing Aftermath effect.',
              );
            }

            const stillBanked =
              state.players[playerId].zones.assetBank.includes(assetInstanceId);
            if (stillBanked
              && !v070RetributionEligibleInstanceIds(state, playerId)
                .includes(assetInstanceId)) {
              throw new V070GameActionError(
                'That Retribution is no longer eligible to be declined.',
              );
            }

            const immediateWinner = pending.immediateWinner;
            runtime.pendingBattleAftermathControlledEffectChoice = null;
            markV070RetributionProcessed(
              state,
              playerId,
              assetInstanceId,
              stillBanked ? 'declined' : 'negated',
            );
            // Declining an optional effect does not consume this player's one
            // controlled-effect application at the shared timing.
            runtime.battleAftermathControlledEffectNextPlayer = playerId;
            completeAftermathInternal(state, immediateWinner);
          }

          function resolveRetributionResponseInAftermath(
            state: V070GameState,
            playerId: PlayerId,
            choice: 'asset' | 'conviction',
            assetInstanceId?: string,
          ): void {
            const runtime = requireRuntime(state);
            requireRuntimeStage(runtime, 'aftermath');
            const pending = runtime.pendingRetributionResponse;
            if (!pending) {
              throw new V070GameActionError(
                'No Retribution response is pending.',
              );
            }
            const owner = pending.owner;
            const immediateWinner = resolveV070RetributionResponse(
              state,
              playerId,
              choice,
              assetInstanceId,
            );
            runtime.battleAftermathControlledEffectNextPlayer =
              nextBattleAftermathControlledEffectPlayer(state, owner);
            completeAftermathInternal(state, immediateWinner);
          }

          function placeAftermathCard(
          """
          text = replace_once(text, old, new, 'choice resolver and helpers')
          path.write_text(text)

          # --- battle-types.ts ---
          path = Path('src/v070/battle-types.ts')
          text = path.read_text()
          anchor = """  | {
                type: 'apply_fortifications_tactic_limit_asset';
                playerId: PlayerId;
                assetInstanceId: string;
              };
          """
          replacement = """  | {
                type: 'apply_fortifications_tactic_limit_asset';
                playerId: PlayerId;
                assetInstanceId: string;
              }
              | {
                type: 'resolve_battle_aftermath_controlled_effect';
                playerId: PlayerId;
                sourceInstanceId: string;
                replaceAssetInstanceId?: string;
              };
          """
          text = replace_once(text, anchor, replacement, 'Subversion continuation')
          path.write_text(text)

          # --- battle-engine-prewar-bonds.ts ---
          path = Path('src/v070/battle-engine-prewar-bonds.ts')
          text = path.read_text()
          anchor = """import {
            V070_FORTIFICATIONS_ASSET_TEXT,
            applyV070FortificationsAssetTacticLimit,
            markV070FortificationsAssetTacticLimitResolved,
            openV070FortificationsRetreatChoice,
            resolveV070FortificationsRetreatChoice,
            v070FortificationsAssetEligibleInstanceIds,
          } from './fortifications';
          """
          replacement = anchor + """import { V070_RETRIBUTION_ID } from './retribution';
          """
          text = replace_once(text, anchor, replacement, 'prewar import')
          text = replace_once(
              text,
              "const assetEffect = battleAssetEffectForAction(action);",
              "const assetEffect = battleAssetEffectForAction(state, action);",
              'asset effect call',
          )
          old = """function battleAssetEffectForAction(
            action: V070BattleAction,
          ): {
          """
          new = """function battleAssetEffectForAction(
            state: V070GameState,
            action: V070BattleAction,
          ): {
          """
          text = replace_once(text, old, new, 'asset effect signature')
          old = """    case 'use_foothold_asset':
                return {
                  playerId: action.playerId,
                  assetInstanceId: action.assetInstanceId,
                  effectLabel: 'Foothold',
                  deferredAction: action,
                };
              default:
          """
          new = """    case 'use_foothold_asset':
                return {
                  playerId: action.playerId,
                  assetInstanceId: action.assetInstanceId,
                  effectLabel: 'Foothold',
                  deferredAction: action,
                };
              case 'resolve_battle_aftermath_controlled_effect':
                if (state.cardInstances[action.sourceInstanceId]?.cardId !==
                  V070_RETRIBUTION_ID) {
                  return null;
                }
                return {
                  playerId: action.playerId,
                  assetInstanceId: action.sourceInstanceId,
                  effectLabel: 'Retribution',
                  deferredAction: action,
                };
              default:
          """
          text = replace_once(text, old, new, 'Retribution asset action')
          old = """function resumeAfterNegatedBattleAsset(
            state: V070GameState,
            deferredAction: V070SubversionAssetBattleContinuation,
          ): V070GameState {
            if (deferredAction.type === 'use_safe_conduct') {
          """
          new = """function resumeAfterNegatedBattleAsset(
            state: V070GameState,
            deferredAction: V070SubversionAssetBattleContinuation,
          ): V070GameState {
            if (deferredAction.type === 'resolve_battle_aftermath_controlled_effect'
              && state.cardInstances[deferredAction.sourceInstanceId]?.cardId ===
                V070_RETRIBUTION_ID) {
              return reduceV070BattleActionInternal(
                state,
                {
                  type: 'pass_retribution_asset',
                  playerId: deferredAction.playerId,
                  assetInstanceId: deferredAction.sourceInstanceId,
                },
                true,
              );
            }

            if (deferredAction.type === 'use_safe_conduct') {
          """
          text = replace_once(text, old, new, 'negated Retribution continuation')
          path.write_text(text)

          # --- views-core.ts ---
          path = Path('src/v070/views-core.ts')
          text = path.read_text()
          anchor = """export interface V070FortificationsRetreatView {
            playerId: PlayerId;
            sourceInstanceId: string;
          }
          """
          replacement = anchor + """
          export interface V070RetributionResponseView {
            playerId: PlayerId;
            owner: PlayerId;
            sourceInstanceId: string;
            candidateAssetCount: number;
            immediateWinner: PlayerId | null;
            candidateAssetInstanceIds?: string[];
          }
          """
          text = replace_once(text, anchor, replacement, 'view interface')
          anchor = """  pendingFortificationsRetreat:
              V070FortificationsRetreatView | null;
          """
          replacement = anchor + """  pendingRetributionResponse:
              V070RetributionResponseView | null;
          """
          text = replace_once(text, anchor, replacement, 'runtime view field')
          anchor = """    pendingFortificationsRetreat:
              runtime.pendingFortificationsRetreat
                ? {
                    playerId: runtime.pendingFortificationsRetreat.playerId,
                    sourceInstanceId:
                      runtime.pendingFortificationsRetreat.sourceInstanceId,
                  }
                : null,
          """
          replacement = anchor + """    pendingRetributionResponse:
              runtime.pendingRetributionResponse
                ? {
                    playerId: runtime.pendingRetributionResponse.playerId,
                    owner: runtime.pendingRetributionResponse.owner,
                    sourceInstanceId:
                      runtime.pendingRetributionResponse.sourceInstanceId,
                    candidateAssetCount:
                      runtime.pendingRetributionResponse
                        .candidateAssetInstanceIds.length,
                    immediateWinner:
                      runtime.pendingRetributionResponse.immediateWinner,
                    ...(runtime.pendingRetributionResponse.playerId === viewer
                      ? {
                          candidateAssetInstanceIds: [
                            ...runtime.pendingRetributionResponse
                              .candidateAssetInstanceIds,
                          ],
                        }
                      : {}),
                  }
                : null,
          """
          text = replace_once(text, anchor, replacement, 'runtime view mapping')
          path.write_text(text)

          Path('.github/workflows/retribution-integration-patch.yml').unlink()

      - name: Typecheck patched engine
        run: npm run typecheck
      - name: Run existing v0.7.0 battle regression surface
        run: npx vitest run src/v070/battle-decision-views.test.ts src/v070/fortifications.test.ts src/v070/subversion-mission.test.ts
      - name: Commit patched engine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Retribution into Aftermath timing"
          git push origin HEAD:feature/v070-retribution-lifecycle
