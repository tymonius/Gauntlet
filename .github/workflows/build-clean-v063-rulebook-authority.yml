name: Build clean v0.6.3 Rulebook authority

on:
  push:
    branches:
      - agent/clean-v063-rulebook-authority
    paths:
      - scripts/build-clean-v063-rulebook.mjs
      - scripts/validate-clean-v063-rulebook.mjs
      - artifacts/reconstruction/clean-v0.6.2/rulebook/**
      - artifacts/reconstruction/clean-v0.6.2/certification/authority-set.json
      - artifacts/reconstruction/clean-v0.6.3/faction-guides/**
      - docs/Gauntlet_v0.6.3_Shared_Rules_Candidate.md
      - docs/Gauntlet_v0.6.3_General_Card_Rules_Candidate.md
      - docs/Gauntlet_v0.6.3_Card_Language_Normalization.md
      - config/reconstruction-version-plan.json
      - config/reconstruction-version-resolutions.json
      - artifacts/reconstruction/clean-v0.6.3/rulebook/**
      - .github/workflows/build-clean-v063-rulebook-authority.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/build-clean-v063-rulebook.mjs
      - scripts/validate-clean-v063-rulebook.mjs
      - artifacts/reconstruction/clean-v0.6.3/rulebook/**
      - .github/workflows/build-clean-v063-rulebook-authority.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clean-v063-rulebook-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Rulebook reconstruction inputs
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/build-clean-v063-rulebook-authority.yml
            /scripts/build-clean-v063-rulebook.mjs
            /scripts/validate-clean-v063-rulebook.mjs
            /config/reconstruction-version-plan.json
            /config/reconstruction-version-resolutions.json
            /docs/Gauntlet_v0.6.3_Shared_Rules_Candidate.md
            /docs/Gauntlet_v0.6.3_General_Card_Rules_Candidate.md
            /docs/Gauntlet_v0.6.3_Card_Language_Normalization.md
            /artifacts/reconstruction/clean-v0.6.2/rulebook/
            /artifacts/reconstruction/clean-v0.6.2/certification/authority-set.json
            /artifacts/reconstruction/clean-v0.6.3/faction-guides/
            /artifacts/reconstruction/clean-v0.6.3/rulebook/

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check reconstruction scripts
        run: |
          node --check scripts/build-clean-v063-rulebook.mjs
          node --check scripts/validate-clean-v063-rulebook.mjs

      - name: Build Rulebook candidate
        run: node scripts/build-clean-v063-rulebook.mjs

      - name: Validate Rulebook candidate
        run: node scripts/validate-clean-v063-rulebook.mjs

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit deterministic Rulebook candidate
        if: github.event_name == 'push'
        run: |
          git add artifacts/reconstruction/clean-v0.6.3/rulebook
          if git diff --cached --quiet; then
            echo 'Generated Rulebook candidate is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate clean v0.6.3 Rulebook authority candidate'
          git push origin HEAD:${{ github.ref_name }}

      - name: Require committed output on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- artifacts/reconstruction/clean-v0.6.3/rulebook
