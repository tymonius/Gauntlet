name: Materialize Player Guide existing graphics once

on:
  push:
    branches:
      - docs/player-guide-existing-graphics

permissions:
  contents: write
  actions: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[player-guide-existing-graphics]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/player-guide-existing-graphics
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reuse existing rulebook graphics in Player Guide
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function replaceExact(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) throw new Error(`Expected text not found in ${path}`);
            fs.writeFileSync(path, source.replace(before, after));
          }

          replaceExact(
            'rulebook/player-guide/player-guide.md',
            `### Reading a card\n\nThe most important parts of an ordinary card are its **name**, **card value**, and its printed **effects**.\n\nAn effect heading tells you how that part of the card is used. The shared headings you will see most often are:\n`,
            `### Card anatomy\n\nMost ordinary playable cards use the same frame. These are the parts you will refer to most often:\n\n1. **Card name** — The card's title.\n2. **Card value** — Used for Deck construction and whenever an effect refers to a card's value.\n3. **Faction identity** — The border and parchment treatment identify the card's faction. Neutral cards use ivory.\n4. **Artwork** — The card's illustration.\n5. **Effect heading** — Names the effect's role or timing.\n6. **Effect text** — Resolve only the printed effect being used unless a rule says otherwise.\n7. **Metadata footer** — Shows faction at left, **Unique** in the center when applicable, and the rules version at right.\n\n#### Arcane trait mark\n\nSome playable cards show the Mystics sigil immediately before the card name. The symbol marks the **Arcane** trait; its color follows the card's faction identity.\n\n### Effect headings\n\nAn effect heading tells you how that part of the card is used. The shared headings you will see most often are:\n`
          );

          const anatomyPath = 'rulebook/card-anatomy.js';
          let anatomy = fs.readFileSync(anatomyPath, 'utf8');
          anatomy = anatomy
            .replaceAll('src="../card-design/card-print-render.html?', 'src="/card-design/card-print-render.html?')
            .replace(
              `  const content = document.querySelector('[data-rulebook-content]');\n  const heading = content?.querySelector('#card-anatomy');\n  const nextHeading = content?.querySelector('#printed-card-effects');\n`,
              `  const content = document.querySelector('[data-rulebook-content], [data-review-content]');\n  const heading = content?.querySelector('#card-anatomy');\n  const nextHeading = content?.querySelector('#printed-card-effects, #effect-headings');\n`
            )
            .replace(
              `  const content = document.querySelector('[data-rulebook-content]');\n`,
              `  const content = document.querySelector('[data-rulebook-content], [data-review-content]');\n`
            );
          fs.writeFileSync(anatomyPath, anatomy);

          replaceExact(
            'rulebook/player-guide-review/app.js',
            `    decorateHeadings();\n\n    const version = currentGame.displayVersion || currentGame.version || 'current development';\n`,
            `    decorateHeadings();\n    document.dispatchEvent(new CustomEvent('gauntlet:rulebook-rendered', { detail: { surface: 'player-guide-review' } }));\n\n    const version = currentGame.displayVersion || currentGame.version || 'current development';\n`
          );

          replaceExact(
            'rulebook/player-guide-review/index.html',
            `  <link rel="stylesheet" href="../publication.css" />\n  <link rel="stylesheet" href="review.css" />\n`,
            `  <link rel="stylesheet" href="../publication.css" />\n  <link rel="stylesheet" href="../card-anatomy.css" />\n  <link rel="stylesheet" href="review.css" />\n`
          );
          replaceExact(
            'rulebook/player-guide-review/index.html',
            `  <script type="module" src="app.js"></script>\n`,
            `  <script type="module" src="app.js"></script>\n  <script type="module" src="../card-anatomy.js"></script>\n`
          );

          replaceExact(
            'rulebook/card-anatomy.css',
            `.card-anatomy-intro h2 {\n`,
            `.card-anatomy-intro h2,\n.card-anatomy-intro h3 {\n`
          );
          NODE

      - name: Validate publication integration
        run: |
          node scripts/validate-rules-publication-scaffolds.mjs
          node --check rulebook/card-anatomy.js
          node --check rulebook/player-guide-review/app.js
          grep -q '### Card anatomy' rulebook/player-guide/player-guide.md
          grep -q '#### Arcane trait mark' rulebook/player-guide/player-guide.md
          grep -q '../card-anatomy.js' rulebook/player-guide-review/index.html
          grep -q '../card-anatomy.css' rulebook/player-guide-review/index.html

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/materialize-player-guide-existing-graphics-once.yml
          git config user.name 'Gauntlet publication materializer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rulebook/player-guide/player-guide.md rulebook/card-anatomy.js rulebook/card-anatomy.css rulebook/player-guide-review/app.js rulebook/player-guide-review/index.html .github/workflows/materialize-player-guide-existing-graphics-once.yml
          git commit -m 'Reuse existing card anatomy graphics in Player Guide [player-guide-existing-graphics]'
          git push origin HEAD:docs/player-guide-existing-graphics
