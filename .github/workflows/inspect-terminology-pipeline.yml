name: Inspect terminology pipeline

on:
  push:
    branches:
      - agent/terminology-refinement

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/terminology-refinement
      - name: List scripts
        run: |
          echo '=== scripts ==='
          find scripts -maxdepth 3 -type f | sort
          echo '=== canonical data references ==='
          grep -RIn "Gauntlet_v0.6.1_Canonical_Data\|Canonical_Data.json\|faction-guides\|Neutral_Card_Pool" scripts .github/workflows package.json || true
          echo '=== generation commands in workflows ==='
          grep -RInE "python|node|npm run" .github/workflows | head -500 || true
