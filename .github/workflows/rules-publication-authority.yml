name: Rules publication authority

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/game-data/current-game.json'
      - 'packages/game-data/current-game-validation.mjs'
      - 'packages/rules/**'
      - 'config/rules-surface-contract.json'
      - 'config/rules-publication-sources.json'
      - 'config/legacy-rulebook-retirement-crosswalk.json'
      - 'config/legacy-rulebook-retirement-crosswalk.sha256'
      - 'scripts/current-game-authority.mjs'
      - 'scripts/render-comprehensive-rules.mjs'
      - 'scripts/validate-rules-term-registry.mjs'
      - 'scripts/validate-faction-rules-authority.mjs'
      - 'scripts/validate-shared-rules-authority.mjs'
      - 'scripts/validate-rules-publication-contract.mjs'
      - 'scripts/validate-rules-publication-scaffolds.mjs'
      - 'scripts/validate-legacy-rulebook-retirement-crosswalk.mjs'
      - 'rulebook/player-facing/current-rulebook.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules-publication-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout rules authority contract inputs
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /config/rules-surface-contract.json
            /config/rules-publication-sources.json
            /config/legacy-rulebook-retirement-crosswalk.json
            /config/legacy-rulebook-retirement-crosswalk.sha256
            /packages/game-data/current-game.json
            /packages/game-data/current-game-validation.mjs
            /packages/game-data/art-direction.mjs
            /packages/rules/
            /scripts/current-game-authority.mjs
            /scripts/render-comprehensive-rules.mjs
            /scripts/validate-rules-term-registry.mjs
            /scripts/validate-faction-rules-authority.mjs
            /scripts/validate-shared-rules-authority.mjs
            /scripts/validate-rules-publication-contract.mjs
            /scripts/validate-rules-publication-scaffolds.mjs
            /scripts/validate-legacy-rulebook-retirement-crosswalk.mjs
            /rulebook/player-facing/rule-facts.js
            /rulebook/player-facing/current-rulebook.md

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate rules publication authority
        run: |
          node scripts/validate-rules-publication-contract.mjs
          node scripts/validate-rules-publication-scaffolds.mjs
          node scripts/validate-faction-rules-authority.mjs
          node scripts/validate-shared-rules-authority.mjs
          node scripts/validate-rules-term-registry.mjs
          node scripts/validate-legacy-rulebook-retirement-crosswalk.mjs
          node scripts/render-comprehensive-rules.mjs
