name: Rules Arbiter Margin Loan follow-up probe

on:
  push:
    branches:
      - ops/rules-arbiter-margin-loan-followup-probe
    paths:
      - '.github/workflows/rules-arbiter-margin-loan-followup-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current ledger and contextual retrieval
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { buildRulesCorpus, retrieveRules } from './rules-assistant/local-search.js';
          import { contextualQuery, augmentRetrievalForContext, BEHAVIOR_REVISION } from './rules-assistant/worker-v071.js';
          import { V071_CANONICAL_SOURCE_PATH, V071_RULEBOOK_SOURCE_PATH } from './rules-assistant/v071-public-corpus.js';

          const ledger = JSON.parse(fs.readFileSync('artifacts/rules-refinement/resolution-ledger.json', 'utf8'));
          const target = '8fadc98d-e870-4ee5-b35f-a45422b02729';
          console.log('=== LEDGER MATCHES ===');
          console.log(JSON.stringify(ledger.entries.filter(entry => (entry.interactionIds || []).includes(target)), null, 2));

          const canonicalData = JSON.parse(fs.readFileSync(V071_CANONICAL_SOURCE_PATH, 'utf8'));
          const rulebookMarkdown = fs.readFileSync(V071_RULEBOOK_SOURCE_PATH, 'utf8');
          const corpus = buildRulesCorpus({ canonicalData, rulebookMarkdown, siteOrigin: 'https://gauntlet.run' });
          const opening = "I use Margin Loan's Battle effect, place a card beneath it as collateral, and then withdraw from the battle. What happens to Margin Loan and the collateral?";
          const history = [
            { role: 'user', content: opening },
            { role: 'assistant', content: 'If your withdrawal means you do not win the battle, in the Aftermath put Margin Loan and its collateral in your Graveyard. If you still win, return the collateral to your Hand.', rulingStatus: 'explicit' }
          ];
          const question = 'What if I win instead?';
          const query = contextualQuery(question, history);
          let results = retrieveRules(corpus, query, { limit: 10, excerptLength: 1400 });
          results = augmentRetrievalForContext(corpus, question, history, results);
          console.log('=== BEHAVIOR REVISION ===');
          console.log(BEHAVIOR_REVISION);
          console.log('=== CONTEXTUAL QUERY ===');
          console.log(query);
          console.log('=== RETRIEVAL ===');
          console.log(JSON.stringify(results.map(({ canonicalId, score, title, body }) => ({ canonicalId, score, title, body })), null, 2));
          NODE
