name: Test homepage developer tools

# This is a focused visual regression harness for the developer-tools disclosure,
# not a general homepage rollout gate. Run it when that component is intentionally changed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  developer-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Serve repository
        run: python3 -m http.server 8000 >/tmp/gauntlet-http.log 2>&1 &

      - name: Verify collapsed and expanded developer tools
        run: npx vitest run tests/homepage-developer-tools.test.ts
