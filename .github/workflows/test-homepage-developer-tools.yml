name: Test homepage developer tools

on:
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "site.css"
      - "tests/homepage-developer-tools.test.ts"
      - ".github/workflows/test-homepage-developer-tools.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-homepage-developer-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  developer-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Serve repository
        run: python3 -m http.server 8000 >/tmp/gauntlet-http.log 2>&1 &

      - name: Verify collapsed and expanded developer tools
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const origin = 'http://127.0.0.1:8000';
          const cases = [
            { name: 'desktop', viewport: { width: 1280, height: 900 } },
            { name: 'mobile', viewport: { width: 390, height: 844 } }
          ];

          for (const item of cases) {
            const context = await browser.newContext({ viewport: item.viewport });
            const page = await context.newPage();
            await page.goto(origin, { waitUntil: 'domcontentloaded' });
            const disclosure = page.locator('details.developer-tools');
            await disclosure.scrollIntoViewIfNeeded();

            if (await disclosure.evaluate(node => node.open)) throw new Error(`${item.name}: disclosure was open by default`);
            if (!await page.getByText('Developer Tools', { exact: true }).isVisible()) throw new Error(`${item.name}: summary label missing`);

            await page.locator('#tools').screenshot({ path: `/tmp/developer-tools-${item.name}-collapsed.png` });
            await disclosure.locator('summary').click();
            if (!await disclosure.evaluate(node => node.open)) throw new Error(`${item.name}: disclosure did not open`);

            const links = disclosure.locator('.developer-tool-link');
            if (await links.count() !== 3) throw new Error(`${item.name}: expected three operational links`);
            const hrefs = await links.evaluateAll(nodes => nodes.map(node => node.href));
            const expected = [
              'https://gauntlet-rules-assistant.tymon-scott.workers.dev/admin',
              `${origin}/playtest/analysis/`,
              `${origin}/playtest/host/`
            ];
            if (JSON.stringify(hrefs) !== JSON.stringify(expected)) throw new Error(`${item.name}: unexpected links ${JSON.stringify(hrefs)}`);

            const boxes = await links.evaluateAll(nodes => nodes.map(node => {
              const box = node.getBoundingClientRect();
              return { top: Math.round(box.top), left: Math.round(box.left), width: Math.round(box.width) };
            }));
            if (item.name === 'desktop' && new Set(boxes.map(box => box.top)).size !== 1) {
              throw new Error(`desktop: links did not remain in one row ${JSON.stringify(boxes)}`);
            }
            if (item.name === 'mobile' && !(boxes[0].top < boxes[1].top && boxes[1].top < boxes[2].top)) {
              throw new Error(`mobile: links did not stack ${JSON.stringify(boxes)}`);
            }

            await page.locator('#tools').screenshot({ path: `/tmp/developer-tools-${item.name}-expanded.png` });
            await context.close();
          }

          const noScriptContext = await browser.newContext({ javascriptEnabled: false, viewport: { width: 900, height: 800 } });
          const noScriptPage = await noScriptContext.newPage();
          await noScriptPage.goto(origin, { waitUntil: 'domcontentloaded' });
          const noScriptDisclosure = noScriptPage.locator('details.developer-tools');
          await noScriptDisclosure.locator('summary').click();
          if (!await noScriptDisclosure.evaluate(node => node.open)) throw new Error('Native disclosure requires JavaScript');
          await noScriptContext.close();
          await browser.close();
          NODE

      - name: Upload homepage screenshots
        uses: actions/upload-artifact@v4
        with:
          name: homepage-developer-tools-screenshots
          path: /tmp/developer-tools-*.png
          if-no-files-found: error
