name: Audit v0.6.1 generation path

on:
  push:
    branches:
      - agent/distinguish-actions-opportunities
    paths:
      - .github/workflows/audit-v061-generation.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Record source and generation commands
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p tmp
          {
            printf '%s\n' '=== workflows ==='
            find .github/workflows -maxdepth 1 -type f -print | sort
            printf '%s\n' '=== workflow generation commands ==='
            grep -R -n -E 'normalize_v061|sync_v061|generate.*v0\.6\.1|generate-v061|canonical|source' .github/workflows || true
            printf '%s\n' '=== scripts matching v061 ==='
            find scripts -maxdepth 1 -type f -print | sort | grep -E 'v061|v0\.6\.1|canonical|faction|rulebook' || true
            printf '%s\n' '=== source governance references ==='
            grep -R -n -E 'definitive v0\.6\.1|governed|canonical source|source of truth' docs releases/v0.6.1 scripts .github/workflows | head -n 500 || true
          } > tmp/v061-generation-audit.txt
          git add -f tmp/v061-generation-audit.txt
          git rm .github/workflows/audit-v061-generation.yml
          git commit -m "Record v0.6.1 generation audit"
          git push origin HEAD:agent/distinguish-actions-opportunities
