name: Rules Arbiter Fog opponent-control probe

on:
  push:
    branches:
      - ops/rules-arbiter-fog-opponent-control-probe
    paths:
      - '.github/workflows/rules-arbiter-fog-opponent-control-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production session and audit
        shell: bash
        run: |
          set -euo pipefail
          echo '=== SESSION ==='
          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant --remote --config rules-assistant/wrangler.toml --json --command "SELECT id, session_id, previous_interaction_id, sequence_index, created_at, question, answer, game_version, ruling_status, ruling_status_v2, confidence, source_count, feedback_rating, review_status, issue_types_json, reviewer_notes, resolution FROM rules_interactions WHERE session_id = '857c7adf-adfb-468e-b75a-7031db22e9d5' ORDER BY sequence_index, created_at"
          echo '=== AUDIT ==='
          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant --remote --config rules-assistant/wrangler.toml --json --command "SELECT * FROM rules_interaction_audits WHERE interaction_id = '254cb085-3f0e-4a5d-853e-036568dedd1f'"
          echo '=== AUDIT HISTORY ==='
          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant --remote --config rules-assistant/wrangler.toml --json --command "SELECT * FROM rules_interaction_audit_history WHERE interaction_id = '254cb085-3f0e-4a5d-853e-036568dedd1f' ORDER BY reviewed_at"
      - name: Inspect current ledger and retrieval
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { buildRulesCorpus, retrieveRules } from './rules-assistant/local-search.js';
          import { contextualQuery, augmentRetrievalForContext, BEHAVIOR_REVISION } from './rules-assistant/worker-v071.js';
          import { V071_CANONICAL_SOURCE_PATH, V071_RULEBOOK_SOURCE_PATH } from './rules-assistant/v071-public-corpus.js';
          const target = '254cb085-3f0e-4a5d-853e-036568dedd1f';
          const ledger = JSON.parse(fs.readFileSync('artifacts/rules-refinement/resolution-ledger.json', 'utf8'));
          console.log('=== LEDGER MATCHES ===');
          console.log(JSON.stringify(ledger.entries.filter(entry => (entry.interactionIds || []).includes(target)), null, 2));
          const canonicalData = JSON.parse(fs.readFileSync(V071_CANONICAL_SOURCE_PATH, 'utf8'));
          const rulebookMarkdown = fs.readFileSync(V071_RULEBOOK_SOURCE_PATH, 'utf8');
          const corpus = buildRulesCorpus({ canonicalData, rulebookMarkdown, siteOrigin: 'https://gauntlet.run' });
          const question = 'What if the opponent controls fog of war';
          let results = retrieveRules(corpus, question, { limit: 10, excerptLength: 1400 });
          results = augmentRetrievalForContext(corpus, question, [], results);
          console.log('=== BEHAVIOR REVISION ===');
          console.log(BEHAVIOR_REVISION);
          console.log('=== RETRIEVAL ===');
          console.log(JSON.stringify(results.map(({ canonicalId, score, title, body }) => ({ canonicalId, score, title, body })), null, 2));
          NODE
