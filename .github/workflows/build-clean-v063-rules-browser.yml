name: Build clean v0.6.3 Rules Browser

on:
  push:
    branches:
      - agent/rebuild-clean-v063-rules-browser
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-clean-v063-rules-browser.yml'
      - 'scripts/build-clean-v063-rules-browser.mjs'
      - 'scripts/validate-clean-v063-rules-browser.mjs'
      - 'artifacts/reconstruction/clean-v0.6.3/rules-browser/**'
      - 'artifacts/reconstruction/clean-v0.6.3/rulebook/**'
      - 'artifacts/reconstruction/clean-v0.6.3/certification/**'
      - 'artifacts/reconstruction/clean-v0.6.3/downstream/**'
      - 'config/release-lifecycle.json'
      - 'rulebook/app.js'
      - 'rulebook/markdown.js'
      - 'rulebook/styles.css'
      - 'rulebook/publication.css'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clean-v063-rules-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Rules Browser reconstruction inputs
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/build-clean-v063-rules-browser.yml
            /scripts/build-clean-v063-rules-browser.mjs
            /scripts/validate-clean-v063-rules-browser.mjs
            /config/release-lifecycle.json
            /artifacts/reconstruction/clean-v0.6.3/certification/
            /artifacts/reconstruction/clean-v0.6.3/rulebook/
            /artifacts/reconstruction/clean-v0.6.3/downstream/
            /artifacts/reconstruction/clean-v0.6.3/rules-browser/
            /rulebook/app.js
            /rulebook/markdown.js
            /rulebook/styles.css
            /rulebook/publication.css

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check Rules Browser scripts
        run: |
          node --check scripts/build-clean-v063-rules-browser.mjs
          node --check scripts/validate-clean-v063-rules-browser.mjs

      - name: Build clean v0.6.3 Rules Browser
        run: node scripts/build-clean-v063-rules-browser.mjs

      - name: Syntax-check generated browser JavaScript
        run: |
          node --check artifacts/reconstruction/clean-v0.6.3/rules-browser/app.js
          node --check artifacts/reconstruction/clean-v0.6.3/rules-browser/markdown.js

      - name: Validate clean v0.6.3 Rules Browser
        run: node scripts/validate-clean-v063-rules-browser.mjs

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit deterministic Rules Browser reconstruction
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/reconstruction/clean-v0.6.3/rules-browser
          if git diff --cached --quiet; then
            echo 'Rules Browser reconstruction already materialized.'
          else
            git commit -m 'Materialize clean v0.6.3 Rules Browser'
            git push
          fi

      - name: Require committed Rules Browser outputs on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- artifacts/reconstruction/clean-v0.6.3/rules-browser
