name: Apply Counterworks continuation fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 1625
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v070-reveal-parity-tranche
          fetch-depth: 1
      - name: Repair outer reveal continuation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path('src/v070/battle-engine-pre-accusation.ts')
          text = engine.read_text()
          old = """  const next = reduceV070BattleActionRevealOrder(\n    state,\n    action as V070RevealOrderBattleAction,\n  );\n  finalizeOuterBattleTransition(state, next);\n  return next;\n"""
          new = """  const next = reduceV070BattleActionRevealOrder(\n    state,\n    action as V070RevealOrderBattleAction,\n  );\n  continueV070BattleRevealProcedure(next);\n  finalizeOuterBattleTransition(state, next);\n  return next;\n"""
          if old in text:
              engine.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('Expected outer battle transition block was not found.')

          test = Path('src/v070/counterworks-battle.test.ts')
          text = test.read_text()
          old = "expect(state.battleRuntime?.stage).toBe('reveal_gambits');"
          new = "expect(state.battleRuntime?.stage).toBe('choose_tactics');"
          if old in text:
              test.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('Expected Counterworks stage assertion was not found.')
          PY
          if git diff --quiet -- src/v070/battle-engine-pre-accusation.ts src/v070/counterworks-battle.test.ts; then
            exit 0
          fi
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add src/v070/battle-engine-pre-accusation.ts src/v070/counterworks-battle.test.ts
          git commit -m 'Resume outer reveal choices after normal battle actions'
          git push origin HEAD:feature/v070-reveal-parity-tranche
