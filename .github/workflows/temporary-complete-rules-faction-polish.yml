name: Temporary Complete Rules faction polish

on:
  push:
    branches:
      - rules/complete-rules-faction-readability

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: rules/complete-rules-faction-readability
          fetch-depth: 1

      - name: Polish and regenerate Complete Rules
        run: |
          node scripts/temporary-polish-comprehensive-factions.mjs
          node scripts/render-comprehensive-rules.mjs --write

      - name: Remove temporary tooling and commit
        run: |
          rm .github/workflows/temporary-complete-rules-faction-polish.yml
          rm scripts/temporary-polish-comprehensive-factions.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish Complete Rules faction prose"
          git push origin HEAD:rules/complete-rules-faction-readability
