name: Materialize Final Legacy Provenance Batch

on:
  pull_request:
    paths:
      - .github/workflows/materialize-final-legacy-provenance-branch.yml
      - .github/asset-provenance-remediation.json
      - .github/asset-provenance.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Append owner-attested remediation families
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.github/asset-provenance-remediation.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('version') != 2 or not isinstance(data.get('batches'), list):
              raise SystemExit('expected version 2 remediation manifest')

          checkpoint = 'c9298f61c4a1d734b7652d6b262d67b22fee71d6'
          openai_rights = (
              "Project use authorized by Tymon Scott. OpenAI Terms of Use assign to the user "
              "OpenAI's right, title, and interest, if any, in Output, to the extent permitted by "
              "applicable law (https://openai.com/policies/terms-of-use/). This record does not "
              "assert copyrightability, uniqueness, or absence of third-party rights."
          )

          batches = [
              {
                  'id': '3d-2d-reference-assets-owner-attestation-2026-09-05',
                  'description': '2D character references and turnaround assets used in the Gauntlet 3D workflow.',
                  'defaults': {
                      'origin': 'project-created',
                      'creator': 'Tymon Scott / Gauntlet project, using OpenAI-generated source imagery',
                      'source': (
                          'Direct project-owner attestation on 2026-09-05: all 2D turnaround/reference assets in '
                          'images/3d/2d assets/ were created through OpenAI/ChatGPT image generation under Tymon '
                          "Scott's direction; some repository files were then manually cropped or repositioned by "
                          'Tymon in Adobe Photoshop. The corpus includes generated originals, extracted views, '
                          'turnarounds, and project-edited variants.'
                      ),
                      'rights': openai_rights + ' Manual Photoshop cropping/repositioning is project-authored derivative editing.',
                      'notes': 'Classified as project-created at corpus level because some exact repository binaries include manual Photoshop edits to generated source imagery.'
                  },
                  'evidence_basis': {
                      'project_owner_attestation': 'Gauntlet project conversation, 2026-09-05.',
                      'identity_commit': checkpoint,
                      'rights_reference': 'https://openai.com/policies/terms-of-use/'
                  },
                  'asset_prefixes': ['images/3d/2d assets/']
              },
              {
                  'id': 'reference-reserve-artwork-owner-attestation-2026-09-05',
                  'description': 'Gauntlet environment, faction, leader, and reserve/reference artwork.',
                  'defaults': {
                      'origin': 'generated',
                      'creator': 'OpenAI image generation, directed and selected by Tymon Scott',
                      'source': (
                          'Direct project-owner attestation on 2026-09-05 that the remaining reference/reserve '
                          'artwork was generated through OpenAI/ChatGPT image generation under Tymon Scott\'s direction.'
                      ),
                      'rights': openai_rights
                  },
                  'evidence_basis': {
                      'project_owner_attestation': 'Gauntlet project conversation, 2026-09-05.',
                      'identity_commit': checkpoint,
                      'rights_reference': 'https://openai.com/policies/terms-of-use/'
                  },
                  'asset_prefixes': ['images/artwork/reference/']
              },
              {
                  'id': 'hero-sketches-owner-attestation-2026-09-05',
                  'description': 'Historical Gauntlet hero sketch and hero-plate artwork outside the accepted leader-design-sheet batch.',
                  'defaults': {
                      'origin': 'generated',
                      'creator': 'OpenAI image generation, directed and selected by Tymon Scott',
                      'source': 'Direct project-owner attestation on 2026-09-05 that these remaining sketch/hero assets were generated through OpenAI/ChatGPT under Tymon Scott\'s direction.',
                      'rights': openai_rights
                  },
                  'evidence_basis': {
                      'project_owner_attestation': 'Gauntlet project conversation, 2026-09-05.',
                      'identity_commit': checkpoint,
                      'rights_reference': 'https://openai.com/policies/terms-of-use/'
                  },
                  'assets': [
                      {'path': 'images/sketches/hero sketch.png'},
                      {'path': 'images/sketches/hero-plates/alchemist-executive-ambassador.png'},
                      {'path': 'images/sketches/hero-plates/ranger-commandant-senator.png'},
                      {'path': 'images/sketches/hero-plates/witch-hunter-banker-spymaster.png'},
                      {'path': 'images/sketches/hero-sketches/hero sketch 2.png'},
                      {'path': 'images/sketches/hero-sketches/hero sketch 3.png'},
                      {'path': 'images/sketches/hero-sketches/hero sketch 4.png'},
                      {'path': 'images/sketches/hero-sketches/hero sketch.png'}
                  ]
              },
              {
                  'id': 'diplomats-wax-seal-owner-attestation-2026-09-05',
                  'description': 'Diplomats supplemental Ratified wax-seal artwork.',
                  'defaults': {
                      'origin': 'generated',
                      'creator': 'OpenAI image generation, directed and selected by Tymon Scott',
                      'source': 'Direct project-owner attestation on 2026-09-05 that the Diplomats wax-seal image was generated through OpenAI/ChatGPT under Tymon Scott\'s direction.',
                      'rights': openai_rights
                  },
                  'evidence_basis': {
                      'project_owner_attestation': 'Gauntlet project conversation, 2026-09-05.',
                      'identity_commit': checkpoint,
                      'rights_reference': 'https://openai.com/policies/terms-of-use/'
                  },
                  'assets': [{'path': 'images/artwork/supplemental/diplomats/ratified-wax-seal.webp'}]
              },
              {
                  'id': 'faction-symbol-candidates-owner-attestation-2026-09-05',
                  'description': 'Historical/candidate Military faction-symbol artwork.',
                  'defaults': {
                      'origin': 'generated',
                      'creator': 'OpenAI image generation, directed and selected by Tymon Scott',
                      'source': 'Direct project-owner attestation on 2026-09-05 that the historical faction-symbol candidates were made through OpenAI/ChatGPT under Tymon Scott\'s direction.',
                      'rights': openai_rights,
                      'notes': 'These are historical/candidate assets, distinct from the six active faction symbols whose final SVGs include Tymon Scott\'s Illustrator cleanup.'
                  },
                  'evidence_basis': {
                      'project_owner_attestation': 'Gauntlet project conversation, 2026-09-05.',
                      'identity_commit': checkpoint,
                      'rights_reference': 'https://openai.com/policies/terms-of-use/'
                  },
                  'asset_prefixes': ['images/faction-symbols/candidates/']
              },
              {
                  'id': 'chief-justice-art-owner-attestation-2026-09-05',
                  'description': 'Chief Justice / Rules Arbiter imagery.',
                  'defaults': {
                      'origin': 'generated',
                      'creator': 'OpenAI image generation, directed and selected by Tymon Scott',
                      'source': 'Direct project-owner attestation on 2026-09-05 that the Chief Justice / Rules Arbiter images were made through OpenAI/ChatGPT under Tymon Scott\'s direction.',
                      'rights': openai_rights
                  },
                  'evidence_basis': {
                      'project_owner_attestation': 'Gauntlet project conversation, 2026-09-05.',
                      'identity_commit': checkpoint,
                      'rights_reference': 'https://openai.com/policies/terms-of-use/'
                  },
                  'asset_prefixes': ['images/rules-arbiter/']
              },
              {
                  'id': 'remaining-site-art-owner-attestation-2026-09-05',
                  'description': 'Remaining Gauntlet site artwork not covered by the command-tent showcase batch.',
                  'defaults': {
                      'origin': 'generated',
                      'creator': 'OpenAI image generation, directed and selected by Tymon Scott',
                      'source': 'Direct project-owner attestation on 2026-09-05 that the remaining site images were made through OpenAI/ChatGPT under Tymon Scott\'s direction.',
                      'rights': openai_rights
                  },
                  'evidence_basis': {
                      'project_owner_attestation': 'Gauntlet project conversation, 2026-09-05.',
                      'identity_commit': checkpoint,
                      'rights_reference': 'https://openai.com/policies/terms-of-use/'
                  },
                  'assets': [
                      {'path': 'images/artwork/site/gauntlet-tts-playtest-table.webp'},
                      {'path': 'images/artwork/site/homepage-hero-three-leaders.webp'}
                  ]
              },
              {
                  'id': 'social-preview-composite-owner-attestation-2026-09-05',
                  'description': 'Gauntlet social-preview composite assembled from generated Gauntlet imagery.',
                  'defaults': {
                      'origin': 'project-created',
                      'creator': 'OpenAI/ChatGPT compositing under Tymon Scott\'s direction',
                      'source': (
                          'Direct project-owner attestation on 2026-09-05 that the social image was composited from '
                          'other images generated through OpenAI/ChatGPT under Tymon Scott\'s direction. Repository '
                          'PR #364 (https://github.com/tymonius/Gauntlet/pull/364) independently documents the social '
                          'preview artwork and notes that a temporary image-generation workflow produced the committed asset.'
                      ),
                      'rights': openai_rights + ' The final composition is a project-created arrangement of those generated Gauntlet inputs.'
                  },
                  'evidence_basis': {
                      'project_owner_attestation': 'Gauntlet project conversation, 2026-09-05.',
                      'repository_history': 'PR #364, Add social preview metadata and artwork.',
                      'identity_commit': checkpoint,
                      'rights_reference': 'https://openai.com/policies/terms-of-use/'
                  },
                  'assets': [{'path': 'images/social/gauntlet-og-1200x630-v2.jpg'}]
              }
          ]

          existing_ids = {batch.get('id') for batch in data['batches']}
          for batch in batches:
              if batch['id'] not in existing_ids:
                  data['batches'].append(batch)
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Materialize and validate
        run: |
          python .github/scripts/materialize-asset-provenance.py --write
          python .github/scripts/validate-asset-provenance.py

      - name: Commit manifest and ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/asset-provenance-remediation.json .github/asset-provenance.json
          if git diff --cached --quiet; then
            echo "No materialization changes."
          else
            git commit -m "Materialize final owner-attested asset provenance"
            git push origin HEAD:${{ github.head_ref }}
          fi
