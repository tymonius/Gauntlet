name: Verify Final Legacy Provenance Inventory

on:
  pull_request:
    paths:
      - .github/workflows/materialize-final-legacy-provenance-branch.yml
      - .github/asset-provenance-remediation.json
      - .github/asset-provenance.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Verify materialized provenance
        run: |
          python .github/scripts/materialize-asset-provenance.py --check
          python .github/scripts/validate-asset-provenance.py

      - name: Inventory current governed assets
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          policy = json.loads(pathlib.Path('.github/asset-provenance.json').read_text(encoding='utf-8'))
          rules = policy['policy']
          baseline = policy['baseline_commit']
          extensions = {ext.lower() for ext in rules['extensions']}
          ignored = tuple(p.rstrip('/') for p in rules.get('ignored_paths', []))
          recorded = {record['path'] for record in policy.get('assets', [])}

          def git(*args):
              return subprocess.run(
                  ['git', *args], check=True, text=True,
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE
              ).stdout.strip()

          def ignored_path(path):
              return any(path == prefix or path.startswith(prefix + '/') for prefix in ignored)

          governed = set()
          for root in rules['governed_roots']:
              for rel in git('ls-files', '--', root).splitlines():
                  if rel and not ignored_path(rel) and pathlib.Path(rel).suffix.lower() in extensions:
                      governed.add(rel)

          unresolved = []
          anomalies = []
          for rel in sorted(governed - recorded):
              present = subprocess.run(
                  ['git', 'cat-file', '-e', f'{baseline}:{rel}'],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
              ).returncode == 0
              if not present:
                  anomalies.append((rel, 'not present at baseline'))
                  continue
              if git('rev-parse', f'{baseline}:{rel}') != git('hash-object', rel):
                  anomalies.append((rel, 'changed from baseline'))
                  continue
              unresolved.append(rel)

          print(f'GOVERNED={len(governed)} EXPLICIT={len(recorded)} UNRESOLVED={len(unresolved)} ANOMALIES={len(anomalies)}')
          print('UNRESOLVED PATHS')
          for rel in unresolved:
              print(rel)
          if anomalies:
              print('ANOMALIES')
              for rel, reason in anomalies:
                  print(f'{rel}: {reason}')
          PY
