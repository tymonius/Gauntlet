name: v0.7.2 candidate Rules Arbiter regression replay

on:
  push:
    branches:
      - main
    paths:
      - ".github/qa-triggers/v072-candidate-regression-20260921.txt"
      - ".github/qa-triggers/v072-candidate-polarity-probe-20260922.txt"
  workflow_dispatch:
    inputs:
      confirm_paid_api:
        description: I understand this workflow makes paid OpenAI API calls
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  classify-run:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.value }}
    steps:
      - name: Checkout trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Classify requested QA mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=regression" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Fxq ".github/qa-triggers/v072-candidate-polarity-probe-20260922.txt"; then
            echo "value=polarity-probe" >> "$GITHUB_OUTPUT"
          else
            echo "value=regression" >> "$GITHUB_OUTPUT"
          fi

  candidate-regression-replay:
    needs: classify-run
    if: needs.classify-run.outputs.mode == 'regression'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_RULES_VERSION: v0.7.2-candidate
      EXPECTED_BEHAVIOR_REVISION: v072-qa-20260921-01
      EXPECTED_AUTHORITY_SET: faacd55458ec1595f480798449033a2c8705e018d828ae8034c5fe2b2a6f35b0
      RULES_ENDPOINT: https://gauntlet-rules-assistant.tymon-scott.workers.dev/api/v072-candidate/rules
      HEALTH_ENDPOINT: https://gauntlet-rules-assistant.tymon-scott.workers.dev/api/v072-candidate/health
      CORPUS_HEALTH_ENDPOINT: https://gauntlet-rules-assistant.tymon-scott.workers.dev/api/v072-candidate/corpus-health
      BENCHMARK: rules-assistant/evals/rules-arbiter-v072-candidate-regression-replay.json
      CORRECTIONS: rules-assistant/evals/rules-arbiter-v072-candidate-regression-replay-corrections.json
      CLARIFICATION_BENCHMARK: rules-assistant/evals/rules-arbiter-v072-candidate-clarification-replay.json
      REPORT: artifacts/rules-qa/v072-candidate-regression-replay.json
      CLARIFICATION_REPORT: artifacts/rules-qa/v072-candidate-regression-replay-clarifications.json

    steps:
      - name: Require paid-API confirmation for manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.confirm_paid_api }}" != "true" ]; then
            echo "Paid API confirmation was not provided."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify pinned live candidate before paid calls
        run: |
          node <<'NODE'
          const expectedVersion = process.env.EXPECTED_RULES_VERSION;
          const expectedRevision = process.env.EXPECTED_BEHAVIOR_REVISION;
          const expectedAuthority = process.env.EXPECTED_AUTHORITY_SET;

          const healthResponse = await fetch(process.env.HEALTH_ENDPOINT, { cache: "no-store" });
          const health = healthResponse.ok ? await healthResponse.json() : null;
          if (
            !healthResponse.ok
            || health?.ok !== true
            || health?.version !== expectedVersion
            || health?.behaviorRevision !== expectedRevision
            || health?.published !== false
            || health?.currentPublicRelease !== "v0.7.1"
          ) {
            console.error("Live v0.7.2 candidate health does not match the frozen replay target. No paid QA calls were made.");
            console.error(JSON.stringify(health));
            process.exit(1);
          }

          const corpusResponse = await fetch(process.env.CORPUS_HEALTH_ENDPOINT, { cache: "no-store" });
          const corpus = corpusResponse.ok ? await corpusResponse.json() : null;
          if (
            !corpusResponse.ok
            || corpus?.ok !== true
            || corpus?.version !== expectedVersion
            || corpus?.behaviorRevision !== expectedRevision
            || corpus?.authoritySetId !== expectedAuthority
          ) {
            console.error("Live v0.7.2 candidate corpus does not match the frozen replay target. No paid QA calls were made.");
            console.error(JSON.stringify(corpus));
            process.exit(1);
          }

          console.log(`Pinned candidate verified: ${expectedVersion} / ${expectedRevision} / ${expectedAuthority}`);
          NODE

      - name: Collect candidate regression answers
        id: collect
        continue-on-error: true
        env:
          GAUNTLET_RULES_QA_ENDPOINT: ${{ env.RULES_ENDPOINT }}
          GAUNTLET_RULES_QA_BENCHMARK: ${{ env.BENCHMARK }}
          GAUNTLET_RULES_QA_CORRECTIONS: ${{ env.CORRECTIONS }}
          GAUNTLET_RULES_QA_OUTPUT: ${{ env.REPORT }}
          GAUNTLET_RULES_QA_LIMIT: "0"
          GAUNTLET_RULES_QA_CONCURRENCY: "1"
          GAUNTLET_RULES_QA_TIMEOUT_MS: "45000"
          GAUNTLET_RULES_QA_MAX_ATTEMPTS: "4"
          GAUNTLET_RULES_QA_INTER_CASE_DELAY_MS: "750"
          GAUNTLET_RULES_QA_USE_GITHUB_OIDC: "true"
        run: node scripts/run-v071-live-rules-qa.mjs

      - name: Grade candidate regression semantics
        id: semantic
        continue-on-error: true
        env:
          GAUNTLET_RULES_QA_BENCHMARK: ${{ env.BENCHMARK }}
          GAUNTLET_RULES_QA_SEMANTIC_INPUT: ${{ env.REPORT }}
          GAUNTLET_RULES_QA_SEMANTIC_OUTPUT: ${{ env.REPORT }}
          GAUNTLET_RULES_QA_SEMANTIC_ONLY: "true"
          GAUNTLET_RULES_QA_TIMEOUT_MS: "45000"
          GAUNTLET_RULES_QA_MAX_ATTEMPTS: "4"
          GAUNTLET_RULES_QA_USE_GITHUB_OIDC: "true"
        run: node scripts/run-v071-semantic-rules-qa.mjs

      - name: Replay ambiguity confirmations
        id: clarification
        continue-on-error: true
        env:
          GAUNTLET_RULES_QA_ENDPOINT: ${{ env.RULES_ENDPOINT }}
          GAUNTLET_RULES_CLARIFICATION_BENCHMARK: ${{ env.CLARIFICATION_BENCHMARK }}
          GAUNTLET_RULES_CLARIFICATION_OUTPUT: ${{ env.CLARIFICATION_REPORT }}
          GAUNTLET_RULES_QA_TIMEOUT_MS: "45000"
          GAUNTLET_RULES_QA_MAX_ATTEMPTS: "4"
          GAUNTLET_RULES_QA_USE_GITHUB_OIDC: "true"
        run: node scripts/run-v071-gate3-clarification-qa.mjs

      - name: Upload candidate regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v072-candidate-rules-arbiter-regression-replay
          path: |
            ${{ env.REPORT }}
            ${{ env.CLARIFICATION_REPORT }}
          if-no-files-found: error
          retention-days: 30

      - name: Enforce candidate regression replay
        if: steps.semantic.outcome != 'success' || steps.clarification.outcome != 'success'
        run: exit 1

  candidate-polarity-probe:
    needs: classify-run
    if: needs.classify-run.outputs.mode == 'polarity-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_RULES_VERSION: v0.7.2-candidate
      EXPECTED_BEHAVIOR_REVISION: v072-qa-20260921-01
      RULES_ENDPOINT: https://gauntlet-rules-assistant.tymon-scott.workers.dev/api/v072-candidate/rules
      HEALTH_ENDPOINT: https://gauntlet-rules-assistant.tymon-scott.workers.dev/api/v072-candidate/health
      CORPUS_HEALTH_ENDPOINT: https://gauntlet-rules-assistant.tymon-scott.workers.dev/api/v072-candidate/corpus-health
      PROBE_REPORT: artifacts/rules-qa/v072-candidate-defensive-edge-polarity-probe.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute current candidate authority identity
        shell: bash
        run: |
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const { createHash } = require("node:crypto");
          const game = readFileSync("packages/game-data/current-game.json");
          const rules = readFileSync("packages/rules/comprehensive/comprehensive-rules.md");
          const hash = createHash("sha256")
            .update(game)
            .update(Buffer.from([0]))
            .update(rules)
            .digest("hex");
          require("node:fs").appendFileSync(process.env.GITHUB_ENV, `EXPECTED_AUTHORITY_SET=${hash}\n`);
          console.log(`Current candidate authority set: ${hash}`);
          NODE

      - name: Wait for matching live candidate before paid calls
        run: |
          node <<'NODE'
          const expectedVersion = process.env.EXPECTED_RULES_VERSION;
          const expectedRevision = process.env.EXPECTED_BEHAVIOR_REVISION;
          const expectedAuthority = process.env.EXPECTED_AUTHORITY_SET;
          const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

          const healthResponse = await fetch(process.env.HEALTH_ENDPOINT, { cache: "no-store" });
          const health = healthResponse.ok ? await healthResponse.json() : null;
          if (
            !healthResponse.ok
            || health?.ok !== true
            || health?.version !== expectedVersion
            || health?.behaviorRevision !== expectedRevision
            || health?.published !== false
            || health?.currentPublicRelease !== "v0.7.1"
          ) {
            console.error("Candidate health does not match the expected behavior target. No paid calls were made.");
            console.error(JSON.stringify(health));
            process.exit(1);
          }

          for (let attempt = 1; attempt <= 60; attempt += 1) {
            try {
              const response = await fetch(
                `${process.env.CORPUS_HEALTH_ENDPOINT}?probe=${process.env.GITHUB_SHA || "manual"}&attempt=${attempt}`,
                { cache: "no-store" }
              );
              const payload = response.ok ? await response.json() : null;
              const actual = payload?.authoritySetId || "missing";
              console.log(`Candidate corpus ${attempt}/60: ${actual}`);
              if (
                response.ok
                && payload?.ok === true
                && payload?.version === expectedVersion
                && payload?.behaviorRevision === expectedRevision
                && actual === expectedAuthority
              ) {
                console.log("Live candidate matches the current repository authority.");
                process.exit(0);
              }
            } catch (error) {
              console.log(`Candidate corpus ${attempt}/60: ${error.message}`);
            }
            if (attempt < 60) await sleep(5000);
          }

          console.error(`Live candidate never reached expected authority set ${expectedAuthority}. No paid calls were made.`);
          process.exit(1);
          NODE

      - name: Probe terse Defensive Edge polarity five times
        env:
          GAUNTLET_RULES_QA_USE_GITHUB_OIDC: "true"
        run: |
          node <<'NODE'
          const { mkdirSync, writeFileSync } = require("node:fs");
          const { dirname } = require("node:path");

          const question = "tie while defender has defensive edge. tiebreak roll?";
          const endpoint = process.env.RULES_ENDPOINT;
          const expectedVersion = process.env.EXPECTED_RULES_VERSION;
          const expectedRevision = process.env.EXPECTED_BEHAVIOR_REVISION;
          const audience = "gauntlet-rules-assistant-live-qa";

          async function oidcToken() {
            const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            url.searchParams.set("audience", audience);
            const response = await fetch(url, {
              headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
              cache: "no-store"
            });
            if (!response.ok) throw new Error(`OIDC token request failed with HTTP ${response.status}`);
            const payload = await response.json();
            if (!payload?.value) throw new Error("OIDC token response had no value");
            return payload.value;
          }

          const token = await oidcToken();
          const results = [];
          for (let index = 0; index < 5; index += 1) {
            const response = await fetch(endpoint, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Origin": "https://gauntlet.run",
                "User-Agent": "Gauntlet-v0.7.2-candidate-polarity-probe",
                "X-Gauntlet-QA-OIDC": token
              },
              body: JSON.stringify({
                question,
                history: [],
                sessionId: `v072_polarity_probe_${index + 1}_${Date.now().toString(36)}`,
                rulesVersion: expectedVersion
              })
            });
            const body = await response.text();
            let payload = null;
            try { payload = JSON.parse(body); } catch {}
            const answer = String(payload?.answer || "").trim();
            const firstPolarity = answer.match(/\b(yes|no)\b/i)?.[1]?.toLowerCase() || null;
            const failures = [];
            if (response.status !== 200) failures.push(`http: ${response.status}`);
            if (!payload) failures.push("response: not JSON");
            if (payload?.version !== expectedVersion) failures.push(`version: ${payload?.version || "missing"}`);
            if (payload?.behaviorRevision !== expectedRevision) failures.push(`behavior: ${payload?.behaviorRevision || "missing"}`);
            if (firstPolarity !== "no") failures.push(`polarity: first Yes/No word was ${firstPolarity || "missing"}`);
            results.push({
              attempt: index + 1,
              httpStatus: response.status,
              answer,
              firstPolarity,
              rulingStatus: payload?.rulingStatus || null,
              executionPath: payload?.executionPath || null,
              failures
            });
            console.log(`${failures.length ? "FAIL" : "PASS"} ${index + 1}/5: ${answer}`);
            for (const failure of failures) console.log(`  - ${failure}`);
            if (index < 4) await new Promise(resolve => setTimeout(resolve, 1000));
          }

          const failed = results.filter(item => item.failures.length);
          const report = {
            schema: "gauntlet.rules-arbiter-v072-candidate-polarity-probe.v1",
            rulesVersion: expectedVersion,
            behaviorRevision: expectedRevision,
            authoritySetId: process.env.EXPECTED_AUTHORITY_SET,
            question,
            completedAt: new Date().toISOString(),
            summary: {
              total: results.length,
              passed: results.length - failed.length,
              failed: failed.length
            },
            results
          };
          mkdirSync(dirname(process.env.PROBE_REPORT), { recursive: true });
          writeFileSync(process.env.PROBE_REPORT, JSON.stringify(report, null, 2) + "\n");
          if (failed.length) process.exitCode = 1;
          NODE

      - name: Upload polarity probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v072-candidate-defensive-edge-polarity-probe
          path: ${{ env.PROBE_REPORT }}
          if-no-files-found: error
          retention-days: 30

