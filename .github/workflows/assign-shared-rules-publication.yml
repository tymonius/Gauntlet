name: Assign shared rules publication

on:
  push:
    branches:
      - rules/shared-authority-normalization
    paths:
      - 'scripts/assign-shared-rules-publication.mjs'
      - '.github/workflows/assign-shared-rules-publication.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout normalization branch
        uses: actions/checkout@v4
        with:
          ref: rules/shared-authority-normalization

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assign normalized shared rules to publication parts
        run: node scripts/assign-shared-rules-publication.mjs

      - name: Commit publication assignments
        run: |
          if git diff --quiet -- config/rules-surface-contract.json; then
            echo 'Shared rules already assigned.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/rules-surface-contract.json
          git commit -m 'Assign shared rules to Comprehensive Rules parts'
          git push origin HEAD:rules/shared-authority-normalization
