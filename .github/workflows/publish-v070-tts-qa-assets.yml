name: Publish v0.7.0 TTS QA assets

on:
  push:
    branches:
      - release/v0.7.0-cutover
    paths:
      - .github/workflows/publish-v070-tts-qa-assets.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-v070-tts-qa-assets
  cancel-in-progress: true

jobs:
  publish-qa-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_ARTIFACT_ID: '9493788206'
      QA_BRANCH: 'tts-v0.7.0-qa-assets'
      FINAL_URL_PREFIX: 'https://github.com/tymonius/Gauntlet/releases/download/v0.7.0/'
      QA_URL_PREFIX: 'https://raw.githubusercontent.com/tymonius/Gauntlet/tts-v0.7.0-qa-assets/'
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download exact generated TTS artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" > /tmp/tts-assets.zip
          mkdir -p /tmp/tts-assets
          unzip -q /tmp/tts-assets.zip -d /tmp/tts-assets
          test -f /tmp/tts-assets/current/Gauntlet_TTS_Review_Scaffold.json
          test -f /tmp/tts-assets/current/tts-release-readiness.json
          test -f /tmp/tts-assets/release-assets/Gauntlet_v0.7.0_TTS_Release_Assets.json

      - name: Verify machine-ready source artifact
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = '/tmp/tts-assets/current/tts-release-readiness.json';
          const r = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (r.gameVersion !== 'v0.7.0') throw new Error(`Unexpected TTS gameVersion: ${r.gameVersion}`);
          if (r.machineReady !== true) throw new Error(`Source artifact is not machine-ready: ${JSON.stringify(r.blockers || [])}`);
          console.log('Source artifact is machine-ready for v0.7.0.');
          NODE

      - name: Build QA-hosted scaffold
        run: |
          set -euo pipefail
          mkdir -p /tmp/qa-publish
          cp -a /tmp/tts-assets/release-assets/. /tmp/qa-publish/
          cp /tmp/tts-assets/current/Gauntlet_TTS_Review_Scaffold.json /tmp/qa-publish/Gauntlet_v0.7.0_TTS_QA_Scaffold.json
          cp /tmp/tts-assets/current/tts-release-readiness.json /tmp/qa-publish/tts-release-readiness.json
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path('/tmp/qa-publish')
          old = os.environ['FINAL_URL_PREFIX']
          new = os.environ['QA_URL_PREFIX']
          for name in ['Gauntlet_v0.7.0_TTS_QA_Scaffold.json', 'Gauntlet_v0.7.0_TTS_Release_Assets.json']:
              p = root / name
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected final URL prefix not found in {name}')
              p.write_text(text.replace(old, new), encoding='utf-8')
          manifest = json.loads((root / 'Gauntlet_v0.7.0_TTS_Release_Assets.json').read_text())
          manifest['releasePage'] = None
          manifest['publication'] = {
              'host': 'raw-github-qa-branch',
              'branch': os.environ['QA_BRANCH'],
              'purpose': 'Temporary clean-client Tabletop Simulator QA only; not a published Gauntlet release.'
          }
          (root / 'Gauntlet_v0.7.0_TTS_Release_Assets.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          cat > /tmp/qa-publish/README.md <<EOF
          # Gauntlet v0.7.0 TTS QA assets

          Temporary pre-publication host for the exact machine-ready asset bundle generated by Actions artifact ${SOURCE_ARTIFACT_ID}.

          - This branch is **not** a Gauntlet release.
          - It exists only so Tabletop Simulator can perform clean-client manual QA before v0.7.0 publication.
          - The QA scaffold rewrites only the network host prefix; deterministic asset filenames are unchanged.
          - After QA approval, the final release pipeline will upload those filenames to the v0.7.0 GitHub Release.
          EOF

      - name: Publish isolated QA branch
        run: |
          set -euo pipefail
          cd /tmp/qa-publish
          git init
          git checkout -b "$QA_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Publish v0.7.0 TTS QA assets'
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "HEAD:refs/heads/${QA_BRANCH}"

      - name: Verify QA-hosted URLs
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('/tmp/qa-publish/Gauntlet_v0.7.0_TTS_Release_Assets.json', 'utf8'));
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          (async () => {
            for (const asset of manifest.assets) {
              let ok = false;
              let status = 0;
              for (let attempt = 1; attempt <= 6; attempt += 1) {
                const response = await fetch(asset.url, { redirect: 'follow' });
                status = response.status;
                if (response.ok) { ok = true; break; }
                await sleep(1500 * attempt);
              }
              if (!ok) throw new Error(`QA asset unavailable (${status}): ${asset.url}`);
            }
            console.log(`Verified ${manifest.assets.length} QA-hosted TTS asset URLs.`);
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE

      - name: Upload QA scaffold for convenience
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-v0.7.0-tts-qa-scaffold
          path: /tmp/qa-publish/Gauntlet_v0.7.0_TTS_QA_Scaffold.json
          if-no-files-found: error
