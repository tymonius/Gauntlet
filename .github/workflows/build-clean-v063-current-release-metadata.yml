name: Build clean v0.6.3 current-release metadata

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-clean-v063-current-release-metadata.yml'
      - 'artifacts/reconstruction/clean-v0.6.3/current-release-metadata/**'
      - 'artifacts/reconstruction/clean-v0.6.3/complete-authority/**'
      - 'artifacts/reconstruction/clean-v0.6.3/downstream/**'
      - 'artifacts/reconstruction/clean-v0.6.3/browser-rulebook/manifest.json'
      - 'artifacts/reconstruction/clean-v0.6.3/card-reference/manifest.json'
      - 'artifacts/reconstruction/clean-v0.6.3/faction-pages/manifest.json'
      - 'artifacts/reconstruction/clean-v0.6.3/start/manifest.json'
      - 'artifacts/reconstruction/clean-v0.6.3/deckbuilder/manifest.json'
      - 'artifacts/reconstruction/clean-v0.6.3/rules-arbiter/manifest.json'
      - 'artifacts/reconstruction/clean-v0.6.3/digital/manifest.json'
      - 'artifacts/reconstruction/clean-v0.6.3/print-export/manifest.json'
      - 'config/release-lifecycle.json'
      - 'config/release-locks.json'
      - 'config/reconstruction-version-plan.json'
      - 'src/content/current.ts'
      - 'scripts/validate-release-recovery-state.mjs'
      - 'scripts/validate-clean-v063-current-release-metadata.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-v063-current-release-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check metadata validator
        run: node --check scripts/validate-clean-v063-current-release-metadata.mjs
      - name: Verify preserved release recovery state
        run: node scripts/validate-release-recovery-state.mjs
      - name: Validate clean v0.6.3 current-release metadata
        run: node scripts/validate-clean-v063-current-release-metadata.mjs
      - name: Reject whitespace errors
        run: git diff --check HEAD^1 HEAD
