name: Certify clean v0.6.2 authority

on:
  push:
    branches:
      - agent/certify-clean-v062-authority
    paths:
      - scripts/certify-clean-v062-authority.mjs
      - scripts/validate-clean-v062-certification.mjs
      - scripts/validate-reconstruction-version-plan.mjs
      - scripts/validate-reconstruction-version-plan-certified.mjs
      - scripts/validate-clean-v062-faction-authority.mjs
      - scripts/validate-clean-v062-rulebook.mjs
      - artifacts/reconstruction/clean-v0.6.2/faction-guides/**
      - artifacts/reconstruction/clean-v0.6.2/rulebook/**
      - artifacts/reconstruction/clean-v0.6.2/certification/**
      - config/reconstruction-version-plan.json
      - config/reconstruction-version-resolutions.json
      - config/reconstruction-decision-candidates.json
      - config/release-lifecycle.json
      - .github/workflows/certify-clean-v062-authority.yml
  pull_request:
    paths:
      - scripts/certify-clean-v062-authority.mjs
      - scripts/validate-clean-v062-certification.mjs
      - scripts/validate-reconstruction-version-plan.mjs
      - scripts/validate-reconstruction-version-plan-certified.mjs
      - scripts/validate-clean-v062-faction-authority.mjs
      - scripts/validate-clean-v062-rulebook.mjs
      - artifacts/reconstruction/clean-v0.6.2/faction-guides/**
      - artifacts/reconstruction/clean-v0.6.2/rulebook/**
      - artifacts/reconstruction/clean-v0.6.2/certification/**
      - config/reconstruction-version-plan.json
      - config/reconstruction-version-resolutions.json
      - config/reconstruction-decision-candidates.json
      - config/release-lifecycle.json
      - .github/workflows/certify-clean-v062-authority.yml

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Revalidate authority components before first certification materialization
        run: |
          STATUS=$(node -p "JSON.parse(require('fs').readFileSync('config/reconstruction-version-plan.json','utf8')).targets['clean-v0.6.2'].status")
          if [ "$STATUS" = "authority_build_approved" ]; then
            node scripts/validate-clean-v062-faction-authority.mjs
            node scripts/validate-clean-v062-rulebook.mjs
          else
            echo "Authority set is already in certified-state form; component integrity will be checked by the certification validator."
          fi
      - name: Build clean v0.6.2 certification state only before first certification
        run: |
          STATUS=$(node -p "JSON.parse(require('fs').readFileSync('config/reconstruction-version-plan.json','utf8')).targets['clean-v0.6.2'].status")
          if [ "$STATUS" = "authority_build_approved" ]; then
            node scripts/certify-clean-v062-authority.mjs
          else
            echo 'clean v0.6.2 is already certified; preserve the newer reconstruction state and validate the existing certification.'
          fi
      - name: Validate certified reconstruction plan
        run: node scripts/validate-reconstruction-version-plan-certified.mjs
      - name: Validate clean v0.6.2 authority certification
        run: node scripts/validate-clean-v062-certification.mjs
      - name: Commit generated certification state
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git add \
            config/reconstruction-version-plan.json \
            artifacts/reconstruction/clean-v0.6.2/certification
          if git diff --cached --quiet; then
            echo 'Certification state is already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize clean v0.6.2 authority certification'
          git push
      - name: Require generated certification state committed on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- config/reconstruction-version-plan.json artifacts/reconstruction/clean-v0.6.2/certification
