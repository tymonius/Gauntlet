# One-shot conflict resolution
name: Merge main into card wording branch

on:
  push:
    branches:
      - agent/shared-card-wording-templates
    paths:
      - .github/workflows/merge-main-card-wording.yml

permissions:
  contents: write

jobs:
  merge-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main and preserve combined renderer
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp tts/renderer/renderer.js /tmp/combined-renderer.js
          git fetch origin main

          set +e
          git merge --no-edit origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "tts/renderer/renderer.js" ]; then
              printf 'Unexpected conflicts:\n%s\n' "$conflicts"
              exit 1
            fi
            cp /tmp/combined-renderer.js tts/renderer/renderer.js
            git add tts/renderer/renderer.js
            git commit -m "Merge main into shared card wording templates"
          fi

          git rm .github/workflows/merge-main-card-wording.yml
          git commit -m "Remove temporary main merge workflow"
          git push origin HEAD:agent/shared-card-wording-templates
