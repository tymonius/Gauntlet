name: Render v0.6.1 release printables

on:
  push:
    branches:
      - rules/v0.6.1-playtest-revision
    paths:
      - ".github/workflows/render-v061-release-printables.yml"
      - "faction-sheets/**"
      - "deckbuilder/completed-factions.js"
      - "deckbuilder/v061-supplementals.js"
      - "releases/v0.6.1/Gauntlet_v0.6.1_Canonical_Data.json"
      - "releases/v0.6.1/printables/README.md"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/render-v061-release-printables.yml"
      - "faction-sheets/**"
      - "deckbuilder/completed-factions.js"
      - "deckbuilder/v061-supplementals.js"
      - "releases/v0.6.1/Gauntlet_v0.6.1_Canonical_Data.json"
      - "releases/v0.6.1/printables/README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-v061-release-printables-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout revision branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate print-package sources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('faction-sheets')
          expected = {
              'neutral.html': 'data-package="neutral"',
              'territories.html': 'data-package="territories"',
              'all-components.html': 'data-package="all-components"',
          }
          for filename, marker in expected.items():
              text = (root / filename).read_text(encoding='utf-8')
              for required in [marker, 'v061.css', 'v061-release-runtime.js']:
                  if required not in text:
                      raise SystemExit(f'{filename} missing {required}')
              for forbidden in ['v0.6.0', 'Battle Hand', 'hand commitment']:
                  if forbidden in text:
                      raise SystemExit(f'{filename} contains obsolete term {forbidden}')

          canonical = json.loads(Path('releases/v0.6.1/Gauntlet_v0.6.1_Canonical_Data.json').read_text(encoding='utf-8'))
          if canonical.get('version') != 'v0.6.1':
              raise SystemExit(f"Unexpected canonical version: {canonical.get('version')}")
          cards = canonical.get('cards', [])
          territories = canonical.get('territories', [])
          if len(cards) != 122:
              raise SystemExit(f'Expected 122 playable titles; found {len(cards)}')
          if sum(card.get('allegiance') == 'Neutral' for card in cards) != 50:
              raise SystemExit('Neutral pool does not contain 50 titles')
          if len(territories) != 25:
              raise SystemExit(f'Expected 25 Territories; found {len(territories)}')
          print('Validated v0.6.1 release print-package sources.')
          PY

      - name: Install rendering and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils zip
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Serve repository
        run: python3 -m http.server 8000 >/tmp/gauntlet-http.log 2>&1 &

      - name: Render and inspect release packages
        run: |
          mkdir -p /tmp/v061-release-printables
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const packages = [
            ['neutral-cards', 'neutral.html'],
            ['territories', 'territories.html'],
            ['military', 'military.html'],
            ['diplomats', 'diplomat.html'],
            ['financiers', 'financier.html'],
            ['intelligence', 'intelligence.html'],
            ['mystics', 'mystics.html'],
            ['inquisition', 'inquisition.html'],
            ['all-components', 'all-components.html']
          ];
          const filenames = {
            'neutral-cards': 'Gauntlet_v0.6.1_Neutral_Cards.pdf',
            territories: 'Gauntlet_v0.6.1_Territories.pdf',
            military: 'Gauntlet_v0.6.1_Military_Faction_Package.pdf',
            diplomats: 'Gauntlet_v0.6.1_Diplomats_Faction_Package.pdf',
            financiers: 'Gauntlet_v0.6.1_Financiers_Faction_Package.pdf',
            intelligence: 'Gauntlet_v0.6.1_Intelligence_Faction_Package.pdf',
            mystics: 'Gauntlet_v0.6.1_Mystics_Faction_Package.pdf',
            inquisition: 'Gauntlet_v0.6.1_Inquisition_Faction_Package.pdf',
            'all-components': 'Gauntlet_v0.6.1_All_Components.pdf'
          };

          const browser = await chromium.launch({ headless: true });
          const pageCounts = {};

          for (const [id, filename] of packages) {
            const page = await browser.newPage({ viewport: { width: 1275, height: 1650 } });
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            page.on('console', message => {
              if (message.type() === 'error') errors.push(message.text());
            });

            const response = await page.goto(`http://127.0.0.1:8000/faction-sheets/${filename}`, { waitUntil: 'networkidle', timeout: 60000 });
            if (!response?.ok()) throw new Error(`${filename} returned ${response?.status()}`);
            await page.waitForSelector('body[data-ready="true"]', { timeout: 60000 });

            const counts = await page.evaluate(() => ({
              sheets: document.querySelectorAll('.sheet').length,
              mainCards: document.querySelectorAll('.main-card').length,
              territories: document.querySelectorAll('.territory-card').length,
              leaders: document.querySelectorAll('.leader-card').length,
              proposals: document.querySelectorAll('.proposal-card').length,
              rites: document.querySelectorAll('.rite-card').length,
              deeds: document.querySelectorAll('.deed-card').length,
              fitResults: window.__cardFitResults || [],
              bodyText: document.body.innerText
            }));

            if (counts.sheets < 1) throw new Error(`${filename} rendered no sheets`);
            const overflows = counts.fitResults.filter(result => !result.fits || result.overflow > 0);
            if (overflows.length) throw new Error(`${filename} overflows: ${JSON.stringify(overflows)}`);
            for (const forbidden of ['v0.6.0', 'Battle Hand', 'hand commitment', 'battle-drawn card']) {
              if (counts.bodyText.includes(forbidden)) throw new Error(`${filename} contains obsolete term ${forbidden}`);
            }

            if (id === 'neutral-cards' && counts.mainCards !== 50) throw new Error(`Neutral package rendered ${counts.mainCards} cards`);
            if (id === 'territories' && counts.territories !== 25) throw new Error(`Territory package rendered ${counts.territories} Territories`);
            if (['military', 'diplomats', 'financiers', 'intelligence', 'mystics', 'inquisition'].includes(id) && counts.mainCards !== 12) {
              throw new Error(`${id} package rendered ${counts.mainCards} playable cards`);
            }
            if (id === 'all-components') {
              if (counts.mainCards !== 122) throw new Error(`All-components package rendered ${counts.mainCards} playable cards`);
              if (counts.territories !== 25) throw new Error(`All-components package rendered ${counts.territories} Territories`);
              if (counts.leaders !== 12) throw new Error(`All-components package rendered ${counts.leaders} Leaders`);
              if (counts.proposals !== 18) throw new Error(`All-components package rendered ${counts.proposals} Proposal/Treaty faces`);
              if (counts.rites !== 6) throw new Error(`All-components package rendered ${counts.rites} Rite faces`);
              if (counts.deeds !== 8) throw new Error(`All-components package rendered ${counts.deeds} Deeds`);
            }
            if (errors.length) throw new Error(`${filename} browser errors:\n${errors.join('\n')}`);

            const pdfPath = `/tmp/v061-release-printables/${filenames[id]}`;
            await page.screenshot({ path: `/tmp/v061-release-printables/${id}-preview.png`, fullPage: true });
            await page.emulateMedia({ media: 'print' });
            await page.pdf({
              path: pdfPath,
              format: 'Letter',
              printBackground: true,
              preferCSSPageSize: true,
              margin: { top: '0', right: '0', bottom: '0', left: '0' }
            });
            pageCounts[filenames[id]] = counts.sheets;
            console.log(`${id}: ${JSON.stringify(counts)}`);
            await page.close();
          }

          fs.writeFileSync('/tmp/v061-release-printables/page-counts.json', JSON.stringify(pageCounts, null, 2));
          await browser.close();
          NODE

      - name: Validate exact PDF page counts and nonblank pages
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path('/tmp/v061-release-printables')
          expected = json.loads((root / 'page-counts.json').read_text(encoding='utf-8'))
          for filename, expected_pages in expected.items():
              path = root / filename
              if not path.exists() or path.stat().st_size < 10_000:
                  raise SystemExit(f'{filename} is missing or unexpectedly small')
              info = subprocess.check_output(['pdfinfo', str(path)], text=True)
              pages_line = next(line for line in info.splitlines() if line.startswith('Pages:'))
              actual_pages = int(pages_line.split(':', 1)[1].strip())
              if actual_pages != expected_pages:
                  raise SystemExit(f'{filename}: expected {expected_pages} pages, found {actual_pages}')
              for page_number in range(1, actual_pages + 1):
                  text = subprocess.check_output([
                      'pdftotext', '-f', str(page_number), '-l', str(page_number), str(path), '-'
                  ], text=True, errors='ignore').strip()
                  if not text:
                      raise SystemExit(f'{filename}: page {page_number} is blank')
              print(f'{filename}: {actual_pages} nonblank pages')
          PY

      - name: Assemble release-candidate archive
        run: |
          cp releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.pdf /tmp/v061-release-printables/
          cp releases/v0.6.1/Gauntlet_v0.6.1_Reference_Guide.pdf /tmp/v061-release-printables/
          cp releases/v0.6.1/Gauntlet_v0.6.1_Release_Notes.md /tmp/v061-release-printables/
          cp releases/v0.6.1/Gauntlet_v0.6.1_First_Game_Guide.md /tmp/v061-release-printables/
          cd /tmp/v061-release-printables
          zip -9 Gauntlet_v0.6.1_Tabletop_Release_Candidate.zip \
            Gauntlet_v0.6.1_*.pdf \
            Gauntlet_v0.6.1_Release_Notes.md \
            Gauntlet_v0.6.1_First_Game_Guide.md

      - name: Store final printable PDFs in release package
        if: github.event_name == 'push'
        run: |
          mkdir -p releases/v0.6.1/printables
          cp /tmp/v061-release-printables/Gauntlet_v0.6.1_*.pdf releases/v0.6.1/printables/
          rm -f releases/v0.6.1/printables/Gauntlet_v0.6.1_Rulebook.pdf
          rm -f releases/v0.6.1/printables/Gauntlet_v0.6.1_Reference_Guide.pdf
          git add releases/v0.6.1/printables/
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate final v0.6.1 printable component PDFs"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload release printables and previews
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-v061-tabletop-release-candidate
          path: /tmp/v061-release-printables/*
          if-no-files-found: error
