name: Rules Arbiter Gate 2 content residual patch (temporary)

on:
  push:
    branches:
      - rules-arbiter-gate2-content-residuals-20260911

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Stage Gate 2 content residual repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rules-arbiter-gate2-content-residuals-20260911
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install repository dependencies
        run: npm ci
      - name: Patch residual content failures
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          worker = Path('rules-assistant/worker-v071.js')
          s = worker.read_text()
          assert s.count('export const BEHAVIOR_REVISION = "v071-qa-20260911-4";') == 1
          s = s.replace('export const BEHAVIOR_REVISION = "v071-qa-20260911-4";', 'export const BEHAVIOR_REVISION = "v071-qa-20260911-5";', 1)

          anchor = '- A summary may remain explicit when it compiles several independently stated facts from multiple clean sources, provided every material statement is directly stated and the summary adds no new relationship, permission, prohibition, equivalence, or conclusion between them. Multiple citations alone do not make an answer inferred.\n'
          addition = anchor + '- A procedural summary also remains explicit when it merely assembles directly stated steps, timing, limits, and destinations from several clean passages into their stated sequence. Do not downgrade a directly documented procedure to inferred merely because more than one passage is needed to state it completely.\n'
          assert s.count(anchor) == 1
          s = s.replace(anchor, addition, 1)

          anchor = '- Use inferred when direct premises must be combined to reach a new conclusion that no clean source itself states. This includes conclusions about the absence of adjacency, contiguity, restrictions, permissions, or requirements even when each supporting premise is explicit.\n'
          addition = anchor + '- In particular, a statement such as "there is no X requirement", "does not require X", or "need not be X" is inferred when no clean source directly states that negative and the conclusion instead follows from other rules or from the absence of such a restriction.\n'
          assert s.count(anchor) == 1
          s = s.replace(anchor, addition, 1)

          anchor = '17. For overview questions, summarize the directly supported mechanics without exposing retrieval coverage. Do not say that an "available passage", "available source", or retrieved excerpt omits the rest of a procedure; omit unsupported detail instead unless the player specifically asks about source coverage.\n'
          addition = anchor + '18. Preserve printed effect-label terminology in the answer itself when it identifies the role being discussed. If the authority says a card is played for its Action effect, call it an Action effect; do not replace that with an invented category such as "Action card".\n'
          assert s.count(anchor) == 1
          s = s.replace(anchor, addition, 1)
          worker.write_text(s)

          # Keep current revision assertions aligned.
          for p in Path('rules-assistant').glob('*.test.mjs'):
              t = p.read_text()
              if 'v071-qa-20260911-4' in t:
                  p.write_text(t.replace('v071-qa-20260911-4', 'v071-qa-20260911-5'))

          # Do not serialize the stale non-printed Margin Loan helper as card authority.
          local_search = Path('rules-assistant/local-search.js')
          t = local_search.read_text()
          old = '  if (Array.isArray(value.effects)) {\n    consumed.add("effects");\n'
          new = '  if (Array.isArray(value.effects)) {\n    consumed.add("effects");\n    // Legacy Margin Loan metadata used a non-printed `loan` helper alongside the printed effects.\n    // Printed effects are the card authority; do not surface that stale helper as a competing rule.\n    consumed.add("loan");\n'
          assert t.count(old) == 1
          t = t.replace(old, new, 1)
          local_search.write_text(t)

          # Remove the same stale helper from the v0.7.2 candidate authority; leave frozen v0.7.1 untouched.
          current_path = Path('game-data/current-game.json')
          data = json.loads(current_path.read_text())
          margin = next(card for card in data['gameplay']['cards'] if card.get('id') == 'financiers-margin-loan')
          assert 'loan' in margin
          assert any(effect.get('label') == 'Asset' and 'After income' in effect.get('text','') for effect in margin.get('effects', []))
          del margin['loan']
          current_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          # Extend deterministic Gate 2 coverage for the residual findings.
          test_path = Path('rules-assistant/v071-gate2-live-regressions.test.mjs')
          t = test_path.read_text()
          t = t.replace('import { describe, expect, test } from "vitest";\n', 'import { describe, expect, test } from "vitest";\nimport { buildCanonicalDocuments } from "./local-search.js";\n', 1)
          marker = '    expect(workerSource).toContain("Satisfy the requirement in a phase where the Feature is already legal unless the text expressly changes its timing.");\n'
          insert = marker + '    expect(workerSource).toContain("Do not downgrade a directly documented procedure to inferred merely because more than one passage is needed");\n    expect(workerSource).toContain("there is no X requirement");\n    expect(workerSource).toContain("call it an Action effect");\n'
          assert t.count(marker) == 1
          t = t.replace(marker, insert, 1)

          before = '  test("treats Worker 5xx failures as infrastructure and counts attempts correctly", () => {\n'
          block = '''  test("does not expose stale non-printed Margin Loan helper metadata as card authority", () => {\n    const canonicalData = {\n      gameplay: {\n        cards: [{\n          id: "financiers-margin-loan",\n          name: "Margin Loan",\n          effects: [\n            { label: "Action", text: "Bank this card." },\n            { label: "Asset", text: "After income, you may choose: Repay or Default." }\n          ],\n          asset: "After income, you may choose: Repay or Default.",\n          loan: "At the start of your next turn, after the Capture step and income, choose one."\n        }]\n      }\n    };\n    const documents = buildCanonicalDocuments(canonicalData, "https://example.test", "https://example.test/data.json");\n    const margin = documents.find((document) => document.id === "card:financiers-margin-loan");\n    expect(margin?.body).toContain("After income, you may choose: Repay or Default.");\n    expect(margin?.body).not.toContain("At the start of your next turn");\n  });\n\n'''
          assert t.count(before) == 1
          t = t.replace(before, block + before, 1)
          test_path.write_text(t)

          candidate_test = Path('rules-assistant/v072-margin-loan-authority.test.mjs')
          candidate_test.write_text('''import { readFileSync } from "node:fs";\nimport { describe, expect, test } from "vitest";\n\nconst current = JSON.parse(readFileSync(new URL("../game-data/current-game.json", import.meta.url), "utf8"));\n\ndescribe("v0.7.2 Margin Loan authority", () => {\n  test("uses printed effects as the single card authority", () => {\n    const margin = current.gameplay.cards.find((card) => card.id === "financiers-margin-loan");\n    expect(margin).toBeTruthy();\n    expect(margin).not.toHaveProperty("loan");\n    const asset = margin.effects.find((effect) => effect.label === "Asset");\n    expect(asset.text).toContain("After income");\n    expect(asset.text).toContain("Repay");\n    expect(asset.text).toContain("Default");\n  });\n});\n''')
          PY
      - name: Run focused Rules Arbiter regressions
        run: |
          npx vitest run rules-assistant/v071-gate2-live-regressions.test.mjs rules-assistant/v071-printed-effect-labels.test.mjs rules-assistant/v071-copied-effect-retrieval-review.test.mjs rules-assistant/v072-margin-loan-authority.test.mjs
      - name: Commit content repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rules-assistant/worker-v071.js rules-assistant/local-search.js rules-assistant/*.test.mjs game-data/current-game.json
          git commit -m 'Resolve remaining Gate 2 Rules Arbiter content findings'
          git push origin HEAD:rules-arbiter-gate2-content-residuals-20260911
