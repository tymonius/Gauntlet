name: Apply faction action summaries

on:
  push:
    branches:
      - docs/clarify-faction-actions

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[faction-actions]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/clarify-faction-actions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply faction chapter summaries
        run: python scripts/add_faction_action_summaries.py
      - name: Synchronize and validate Rulebook
        run: |
          python scripts/sync_v061_rulebook.py
          python scripts/normalize_v061_rulebook_content.py
          python scripts/validate_v061_rulebook_content.py
      - name: Run test suite
        run: |
          npm install --no-package-lock
          npm run test:deckbuilder
          npm test
      - name: Remove one-use migration
        run: rm scripts/add_faction_action_summaries.py .github/workflows/apply-faction-action-summaries.yml
      - name: Commit faction action documentation
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[faction-actions] Clarify faction actions in faction chapters"
          for attempt in 1 2 3 4 5; do
            git fetch origin docs/clarify-faction-actions
            if git rebase origin/docs/clarify-faction-actions && git push origin HEAD:docs/clarify-faction-actions; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
