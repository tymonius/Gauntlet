name: Probe Fate's Toll and Valor reviewed case

on:
  push:
    branches:
      - ops/rules-arbiter-fates-toll-valor-probe
    paths:
      - '.github/workflows/rules-arbiter-fates-toll-valor-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect production interaction and audit
        shell: bash
        run: |
          set -euo pipefail
          echo '=== SESSION ==='
          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant --remote --config rules-assistant/wrangler.toml --json --command "SELECT id, session_id, previous_interaction_id, sequence_index, created_at, question, answer, game_version, ruling_status, ruling_status_v2, confidence, source_count, feedback_rating, review_status, issue_types_json, reviewer_notes, resolution FROM rules_interactions WHERE session_id = (SELECT session_id FROM rules_interactions WHERE id = '58fb3cca-3fcd-41d6-9fbf-ee56f59a7575') ORDER BY sequence_index, created_at"
          echo '=== AUDIT ==='
          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant --remote --config rules-assistant/wrangler.toml --json --command "SELECT * FROM rules_interaction_audits WHERE interaction_id = '58fb3cca-3fcd-41d6-9fbf-ee56f59a7575'"
      - name: Probe current v0.7.1 deterministic retrieval
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { buildRulesCorpus, retrieveRules } from './rules-assistant/local-search.js';
          import { augmentRetrievalForContext, contextualQuery } from './rules-assistant/worker-v071.js';
          import { V071_CANONICAL_SOURCE_PATH, V071_RULEBOOK_SOURCE_PATH } from './rules-assistant/v071-public-corpus.js';

          const canonicalData = JSON.parse(fs.readFileSync(V071_CANONICAL_SOURCE_PATH, 'utf8'));
          const rulebookMarkdown = fs.readFileSync(V071_RULEBOOK_SOURCE_PATH, 'utf8');
          const corpus = buildRulesCorpus({ canonicalData, rulebookMarkdown, siteOrigin: 'https://gauntlet.run' });
          const questions = [
            "I am losing after the initial battle roll and have both Fate's Toll and Valor available as Battle effects. May I reroll with both effects one after the other?",
            "Can I use Fate's Toll and then Valor to reroll twice in the same battle?",
            "Can multiple Battle effects reroll the same battle one after another?",
            "When two of my effects can resolve after the same roll, in what order do I resolve them?",
            "How are multiple effects at the same timing resolved?"
          ];
          for (const question of questions) {
            const query = contextualQuery(question, []);
            const raw = retrieveRules(corpus, query, { limit: 12, excerptLength: 2000 });
            const results = augmentRetrievalForContext(corpus, question, [], raw);
            console.log('\n=== QUESTION ===\n' + question);
            console.log(JSON.stringify(results.slice(0, 12).map((r, i) => ({ rank: i + 1, id: r.canonicalId, title: r.title, body: r.body })), null, 2));
          }
          NODE
