name: Rules Arbiter targeted review

on:
  push:
    branches:
      - rules-arbiter-review-58c9c1c6
    paths:
      - '.github/workflows/rules-arbiter-targeted-inspect.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply reviewed Fortifications fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime, timezone

          local_search = Path('rules-assistant/local-search.js')
          text = local_search.read_text()
          addition = '''  {
            pattern: /(?=[\\s\\S]*\\btactics?\\b)(?=[\\s\\S]*\\b(?:two|2|second|additional|multiple|several)\\b)(?=[\\s\\S]*\\b(?:choose|chooses|chosen|choosing|choice|select|selection)\\b)/i,
            aliases: ["Multiple Gambits or Tactics", "several Tactics chosen as part of the same choice", "choose them simultaneously", "Choose Tactics", "Reveal Tactics"]
          },
          '''
          if addition not in text:
              marker = 'aliases: ["Shared timing", "multiple controlled effects would apply at the same time", "each player chooses the order of effects they control", "continue alternating until no effects remain at that timing"]'
              marker_pos = text.find(marker)
              if marker_pos < 0:
                  raise SystemExit('Could not find local-search shared-timing alias marker')
              block_end = text.find('  },', marker_pos)
              if block_end < 0:
                  raise SystemExit('Could not find end of shared-timing alias block')
              insert_at = block_end + len('  },\n')
              local_search.write_text(text[:insert_at] + addition + text[insert_at:])

          worker = Path('rules-assistant/worker-v071.js')
          text = worker.read_text()
          old_rev = 'v071-qa-20260909-9'
          new_rev = 'v071-qa-20260910-1'
          if new_rev not in text:
              if old_rev not in text:
                  raise SystemExit('Could not find current behavior revision')
              worker.write_text(text.replace(old_rev, new_rev, 1))

          for test_path in Path('rules-assistant').glob('*.test.mjs'):
              test_text = test_path.read_text()
              if old_rev in test_text:
                  test_path.write_text(test_text.replace(old_rev, new_rev))

          test_file = Path('rules-assistant/v071-fortifications-tactic-choice-review.test.mjs')
          test_file.write_text('''import { readFileSync } from "node:fs";\nimport { describe, expect, test } from "vitest";\nimport { buildRulesCorpus, retrieveRules } from "./local-search.js";\nimport { BEHAVIOR_REVISION, augmentRetrievalForContext, contextualQuery } from "./worker-v071.js";\nimport { V071_CANONICAL_SOURCE_PATH, V071_RULEBOOK_SOURCE_PATH } from "./v071-public-corpus.js";\n\nconst canonicalData = JSON.parse(readFileSync(V071_CANONICAL_SOURCE_PATH, "utf8"));\nconst rulebookMarkdown = readFileSync(V071_RULEBOOK_SOURCE_PATH, "utf8");\nconst workerSource = readFileSync(new URL("./worker-v071.js", import.meta.url), "utf8");\nconst corpus = buildRulesCorpus({ canonicalData, rulebookMarkdown, siteOrigin: "https://gauntlet.run" });\n\nfunction sourcesFor(question) {\n  const query = contextualQuery(question, []);\n  const raw = retrieveRules(corpus, query, { limit: 12, excerptLength: 2200 });\n  return augmentRetrievalForContext(corpus, question, [], raw);\n}\n\nconst reviewedQuestion = "If I have Fortifications active, may I choose one Tactic, see my opponent’s choice, then choose my second Tactic?";\n\ndescribe("v0.7.1 Fortifications reviewed Tactic-choice case", () => {\n  test("the reviewed question retrieves Fortifications and the governing multiple-Tactic timing rule", () => {\n    const sources = sourcesFor(reviewedQuestion);\n    const ids = sources.slice(0, 4).map((source) => source.canonicalId);\n    expect(ids[0]).toBe("card:neutral-fortifications");\n    expect(ids).toContain("rulebook:multiple-gambits-or-tactics");\n\n    const fortifications = sources.find((source) => source.canonicalId === "card:neutral-fortifications");\n    expect(String(fortifications?.body || "")).toContain("When defending, you may choose up to two Tactics instead of one.");\n\n    const multiple = sources.find((source) => source.canonicalId === "rulebook:multiple-gambits-or-tactics");\n    expect(String(multiple?.body || "")).toContain("When several Tactics are chosen as part of the same choice, choose them simultaneously.");\n  });\n\n  test("generic multiple-Tactic sequencing language also retrieves the same authority", () => {\n    const sources = sourcesFor("May I choose one Tactic, wait, and then select a second Tactic?");\n    expect(sources.slice(0, 4).map((source) => source.canonicalId)).toContain("rulebook:multiple-gambits-or-tactics");\n  });\n\n  test("current classification discipline does not permit a provisional ruling when clean authority resolves every premise", () => {\n    expect(workerSource).toContain("Use explicit only when clean authority directly states each material premise required by the answer");\n    expect(workerSource).toContain("Provisional is only for a genuine remaining gap or ambiguity");\n    expect(BEHAVIOR_REVISION).toBe("v071-qa-20260910-1");\n  });\n});\n''')

          ledger_path = Path('artifacts/rules-refinement/resolution-ledger.json')
          ledger = json.loads(ledger_path.read_text())
          entry_id = 'fortifications-tactic-choice-classification-v071'
          if not any(entry.get('id') == entry_id for entry in ledger.get('entries', [])):
              now = datetime.now(timezone.utc).isoformat(timespec='milliseconds').replace('+00:00', 'Z')
              ledger.setdefault('entries', []).append({
                  'id': entry_id,
                  'status': 'resolved',
                  'rootCause': 'classification',
                  'interactionIds': ['58c9c1c6-a588-4b18-8e7c-516e1907dd06'],
                  'caseIds': ['fortifications-two-tactics-timing-classification'],
                  'resolutionSurface': 'arbiter_retrieval_prompt',
                  'summary': 'The reviewed Fortifications ruling was substantively correct but over-classified as provisional. Current v0.7.1 authority directly states both that Fortifications permits up to two Tactics while defending and that several Tactics chosen as part of the same choice are chosen simultaneously. Multiple-Tactic sequencing questions now promote that timing authority, while the existing classification discipline reserves provisional status for genuine gaps or ambiguity.',
                  'resolvedAt': now,
                  'binding': {'behaviorRevision': new_rev}
              })
              ledger['updatedAt'] = now
              ledger_path.write_text(json.dumps(ledger, indent=2, ensure_ascii=False) + '\n')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run focused Rules Arbiter tests
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run \
            rules-assistant/v071-fortifications-tactic-choice-review.test.mjs \
            rules-assistant/v071-strategic-withdrawal-review.test.mjs \
            rules-assistant/v071-battle-card-replacement-retrieval.test.mjs \
            rules-assistant/v071-short-counterfactual-continuity.test.mjs \
            rules-assistant/v071-ambiguous-referent-clarification.test.mjs
          printf '%s\n' '["rules-assistant/local-search.js","rules-assistant/worker-v071.js","rules-assistant/v071-fortifications-tactic-choice-review.test.mjs","rules-assistant/v071-strategic-withdrawal-review.test.mjs","rules-assistant/v071-battle-card-replacement-retrieval.test.mjs","rules-assistant/v071-short-counterfactual-continuity.test.mjs","rules-assistant/v071-ambiguous-referent-clarification.test.mjs","artifacts/rules-refinement/resolution-ledger.json"]' > /tmp/changed-files.json
          node scripts/validate-rules-refinement-source-first.mjs --changed-files /tmp/changed-files.json

      - name: Remove review probe and commit refinement
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rules-arbiter-targeted-inspect.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules-assistant artifacts/rules-refinement/resolution-ledger.json .github/workflows/rules-arbiter-targeted-inspect.yml
          git diff --cached --check
          git commit -m "Fix Fortifications Tactic-choice review regression"
          git push origin HEAD:rules-arbiter-review-58c9c1c6
