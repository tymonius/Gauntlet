name: Rules Arbiter targeted cleanup

on:
  push:
    branches:
      - rules-arbiter-review-58c9c1c6-clean
    paths:
      - '.github/workflows/rules-arbiter-targeted-inspect.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize alias indentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('rules-assistant/local-search.js')
          lines = p.read_text().splitlines()
          target = 'pattern: /(?=[\\s\\S]*\\btactics?\\b)'
          found = False
          for i, line in enumerate(lines):
              if target in line:
                  found = True
                  lines[i] = '    ' + line.lstrip()
                  if i + 1 >= len(lines) or not lines[i + 1].lstrip().startswith('aliases: ["Multiple Gambits or Tactics"'):
                      raise SystemExit('Expected alias line not found')
                  lines[i + 1] = '    ' + lines[i + 1].lstrip()
                  if i + 2 >= len(lines) or lines[i + 2].strip() != '},':
                      raise SystemExit('Expected alias block terminator not found')
                  lines[i + 2] = '  },'
                  break
          if not found:
              raise SystemExit('Expected multiple-Tactic alias block not found')
          p.write_text('\n'.join(lines) + '\n')
          PY

      - name: Remove probe and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rules-arbiter-targeted-inspect.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules-assistant/local-search.js .github/workflows/rules-arbiter-targeted-inspect.yml
          git diff --cached --check
          git commit -m "Normalize Fortifications review formatting"
          git push origin HEAD:rules-arbiter-review-58c9c1c6-clean
