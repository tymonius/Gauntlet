name: Rules Arbiter targeted cleanup

on:
  push:
    branches:
      - rules-arbiter-review-58c9c1c6-clean
    paths:
      - '.github/workflows/rules-arbiter-targeted-inspect.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize alias indentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('rules-assistant/local-search.js')
          text = p.read_text()
          old = '''  {
          pattern: /(?=[\\s\\S]*\\btactics?\\b)(?=[\\s\\S]*\\b(?:two|2|second|additional|multiple|several)\\b)(?=[\\s\\S]*\\b(?:choose|chooses|chosen|choosing|choice|select|selection)\\b)/i,
          aliases: ["Multiple Gambits or Tactics", "several Tactics chosen as part of the same choice", "choose them simultaneously", "Choose Tactics", "Reveal Tactics"]
        },'''
          new = '''  {
            pattern: /(?=[\\s\\S]*\\btactics?\\b)(?=[\\s\\S]*\\b(?:two|2|second|additional|multiple|several)\\b)(?=[\\s\\S]*\\b(?:choose|chooses|chosen|choosing|choice|select|selection)\\b)/i,
            aliases: ["Multiple Gambits or Tactics", "several Tactics chosen as part of the same choice", "choose them simultaneously", "Choose Tactics", "Reveal Tactics"]
          },'''
          if old not in text:
              raise SystemExit('Expected alias block not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Remove probe and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rules-arbiter-targeted-inspect.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules-assistant/local-search.js .github/workflows/rules-arbiter-targeted-inspect.yml
          git diff --cached --check
          git commit -m "Normalize Fortifications review formatting"
          git push origin HEAD:rules-arbiter-review-58c9c1c6-clean
