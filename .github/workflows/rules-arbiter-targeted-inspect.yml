name: Rules Arbiter targeted inspect

on:
  push:
    branches:
      - rules-arbiter-review-58c9c1c6
    paths:
      - '.github/workflows/rules-arbiter-targeted-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OUT: .tmp/rules-arbiter-targeted-inspect
      TARGET: 58c9c1c6-a588-4b18-8e7c-516e1907dd06
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read target production context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          d1() {
            local command="$1"
            local file="$2"
            npx --yes wrangler@4 d1 execute gauntlet-rules-assistant \
              --remote \
              --config rules-assistant/wrangler.toml \
              --json \
              --command "$command" > "$OUT/$file"
          }
          d1 "SELECT * FROM rules_interactions WHERE id = '$TARGET'" interaction.json
          d1 "SELECT * FROM rules_interaction_sources WHERE interaction_id = '$TARGET' ORDER BY ordinal" sources.json
          d1 "SELECT * FROM rules_interaction_audits WHERE interaction_id = '$TARGET' ORDER BY reviewed_at" audits.json

      - name: Inspect current v0.7.1 retrieval
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > "$OUT/retrieval.json"
          import { readFileSync } from 'node:fs';
          import { buildRulesCorpus, retrieveRules } from './rules-assistant/local-search.js';
          import { augmentRetrievalForContext, contextualQuery } from './rules-assistant/worker-v071.js';
          import { V071_CANONICAL_SOURCE_PATH, V071_RULEBOOK_SOURCE_PATH } from './rules-assistant/v071-public-corpus.js';

          const canonicalData = JSON.parse(readFileSync(V071_CANONICAL_SOURCE_PATH, 'utf8'));
          const rulebookMarkdown = readFileSync(V071_RULEBOOK_SOURCE_PATH, 'utf8');
          const corpus = buildRulesCorpus({ canonicalData, rulebookMarkdown, siteOrigin: 'https://gauntlet.run' });
          const question = "If I have Fortifications active, may I choose one Tactic, see my opponent’s choice, then choose my second Tactic?";
          const raw = retrieveRules(corpus, contextualQuery(question, []), { limit: 12, excerptLength: 2200 });
          const sources = augmentRetrievalForContext(corpus, question, [], raw);
          console.log(JSON.stringify(sources.map(({ canonicalId, title, heading, score, body }) => ({ canonicalId, title, heading, score, body })), null, 2));
          NODE

      - name: Upload targeted inspection
        uses: actions/upload-artifact@v4
        with:
          name: rules-arbiter-targeted-inspect-58c9c1c6
          path: .tmp/rules-arbiter-targeted-inspect
          if-no-files-found: error
          retention-days: 1
