name: Sync Deckbuilder to v0.6.1

on:
  push:
    branches:
      - rules/v0.6.1-playtest-revision
    paths:
      - ".github/workflows/sync-v061-deckbuilder.yml"
      - "scripts/sync_v061_deckbuilder.py"
      - "scripts/sync_v061_print_supplementals.py"
      - "scripts/sync_v061_public_rules.py"
      - "deckbuilder/**"
      - "start/**"
      - "playtest/onboarding/**"
      - "playtest/player-mat/**"
      - "factions/**"
      - "faction-sheets/**"
      - "docs/Gauntlet_v0.6.1_Neutral_Card_Pool.md"
      - "docs/Gauntlet_v0.6.1_Territory_Pool.md"
      - "releases/v0.6.1/faction-guides/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-v061-deckbuilder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Reconcile generator variants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          public_path = Path("scripts/sync_v061_public_rules.py")
          public_text = public_path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'\n        "faction-sheets/v061-release-runtime\.js": \[\n'
              r'(?:            .*\n)+'
              r'        \],\n'
          )
          public_updated, count = pattern.subn("\n", public_text, count=1)
          if count:
              public_path.write_text(public_updated, encoding="utf-8")

          print_path = Path("scripts/sync_v061_print_supplementals.py")
          print_text = print_path.read_text(encoding="utf-8")
          print_updated = print_text.replace(
              "no deckbuilding value",
              "not a Playable Deck card",
          )
          if print_updated != print_text:
              print_path.write_text(print_updated, encoding="utf-8")
          PY

      - name: Synchronize browser and printable sources
        run: |
          python scripts/sync_v061_deckbuilder.py
          python scripts/sync_v061_public_rules.py
          python scripts/sync_v061_print_supplementals.py

      - name: Commit synchronized sources when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/sync_v061_print_supplementals.py \
            scripts/sync_v061_public_rules.py \
            deckbuilder/ \
            start/ \
            playtest/onboarding/ \
            playtest/player-mat/ \
            factions/ \
            faction-sheets/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Synchronize public v0.6.1 browser and print rules"
          git pull --rebase origin ${{ github.head_ref || github.ref_name }}
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

      - name: Verify clean synchronization
        run: |
          python scripts/sync_v061_deckbuilder.py
          python scripts/sync_v061_public_rules.py
          python scripts/sync_v061_print_supplementals.py
          git diff --exit-code -- scripts/sync_v061_print_supplementals.py scripts/sync_v061_public_rules.py deckbuilder/ start/ playtest/onboarding/ playtest/player-mat/ factions/ faction-sheets/
