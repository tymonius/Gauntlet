name: Sync Deckbuilder to v0.6.1

on:
  push:
    branches:
      - rules/v0.6.1-playtest-revision
    paths:
      - ".github/workflows/sync-v061-deckbuilder.yml"
      - "scripts/sync_v061_deckbuilder.py"
      - "deckbuilder/**"
      - "docs/Gauntlet_v0.6.1_Neutral_Card_Pool.md"
      - "docs/Gauntlet_v0.6.1_Territory_Pool.md"
      - "releases/v0.6.1/faction-guides/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/sync-v061-deckbuilder.yml"
      - "scripts/sync_v061_deckbuilder.py"
      - "deckbuilder/**"
      - "docs/Gauntlet_v0.6.1_Neutral_Card_Pool.md"
      - "docs/Gauntlet_v0.6.1_Territory_Pool.md"
      - "releases/v0.6.1/faction-guides/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-v061-deckbuilder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Synchronize and validate Deckbuilder
        run: python scripts/sync_v061_deckbuilder.py

      - name: Commit synchronized Deckbuilder sources when changed
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deckbuilder/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Synchronize Deckbuilder sources and version to v0.6.1"
          git push origin HEAD:rules/v0.6.1-playtest-revision

      - name: Verify clean synchronization
        run: |
          python scripts/sync_v061_deckbuilder.py
          git diff --exit-code -- deckbuilder/
