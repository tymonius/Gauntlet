name: Validate and Deploy Artwork Authoring Worker

on:
  pull_request:
    paths:
      - "workers/artwork-authoring/**"
      - "card-design/artwork-authoring-client.js"
      - "card-design/artwork-batch-publish-control.js"
      - "card-design/artwork-compositor-targets.js"
      - ".github/workflows/deploy-artwork-authoring.yml"
  push:
    branches:
      - main
    paths:
      - "workers/artwork-authoring/**"
      - "card-design/artwork-authoring-client.js"
      - "card-design/artwork-batch-publish-control.js"
      - "card-design/artwork-compositor-targets.js"
      - ".github/workflows/deploy-artwork-authoring.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artwork-authoring-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validation revision
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate artwork authoring code
        run: |
          node --check workers/artwork-authoring/src/index.js
          node --check workers/artwork-authoring/src/index-publish.js
          node --check workers/artwork-authoring/src/format.js
          node --check card-design/artwork-authoring-client.js
          node --check card-design/artwork-batch-publish-control.js
          node --check card-design/artwork-compositor-targets.js
          node --test workers/artwork-authoring/src/index.node-test.mjs

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ARTWORK_GITHUB_CLIENT_ID: ${{ secrets.ARTWORK_GITHUB_CLIENT_ID }}
      ARTWORK_GITHUB_CLIENT_SECRET: ${{ secrets.ARTWORK_GITHUB_CLIENT_SECRET }}
      ARTWORK_SESSION_SECRET: ${{ secrets.ARTWORK_SESSION_SECRET }}
    steps:
      - name: Check out deployment revision
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deployment secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          test -n "$ARTWORK_GITHUB_CLIENT_ID" || { echo "ARTWORK_GITHUB_CLIENT_ID is not configured"; exit 1; }
          test -n "$ARTWORK_GITHUB_CLIENT_SECRET" || { echo "ARTWORK_GITHUB_CLIENT_SECRET is not configured"; exit 1; }
          test -n "$ARTWORK_SESSION_SECRET" || { echo "ARTWORK_SESSION_SECRET is not configured"; exit 1; }

      - name: Install Worker tooling
        run: npm install --no-save wrangler@4

      - name: Deploy artwork authoring service
        run: npx wrangler deploy --config workers/artwork-authoring/wrangler.toml

      - name: Configure Worker secrets
        run: |
          printf '%s' "$ARTWORK_GITHUB_CLIENT_ID" |
            npx wrangler secret put ARTWORK_GITHUB_CLIENT_ID --config workers/artwork-authoring/wrangler.toml
          printf '%s' "$ARTWORK_GITHUB_CLIENT_SECRET" |
            npx wrangler secret put ARTWORK_GITHUB_CLIENT_SECRET --config workers/artwork-authoring/wrangler.toml
          printf '%s' "$ARTWORK_SESSION_SECRET" |
            npx wrangler secret put ARTWORK_SESSION_SECRET --config workers/artwork-authoring/wrangler.toml

      - name: Verify production artwork APIs
        run: |
          worker="https://gauntlet-artwork-authoring.tymon-scott.workers.dev"

          curl --fail --retry 8 --retry-delay 4 --retry-all-errors \
            "$worker/health" \
            -o /tmp/artwork-authoring-health.json
          node -e '
            const fs = require("fs");
            const health = JSON.parse(fs.readFileSync("/tmp/artwork-authoring-health.json", "utf8"));
            if (
              !health.ok ||
              health.service !== "gauntlet-artwork-authoring" ||
              !health.configured ||
              health.batchPublishing !== true ||
              health.apiCors !== true ||
              health.saveEndpoint !== "/api/art-direction" ||
              health.publishEndpoint !== "/api/art-direction/publish"
            ) {
              console.error(health);
              process.exit(1);
            }
            console.log("Verified production artwork-authoring capabilities.");
          '

          for endpoint in /api/art-direction /api/art-direction/publish; do
            safe_name="$(printf '%s' "$endpoint" | tr '/-' '__')"
            headers="/tmp/${safe_name}.headers"

            curl --fail --silent --show-error \
              -X OPTIONS \
              -H 'Origin: https://gauntlet.run' \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: authorization,content-type' \
              -D "$headers" \
              -o /dev/null \
              "$worker$endpoint"

            grep -Eiq '^access-control-allow-origin:[[:space:]]*https://gauntlet\.run' "$headers" || {
              cat "$headers"
              echo "$endpoint did not return the required CORS origin." >&2
              exit 1
            }
            grep -Eiq '^access-control-allow-methods:.*POST' "$headers" || {
              cat "$headers"
              echo "$endpoint did not allow POST." >&2
              exit 1
            }
            grep -Eiq '^access-control-allow-headers:.*authorization' "$headers" || {
              cat "$headers"
              echo "$endpoint did not allow the Authorization header." >&2
              exit 1
            }
          done
