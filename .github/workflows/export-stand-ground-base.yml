name: Deploy Stand Ground

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    if: github.head_ref == 'agent/neutral-stand-ground'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stand Ground branch
        uses: actions/checkout@v4
        with:
          ref: agent/neutral-stand-ground
          fetch-depth: 0

      - name: Verify and deploy source
        run: |
          set -euo pipefail
          echo '235a87e6d032722b26e39b89ea49d5e6448c2a399c13453720fc0a225be298f9  .github/stand-ground-final-00.b64' | sha256sum -c -
          echo '6060259b663d09c7182222028b4f53335ae9f774c41cdb1cffae02aa15de8c39  .github/stand-ground-final-01a.b64' | sha256sum -c -
          echo '44dd7e16c373fbeeb5ee030bb8b1ba53106d2ae349734ae62f04260525ebab20  .github/stand-ground-final-01b.b64' | sha256sum -c -
          echo 'bf6efb4dc194644d790b0211316ad244d18ba3abfa04050d2f94ee2a5408059e  .github/stand-ground-final-02.b64' | sha256sum -c -
          echo '5d6a72e30e526a661a6a4ce6296279d1b58a762b0202baf889b1527b305c9770  .github/stand-ground-final-03.b64' | sha256sum -c -
          echo '7a0ec8fed81271605ade8edb622de2756a3dbec71750644f11c49fc820360097  .github/stand-ground-final-04.b64' | sha256sum -c -
          echo '0281c11cdd463810bd1acf3eacee363620410c118dfa502d0060c795ed089771  .github/stand-ground-final-05.b64' | sha256sum -c -
          echo 'ce76298fde95ad83a5619336511ce6dbb6e22b68f1987a0cc6a70deced71afd5  .github/stand-ground-final-06.b64' | sha256sum -c -
          echo 'b1d96ad0c57eacf3ad71f49fbdaf14663c96c63e0e3d00321f1244281fd18dca  .github/stand-ground-final-07.b64' | sha256sum -c -
          echo '5ca42038a3d70ed2c773c71a9d4a8816e7b17acd2d1d9c14d0b6a292881f8c9c  .github/stand-ground-final-08.b64' | sha256sum -c -
          echo '5a15db68e6bd90800d095e811b019b9b7fc57c66cd13029b6d1897bebf67f71c  .github/stand-ground-final-09.b64' | sha256sum -c -
          echo '8f315a6f504062725ea886931a11477329b8e97d8988cb999044185254a631e9  .github/stand-ground-final-10.b64' | sha256sum -c -
          echo '6800b045e84b0ad5c433bcac03e840ee1937a04d8e18c6441179a4ce1c0fc37f  .github/stand-ground-final-11.b64' | sha256sum -c -

          cat \
            .github/stand-ground-final-00.b64 \
            .github/stand-ground-final-01a.b64 \
            .github/stand-ground-final-01b.b64 \
            .github/stand-ground-final-02.b64 \
            .github/stand-ground-final-03.b64 \
            .github/stand-ground-final-04.b64 \
            .github/stand-ground-final-05.b64 \
            .github/stand-ground-final-06.b64 \
            .github/stand-ground-final-07.b64 \
            .github/stand-ground-final-08.b64 \
            .github/stand-ground-final-09.b64 \
            .github/stand-ground-final-10.b64 \
            .github/stand-ground-final-11.b64 \
            > /tmp/stand-ground-final.b64

          test "$(wc -c < /tmp/stand-ground-final.b64)" -eq 41744
          echo 'e88c9d36d70044af21b22f0770f7c6458a8d804d16a6ea37839ca78396e30db2  /tmp/stand-ground-final.b64' | sha256sum -c -
          base64 -d /tmp/stand-ground-final.b64 > /tmp/stand-ground-final.tar.gz
          test "$(wc -c < /tmp/stand-ground-final.tar.gz)" -eq 31307
          echo '328691e48835d60976858517a3b7867c385c8d077b43693cb5820a13881f924c  /tmp/stand-ground-final.tar.gz' | sha256sum -c -
          tar -xzf /tmp/stand-ground-final.tar.gz

          rm -f .github/stand-ground-*.b64
          rm -f .github/trigger-export-stand-ground.txt
          git fetch origin main
          git checkout origin/main -- .github/workflows/test.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Neutral Stand Ground'
          git push origin HEAD:agent/neutral-stand-ground
