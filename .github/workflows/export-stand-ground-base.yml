name: Export Stand Ground Base

on:
  pull_request:
    branches:
      - main

jobs:
  export:
    if: github.head_ref == 'agent/neutral-stand-ground'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Package canonical runtime inputs
        run: |
          set -euo pipefail
          tar -czf /tmp/stand-ground-runtime.tar.gz \
            releases/v0.6.0/Gauntlet_v0.6.0_Canonical_Data.json
      - name: Upload canonical runtime inputs
        uses: actions/upload-artifact@v4
        with:
          name: stand-ground-runtime
          path: /tmp/stand-ground-runtime.tar.gz
