name: Publish v0.7.0 TTS release assets

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: publish-v070-tts-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.release.tag_name == 'v0.7.0'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout published release source
        uses: actions/checkout@v4
        with:
          ref: v0.7.0
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Generate strict v0.7.0 TTS package
        run: |
          npm run tts:check
          npm run tts:cards -- --strict-art
          npm run tts:territories
          npm run tts:leaders
          npm run tts:starters
          npm run tts:supplementals
          npm run tts:finalized-supplementals
          npm run tts:release:stage
          npm run tts:save
          npm run tts:save:assemble
          npm run tts:save:finalize
          npm run tts:release:status

      - name: Confirm machine-ready release status
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const candidates = fs.readdirSync('tts/generated/current').filter(name => /readiness/i.test(name) && name.endsWith('.json'));
          if (!candidates.length) {
            console.log('No current-alias readiness JSON found; release-status command already enforced the configured release-candidate gate.');
            process.exit(0);
          }
          for (const name of candidates) {
            const payload = JSON.parse(fs.readFileSync(path.join('tts/generated/current', name), 'utf8'));
            const value = payload.machineReady ?? payload.machine_ready ?? payload.ready;
            if (value === false) throw new Error(`${name} reports machineReady=false.`);
          }
          NODE

      - name: Upload deterministic TTS network assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find tts/generated/release-assets -maxdepth 1 -type f -name 'Gauntlet_*_TTS_Release_Assets.json' -print -quit)"
          test -n "$manifest"
          tag="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(m.releaseTag)" "$manifest")"
          repo="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(m.repository)" "$manifest")"
          test "$tag" = "v0.7.0"
          test "$repo" = "$GITHUB_REPOSITORY"
          gh release view "$tag" --repo "$repo" >/dev/null
          mapfile -t assets < <(find tts/generated/release-assets -maxdepth 1 -type f -print | sort)
          test "${#assets[@]}" -gt 1
          gh release upload "$tag" --repo "$repo" --clobber "${assets[@]}"

      - name: Verify published TTS asset URLs
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find tts/generated/release-assets -maxdepth 1 -type f -name 'Gauntlet_*_TTS_Release_Assets.json' -print -quit)"
          node - "$manifest" <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          (async () => {
            for (const asset of manifest.assets) {
              let lastStatus = 0;
              for (let attempt = 1; attempt <= 6; attempt += 1) {
                const response = await fetch(asset.url, { redirect: 'follow' });
                lastStatus = response.status;
                if (response.ok) break;
                if (attempt < 6) await sleep(2000 * attempt);
              }
              if (lastStatus < 200 || lastStatus >= 300) {
                throw new Error(`Published TTS asset is not reachable (${lastStatus}): ${asset.url}`);
              }
            }
            console.log(`Verified ${manifest.assets.length} hosted TTS asset URLs for ${manifest.releaseTag}.`);
          })().catch(error => {
            console.error(error.stack || error.message || error);
            process.exitCode = 1;
          });
          NODE
