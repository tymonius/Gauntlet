name: Apply No Martyrs V2

on:
  push:
    branches:
      - agent/inquisition-no-martyrs-v2
    paths:
      - .github/workflows/apply-no-martyrs-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/inquisition-no-martyrs-v2
          fetch-depth: 0
      - name: Apply implementation
        run: |
          cat .github/no-martyrs-v2-patch/part* | base64 --decode > /tmp/no-martyrs-v2.patch
          patch -p1 --batch < /tmp/no-martyrs-v2.patch
          rm -rf .github/no-martyrs-v2-patch
          rm -f .github/workflows/no-martyrs-v2-source.yml
          rm -f .github/workflows/apply-no-martyrs-v2.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Inquisition No Martyrs"
          git push origin HEAD:agent/inquisition-no-martyrs-v2
