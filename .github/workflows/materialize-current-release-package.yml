name: Materialize current release package

on:
  push:
    branches:
      - main
      - "release/**-finalize"
    paths:
      - game-data/**
      - rulebook/**
      - card-design/**
      - images/artwork/cards/**
      - images/artwork/card-backgrounds/**
      - design-tokens.css
      - rulebook-design/**
      - rulebook-production/**
      - legacy/v0.6.1-rulebook-publication/**
      - config/release-lifecycle.json
      - config/github-release-contract.json
      - scripts/build-*-release-source.mjs
      - scripts/render-*-booklet.mjs
      - scripts/run-*-rulebook-renderer.mjs
      - scripts/build-rulebook-production.py
      - scripts/build-v063-rulebook-production.py
      - scripts/render-current-rulebook-booklet.mjs
      - scripts/materialize-public-route-compatibility.mjs
      - scripts/validate-current-*.mjs
      - scripts/validate-github-release-contract.mjs
      - scripts/publication-utils.mjs
      - images/sketches/**
      - .github/workflows/materialize-current-release-package.yml
  pull_request:
    branches:
      - main
    paths:
      - game-data/**
      - rulebook/**
      - card-design/**
      - images/artwork/cards/**
      - images/artwork/card-backgrounds/**
      - design-tokens.css
      - rulebook-design/**
      - rulebook-production/**
      - legacy/v0.6.1-rulebook-publication/**
      - config/release-lifecycle.json
      - config/github-release-contract.json
      - scripts/build-*-release-source.mjs
      - scripts/render-*-booklet.mjs
      - scripts/run-*-rulebook-renderer.mjs
      - scripts/build-rulebook-production.py
      - scripts/build-v063-rulebook-production.py
      - scripts/render-current-rulebook-booklet.mjs
      - scripts/materialize-public-route-compatibility.mjs
      - scripts/validate-current-*.mjs
      - scripts/validate-github-release-contract.mjs
      - scripts/publication-utils.mjs
      - images/sketches/**
      - .github/workflows/materialize-current-release-package.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: materialize-current-release-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, 'Refresh current release package') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve lifecycle-selected current release
        id: plan
        run: |
          node --check scripts/render-current-rulebook-booklet.mjs
          node scripts/render-current-rulebook-booklet.mjs --plan

      - name: Install release validation dependencies
        run: |
          npm install
          npm install --no-save --package-lock=false pdf-lib

      - name: Install Rulebook rendering dependencies
        if: ${{ steps.plan.outputs.eligible == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Install publication utility font
        if: ${{ steps.plan.outputs.eligible == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-inter
          fc-match Inter

      - name: Materialize lifecycle-selected release package
        if: ${{ steps.plan.outputs.eligible == 'true' }}
        run: node scripts/render-current-rulebook-booklet.mjs

      - name: Preserve frozen current package when development has advanced
        if: ${{ steps.plan.outputs.eligible != 'true' }}
        run: |
          echo "Current authority is ${{ steps.plan.outputs.authority_version }} (${{ steps.plan.outputs.authority_status }})."
          echo "Published ${{ steps.plan.outputs.version }} remains frozen; regeneration and writes are disabled."

      - name: Materialize historical public route compatibility
        run: node scripts/materialize-public-route-compatibility.mjs

      - name: Validate current release package
        run: |
          node scripts/validate-current-public-contract.mjs
          node scripts/validate-current-release-payload.mjs
          node scripts/validate-current-rulebook-booklet-provenance.mjs
          node scripts/validate-github-release-contract.mjs
          node scripts/validate-release-path-normalization.mjs

      - name: Upload current release package preview
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-current-release-package-${{ steps.plan.outputs.version }}
          path: ${{ steps.plan.outputs.release_root }}/**
          if-no-files-found: error

      - name: Prepare protected-main release refresh
        if: ${{ steps.plan.outputs.eligible == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.plan.outputs.version }}"
          release_root="${{ steps.plan.outputs.release_root }}"
          branch="automation/current-release-package-refresh"

          if [[ -z "$(git status --porcelain -- "$release_root")" ]]; then
            echo "Generated $version package already matches main."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add "$release_root"
          git commit -m "Refresh current release package ($version)"
          git push --force origin "HEAD:$branch"

          compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
          echo "Generated refresh branch: `$branch`" >> "$GITHUB_STEP_SUMMARY"
          echo "Refresh PR: $compare_url" >> "$GITHUB_STEP_SUMMARY"

          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            if gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "Refresh $version release package" \
              --body "Automated rematerialization of the lifecycle-selected current release package after publication-source changes landed on main. This updates the tracked Rulebook booklet and manifest/provenance payload without bypassing protected-main review."; then
              pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
            else
              echo "::warning::GitHub Actions could not open the refresh PR automatically. The branch is ready at $compare_url."
            fi
          fi

          if [[ -n "$pr_number" ]]; then
            echo "Refresh PR #$pr_number is open; dispatching protected-main checks on the generated head commit."
            gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
            gh workflow run pr-quality-gate.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
            gh workflow run governance-integrity.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          fi

      - name: Commit materialized current release package
        if: ${{ steps.plan.outputs.eligible == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') && endsWith(github.ref, '-finalize') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.plan.outputs.version }}"
          release_root="${{ steps.plan.outputs.release_root }}"
          node scripts/commit-generated-files.mjs \
            "Materialize current release package ($version)" -- \
            "${release_root}/Gauntlet_${version}_Rulebook.md" \
            "${release_root}/Gauntlet_${version}_Rulebook_Booklet.pdf" \
            "${release_root}/Gauntlet_${version}_Card_Anatomy.png" \
            "${release_root}/Gauntlet_${version}_Arcane_Trait_Mark.png" \
            "${release_root}/Gauntlet_${version}_Canonical_Data.json" \
            "${release_root}/Gauntlet_${version}_Starter_Decks.json" \
            "${release_root}/Gauntlet_${version}_Source_Provenance.json" \
            "${release_root}/Gauntlet_${version}_Manifest.json"
