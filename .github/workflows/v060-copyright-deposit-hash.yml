name: v0.6.0 copyright deposit hash

on:
  push:
    branches:
      - docs/v060-expressive-provenance

permissions:
  contents: read

jobs:
  hash-deposit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover and hash July 20 Rulebook PDF
        shell: bash
        run: |
          set -euo pipefail
          git show e3d03c68c182c4ea61947019485b4b09f7ca07b9:releases/v0.6/Gauntlet_v0.6.0_Rulebook.pdf > /tmp/Gauntlet_v0.6.0_Rulebook.pdf
          echo "COPYRIGHT_DEPOSIT_SHA256=$(sha256sum /tmp/Gauntlet_v0.6.0_Rulebook.pdf | awk '{print $1}')"
          echo "COPYRIGHT_DEPOSIT_BYTES=$(wc -c < /tmp/Gauntlet_v0.6.0_Rulebook.pdf | tr -d ' ')"
