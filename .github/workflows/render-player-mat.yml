name: Validate current player mat

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/render-player-mat.yml"
      - "config/release-lifecycle.json"
      - "config/release-locks.json"
      - "apps/playtest/player-mat/index.html"
      - "v0.6.2/print/player-mat.html"
      - "scripts/validate-release-recovery-state.mjs"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/render-player-mat.yml"
      - "config/release-lifecycle.json"
      - "config/release-locks.json"
      - "apps/playtest/player-mat/index.html"
      - "v0.6.2/print/player-mat.html"
      - "scripts/validate-release-recovery-state.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate release recovery locks
        run: node scripts/validate-release-recovery-state.mjs

      - name: Validate lifecycle-selected current player mat
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lifecycle = JSON.parse(fs.readFileSync('config/release-lifecycle.json', 'utf8'));
          const version = String(lifecycle.current_release || '');
          const release = lifecycle.releases?.[version];
          if (!version || release?.status !== 'current' || release?.public_cutover !== true) {
            throw new Error(`Release lifecycle does not identify an approved current release: ${version || 'missing'}`);
          }
          const currentPath = 'apps/playtest/player-mat/index.html';
          const current = fs.readFileSync(currentPath, 'utf8');
          for (const marker of [`Gauntlet ${version} Player Mat`, `Gauntlet ${version}`, 'Hand', 'Reserve', 'Gambit', 'Tactic', 'Asset Bank']) {
            if (!current.includes(marker)) throw new Error(`Current ${version} player mat is missing: ${marker}`);
          }
          if (current.includes('v0.6.2/print/player-mat.html')) {
            throw new Error('Current player mat still redirects to withdrawn v0.6.2.');
          }
          console.log(`Validated current ${version} player mat.`);
          NODE
