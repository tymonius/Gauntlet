name: Validate current player mat

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/render-player-mat.yml"
      - "config/release-lifecycle.json"
      - "config/release-locks.json"
      - "playtest/player-mat/index.html"
      - "v0.6.2/print/player-mat.html"
      - "scripts/validate-release-recovery-state.mjs"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/render-player-mat.yml"
      - "config/release-lifecycle.json"
      - "config/release-locks.json"
      - "playtest/player-mat/index.html"
      - "v0.6.2/print/player-mat.html"
      - "scripts/validate-release-recovery-state.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate release recovery locks
        run: node scripts/validate-release-recovery-state.mjs

      - name: Validate current v0.7.0 player mat
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const currentPath = 'playtest/player-mat/index.html';
          const current = fs.readFileSync(currentPath, 'utf8');
          for (const marker of ['Gauntlet v0.7.0 Player Mat', 'Gauntlet v0.7.0', 'Hand', 'Reserve', 'Gambit', 'Tactic', 'Asset Bank']) {
            if (!current.includes(marker)) throw new Error(`Current v0.7.0 player mat is missing: ${marker}`);
          }
          if (current.includes('v0.6.2/print/player-mat.html')) {
            throw new Error('Current player mat still redirects to withdrawn v0.6.2.');
          }
          console.log('Validated current v0.7.0 player mat.');
          NODE
