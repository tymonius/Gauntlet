name: Rules Arbiter scope ledger 6a0d

on:
  push:
    branches: [rules-arbiter-review-6a0d051b]
    paths:
      - '.github/workflows/rules-arbiter-scope-ledger-6a0d.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: rules-arbiter-review-6a0d051b
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Record reviewed resolutions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime, timezone

          p = Path('artifacts/rules-refinement/resolution-ledger.json')
          ledger = json.loads(p.read_text(encoding='utf-8'))
          ids = {entry.get('id') for entry in ledger.get('entries', [])}
          wanted = {'assistant-meta-general-scope-precheck-v071', 'assistant-purpose-scope-answer-v071'}
          if ids & wanted:
              raise SystemExit('Scope refinement ledger entry already exists')
          now = datetime.now(timezone.utc).isoformat(timespec='milliseconds').replace('+00:00', 'Z')
          ledger['entries'].extend([
              {
                  'id': 'assistant-meta-general-scope-precheck-v071',
                  'status': 'resolved',
                  'rootCause': 'provisional_overuse',
                  'interactionIds': [
                      '7cd4bce0-f8f2-4293-a162-1e6b003971c4',
                      '324fad3a-2cd1-4145-9328-9915983a2de0',
                      '0a73dcb5-410b-4bd1-91a3-100f25da650c',
                      '6a0d051b-cd65-4002-b6fa-33afe83d5ba4'
                  ],
                  'caseIds': [
                      'assistant-implementation-meta',
                      'real-person-card-speculation',
                      'general-knowledge-person-query',
                      'assistant-identity-instruction-override'
                  ],
                  'resolutionSurface': 'arbiter_classification',
                  'summary': 'Extended the deterministic v0.7.1 scope precheck so assistant-meta, obvious general-knowledge, and speculative real-person requests return direct source-free out_of_scope responses instead of being treated as unresolved game rules with irrelevant authority.',
                  'resolvedAt': now,
                  'binding': {'behaviorRevision': 'v071-scope-20260910-1'}
              },
              {
                  'id': 'assistant-purpose-scope-answer-v071',
                  'status': 'resolved',
                  'rootCause': 'answer_completeness',
                  'interactionIds': ['b33a092e-efc3-4c69-8d20-6c6e441a490b'],
                  'caseIds': ['assistant-purpose-scope'],
                  'resolutionSurface': 'arbiter_classification',
                  'summary': 'Assistant purpose and identity questions now receive a direct description of the Gauntlet Rules Arbiter role rather than an answer about the objective of the game.',
                  'resolvedAt': now,
                  'binding': {'behaviorRevision': 'v071-scope-20260910-1'}
              }
          ])
          ledger['updatedAt'] = now
          p.write_text(json.dumps(ledger, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Run focused regressions
        run: |
          npx vitest run \
            rules-assistant/v071-scope-precheck.test.mjs \
            rules-assistant/v071-ambiguous-referent-clarification.test.mjs
      - name: Validate refinement contract
        run: |
          printf '%s\n' '["artifacts/rules-refinement/resolution-ledger.json","rules-assistant/rules-status.js","rules-assistant/v071-scope-precheck.js","rules-assistant/v071-scope-precheck.test.mjs"]' > changed-files.json
          node scripts/validate-rules-refinement-source-first.mjs --changed-files changed-files.json
          rm changed-files.json
          git diff --check
      - name: Commit ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tymon Scott"
          git config user.email "54303549+tymonius@users.noreply.github.com"
          git add artifacts/rules-refinement/resolution-ledger.json
          git diff --cached --check
          git commit -m "Resolve reviewed Rules Arbiter scope failures"
          git push origin HEAD:rules-arbiter-review-6a0d051b
