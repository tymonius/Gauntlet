name: Deploy v0.6.1 Rules and Playtest Workers

on:
  push:
    branches:
      - rules/v0.6.1-playtest-revision
    paths:
      - ".github/workflows/deploy-v061-workers.yml"
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply pending D1 migrations before deployment
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: deploy-v061-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PLAYTEST_SESSION_ADMIN_TOKEN: ${{ secrets.PLAYTEST_SESSION_ADMIN_TOKEN }}
    steps:
      - name: Check out v0.6.1 revision
        uses: actions/checkout@v4
        with:
          ref: rules/v0.6.1-playtest-revision

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deployment secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          test -n "$PLAYTEST_SESSION_ADMIN_TOKEN" || { echo "PLAYTEST_SESSION_ADMIN_TOKEN is not configured"; exit 1; }

      - name: Install validation and Worker tooling
        run: |
          npm install
          npm install --no-save wrangler@4

      - name: Validate deployment sources and session lifecycle
        run: |
          npm run test:rules-assistant
          npm run test:playtest-sessions
          npm run test:formal-session-e2e
          python scripts/validate_v061_playtest_sessions.py
          python scripts/validate_v061_release.py

      - name: Apply shared D1 migrations
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.apply_migrations }}
        run: >-
          npx wrangler d1 migrations apply gauntlet-rules-assistant
          --remote
          --config rules-assistant/wrangler.toml

      - name: Deploy v0.6.1 Rules Arbiter
        run: npx wrangler deploy --config rules-assistant/wrangler.toml

      - name: Deploy formal playtest session service
        run: npx wrangler deploy --config workers/playtest-sessions/wrangler.toml

      - name: Configure facilitator session-creation secret
        run: >-
          printf '%s' "$PLAYTEST_SESSION_ADMIN_TOKEN" |
          npx wrangler secret put SESSION_ADMIN_TOKEN
          --config workers/playtest-sessions/wrangler.toml

      - name: Verify production health endpoints
        run: |
          curl --fail --retry 8 --retry-delay 4 --retry-all-errors \
            https://gauntlet-rules-assistant.tymon-scott.workers.dev/health \
            -o /tmp/rules-health.json
          curl --fail --retry 8 --retry-delay 4 --retry-all-errors \
            https://gauntlet-playtest-sessions.tymon-scott.workers.dev/health \
            -o /tmp/session-health.json
          python - <<'PY'
          import json
          from pathlib import Path

          rules = json.loads(Path('/tmp/rules-health.json').read_text())
          sessions = json.loads(Path('/tmp/session-health.json').read_text())
          if not rules.get('ok') or rules.get('version') != 'v0.6.1':
              raise SystemExit(f'Rules Arbiter health failed: {rules}')
          if not sessions.get('ok') or sessions.get('version') != 'v0.6.1':
              raise SystemExit(f'Playtest session health failed: {sessions}')
          if not sessions.get('database'):
              raise SystemExit(f'Playtest session D1 binding unavailable: {sessions}')
          if not sessions.get('sessionCreationConfigured'):
              raise SystemExit(f'Playtest session creation secret unavailable: {sessions}')
          print('Verified production v0.6.1 Rules Arbiter and formal playtest session Workers.')
          PY

      - name: Record deployment gate result
        if: ${{ always() }}
        env:
          DEPLOYMENT_STATUS: ${{ job.status }}
          DEPLOYMENT_RUN_ID: ${{ github.run_id }}
          DEPLOYMENT_SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          result = {
              "version": "v0.6.1",
              "environment": "production",
              "status": os.environ["DEPLOYMENT_STATUS"],
              "run_id": int(os.environ["DEPLOYMENT_RUN_ID"]),
              "source_sha": os.environ["DEPLOYMENT_SOURCE_SHA"],
              "recorded_at": datetime.now(timezone.utc).isoformat(),
          }
          path = Path("releases/v0.6.1/deployment-status.json")
          path.write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          PY
          git add releases/v0.6.1/deployment-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record v0.6.1 production deployment gate"
          git push origin HEAD:rules/v0.6.1-playtest-revision
