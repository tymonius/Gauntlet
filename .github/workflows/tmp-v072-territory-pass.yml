name: Temporary v0.7.2 territory authority update

on:
  push:
    branches:
      - balance/territory-pass-v072-final
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: balance/territory-pass-v072-final
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Finalize Territory authority
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'game-data/current-game.json';
          const authority = JSON.parse(fs.readFileSync(path, 'utf8'));
          const byName = new Map(authority.gameplay.territories.map(t => [t.name, t]));

          const quicksand = byName.get('Quicksand');
          if (!quicksand) throw new Error('Quicksand not found');
          const quicksandText = 'When a player enters this Territory, their movement ends. A player who begins their Movement here cannot Advance or Fall Back more than 1 Position or use an effect to increase their movement that turn. Retreat is unaffected.';
          quicksand.text = quicksandText;
          if (!Array.isArray(quicksand.effects) || quicksand.effects.length !== 1) throw new Error('Unexpected Quicksand effects mirror');
          quicksand.effects[0].text = quicksandText;

          const expected = {
            general: ["Smuggler's Run", "King's Road", 'Arena: No Quarter'],
            commandant: ['Garrison', 'Training Grounds', 'High Ground'],
            ambassador: ['Refuge', 'Supply Depot', 'Command Tent'],
            senator: ['Refuge', 'Garrison', 'Fortified Pass'],
            banker: ['Supply Depot', 'Ruined Storehouse', 'Arena: Spoils of War'],
            executive: ["Smuggler's Run", "King's Road", 'Arena: No Quarter'],
            'spirit-walker': ['Garrison', 'Training Grounds', 'High Ground'],
            alchemist: ['Poisonous Gas', 'Old Battlefield', 'Ruined Storehouse'],
            'grand-inquisitor': ['Poisonous Gas', 'Toll Bridge', 'Arena: Grand Melee'],
            'witch-hunter': ['Garrison', 'Training Grounds', 'High Ground'],
            spymaster: ['Refuge', 'Ruined Storehouse', 'Field Hospital'],
            ranger: ['Quicksand', 'Difficult Terrain', 'Poisonous Gas'],
          };
          const decks = new Map(authority.starterDecks.decks.map(d => [d.leaderId, d]));
          if (decks.size !== 12) throw new Error(`Expected 12 starter decks, found ${decks.size}`);
          for (const [leader, territories] of Object.entries(expected)) {
            const deck = decks.get(leader);
            if (!deck) throw new Error(`Missing starter deck: ${leader}`);
            for (const territory of territories) if (!byName.has(territory)) throw new Error(`Unknown Territory: ${territory}`);
            deck.territories = territories;
          }
          fs.writeFileSync(path, JSON.stringify(authority, null, 2) + '\n');
          NODE
      - name: Install deterministic test dependencies
        run: |
          git fetch origin main --depth=1
          git show origin/main:package-lock.json > package-lock.json
          npm ci
      - name: Run authority test
        run: npx vitest run tests/current-game-authority.test.ts
      - name: Commit finalized Territory authority
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-v072-territory-pass.yml
          git add game-data/current-game.json
          git commit -m 'Finalize v0.7.2 Territory starter packages'
          git push origin HEAD:balance/territory-pass-v072-final
