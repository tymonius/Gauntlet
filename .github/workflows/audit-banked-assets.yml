name: Audit banked Assets

on:
  pull_request:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source snapshot
        run: |
          zip -qr gauntlet-source-snapshot.zip src package.json package-lock.json tsconfig.json vitest.config.ts
      - uses: actions/upload-artifact@v4
        with:
          name: gauntlet-source-snapshot
          path: gauntlet-source-snapshot.zip
