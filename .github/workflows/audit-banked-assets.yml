name: Verify Illegal Occupation Reconstruction

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    if: github.head_ref == 'agent/neutral-illegal-occupation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/neutral-illegal-occupation
      - name: Verify reconstruction
        run: |
          set +e
          {
            wc -c .github/io-prefix-10000-24000.b64
            sha256sum .github/io-prefix-10000-24000.b64
            cat .github/io-archive-00.b64 .github/io-prefix-10000-24000.b64 > /tmp/illegal-occupation-files.b64
            tail -c +3978 .github/io-tail-00.b64 >> /tmp/illegal-occupation-files.b64
            head -c 6977 .github/io-tail-01.b64 >> /tmp/illegal-occupation-files.b64
            cat .github/io-archive-03.b64 >> /tmp/illegal-occupation-files.b64
            tail -c +978 .github/io-tail-03.b64 >> /tmp/illegal-occupation-files.b64
            wc -c /tmp/illegal-occupation-files.b64
            sha256sum /tmp/illegal-occupation-files.b64
            base64 -d /tmp/illegal-occupation-files.b64 > /tmp/illegal-occupation-files.tar.gz
            echo "decode-exit=$?"
            wc -c /tmp/illegal-occupation-files.tar.gz
            sha256sum /tmp/illegal-occupation-files.tar.gz
            tar -tzf /tmp/illegal-occupation-files.tar.gz | head -50
            echo "tar-exit=${PIPESTATUS[0]}"
          } > reconstruction-diagnostic.txt 2>&1
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: illegal-occupation-reconstruction-diagnostic
          path: reconstruction-diagnostic.txt
