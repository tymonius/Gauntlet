name: Verify Illegal Occupation Source

on:
  pull_request:
    branches:
      - main

jobs:
  verify-source:
    if: github.head_ref == 'agent/neutral-illegal-occupation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/neutral-illegal-occupation
      - name: Package source
        run: |
          zip -qr illegal-occupation-source.zip src package.json package-lock.json tsconfig.json vitest.config.ts
      - uses: actions/upload-artifact@v4
        with:
          name: illegal-occupation-source
          path: illegal-occupation-source.zip
