name: Finalize Illegal Occupation Source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/neutral-illegal-occupation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/neutral-illegal-occupation
      - name: Correct and clean source branch
        run: |
          sed -i "s/'Lt is not this player’s Action Opportunity\.'/'It is not this player’s Action Opportunity.'/" src/state/intelligence-missions.ts
          rm -f deployment-capture.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/state/intelligence-missions.ts deployment-capture.txt
          git commit -m "Finalize Illegal Occupation source"
          git push origin HEAD:agent/neutral-illegal-occupation
