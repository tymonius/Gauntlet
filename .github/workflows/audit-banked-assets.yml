name: Diagnose Illegal Occupation Prefix

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    if: github.head_ref == 'agent/neutral-illegal-occupation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/neutral-illegal-occupation
      - name: Inspect prefix candidates
        run: |
          {
            for file in \
              .github/io-archive-00.b64 \
              .github/io-archive-01.b64 \
              .github/io-archive-03.b64; do
              wc -c "$file"
              sha256sum "$file"
              head -c 40 "$file"; echo
              tail -c 40 "$file"; echo
            done
          } > prefix-diagnostic.txt 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: illegal-occupation-prefix-diagnostic
          path: prefix-diagnostic.txt
