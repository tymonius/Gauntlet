name: Audit banked Assets

on:
  pull_request:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find Asset activity checks
        run: |
          {
            echo '=== all assetBank references ==='
            grep -R -n "assetBank" src/state src/cards src/types || true
            echo '=== bankedAssetUseProhibited ==='
            grep -R -n "bankedAssetUseProhibited" src/state src/cards src/types || true
            echo '=== bankedAssetUseAllowed ==='
            grep -R -n "bankedAssetUseAllowed" src/state src/cards src/types || true
          } > banked-asset-audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: banked-asset-audit
          path: banked-asset-audit.txt
