name: Diagnose Illegal Occupation Deploy

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    if: github.head_ref == 'agent/neutral-illegal-occupation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/neutral-illegal-occupation
      - name: Inspect staged archive
        run: |
          set +e
          {
            echo "archive-bytes=$(wc -c < .github/illegal-occupation-files.b64)"
            sha256sum .github/illegal-occupation-files.b64
            base64 -d .github/illegal-occupation-files.b64 > /tmp/illegal-occupation-files.tar.gz
            echo "decode-exit=$?"
            echo "decoded-bytes=$(wc -c < /tmp/illegal-occupation-files.tar.gz)"
            sha256sum /tmp/illegal-occupation-files.tar.gz
            tar -tzf /tmp/illegal-occupation-files.tar.gz | head -50
            echo "tar-exit=${PIPESTATUS[0]}"
          } > deploy-diagnostic.txt 2>&1
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: illegal-occupation-deploy-diagnostic
          path: deploy-diagnostic.txt
