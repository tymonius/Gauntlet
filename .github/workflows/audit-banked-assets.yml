name: Diagnose Illegal Occupation Final Chunks

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    if: github.head_ref == 'agent/neutral-illegal-occupation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/neutral-illegal-occupation
      - name: Inspect all chunks
        run: |
          {
            for file in \
              .github/io-archive-00.b64 \
              .github/io-mid-00.b64 \
              .github/io-mid-01.b64 \
              .github/io-mid-02.b64 \
              .github/io-tail-00.b64 \
              .github/io-tail-01.b64 \
              .github/io-tail-02.b64 \
              .github/io-tail-03.b64; do
              wc -c "$file"
              sha256sum "$file"
            done
            cat \
              .github/io-archive-00.b64 \
              .github/io-mid-00.b64 \
              .github/io-mid-01.b64 \
              .github/io-mid-02.b64 \
              .github/io-tail-00.b64 \
              .github/io-tail-01.b64 \
              .github/io-tail-02.b64 \
              .github/io-tail-03.b64 \
              > /tmp/illegal-occupation-files.b64
            wc -c /tmp/illegal-occupation-files.b64
            sha256sum /tmp/illegal-occupation-files.b64
          } > final-chunk-diagnostic.txt 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: illegal-occupation-final-chunk-diagnostic
          path: final-chunk-diagnostic.txt
