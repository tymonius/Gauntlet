name: Apply card value centering fix

on:
  push:
    branches:
      - agent/refine-card-value-centering

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Refine card value centering'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refine-card-value-centering
          fetch-depth: 0
      - name: Strengthen optical centering correction
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('card-design/card-design-refinement.css')
          css = css_path.read_text()
          old_css = '  padding-top: 0.018in;'
          new_css = '  padding-top: 0.036in;'
          if css.count(old_css) != 1:
              raise SystemExit(f'Expected one current medallion offset, found {css.count(old_css)}')
          css_path.write_text(css.replace(old_css, new_css))

          test_path = Path('tests/card-value-medallion.test.ts')
          test = test_path.read_text()
          old_test = r'padding-top:\\s*0\\.018in'
          new_test = r'padding-top:\\s*0\\.036in'
          if test.count(old_test) != 1:
              raise SystemExit(f'Expected one current test offset, found {test.count(old_test)}')
          test_path.write_text(test.replace(old_test, new_test))
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-card-value-centering-fix.yml
      - name: Commit focused correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add card-design/card-design-refinement.css tests/card-value-medallion.test.ts .github/workflows/apply-card-value-centering-fix.yml
          git commit -m "Refine card value centering"
          git push origin HEAD:agent/refine-card-value-centering
