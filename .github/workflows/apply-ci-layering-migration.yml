name: Apply CI layering migration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-ci-layering-migration.yml'
      - 'scripts/retire-legacy-workflow-triggers.mjs'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Retire automatic legacy/candidate triggers
        run: node scripts/retire-legacy-workflow-triggers.mjs

      - name: Commit migration
        run: |
          set -euo pipefail
          git add .github/workflows
          if git diff --cached --quiet; then
            echo 'Legacy workflow triggers are already retired.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Retire automatic legacy workflow triggers'
          git push origin HEAD:${{ github.head_ref }}
