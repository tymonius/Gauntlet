name: Certify clean v0.6.3 authority

on:
  push:
    branches:
      - agent/certify-clean-v063-authority
    paths:
      - scripts/certify-clean-v063-authority.mjs
      - scripts/validate-clean-v063-certification.mjs
      - scripts/validate-reconstruction-version-plan-certified.mjs
      - scripts/validate-clean-v063-faction-authority.mjs
      - scripts/validate-clean-v063-rulebook.mjs
      - artifacts/reconstruction/clean-v0.6.3/faction-guides/**
      - artifacts/reconstruction/clean-v0.6.3/rulebook/**
      - artifacts/reconstruction/clean-v0.6.3/certification/**
      - config/reconstruction-version-plan.json
      - config/reconstruction-version-resolutions.json
      - config/release-lifecycle.json
      - .github/workflows/certify-clean-v063-authority.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/certify-clean-v063-authority.mjs
      - scripts/validate-clean-v063-certification.mjs
      - scripts/validate-reconstruction-version-plan-certified.mjs
      - scripts/validate-clean-v063-faction-authority.mjs
      - scripts/validate-clean-v063-rulebook.mjs
      - artifacts/reconstruction/clean-v0.6.3/faction-guides/**
      - artifacts/reconstruction/clean-v0.6.3/rulebook/**
      - artifacts/reconstruction/clean-v0.6.3/certification/**
      - config/reconstruction-version-plan.json
      - config/reconstruction-version-resolutions.json
      - config/release-lifecycle.json
      - .github/workflows/certify-clean-v063-authority.yml

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Revalidate approved authority components before certification
        run: |
          STATUS=$(node -p "JSON.parse(require('fs').readFileSync('config/reconstruction-version-plan.json','utf8')).targets['clean-v0.6.3'].status")
          if [ "$STATUS" = "authority_build_approved" ]; then
            node scripts/validate-clean-v063-faction-authority.mjs
            node scripts/validate-clean-v063-rulebook.mjs
          else
            echo 'Authority set is already in certified-state form; certification validator will recheck the pinned bytes.'
          fi
      - name: Build clean v0.6.3 certification state
        run: node scripts/certify-clean-v063-authority.mjs
      - name: Validate certified reconstruction plan
        run: node scripts/validate-reconstruction-version-plan-certified.mjs
      - name: Validate clean v0.6.3 authority certification
        run: node scripts/validate-clean-v063-certification.mjs
      - name: Reject whitespace errors
        run: git diff --check
      - name: Commit generated certification state
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git add config/reconstruction-version-plan.json artifacts/reconstruction/clean-v0.6.3/certification
          if git diff --cached --quiet; then
            echo 'Certification state is already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize clean v0.6.3 authority certification'
          git push
      - name: Require generated certification state committed on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- config/reconstruction-version-plan.json artifacts/reconstruction/clean-v0.6.3/certification
