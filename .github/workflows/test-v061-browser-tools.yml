name: Test restored v0.6.1 browser tools

on:
  pull_request:
    branches:
      - main
    paths:
      - "config/release-lifecycle.json"
      - "config/release-locks.json"
      - "rulebook/**"
      - "card-reference/**"
      - "deckbuilder/**"
      - "factions/**"
      - "rules-assistant/**"
      - "playtest/**"
      - "releases/v0.6.1/**"
      - "scripts/validate-release-recovery-state.mjs"
      - ".github/workflows/test-v061-browser-tools.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-browser-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact recovery locks before browser smoke
        run: node scripts/validate-release-recovery-state.mjs

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Serve repository
        run: python3 -m http.server 8000 >/tmp/gauntlet-http.log 2>&1 &

      - name: Smoke-test restored v0.6.1 browser surfaces
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });

          async function openPage(path, viewport) {
            const page = await browser.newPage({ viewport });
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            page.on('console', message => { if (message.type() === 'error') errors.push(message.text()); });
            const response = await page.goto(`http://127.0.0.1:8000${path}`, { waitUntil: 'networkidle' });
            if (!response?.ok()) throw new Error(`${path} returned ${response?.status()}`);
            return { page, errors };
          }

          for (const viewport of [{ width: 1440, height: 1000 }, { width: 390, height: 844 }]) {
            const suffix = viewport.width < 600 ? 'mobile' : 'desktop';

            {
              const { page, errors } = await openPage('/rulebook/', viewport);
              await page.waitForSelector('[data-rulebook-content] h1, [data-rulebook-content] h2');
              const text = await page.locator('[data-rulebook-content]').innerText();
              for (const term of ['Gambit', 'Reserve', 'Tactic', 'Aftermath']) {
                if (!text.includes(term)) throw new Error(`Browser rulebook missing ${term}`);
              }
              const leaderImages = page.locator('[data-rulebook-content] img');
              if (await leaderImages.count() !== 12) throw new Error('Browser rulebook did not render 12 Leader images');
              await page.screenshot({ path: `/tmp/rulebook-${suffix}.png`, fullPage: true });
              if (errors.length) throw new Error(`Rulebook ${suffix} errors:\n${errors.join('\n')}`);
              await page.close();
            }

            {
              const { page, errors } = await openPage('/card-reference/', viewport);
              await page.waitForFunction(() => document.querySelector('#cardTotal')?.textContent === '122');
              if ((await page.locator('#territoryTotal').textContent()) !== '25') throw new Error('Card Reference did not load 25 Territories');
              const status = await page.locator('#dataStatus').innerText();
              if (!status.includes('v0.6.1')) throw new Error(`Card Reference did not identify v0.6.1: ${status}`);
              await page.fill('#searchInput', 'Black Covenant');
              await page.waitForFunction(() => document.querySelector('#resultCount')?.textContent === '1');
              if ((await page.locator('.reference-row-title').first().innerText()) !== 'Black Covenant') throw new Error('v0.6.1 Card Reference search failed');
              await page.screenshot({ path: `/tmp/card-reference-${suffix}.png`, fullPage: true });
              if (errors.length) throw new Error(`Card Reference ${suffix} errors:\n${errors.join('\n')}`);
              await page.close();
            }

            {
              const { page, errors } = await openPage('/deckbuilder/', viewport);
              await page.waitForFunction(() => document.body.innerText.includes('Military'));
              const text = await page.locator('body').innerText();
              if (!text.includes('v0.6.1')) throw new Error('Deckbuilder does not identify v0.6.1');
              await page.screenshot({ path: `/tmp/deckbuilder-${suffix}.png`, fullPage: true });
              if (errors.length) throw new Error(`Deckbuilder ${suffix} errors:\n${errors.join('\n')}`);
              await page.close();
            }
          }

          {
            const { page, errors } = await openPage('/factions/military/', { width: 1200, height: 900 });
            const general = await page.locator('#general').innerText();
            const commandant = await page.locator('#commandant').innerText();
            for (const order of ['Onward', 'Rally', 'Rout']) if (!general.includes(order)) throw new Error(`General missing ${order}`);
            for (const order of ['Entrench', 'Repel', 'Fortify']) if (!commandant.includes(order)) throw new Error(`Commandant missing ${order}`);
            if (errors.length) throw new Error(`Military faction errors:\n${errors.join('\n')}`);
            await page.close();
          }

          {
            const { page, errors } = await openPage('/playtest/?serial=G061-SMOKE', { width: 900, height: 1200 });
            if ((await page.locator('#sheet-serial').textContent()) !== 'G061-SMOKE') throw new Error('Playtest sheet did not apply its serial parameter');
            if (errors.length) throw new Error(`Playtest sheet errors:\n${errors.join('\n')}`);
            await page.close();
          }

          {
            const { page, errors } = await openPage('/playtest/player-mat/', { width: 1200, height: 900 });
            const text = await page.locator('.player-mat').innerText();
            for (const term of ['Hand', 'Reserve', 'Gambit', 'Tactic', 'Asset Bank']) {
              if (!text.includes(term)) throw new Error(`Player mat missing ${term}`);
            }
            if (errors.length) throw new Error(`Player mat errors:\n${errors.join('\n')}`);
            await page.close();
          }

          await browser.close();
          NODE

      - name: Upload browser screenshots
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-v061-recovery-browser-smoke
          path: /tmp/*.png
          if-no-files-found: error
