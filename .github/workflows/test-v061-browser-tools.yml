name: Retired v0.6.1 browser recovery smoke

# This workflow protected the temporary rollback/recovery state in which the
# top-level browser tools were intentionally pinned to v0.6.1. The current
# public release is v0.6.3, so those assertions must not govern current routes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Recovery smoke is retired
        run: |
          echo "Top-level browser tools are no longer the restored v0.6.1 recovery state."
          echo "Historical v0.6.1 remains protected by release locks and versioned-release tests."
