name: Clean Last Stand implementation branch

on:
  pull_request:
    branches:
      - main

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'agent/normalize-last-stand-language'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          show-progress: false
      - name: Remove temporary validation environment
        run: |
          rm -rf .venv build
          rm .github/workflows/cleanup-last-stand-branch.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary validation environment'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
