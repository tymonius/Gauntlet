name: Deploy Rules Arbiter Worker

on:
  push:
    branches:
      - main
    paths:
      - "rules-assistant/admin-refinement-worker.js"
      - "rules-assistant/worker-entry.js"
      - "rules-assistant/worker-v071.js"
      - "rules-assistant/worker-v072-candidate.js"
      - "rules-assistant/v072-candidate-corpus.js"
      - "rules-assistant/worker-v072.js"
      - "rules-assistant/v072-release-corpus.js"
      - "releases/v0.7.2/Gauntlet_v0.7.2_Complete_Rules.md"
      - "releases/v0.7.2/Gauntlet_v0.7.2_Canonical_Data.json"
      - "releases/v0.7.2/Gauntlet_v0.7.2_Manifest.json"
      - "releases/v0.7.2/Gauntlet_v0.7.2_Source_Provenance.json"
      - "releases/v0.7.2/Gauntlet_v0.7.2_Starter_Decks.json"
      - "rules-assistant/local-search.js"
      - "rules-assistant/v071-public-corpus.js"
      - "rules-assistant/r13-classification.js"
      - "rules-assistant/v071-gate3-c-remediation.js"
      - "rules-assistant/v071-answer-verifier.js"
      - "rules-assistant/rules-persistence.js"
      - "rules-assistant/github-actions-qa-auth.js"
      - "rules-assistant/wrangler.toml"
      - ".github/workflows/deploy-rules-arbiter.yml"
      - ".github/workflows/v072-final-rules-arbiter-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rules-arbiter-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deployment secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

      - name: Install dependencies
        run: |
          npm install
          npm install --no-save wrangler@4

      - name: Validate Rules Arbiter runtime
        run: |
          node --check rules-assistant/admin-refinement-worker.js
          node --check rules-assistant/worker-entry.js
          node --check rules-assistant/worker-v071.js
          node --check rules-assistant/worker-v072-candidate.js
          node --check rules-assistant/worker-v072.js
          npx vitest run \
            rules-assistant/v071-gate3-h-remediation.test.mjs \
            rules-assistant/v071-gate3-i-remediation.test.mjs \
            rules-assistant/v072-candidate-corpus.test.mjs \
            rules-assistant/v072-r33-worker-port.test.mjs \
            rules-assistant/worker-entry-v072-candidate.test.mjs \
            rules-assistant/v072-release-corpus.test.mjs \
            rules-assistant/v072-final-worker-port.test.mjs \
            rules-assistant/worker-entry-v072-final.test.mjs

      - name: Resolve expected behavior revision
        id: revision
        shell: bash
        run: |
          revision="$(node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";
          const source = readFileSync("rules-assistant/worker-v072.js", "utf8");
          const match = source.match(/BEHAVIOR_REVISION\s*=\s*"([^"]+)"/);
          if (!match) process.exit(1);
          process.stdout.write(match[1]);
          NODE
          )"
          test -n "$revision"
          echo "value=$revision" >> "$GITHUB_OUTPUT"
          echo "Deploying current v0.7.2 Rules Arbiter behavior revision $revision"

      - name: Resolve expected candidate behavior revision
        id: candidate_revision
        shell: bash
        run: |
          revision="$(node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";
          const source = readFileSync("rules-assistant/worker-v072-candidate.js", "utf8");
          const match = source.match(/BEHAVIOR_REVISION\s*=\s*"([^"]+)"/);
          if (!match) process.exit(1);
          process.stdout.write(match[1]);
          NODE
          )"
          test -n "$revision"
          echo "value=$revision" >> "$GITHUB_OUTPUT"
          echo "Staging v0.7.2 candidate Rules Arbiter behavior revision $revision"

      - name: Resolve expected final v0.7.2 behavior revision
        id: v072_revision
        shell: bash
        run: |
          revision="$(node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";
          const source = readFileSync("rules-assistant/worker-v072.js", "utf8");
          const match = source.match(/BEHAVIOR_REVISION\s*=\s*"([^"]+)"/);
          if (!match) process.exit(1);
          process.stdout.write(match[1]);
          NODE
          )"
          test -n "$revision"
          echo "value=$revision" >> "$GITHUB_OUTPUT"
          echo "Staging frozen v0.7.2 Rules Arbiter behavior revision $revision"

      - name: Deploy Rules Arbiter
        run: npx wrangler deploy --config rules-assistant/wrangler.toml

      - name: Verify production health
        env:
          EXPECTED_BEHAVIOR_REVISION: ${{ steps.revision.outputs.value }}
        run: |
          node <<'NODE'
          const endpoint = "https://gauntlet-rules-assistant.tymon-scott.workers.dev/api/health";
          const expected = process.env.EXPECTED_BEHAVIOR_REVISION;

          for (let attempt = 1; attempt <= 20; attempt += 1) {
            try {
              const response = await fetch(endpoint, { cache: "no-store" });
              const payload = response.ok ? await response.json() : null;
              const actual = payload?.behaviorRevision || "missing";
              console.log(`Health check ${attempt}/20: ${actual}`);
              if (response.ok && payload?.ok === true && actual === expected) {
                console.log(`Verified production Rules Arbiter ${expected}.`);
                process.exit(0);
              }
            } catch (error) {
              console.log(`Health check ${attempt}/20: ${error.message}`);
            }
            if (attempt < 20) await new Promise((resolve) => setTimeout(resolve, 3000));
          }

          console.error(`Production did not report expected behavior revision ${expected}.`);
          process.exit(1);
          NODE

      - name: Verify v0.7.2 candidate health and corpus
        env:
          EXPECTED_CANDIDATE_BEHAVIOR_REVISION: ${{ steps.candidate_revision.outputs.value }}
        run: |
          node <<'NODE'
          const healthEndpoint = "https://gauntlet-rules-assistant.tymon-scott.workers.dev/api/v072-candidate/health";
          const corpusEndpoint = "https://gauntlet-rules-assistant.tymon-scott.workers.dev/api/v072-candidate/corpus-health";
          const expected = process.env.EXPECTED_CANDIDATE_BEHAVIOR_REVISION;

          for (let attempt = 1; attempt <= 20; attempt += 1) {
            try {
              const response = await fetch(healthEndpoint, { cache: "no-store" });
              const payload = response.ok ? await response.json() : null;
              console.log(`Candidate health ${attempt}/20: ${payload?.behaviorRevision || "missing"}`);
              if (
                response.ok
                && payload?.ok === true
                && payload?.version === "v0.7.2-candidate"
                && payload?.published === false
                && payload?.currentPublicRelease === "v0.7.2"
                && payload?.behaviorRevision === expected
              ) break;
              if (attempt === 20) throw new Error("candidate health did not converge");
            } catch (error) {
              if (attempt === 20) {
                console.error(`Candidate health verification failed: ${error.message}`);
                process.exit(1);
              }
            }
            await new Promise((resolve) => setTimeout(resolve, 3000));
          }

          for (let attempt = 1; attempt <= 20; attempt += 1) {
            try {
              const response = await fetch(corpusEndpoint, { cache: "no-store" });
              const payload = response.ok ? await response.json() : null;
              console.log(`Candidate corpus ${attempt}/20: ${payload?.authoritySetId || "missing"}`);
              if (
                response.ok
                && payload?.ok === true
                && payload?.version === "v0.7.2-candidate"
                && payload?.currentPublicRelease === "v0.7.2"
                && payload?.behaviorRevision === expected
                && /^[a-f0-9]{64}$/.test(String(payload?.authoritySetId || ""))
              ) {
                console.log(`Verified staged v0.7.2 candidate Rules Arbiter ${expected}.`);
                process.exit(0);
              }
            } catch (error) {
              if (attempt === 20) console.error(`Candidate corpus verification failed: ${error.message}`);
            }
            if (attempt < 20) await new Promise((resolve) => setTimeout(resolve, 3000));
          }

          console.error("Production candidate route did not report a valid v0.7.2 candidate corpus.");
          process.exit(1);
          NODE

      - name: Verify frozen v0.7.2 health and corpus
        env:
          EXPECTED_V072_BEHAVIOR_REVISION: ${{ steps.v072_revision.outputs.value }}
          EXPECTED_V072_AUTHORITY_SET: ab0125ae280accfb03d53bdadf5b6ae006f98aeab897e20a4b2269d89ed9eb84
        run: |
          node <<'NODE'
          const healthEndpoint = "https://gauntlet-rules-assistant.tymon-scott.workers.dev/api/v072/health";
          const corpusEndpoint = "https://gauntlet-rules-assistant.tymon-scott.workers.dev/api/v072/corpus-health";
          const expectedRevision = process.env.EXPECTED_V072_BEHAVIOR_REVISION;
          const expectedAuthority = process.env.EXPECTED_V072_AUTHORITY_SET;
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          for (let attempt = 1; attempt <= 60; attempt += 1) {
            try {
              const healthResponse = await fetch(healthEndpoint, { cache: "no-store" });
              const health = healthResponse.ok ? await healthResponse.json() : null;
              const corpusResponse = await fetch(corpusEndpoint, { cache: "no-store" });
              const corpus = corpusResponse.ok ? await corpusResponse.json() : null;
              console.log(
                `Final v0.7.2 check ${attempt}/60: health=${health?.behaviorRevision || "missing"} corpus=${corpus?.authoritySetId || "missing"}`
              );
              if (
                healthResponse.ok
                && health?.ok === true
                && health?.version === "v0.7.2"
                && health?.published === true
                && health?.currentPublicRelease === "v0.7.2"
                && health?.behaviorRevision === expectedRevision
                && corpusResponse.ok
                && corpus?.ok === true
                && corpus?.version === "v0.7.2"
                && corpus?.currentPublicRelease === "v0.7.2"
                && corpus?.behaviorRevision === expectedRevision
                && corpus?.authoritySetId === expectedAuthority
              ) {
                console.log(`Verified published frozen v0.7.2 Rules Arbiter ${expectedRevision} / ${expectedAuthority}.`);
                process.exit(0);
              }
            } catch (error) {
              console.log(`Final v0.7.2 check ${attempt}/60: ${error.message}`);
            }
            if (attempt < 60) await sleep(5000);
          }

          console.error("Published v0.7.2 Rules Arbiter did not converge to the frozen release corpus.");
          process.exit(1);
          NODE

