name: Promote v0.7.0 TTS Workshop assets

on:
  push:
    branches:
      - release/v0.7.0-cutover
    paths:
      - '.github/workflows/promote-v070-tts-workshop-assets.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_TAG: tts-v0.7.0-qa-pr-909-fe5940376a74
      DEST_TAG: v0.7.0
      PREVIEW_JSON: Gauntlet_v0.7.0_TTS_PR909_Preview.json
      WORKSHOP_JSON: Gauntlet_v0.7.0_TTS_Workshop_Candidate.json
      MANIFEST: Gauntlet_v0.7.0_TTS_Release_Assets.json
    steps:
      - name: Download approved immutable TTS preview assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tts-promote
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --dir /tmp/tts-promote
          test -f "/tmp/tts-promote/$PREVIEW_JSON"
          test -f "/tmp/tts-promote/$MANIFEST"

      - name: Rewrite preview URLs to permanent v0.7.0 host
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_PREFIX="https://github.com/$GITHUB_REPOSITORY/releases/download/$SOURCE_TAG/"
          DEST_PREFIX="https://github.com/$GITHUB_REPOSITORY/releases/download/$DEST_TAG/"

          SOURCE_PREFIX="$SOURCE_PREFIX" DEST_PREFIX="$DEST_PREFIX" node <<'NODE'
          const fs = require('fs');
          const path = '/tmp/tts-promote/' + process.env.MANIFEST;
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          delete manifest.preview;
          for (const asset of manifest.assets || []) {
            asset.url = String(asset.url || '').split(process.env.SOURCE_PREFIX).join(process.env.DEST_PREFIX);
          }
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          NODE

          SOURCE_PREFIX="$SOURCE_PREFIX" DEST_PREFIX="$DEST_PREFIX" node <<'NODE'
          const fs = require('fs');
          const sourcePath = '/tmp/tts-promote/' + process.env.PREVIEW_JSON;
          const destPath = '/tmp/tts-promote/' + process.env.WORKSHOP_JSON;
          const source = fs.readFileSync(sourcePath, 'utf8');
          if (!source.includes(process.env.SOURCE_PREFIX)) {
            throw new Error('Approved preview save does not contain the expected immutable preview prefix.');
          }
          const rewritten = source.split(process.env.SOURCE_PREFIX).join(process.env.DEST_PREFIX);
          JSON.parse(rewritten);
          fs.writeFileSync(destPath, rewritten);
          NODE

          rm "/tmp/tts-promote/$PREVIEW_JSON"

      - name: Publish approved assets to permanent v0.7.0 host
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$DEST_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          mapfile -t files < <(find /tmp/tts-promote -maxdepth 1 -type f -print | sort)
          test "${#files[@]}" -ge 83
          gh release upload "$DEST_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"

      - name: Verify permanent Workshop candidate and every hosted object URL
        shell: bash
        run: |
          set -euo pipefail
          WORKSHOP_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$DEST_TAG/$WORKSHOP_JSON"
          node <<'NODE'
          const workshopUrl = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.DEST_TAG}/${process.env.WORKSHOP_JSON}`;
          const expectedNeedle = `/releases/download/${process.env.DEST_TAG}/`;
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          function collectUrls(value, urls = new Set()) {
            if (Array.isArray(value)) {
              value.forEach(child => collectUrls(child, urls));
              return urls;
            }
            if (!value || typeof value !== 'object') return urls;
            for (const child of Object.values(value)) {
              if (typeof child === 'string' && /^https:\/\//i.test(child)) urls.add(child);
              else collectUrls(child, urls);
            }
            return urls;
          }

          (async () => {
            let response;
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              response = await fetch(workshopUrl, { redirect: 'follow' });
              if (response.ok) break;
              if (attempt < 6) await sleep(1500 * attempt);
            }
            if (!response?.ok) throw new Error(`Workshop candidate is not reachable (${response?.status || 0}).`);
            const save = JSON.parse(await response.text());
            const urls = [...collectUrls(save)].filter(url => url.includes('/releases/download/'));
            if (!urls.length) throw new Error('Workshop candidate contains no hosted release URLs.');
            if (urls.some(url => !url.includes(expectedNeedle))) {
              throw new Error('Workshop candidate contains a non-v0.7.0 release URL.');
            }
            for (const url of urls) {
              let assetResponse;
              for (let attempt = 1; attempt <= 6; attempt += 1) {
                assetResponse = await fetch(url, { redirect: 'follow' });
                if (assetResponse.ok) break;
                if (attempt < 6) await sleep(1500 * attempt);
              }
              if (!assetResponse?.ok) {
                throw new Error(`Permanent TTS asset is not reachable (${assetResponse?.status || 0}): ${url}`);
              }
            }
            console.log(`Verified Workshop candidate and ${urls.length} unique permanent v0.7.0 object URLs.`);
          })().catch(error => {
            console.error(error.stack || error.message || error);
            process.exitCode = 1;
          });
          NODE
