name: Fix social preview image

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/fix-social-image'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-social-image
          fetch-depth: 0

      - name: Regenerate social image from source artwork
        run: |
          set -euo pipefail
          source_image="images/artwork/site/homepage-hero-three-leaders.webp"
          output_image="images/social/gauntlet-og-1200x630.jpg"
          preview_image="images/social/gauntlet-og-preview.jpg"

          identify "$source_image"
          mkdir -p "$(dirname "$output_image")"

          convert "$source_image" \
            -resize 1200x \
            -crop 1200x630+0+53 \
            +repage \
            -strip \
            -quality 92 \
            "$output_image"

          convert "$output_image" \
            -resize 600x315! \
            -strip \
            -quality 68 \
            "$preview_image"

          test "$(identify -format '%wx%h' "$output_image")" = "1200x630"
          test "$(identify -format '%wx%h' "$preview_image")" = "600x315"
          sha256sum "$output_image" "$preview_image"

          rm -f .github/fix-og-trigger
          rm -f .github/workflows/fix-social-image.yml

      - name: Commit regenerated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate social preview image from source artwork"
          git push origin HEAD:agent/fix-social-image
