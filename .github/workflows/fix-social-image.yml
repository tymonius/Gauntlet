name: Fix social preview image

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/fix-social-image'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-social-image
          fetch-depth: 0

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Regenerate social image from source artwork
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image
          import hashlib

          source_path = Path('images/artwork/site/homepage-hero-three-leaders.webp')
          output_path = Path('images/social/gauntlet-og-1200x630.jpg')
          preview_path = Path('images/social/gauntlet-og-preview.jpg')

          source = Image.open(source_path).convert('RGB')
          print(f'Source dimensions: {source.width}x{source.height}')

          target_width = 1200
          resized_height = round(source.height * target_width / source.width)
          resized = source.resize((target_width, resized_height), Image.Resampling.LANCZOS)

          crop_top = 53
          if resized_height < crop_top + 630:
              raise SystemExit(f'Resized source is only {resized_height}px high')
          final = resized.crop((0, crop_top, 1200, crop_top + 630))

          output_path.parent.mkdir(parents=True, exist_ok=True)
          final.save(output_path, 'JPEG', quality=92, optimize=True, progressive=True)
          preview = final.resize((600, 315), Image.Resampling.LANCZOS)
          preview.save(preview_path, 'JPEG', quality=68, optimize=True, progressive=True)

          for path, expected_size in ((output_path, (1200, 630)), (preview_path, (600, 315))):
              check = Image.open(path)
              if check.size != expected_size:
                  raise SystemExit(f'{path} has size {check.size}, expected {expected_size}')
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              print(f'{path}: {check.size[0]}x{check.size[1]} sha256={digest}')

          Path('.github/fix-og-trigger').unlink(missing_ok=True)
          Path('.github/workflows/fix-social-image.yml').unlink(missing_ok=True)

      - name: Commit regenerated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate social preview image from source artwork"
          git push origin HEAD:agent/fix-social-image
