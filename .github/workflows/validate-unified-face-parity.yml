name: Validate unified face parity

on:
  pull_request:
    paths:
      - "game-data/**"
      - "card-design/face-*.mjs"
      - "card-design/face-*.html"
      - "card-design/face-templates/**"
      - "card-design/*.css"
      - "card-design/card-back-pattern.svg"
      - "images/artwork/**"
      - "images/*.png"
      - "images/*.svg"
      - "scripts/validate-unified-face-parity.mjs"
      - ".github/workflows/validate-unified-face-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Resolve Playwright version
        id: playwright-version
        shell: bash
        run: node -e "console.log('version=' + require('playwright/package.json').version)" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Compare clean renderer with current production surfaces
        run: node scripts/validate-unified-face-parity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-face-parity
          path: card-design/generated/face-parity/
          if-no-files-found: error
