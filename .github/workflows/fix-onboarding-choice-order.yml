name: Fix onboarding choice ordering

on:
  push:
    branches:
      - agent/standardize-capitalization-guideline
    paths:
      - .github/onboarding-choice-order-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make onboarding revisions deterministic
        run: |
          python - <<'PY'
          from pathlib import Path

          worker = Path('workers/playtest-sessions/src/index.js')
          text = worker.read_text(encoding='utf-8')
          old = "      ORDER BY created_at ASC`\n"
          new = "      ORDER BY created_at ASC, rowid ASC`\n"
          if text.count(old) != 1:
              raise SystemExit(f"Expected one onboarding event-order query, found {text.count(old)}")
          worker.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('.github/onboarding-choice-order-trigger').unlink(missing_ok=True)
          Path('.github/workflows/fix-onboarding-choice-order.yml').unlink(missing_ok=True)
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make onboarding choice revisions deterministic"
          git push
