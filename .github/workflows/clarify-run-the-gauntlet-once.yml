name: Clarify Run the Gauntlet once

on:
  push:
    branches:
      - rules/clarify-run-the-gauntlet-victory

permissions:
  contents: write

jobs:
  clarify:
    if: ${{ !contains(github.event.head_commit.message, '[run-the-gauntlet-clarified]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rules/clarify-run-the-gauntlet-victory
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clarify territorial victory from authority through teaching surfaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {found}: {old[:100]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Canonical authority: preserve mechanics, clarify what the completion state means.
          replace_exact(
              'game-data/current-game.json',
              '"capture": "During Capture, if your token is on or beyond the next opposing Territory immediately beyond your Front Line, add that Territory to your Front Line. Normal Capture advances the Front Line by at most one Territory per turn. Capturing the Territory at the opponent\'s end immediately runs the Gauntlet and wins.",',
              '"capture": "During Capture, if your token is on or beyond the next opposing Territory immediately beyond your Front Line, add that Territory to your Front Line. Normal Capture advances the Front Line by at most one Territory per turn. When Capture adds the final opposing Territory to your Front Line, your Front Line spans the entire Gauntlet; you immediately run the Gauntlet and win.",'
          )
          replace_exact(
              'game-data/current-game.json',
              '"victory": "Run the Gauntlet and win immediately by either capturing the Territory at the opponent\'s end or winning the opponent\'s Last Stand.",',
              '"victory": "Run the Gauntlet and win immediately by either controlling the entire Gauntlet—extending your Front Line across all six Territories—or winning the opponent\'s Last Stand.",'
          )
          replace_exact(
              'game-data/current-game.json',
              '"text": "Capture the Territory at the opponent\'s end, or force a Last Stand and win the resulting battle."',
              '"text": "Control the entire Gauntlet, or force a Last Stand and win the resulting battle."',
              expected=4
          )
          replace_exact(
              'game-data/current-game.json',
              '"v072SharedBaselineRestoration": "/docs/v0.7.2-shared-baseline-restoration.json"',
              '"v072SharedBaselineRestoration": "/docs/v0.7.2-shared-baseline-restoration.json",\n      "v072RunTheGauntletVictoryClarification": "/docs/v0.7.2-run-the-gauntlet-victory-clarification.json"'
          )

          # Player's Guide.
          replace_exact(
              'rulebook/player-guide/player-guide.md',
              "Keep advancing until you **run the Gauntlet**: capture the Territory at your opponent's end, or push your opponent beyond the battlefield and defeat their Last Stand.",
              "Keep advancing until you **run the Gauntlet**: take control of the entire battlefield by capturing all of your opponent's Territories, or push your opponent beyond the battlefield and defeat their Last Stand."
          )
          replace_exact(
              'rulebook/player-guide/player-guide.md',
              "1. **Capture the Territory at your opponent's end.**\n2. **Win your opponent's Last Stand** after pushing them beyond their end of the battlefield.",
              "1. **Control the entire Gauntlet** by capturing your opponent's Territories in order until your Front Line spans the whole battlefield.\n2. **Win your opponent's Last Stand** after pushing them beyond their end of the battlefield."
          )
          replace_exact(
              'rulebook/player-guide/player-guide.md',
              "If the Territory you capture is the Territory at your opponent's end, you immediately run the Gauntlet and win.",
              "When you capture the last opposing Territory still outside your Front Line, your Front Line now spans the entire Gauntlet. You immediately run the Gauntlet and win."
          )
          replace_exact(
              'rulebook/player-guide/player-guide.md',
              "### Route 1: Capture the final Territory\n\nKeep advancing your Front Line until you capture the Territory at your opponent's end.\n\nThe moment you capture that Territory, you win.\n\nThis is the straightforward territorial route: attack, occupy, survive until Capture, and repeat.",
              "### Route 1: Control the entire Gauntlet\n\nKeep advancing your Front Line by capturing your opponent's Territories in order. Because your Front Line must remain unbroken, you cannot skip ahead and win by capturing only the far-end Territory.\n\nWhen your Front Line spans all six Territories, you control the entire Gauntlet and win immediately.\n\nThis is the straightforward territorial route: attack, occupy, survive until Capture, and repeat."
          )
          replace_exact(
              'rulebook/player-guide/player-guide.md',
              "You can also win before capturing the final Territory.",
              "You can also win before controlling the entire Gauntlet."
          )
          replace_exact(
              'rulebook/player-guide/player-guide.md',
              "You do **not** have to control or capture the final Territory before forcing a Last Stand. The capture route and Last Stand route are two independent ways to finish the same shared objective.",
              "You do **not** have to control the entire Gauntlet—or even control or capture the opponent's final Territory—before forcing a Last Stand. The territorial route and Last Stand route are two independent ways to finish the same shared objective."
          )

          # Current official candidate rulebook.
          replace_exact(
              'rulebook/player-facing/current-rulebook.md',
              "Players advance toward one another, fight battles, occupy and capture opposing Territories, develop Assets, and pursue faction-specific plans. The normal shared victory is to **run the Gauntlet** by either capturing the Territory at the opponent's end or forcing that opponent to make a Last Stand and winning the resulting battle.",
              "Players advance toward one another, fight battles, occupy and capture opposing Territories, develop Assets, and pursue faction-specific plans. The normal shared victory is to **run the Gauntlet** by either extending your Front Line across the entire battlefield or forcing that opponent to make a Last Stand and winning the resulting battle."
          )
          replace_exact(
              'rulebook/player-facing/current-rulebook.md',
              "1. capture the Territory at your opponent's end of the Gauntlet; or\n2. force your opponent to make a Last Stand and win the resulting battle.",
              "1. extend your Front Line across the entire Gauntlet by capturing all opposing Territories in order; or\n2. force your opponent to make a Last Stand and win the resulting battle."
          )
          replace_exact(
              'rulebook/player-facing/current-rulebook.md',
              "### Final Territory and Last Stand\n\nCapturing the Territory at the opponent's end immediately runs the Gauntlet and wins. Control of that Territory is not required to force the opponent to make a Last Stand. After the opponent is forced beyond their end, an attacker on the final Territory may force the opponent to make a Last Stand only through a **new legal movement sequence** that Advances beyond the Gauntlet. Unused movement from the sequence that created the preceding battle cannot carry into a Last Stand battle.",
              "### Completing the Front Line and Last Stand\n\nWhen a legal capture adds the final opposing Territory to a player's Front Line, that Front Line spans the entire Gauntlet and the player immediately wins. Control of the opponent's final Territory is not required to force the opponent to make a Last Stand. After the opponent is forced beyond their end, an attacker on the final Territory may force the opponent to make a Last Stand only through a **new legal movement sequence** that Advances beyond the Gauntlet. Unused movement from the sequence that created the preceding battle cannot carry into a Last Stand battle."
          )
          replace_exact(
              'rulebook/player-facing/current-rulebook.md',
              "- capture the Territory at your opponent's end; or\n- force the opponent to make a Last Stand and win the resulting battle.",
              "- extend your Front Line across the entire Gauntlet by capturing all opposing Territories; or\n- force the opponent to make a Last Stand and win the resulting battle."
          )
          replace_exact(
              'rulebook/player-facing/current-rulebook.md',
              "> **Run the Gauntlet:** A player runs the Gauntlet and wins immediately when that player either captures the Territory at the opponent's end of the Gauntlet or forces the opponent to make a Last Stand and wins the resulting battle.\n\nBoth routes are the normal shared victory condition. Rules and player-facing text may distinguish the **capture route** from the **Last Stand battle route**, but both are running the Gauntlet.",
              "> **Run the Gauntlet:** A player runs the Gauntlet and wins immediately when that player's Front Line spans the entire Gauntlet or that player forces the opponent to make a Last Stand and wins the resulting battle.\n\nBoth routes are the normal shared victory condition. Rules and player-facing text may distinguish the **territorial-control route** from the **Last Stand battle route**, but both are running the Gauntlet."
          )
          replace_exact(
              'rulebook/player-facing/current-rulebook.md',
              "## Final-Territory Capture Victory\n\n### How it works\n\nIf your Front Line reaches and captures the Territory at your opponent's end of the Gauntlet, you immediately run the Gauntlet and win.\n\n### Complete rules\n\nWhen a player captures the Territory at the opponent's end of the Gauntlet, that player immediately runs the Gauntlet and wins the game.",
              "## Territorial-Control Victory\n\n### How it works\n\nCapture opposing Territories in order until your Front Line spans all six Territories. The capture that adds the final opposing Territory completes the Gauntlet and wins the game immediately.\n\n### Complete rules\n\nWhen a legal capture or Front Line advance causes a player's Front Line to span the entire Gauntlet, that player immediately runs the Gauntlet and wins the game."
          )
          replace_exact(
              'rulebook/player-facing/current-rulebook.md',
              "A capture effect is not suspended, delayed, or treated differently merely because the captured Territory is the opponent's final Territory.",
              "The capture that completes the Front Line is resolved under the normal capture rules; it is not suspended, delayed, or treated differently merely because it completes the Gauntlet."
          )
          replace_exact(
              'rulebook/player-facing/current-rulebook.md',
              "If the attacker does not force the opponent to make a Last Stand, the attacker may remain on the opposing final Territory. The opponent may Counterattack or use any other legal response. If the attacker later captures the final Territory, the attacker wins through the capture route.",
              "If the attacker does not force the opponent to make a Last Stand, the attacker may remain on the opposing final Territory. The opponent may Counterattack or use any other legal response. If the attacker later completes their Front Line across the entire Gauntlet, the attacker wins through the territorial-control route."
          )

          # Start page learning copy.
          replace_exact(
              'start/index.html',
              "<strong>capture the Territory at your opponent's end</strong>",
              "<strong>control the entire battlefield by capturing your opponent's Territories</strong>"
          )

          provenance = {
              "schemaVersion": 1,
              "version": "v0.7.2-candidate",
              "changeType": "rules-concept-clarification",
              "gameplayBehaviorChanged": False,
              "status": "approved-current-rule-clarification",
              "summary": "Clarify Run the Gauntlet's territorial victory as controlling the entire Gauntlet by extending a contiguous Front Line across all six Territories, rather than presenting the opponent-end Territory as a standalone victory object.",
              "existingMechanic": "Front Line control is contiguous from a player's own end, and Capture can add only the next opposing Territory immediately beyond that Front Line. Therefore the opponent-end Territory cannot be captured as an isolated shortcut; it is necessarily the final opposing Territory required to complete battlefield control.",
              "clarifiedFraming": "The territorial shared victory is to control the entire Gauntlet. Capturing the final opposing Territory is the completion trigger because it makes the Front Line span all six Territories. Last Stand remains an independent shared victory route and does not require controlling or capturing that final Territory.",
              "semanticRuleIds": [
                  "core.battlefield.capture",
                  "core.battlefield.front-line",
                  "core.battlefield.victory",
                  "core.battlefield.last-stand"
              ],
              "affectedSurfaces": [
                  "game-data/current-game.json",
                  "rulebook/player-guide/player-guide.md",
                  "rulebook/player-facing/current-rulebook.md",
                  "start/index.html"
              ]
          }
          Path('docs/v0.7.2-run-the-gauntlet-victory-clarification.json').write_text(
              json.dumps(provenance, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          PY

      - name: Validate authority and publication contracts
        run: |
          node scripts/card-authority/validate-current-game.mjs
          node scripts/validate-rules-publication-contract.mjs
          node scripts/validate-rules-publication-scaffolds.mjs

      - name: Commit clarification and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/clarify-run-the-gauntlet-once.yml
          git config user.name 'Gauntlet rules materializer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-data/current-game.json rulebook/player-guide/player-guide.md rulebook/player-facing/current-rulebook.md start/index.html docs/v0.7.2-run-the-gauntlet-victory-clarification.json .github/workflows/clarify-run-the-gauntlet-once.yml
          git commit -m 'Clarify Run the Gauntlet territorial victory [run-the-gauntlet-clarified]'
          git push origin HEAD:rules/clarify-run-the-gauntlet-victory
