name: PR 1704 self-fix

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 1704 && github.head_ref == 'rules-arbiter-gate3-a-regressions-r10'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply scoped r10 fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          worker_path = Path('rules-assistant/worker-v071.js')
          worker = worker_path.read_text(encoding='utf-8')

          edits = [
              (
                  '  const intelligenceTopic = /\\b(?:surveillance|interference|interfer(?:e|es|ed|ing)|intel)\\b/;',
                  '  const genericBattleCardDestinationFocus = destinationFocus && battleCardFocus && !namedCardSource;\n'
                  '  const intelligenceTopic = /\\b(?:surveillance|interference|interfer(?:e|es|ed|ing)|intel)\\b/;'
              ),
              (
                  '&& !(destinationFocus && battleCardFocus) && !battleCardQuantityFocus',
                  '&& !genericBattleCardDestinationFocus && !battleCardQuantityFocus'
              ),
              (
                  ': destinationFocus && battleCardFocus\n                ? BATTLE_CARD_DESTINATION_AUTHORITY_IDS',
                  ': genericBattleCardDestinationFocus\n                ? BATTLE_CARD_DESTINATION_AUTHORITY_IDS'
              ),
          ]

          for old, new in edits:
              count = worker.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one Worker match, found {count}: {old}')
              worker = worker.replace(old, new, 1)

          worker_path.write_text(worker, encoding='utf-8')

          pin_files = [
              'rules-assistant/v071-gate2-live-regressions.test.mjs',
              'rules-assistant/v071-battle-card-replacement-retrieval.test.mjs',
              'rules-assistant/v071-gate2-r6-regressions.test.mjs',
              'rules-assistant/v071-copied-effect-retrieval-review.test.mjs',
              'rules-assistant/v071-strategic-withdrawal-review.test.mjs',
              'rules-assistant/v071-fortifications-tactic-choice-review.test.mjs',
              'rules-assistant/v071-short-counterfactual-continuity.test.mjs',
              'rules-assistant/v071-asset-replacement-review.test.mjs',
              'rules-assistant/v071-gate2-r8-conflict-discipline.test.mjs',
          ]
          old_pin = 'v071-qa-20260913-9'
          new_pin = 'v071-qa-20260913-10'
          for name in pin_files:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace(old_pin, new_pin)
              if old_pin in text:
                  raise SystemExit(f'Stale r9 pin remains in {name}')
              path.write_text(text, encoding='utf-8')
          PY

          node --check rules-assistant/worker-v071.js

      - name: Run focused regressions
        run: |
          npm install
          npx vitest run \
            rules-assistant/v071-gate3-a-regressions.test.mjs \
            rules-assistant/v071-copied-effect-retrieval-review.test.mjs \
            rules-assistant/v071-gate2-live-regressions.test.mjs \
            rules-assistant/v071-battle-card-replacement-retrieval.test.mjs \
            rules-assistant/v071-gate2-r6-regressions.test.mjs \
            rules-assistant/v071-strategic-withdrawal-review.test.mjs \
            rules-assistant/v071-fortifications-tactic-choice-review.test.mjs \
            rules-assistant/v071-short-counterfactual-continuity.test.mjs \
            rules-assistant/v071-asset-replacement-review.test.mjs \
            rules-assistant/v071-gate2-r8-conflict-discipline.test.mjs

      - name: Commit scoped fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rules-assistant/worker-v071.js \
            rules-assistant/v071-gate2-live-regressions.test.mjs \
            rules-assistant/v071-battle-card-replacement-retrieval.test.mjs \
            rules-assistant/v071-gate2-r6-regressions.test.mjs \
            rules-assistant/v071-copied-effect-retrieval-review.test.mjs \
            rules-assistant/v071-strategic-withdrawal-review.test.mjs \
            rules-assistant/v071-fortifications-tactic-choice-review.test.mjs \
            rules-assistant/v071-short-counterfactual-continuity.test.mjs \
            rules-assistant/v071-asset-replacement-review.test.mjs \
            rules-assistant/v071-gate2-r8-conflict-discipline.test.mjs
          if git diff --cached --quiet; then
            echo 'No scoped fixes to commit.'
            exit 0
          fi
          git commit -m 'fix: preserve named-card retrieval in r10'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
