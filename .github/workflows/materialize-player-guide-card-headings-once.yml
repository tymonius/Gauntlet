name: Materialize Player Guide card headings once

on:
  push:
    branches:
      - docs/player-guide-card-headings

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/player-guide-card-headings
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clarify shared card headings
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'rulebook/player-guide/player-guide.md';
          const text = fs.readFileSync(path, 'utf8');
          const old = [
            '- **Action** — play the card from your Hand by spending your Action at a legal time.',
            '- **Asset** — bank the card face up so its Asset effect can remain available. Banking an Asset normally costs your Action.',
            '- **Gambit** — risk the card from your Hand during a battle.',
            '- **Tactic** — use the card from your temporary Reserve during a battle.',
            '- **Gambit/Tactic** — the card may be used in either of those battle roles.',
            '',
            'Some cards have other headings, such as **Reaction** or **Overlay**, and factions introduce some headings of their own. Follow the card and the relevant Faction Guide when one appears; you do not need those systems to understand the shared game.'
          ].join('\n');
          const replacement = [
            '- **Action** — play the card from your Hand by spending your Action at a legal time.',
            '- **Asset** — bank the card face up so its Asset effect can remain available. Banking an Asset normally costs your Action.',
            '- **Gambit** — risk the card from your Hand during a battle.',
            '- **Tactic** — use the card from your temporary Reserve during a battle.',
            '- **Gambit/Tactic** — the card may be used in either of those battle roles.',
            '- **Reaction** — play the card when the trigger or timing printed in its Reaction effect occurs. A Reaction does not spend your normal Action unless it specifically says that it does.',
            '- **Overlay** — attach the card to a Territory as instructed. While exposed, its Overlay effect temporarily replaces the effect immediately beneath it.',
            '',
            'Factions also introduce some headings of their own. Follow the card and the relevant Faction Guide when one appears; you do not need to learn those faction systems to understand the shared game.'
          ].join('\n');
          if (text.split(old).length !== 2) throw new Error('Expected exactly one shared-heading teaching passage.');
          fs.writeFileSync(path, text.replace(old, replacement));
          NODE

      - name: Validate publication integration
        run: |
          node scripts/validate-rules-publication-contract.mjs
          node scripts/validate-rules-publication-scaffolds.mjs

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/materialize-player-guide-card-headings-once.yml
          git config user.name 'Gauntlet publication materializer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rulebook/player-guide/player-guide.md .github/workflows/materialize-player-guide-card-headings-once.yml
          git commit -m 'Clarify Player Guide Reaction and Overlay headings'
          git push origin HEAD:docs/player-guide-card-headings
