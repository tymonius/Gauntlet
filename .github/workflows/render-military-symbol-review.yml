name: Render Military symbol review

on:
  pull_request:
    branches: [main]
    paths:
      - images/faction-symbols/military.svg
      - images/faction-symbols/candidates/military-*.svg
      - card-design/military-symbols.html
      - card-design/leader-card.css
      - card-design/card-design*.css
      - card-design/card-design.js
      - scripts/render-military-symbol-review.mjs
      - .github/workflows/render-military-symbol-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Render and validate Military symbol candidates
        run: node scripts/render-military-symbol-review.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: gauntlet-military-symbol-review
          path: card-design/generated/military-symbols
          if-no-files-found: error
