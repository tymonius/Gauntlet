name: Rules Arbiter r15 CI compatibility patch

on:
  push:
    branches:
      - rules-arbiter-gate3-d-remediation

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: rules-arbiter-gate3-d-remediation
          fetch-depth: 0

      - name: Apply scoped CI compatibility fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          search_path = Path('rules-assistant/local-search.js')
          text = search_path.read_text(encoding='utf-8')
          before = '  if (rawTitle.length > 4 && !rawTitle.includes(" ") && queryTokens.includes(rawTitle)) score += 80;'
          after = '  if (rawTitle.length > 4 && !rawTitle.includes(" ") && queryTokens.includes(rawTitle) && !baseQueryTokens.includes(rawTitle)) score += 80;'
          if text.count(before) != 1:
              raise SystemExit(f'Expected exactly one broad title boost; found {text.count(before)}')
          search_path.write_text(text.replace(before, after), encoding='utf-8')

          revision_files = [
              'rules-assistant/v071-gate2-live-regressions.test.mjs',
              'rules-assistant/v071-gate2-r7-combined-authority.test.mjs',
              'rules-assistant/v071-gate3-a-regressions.test.mjs',
              'rules-assistant/v071-gate3-b-regressions.test.mjs',
              'rules-assistant/v071-battle-card-replacement-retrieval.test.mjs',
              'rules-assistant/v071-gate2-r6-regressions.test.mjs',
              'rules-assistant/v071-copied-effect-retrieval-review.test.mjs',
              'rules-assistant/v071-strategic-withdrawal-review.test.mjs',
              'rules-assistant/v071-fortifications-tactic-choice-review.test.mjs',
              'rules-assistant/v071-short-counterfactual-continuity.test.mjs',
              'rules-assistant/v071-asset-replacement-review.test.mjs',
              'rules-assistant/v071-gate2-r8-conflict-discipline.test.mjs',
              'rules-assistant/v071-r12-direct-overview-classification.test.mjs',
          ]
          old = 'v071-qa-20260915-14'
          new = 'v071-qa-20260916-15'
          total = 0
          for filename in revision_files:
              path = Path(filename)
              content = path.read_text(encoding='utf-8')
              count = content.count(old)
              if count < 1:
                  raise SystemExit(f'Expected at least one stale revision pin in {filename}; found none')
              path.write_text(content.replace(old, new), encoding='utf-8')
              total += count
          print(f'Updated {total} stale revision-marker occurrence(s) across {len(revision_files)} files.')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate affected retrieval and tranche D behavior
        run: >
          npx vitest run
          rules-assistant/v071-deed-cost-clarity-continuity.test.mjs
          rules-assistant/v071-multi-effect-order-retrieval.test.mjs
          rules-assistant/v071-safe-conduct-political-capital-review.test.mjs
          rules-assistant/v071-gate3-d-remediation.test.mjs
          rules-assistant/v071-gate3-d-retrieval-priority.test.mjs
          rules-assistant/v071-gate2-live-regressions.test.mjs
          rules-assistant/v071-gate2-r7-combined-authority.test.mjs
          rules-assistant/v071-gate3-a-regressions.test.mjs
          rules-assistant/v071-gate3-b-regressions.test.mjs
          rules-assistant/v071-battle-card-replacement-retrieval.test.mjs
          rules-assistant/v071-gate2-r6-regressions.test.mjs
          rules-assistant/v071-copied-effect-retrieval-review.test.mjs
          rules-assistant/v071-strategic-withdrawal-review.test.mjs
          rules-assistant/v071-fortifications-tactic-choice-review.test.mjs
          rules-assistant/v071-short-counterfactual-continuity.test.mjs
          rules-assistant/v071-asset-replacement-review.test.mjs
          rules-assistant/v071-gate2-r8-conflict-discipline.test.mjs
          rules-assistant/v071-r12-direct-overview-classification.test.mjs

      - name: Commit validated patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rules-arbiter-r15-ci-compat.yml
          git add rules-assistant/local-search.js rules-assistant/*.test.mjs
          git diff --cached --check
          git commit -m "Fix r15 CI compatibility regressions"
          git push origin HEAD:rules-arbiter-gate3-d-remediation
