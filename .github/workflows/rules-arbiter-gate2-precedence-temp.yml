name: Rules Arbiter Gate 2 precedence patch (temporary)

on:
  push:
    branches:
      - rules-arbiter-gate2-live-failures-20260911

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Patch Gate 2 retrieval precedence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rules-arbiter-gate2-live-failures-20260911
      - name: Preserve specific retrieval before generic named-card fallback
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('rules-assistant/worker-v071.js')
          s = p.read_text()
          old = '  : namedCardSpecificityFocus\n    ? namedCardSpecificityAuthorityIds\n'
          new = '  : namedCardSpecificityFocus && !specificRulePrecedenceFocus && !mysticsTransmutationFocus && !peaceTreatyFocus && !shockAndAweFocus && !intelligenceInterferenceFocus && !battleCardReplacementFocus && !(destinationFocus && battleCardFocus)\n    ? namedCardSpecificityAuthorityIds\n'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rules-assistant/worker-v071.js
          git commit -m 'Preserve specific Rules Arbiter retrieval precedence'
          git push origin HEAD:rules-arbiter-gate2-live-failures-20260911
