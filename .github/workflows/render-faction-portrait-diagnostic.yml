name: Apply faction portrait fix

on:
  push:
    branches: [agent/diagnose-faction-portrait-render]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/diagnose-faction-portrait-render
      - name: Remove obsolete leader-card overrides
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('factions/factions.css')
          css = css_path.read_text()
          css = css.replace(
              '/* Prefer the dedicated leader-card artwork used by current faction sheets. */',
              '/* Normalize legacy page references to the current top-level portrait assets. */'
          )
          css = '\n'.join(
              line for line in css.splitlines()
              if '../images/leader-cards/' not in line
          ) + '\n'
          css_path.write_text(css)

          for page in ('financiers', 'mystics', 'inquisition'):
              path = Path('factions') / page / 'index.html'
              html = path.read_text().replace('.png?v=20260725', '.png')
              path.write_text(html)
          PY
          rm .github/workflows/render-faction-portrait-diagnostic.yml
      - name: Commit confirmed fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add factions/factions.css factions/financiers/index.html factions/mystics/index.html factions/inquisition/index.html .github/workflows/render-faction-portrait-diagnostic.yml
          git commit -m "Stop overriding faction portraits with leader-card assets"
          git push origin HEAD:agent/diagnose-faction-portrait-render
