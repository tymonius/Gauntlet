name: Render faction portrait diagnostic

on:
  workflow_dispatch:
  push:
    branches: [agent/diagnose-faction-portrait-render]
  pull_request:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium renderer
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Render pages and record image state
        run: |
          python3 -m http.server 4173 >/tmp/gauntlet-http.log 2>&1 &
          cat > render-faction-portraits.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({headless:true});
          const pages = ['diplomats','financiers','mystics','inquisition'];
          const report = {};
          for (const name of pages) {
            const page = await browser.newPage({viewport:{width:1365,height:960}, deviceScaleFactor:1});
            await page.goto(`http://127.0.0.1:4173/factions/${name}/`, {waitUntil:'networkidle'});
            report[name] = await page.locator('.hero-leader-art img').evaluateAll(imgs => imgs.map(img => {
              const cs = getComputedStyle(img);
              const r = img.getBoundingClientRect();
              return {
                src: img.getAttribute('src'),
                currentSrc: img.currentSrc,
                complete: img.complete,
                naturalWidth: img.naturalWidth,
                naturalHeight: img.naturalHeight,
                rect: {x:r.x,y:r.y,width:r.width,height:r.height},
                objectFit: cs.objectFit,
                objectPosition: cs.objectPosition,
                display: cs.display,
                opacity: cs.opacity,
                visibility: cs.visibility
              };
            }));
            await page.screenshot({path:`${name}.png`, fullPage:true});
            await page.close();
          }
          fs.writeFileSync('portrait-render-report.json', JSON.stringify(report,null,2));
          await browser.close();
          JS
          node render-faction-portraits.mjs
          rm render-faction-portraits.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: faction-portrait-render
          path: |
            diplomats.png
            financiers.png
            mystics.png
            inquisition.png
            portrait-render-report.json
