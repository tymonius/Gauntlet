name: Rules Arbiter finalize a0d765b1

on:
  push:
    branches: [rules-arbiter-review-a0d765b1]
    paths:
      - '.github/workflows/rules-arbiter-finalize-a0d765b1.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Record reviewed interaction in refinement ledger
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'artifacts/rules-refinement/resolution-ledger.json';
          const ledger = JSON.parse(fs.readFileSync(path, 'utf8'));
          const interactionId = 'a0d765b1-6a04-42ef-8a8c-6c664f9b92b0';
          const entryId = 'overpowered-leader-scope-classification-v071';
          if ((ledger.entries || []).some((entry) => entry.id === entryId)) throw new Error('Ledger entry already exists');
          if ((ledger.entries || []).some((entry) => (entry.interactionIds || []).includes(interactionId))) throw new Error('Interaction already resolved');
          const now = new Date().toISOString();
          ledger.updatedAt = now;
          ledger.entries.push({
            id: entryId,
            status: 'resolved',
            rootCause: 'provisional_overuse',
            interactionIds: [interactionId],
            caseIds: ['overpowered-leader-evaluative-scope'],
            resolutionSurface: 'arbiter_classification',
            summary: 'The reviewed v0.6.0 answer correctly declined to identify a most overpowered Leader because the rules provide no objective comparison standard, but the legacy unresolved status kept the interaction in the provisional-overuse queue. Current v0.7.1 now classifies this evaluative balance/strategy question deterministically as out of scope, with high confidence and no irrelevant rules citations.',
            resolvedAt: now,
            binding: { behaviorRevision: 'v071-scope-20260910-2' }
          });
          fs.writeFileSync(path, JSON.stringify(ledger, null, 2) + '\n');
          NODE

      - name: Run focused scope regressions
        run: npx vitest run rules-assistant/v071-scope-precheck.test.mjs

      - name: Validate refinement contract
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '["artifacts/rules-refinement/resolution-ledger.json","rules-assistant/rules-status.js","rules-assistant/v071-scope-precheck.js","rules-assistant/v071-scope-precheck.test.mjs"]' > /tmp/changed-files.json
          node scripts/validate-rules-refinement-source-first.mjs --changed-files /tmp/changed-files.json
          git diff --check

      - name: Commit ledger refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tymon Scott"
          git config user.email "54303549+tymonius@users.noreply.github.com"
          git add artifacts/rules-refinement/resolution-ledger.json
          git diff --cached --check
          git commit -m "Resolve overpowered Leader scope review"
          git push origin HEAD:rules-arbiter-review-a0d765b1
