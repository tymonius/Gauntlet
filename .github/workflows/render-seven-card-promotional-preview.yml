name: Render seven-card promotional preview

on:
  pull_request:
    branches:
      - main
    paths:
      - 'media/compositions.json'
      - '.github/workflows/render-seven-card-promotional-preview.yml'

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/add-seven-card-promotional-showcase'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Render canonical website card media and compositions
        run: npm run media:build -- --profile=website --strict-art
      - name: Upload seven-card promotional preview
        uses: actions/upload-artifact@v4
        with:
          name: seven-card-promotional-showcase-preview
          path: |
            media/generated/v0.6.2/compositions/website/png/all-factions-promotional-showcase.png
            media/generated/v0.6.2/compositions-manifest.json
          if-no-files-found: error
