name: Fix Intelligence retrieval regression failures

on:
  push:
    branches:
      - fix/rules-arbiter-intelligence-interference
    paths:
      - '.github/workflows/fix-rules-arbiter-intelligence-tests.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rules-arbiter-intelligence-interference
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix active-topic detection
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'rules-assistant/worker-v071.js';
          let source = readFileSync(path, 'utf8');
          const oldBlock = `  const intelligenceTopic = /\\b(?:surveillance|interference|interfere|intel)\\b/;\n  const intelligenceInterferenceFocus = (\n    intelligenceTopic.test(current)\n    || (currentWordCount <= 8 && intelligenceTopic.test(recent))\n  ) && /\\b(?:gambits?|tactics?|face[ -]?up|reveals?|replacements?|revis(?:e|ion))\\b/.test(combined);`;
          const newBlock = `  const intelligenceTopic = /\\b(?:surveillance|interference|interfer(?:e|es|ed|ing)|intel)\\b/;\n  const intelligenceFollowupCue = /\\b(?:gambits?|tactics?|cards?|face[ -]?up|reveals?|replac(?:e|es|ed|ing|ement|ements)|revis(?:e|es|ed|ing|ion|ions)|again|another|reopen|that|it|they|them|those)\\b/.test(current);\n  const intelligenceProcedureSubject = /\\b(?:gambits?|tactics?|cards?|face[ -]?up|reveals?|replac(?:e|es|ed|ing|ement|ements)|revis(?:e|es|ed|ing|ion|ions)|cost|spend|intel)\\b/.test(combined);\n  const intelligenceInterferenceFocus = (\n    intelligenceTopic.test(current)\n    || (currentWordCount <= 8 && intelligenceTopic.test(recent) && intelligenceFollowupCue)\n  ) && intelligenceProcedureSubject;`;
          if (!source.includes(oldBlock)) throw new Error('Expected Intelligence trigger block was not found.');
          source = source.replace(oldBlock, newBlock);
          writeFileSync(path, source);
          NODE
      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-rules-arbiter-intelligence-tests.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules-assistant/worker-v071.js .github/workflows/fix-rules-arbiter-intelligence-tests.yml
          git commit -m "Fix Intelligence retrieval topic detection"
          git push origin HEAD:fix/rules-arbiter-intelligence-interference
