name: Diagnose Palisade Wall Deployment

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    if: github.head_ref == 'agent/neutral-palisade-wall'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/neutral-palisade-wall
      - name: Inspect staged archive
        run: |
          set +e
          {
            wc -c .github/palisade-files.b64
            sha256sum .github/palisade-files.b64
            base64 -d .github/palisade-files.b64 > /tmp/palisade-files.tar.gz
            echo "decode-exit=$?"
            wc -c /tmp/palisade-files.tar.gz
            sha256sum /tmp/palisade-files.tar.gz
            tar -tzf /tmp/palisade-files.tar.gz
            echo "tar-exit=$?"
          } > palisade-deploy-diagnostic.txt 2>&1
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: palisade-deploy-diagnostic
          path: palisade-deploy-diagnostic.txt
