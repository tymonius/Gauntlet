name: Validate current publication contract

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-publication-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout only publication contract inputs
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /config/release-lifecycle.json
            /config/github-release-contract.json
            /scripts/validate-current-public-contract.mjs
            /scripts/validate-current-release-payload.mjs
            /scripts/validate-current-rulebook-booklet-provenance.mjs
            /scripts/validate-github-release-contract.mjs
            /scripts/materialize-public-route-compatibility.mjs
            /scripts/resolve-current-live-publication.mjs
            /scripts/run-*-live-rules-qa.mjs
            /scripts/publication-utils.mjs
            /scripts/verify-clean-v063-live-publication.mjs
            /scripts/verify-v070-live-publication.mjs
            /scripts/verify-v071-live-publication.mjs
            /docs/releases/github/*.md
            /rules-assistant/v063-last-stand-language.js
            /rules-assistant/worker-v*.js
            /rulebook/player-facing/chapter-11.md
            /rulebook/player-facing/corrections.js
            /artifacts/reconstruction/clean-v0.6.3/rulebook/Gauntlet_v0.6.3_Rulebook.md
            /index.html
            /legacy/public-versions/
            /v*/index.html
            /changelog/index.html
            /about/index.html
            /faq/index.html
            /privacy/index.html
            /contact/**/index.html
            /accessibility/index.html
            /press/index.html
            /404.html
            /robots.txt
            /sitemap.xml
            /apps/card-reference/**
            /apps/deckbuilder/**
            /apps/factions/**
            /apps/start/**
            /rulebook/index.html
            /rules-arbiter/index.html
            /apps/playtest/**/index.html
            /site-footer.css
            /site-polish.css
            /analytics-consent.js
            /design-tokens.css
            /images/faction-symbols/*.svg
            /releases/**

      - name: Materialize relocated public routes
        run: |
          if [ -d apps/card-reference ]; then
            mkdir -p card-reference
            cp -a apps/card-reference/. card-reference/
          fi
          if [ -d apps/deckbuilder ]; then
            mkdir -p deckbuilder
            cp -a apps/deckbuilder/. deckbuilder/
          fi
          if [ -d apps/factions ]; then
            mkdir -p factions
            cp -a apps/factions/. factions/
          fi
          if [ -d apps/playtest ]; then
            mkdir -p playtest
            cp -a apps/playtest/. playtest/
          fi
          if [ -d apps/start ]; then
            mkdir -p start
            cp -a apps/start/. start/
          fi
          node scripts/materialize-public-route-compatibility.mjs

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install contract dependency
        run: npm install --no-save --package-lock=false pdf-lib

      - name: Validate current player-facing publication contract
        run: |
          node scripts/validate-current-public-contract.mjs
          node scripts/validate-current-release-payload.mjs
          node scripts/validate-current-rulebook-booklet-provenance.mjs
          node scripts/validate-github-release-contract.mjs
          node scripts/resolve-current-live-publication.mjs --plan
