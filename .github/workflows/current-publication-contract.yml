name: Validate current publication contract

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-publication-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout only publication contract inputs
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /config/release-lifecycle.json
            /scripts/validate-current-public-contract.mjs
            /index.html
            /v0.6.3/index.html
            /changelog/index.html
            /start/index.html
            /start/styles.css
            /rulebook/index.html
            /card-reference/index.html
            /factions/index.html
            /factions/*/index.html
            /deckbuilder/index.html
            /rules-arbiter/index.html
            /design-tokens.css
            /images/faction-symbols/*.svg
            /releases/*/Gauntlet_*_Manifest.json
            /releases/*/Gauntlet_*_Rulebook_Booklet.pdf

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install contract dependency
        run: npm install --no-save --package-lock=false pdf-lib

      - name: Validate current player-facing publication contract
        run: node scripts/validate-current-public-contract.mjs
