name: Validate current publication contract

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-publication-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout only publication contract inputs
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /config/release-lifecycle.json
            /config/github-release-contract.json
            /scripts/validate-current-public-contract.mjs
            /scripts/validate-current-release-payload.mjs
            /scripts/validate-current-rulebook-booklet-provenance.mjs
            /scripts/validate-github-release-contract.mjs
            /scripts/publication-utils.mjs
            /scripts/verify-clean-v063-live-publication.mjs
            /scripts/verify-v070-live-publication.mjs
            /scripts/verify-v071-live-publication.mjs
            /docs/releases/github/*.md
            /rules-assistant/v063-last-stand-language.js
            /rulebook/player-facing/chapter-11.md
            /rulebook/player-facing/corrections.js
            /artifacts/reconstruction/clean-v0.6.3/rulebook/Gauntlet_v0.6.3_Rulebook.md
            /index.html
            /v0.6.3/index.html
            /v0.7.0/index.html
            /v0.7.1/index.html
            /changelog/index.html
            /about/index.html
            /faq/index.html
            /404.html
            /robots.txt
            /sitemap.xml
            /start/index.html
            /start/styles.css
            /rulebook/index.html
            /card-reference/index.html
            /factions/index.html
            /factions/*/index.html
            /deckbuilder/index.html
            /rules-arbiter/index.html
            /playtest/**/index.html
            /site-footer.css
            /design-tokens.css
            /images/faction-symbols/*.svg
            /releases/*/Gauntlet_*_Manifest.json
            /releases/*/Gauntlet_*_Rulebook_Booklet.pdf
            /releases/v0.6.3/**
            /releases/v0.7.0/**
            /releases/v0.7.1/**

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install contract dependency
        run: npm install --no-save --package-lock=false pdf-lib

      - name: Validate current player-facing publication contract
        run: |
          node scripts/validate-current-public-contract.mjs
          node scripts/validate-current-release-payload.mjs
          node scripts/validate-current-rulebook-booklet-provenance.mjs
          node scripts/validate-github-release-contract.mjs
