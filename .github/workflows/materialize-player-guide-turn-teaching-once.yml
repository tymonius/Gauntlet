name: Materialize Player Guide turn teaching once

on:
  push:
    branches:
      - docs/player-guide-turn-teaching

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/player-guide-turn-teaching
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clarify the normal turn model
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('rulebook/player-guide/player-guide.md')
          text = path.read_text()
          old = '''Every normal turn follows the same six-part rhythm:

> **Capture → Draw → Opening → Movement → Denouement → Cleanup**

Most of the time, you can think of it even more simply:

> **Capture. Draw. Act. Move.**

You normally get **one Action for the entire turn**. You may spend it before moving, during **Opening**, or save it until after moving, during **Denouement**.
'''
          new = '''Every normal turn follows the same six-part rhythm:

> **Capture → Draw → Opening → Movement → Denouement → Cleanup**

The names **Opening** and **Denouement** are just the two places where you can normally spend your Action: before Movement or after it. You get **one Action for the entire turn**.

So after Capture and Draw, the middle of most turns is simply:

> **Act, then move — or move, then act.**
'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one turn-teaching passage; found {text.count(old)}.')
          path.write_text(text.replace(old, new))
          PY

      - name: Validate publication integration
        run: |
          node scripts/validate-rules-publication-contract.mjs
          node scripts/validate-rules-publication-scaffolds.mjs

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/materialize-player-guide-turn-teaching-once.yml
          git config user.name 'Gauntlet publication materializer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rulebook/player-guide/player-guide.md .github/workflows/materialize-player-guide-turn-teaching-once.yml
          git commit -m 'Clarify Player Guide turn teaching'
          git push origin HEAD:docs/player-guide-turn-teaching
