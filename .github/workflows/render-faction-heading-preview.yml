name: Render faction heading preview

on:
  pull_request:
    branches:
      - main
    paths:
      - 'factions/homepage.css'
      - '.github/workflows/render-faction-heading-preview.yml'

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/faction-heading-symbols'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Render faction section
        shell: bash
        run: |
          python3 -m http.server 4173 > /tmp/gauntlet-faction-preview-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const desktop = await browser.newPage({ viewport: { width: 1240, height: 900 }, deviceScaleFactor: 1 });
            await desktop.goto('http://127.0.0.1:4173/#factions', { waitUntil: 'networkidle' });
            await desktop.locator('#factions').screenshot({ path: 'faction-heading-desktop.png' });

            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            await mobile.goto('http://127.0.0.1:4173/#factions', { waitUntil: 'networkidle' });
            await mobile.locator('#factions').screenshot({ path: 'faction-heading-mobile.png' });
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: faction-heading-preview
          path: |
            faction-heading-desktop.png
            faction-heading-mobile.png
          if-no-files-found: error
