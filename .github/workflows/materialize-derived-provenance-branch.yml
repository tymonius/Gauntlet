name: Materialize Derived Asset Provenance Batch

on:
  pull_request:
    paths:
      - .github/workflows/materialize-derived-provenance-branch.yml
      - .github/asset-provenance-remediation.json
      - .github/asset-provenance.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Verify materialized batch
        run: |
          python .github/scripts/materialize-asset-provenance.py --check
          python .github/scripts/validate-asset-provenance.py

      - name: Inventory remaining unresolved assets
        run: |
          python - <<'PY'
          import collections
          import json
          import pathlib
          import subprocess

          policy = json.loads(pathlib.Path('.github/asset-provenance.json').read_text(encoding='utf-8'))
          rules = policy['policy']
          baseline = policy['baseline_commit']
          extensions = {ext.lower() for ext in rules['extensions']}
          ignored = tuple(p.rstrip('/') for p in rules.get('ignored_paths', []))
          recorded = {r['path'] for r in policy.get('assets', [])}

          def git(*args):
              return subprocess.run(['git', *args], check=True, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE).stdout.strip()

          def is_ignored(path):
              return any(path == p or path.startswith(p + '/') for p in ignored)

          governed = set()
          for root in rules['governed_roots']:
              for rel in git('ls-files', '--', root).splitlines():
                  if rel and not is_ignored(rel) and pathlib.Path(rel).suffix.lower() in extensions:
                      governed.add(rel)

          unresolved = []
          anomalies = []
          for rel in sorted(governed - recorded):
              present = subprocess.run(['git', 'cat-file', '-e', f'{baseline}:{rel}'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0
              if not present:
                  anomalies.append((rel, 'not present at baseline'))
                  continue
              if git('rev-parse', f'{baseline}:{rel}') != git('hash-object', rel):
                  anomalies.append((rel, 'changed from baseline'))
                  continue
              unresolved.append(rel)

          groups = collections.Counter()
          for rel in unresolved:
              parts = rel.split('/')
              if rel.startswith('images/artwork/') and len(parts) >= 3:
                  groups['images/artwork/' + parts[2] + '/'] += 1
              elif rel.startswith('images/3d/2d assets/'):
                  groups['images/3d/2d assets/'] += 1
              elif len(parts) >= 2:
                  groups['/'.join(parts[:2]) + '/'] += 1
              else:
                  groups[parts[0]] += 1

          print(f'GOVERNED={len(governed)} EXPLICIT={len(recorded)} UNRESOLVED={len(unresolved)} ANOMALIES={len(anomalies)}')
          print('GROUPS')
          for group, count in sorted(groups.items()):
              print(f'{count:3}  {group}')
          print('UNRESOLVED PATHS')
          for rel in unresolved:
              print(rel)
          if anomalies:
              print('ANOMALIES')
              for rel, reason in anomalies:
                  print(f'{rel}: {reason}')
          PY
