name: Rules Arbiter General inspiration audit

on:
  push:
    branches:
      - ops/rules-arbiter-backlog-schema-20260909
    paths:
      - '.github/workflows/rules-arbiter-backlog-schema.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production General conversation
        shell: bash
        run: |
          set -euo pipefail
          echo '=== SESSION ==='
          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant --remote --config rules-assistant/wrangler.toml --json --command "SELECT id, session_id, previous_interaction_id, sequence_index, created_at, question, answer, game_version, ruling_status, ruling_status_v2, confidence, source_count, feedback_rating, review_status, issue_types_json, reviewer_notes, resolution FROM rules_interactions WHERE session_id = 'a3bb8f2a-cf7f-4f56-80a2-e97ce2c089ed' ORDER BY sequence_index, created_at"
          echo '=== AUDIT ==='
          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant --remote --config rules-assistant/wrangler.toml --json --command "SELECT * FROM rules_interaction_audits WHERE interaction_id = '5990af8d-4276-41a0-bebf-d4b1ff762e09'"
          echo '=== AUDIT HISTORY ==='
          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant --remote --config rules-assistant/wrangler.toml --json --command "SELECT * FROM rules_interaction_audit_history WHERE interaction_id = '5990af8d-4276-41a0-bebf-d4b1ff762e09' ORDER BY reviewed_at"
      - name: Probe deterministic current scope classifier
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { classifyV071ScopePrecheck } from './rules-assistant/v071-scope-precheck.js';
          const questions = [
            'Who is the General designed after?',
            'Who was the General designed after?',
            'Who is the General based on?',
            'What historical figure inspired the General?',
            'What does the General do?'
          ];
          for (const question of questions) {
            console.log(JSON.stringify({ question, result: classifyV071ScopePrecheck(question) }, null, 2));
          }
          NODE
