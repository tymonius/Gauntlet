name: Rules Arbiter Communism expansion audit

on:
  push:
    branches:
      - ops/rules-arbiter-backlog-schema-20260909
    paths:
      - '.github/workflows/rules-arbiter-backlog-schema.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect reviewed interaction and session
        shell: bash
        run: |
          set -euo pipefail
          echo '=== SESSION ==='
          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant --remote --config rules-assistant/wrangler.toml --json --command "SELECT id, session_id, previous_interaction_id, sequence_index, created_at, question, answer, game_version, ruling_status, ruling_status_v2, confidence, answer_mode, answer_mode_v2, source_count, feedback_rating, review_status, issue_types_json, reviewer_notes, resolution FROM rules_interactions WHERE session_id = 'ea678554-19fe-4e6a-b6a8-bab486e85ad9' ORDER BY sequence_index, created_at"
          echo '=== AUDIT ==='
          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant --remote --config rules-assistant/wrangler.toml --json --command "SELECT * FROM rules_interaction_audits WHERE interaction_id = '45f0d3a8-aa0f-4adc-8e3c-9a7d2f32a86d'"
          echo '=== AUDIT HISTORY ==='
          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant --remote --config rules-assistant/wrangler.toml --json --command "SELECT * FROM rules_interaction_audit_history WHERE interaction_id = '45f0d3a8-aa0f-4adc-8e3c-9a7d2f32a86d' ORDER BY reviewed_at"
          echo '=== DIAGNOSTICS ==='
          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant --remote --config rules-assistant/wrangler.toml --json --command "SELECT * FROM rules_interaction_diagnostics WHERE interaction_id = '45f0d3a8-aa0f-4adc-8e3c-9a7d2f32a86d'"
          echo '=== SOURCES ==='
          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant --remote --config rules-assistant/wrangler.toml --json --command "SELECT * FROM rules_interaction_sources WHERE interaction_id = '45f0d3a8-aa0f-4adc-8e3c-9a7d2f32a86d' ORDER BY ordinal"
          echo '=== REVIEWS ==='
          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant --remote --config rules-assistant/wrangler.toml --json --command "SELECT * FROM rules_interaction_reviews WHERE interaction_id = '45f0d3a8-aa0f-4adc-8e3c-9a7d2f32a86d' ORDER BY created_at"
