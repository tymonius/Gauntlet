name: Reconcile final main into v0.6.1

on:
  push:
    branches:
      - rules/v0.6.1-playtest-revision
    paths:
      - ".github/workflows/reconcile-v061-final-main.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-v061-final-main
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.6.1 branch
        uses: actions/checkout@v4
        with:
          ref: rules/v0.6.1-playtest-revision
          fetch-depth: 0

      - name: Merge current main while preserving release resolutions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main rules/v0.6.1-playtest-revision
          git merge -X ours --no-edit origin/main
          git push origin HEAD:rules/v0.6.1-playtest-revision
