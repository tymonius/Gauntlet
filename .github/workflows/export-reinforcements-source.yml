name: Deploy Reinforcements

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    if: github.head_ref == 'agent/neutral-reinforcements'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/neutral-reinforcements
      - name: Apply implementation
        run: |
          if [ ! -f .github/reinforcements-new-00.b64 ]; then
            echo "Implementation already applied."
            exit 0
          fi
          echo "3dfed7ed6fce7088e95b087b0a338306a3b859a5ece036dcd236738a2b8dd088  .github/reinforcements-new-00.b64" | sha256sum -c -
          echo "47cb410f3085c857958bc32dc472c730016f4e90af0042ddb2106812ace64a47  .github/reinforcements-new-02.b64" | sha256sum -c -
          echo "90794db3e4efe809e2b7965e1163595829197d9853f2f5012d4fdf9c06dcf586  .github/reinforcements-new-01a.b64" | sha256sum -c -
          echo "dd1f0a09d7aa8d0b5cdf0b92cfb780a9538d85246253719c506f431754a3b7c4  .github/reinforcements-new-01b.b64" | sha256sum -c -
          echo "d03ebf999879d3da54678cc219b6ccb53ea7ab5ad851914c44e5d99e1be87656  .github/reinforcements-new-03.b64" | sha256sum -c -
          cat \
            .github/reinforcements-new-00.b64 \
            .github/reinforcements-new-02.b64 \
            .github/reinforcements-new-01a.b64 \
            .github/reinforcements-new-01b.b64 \
            .github/reinforcements-new-03.b64 \
            > /tmp/reinforcements-impl.b64
          test "$(wc -c < /tmp/reinforcements-impl.b64)" = "38608"
          echo "8c163ebc9457b269d39bd199a9443a674e9c3c0b0cf17be32dadefa1abac5567  /tmp/reinforcements-impl.b64" | sha256sum -c -
          base64 -d /tmp/reinforcements-impl.b64 > /tmp/reinforcements-impl.tar.gz
          echo "5478999500ca7af38c3f365cd2bfb6eef19d0a646a69bb1a642441758be8b587  /tmp/reinforcements-impl.tar.gz" | sha256sum -c -
          tar -xzf /tmp/reinforcements-impl.tar.gz
          rm -f \
            .github/reinforcements-00.b64 \
            .github/reinforcements-new-00.b64 \
            .github/reinforcements-new-01.b64 \
            .github/reinforcements-new-01a.b64 \
            .github/reinforcements-new-01b.b64 \
            .github/reinforcements-new-02.b64 \
            .github/reinforcements-new-03.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Neutral Reinforcements"
          git push origin HEAD:agent/neutral-reinforcements
