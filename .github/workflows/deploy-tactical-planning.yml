name: Deploy Tactical Planning

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    if: github.head_ref == 'agent/neutral-tactical-planning'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/neutral-tactical-planning
          fetch-depth: 0

      - name: Verify and deploy Tactical Planning
        run: |
          set -euo pipefail
          echo '4f325b81e653eea6d2504f284029068818cf6fcf2b1be5b9077a77a3a4807cfa  .github/tactical-planning-new-00.b64' | sha256sum -c -
          echo '7b21a8d021feaee048a7765c33628a88dd675d6318f506052b9290d707ec98ee  .github/tactical-planning-new-01.b64' | sha256sum -c -
          echo '2867d4b05d00bca25cc0081d782ae885de9b16a9cebf6e352430e9dcd1e87877  .github/tactical-planning-new-02.b64' | sha256sum -c -
          echo 'd10f28c6048fad9711ef44b3fb490535df1106a5259edd345dea49085448970f  .github/tactical-planning-new-03.b64' | sha256sum -c -
          echo '82c2b06038fcbca2437ee701e6fe61a5745d23caaa3771eddd83ea64b16cc329  .github/tactical-planning-new-04.b64' | sha256sum -c -
          echo '03d1774cec3325c2eb11044a4a072ad4d823ef89c09ee3c45e48e8fe5c1ad2ce  .github/tactical-planning-new-05.b64' | sha256sum -c -
          echo '3297581f550d80f2a3022241f618d221881e8eb5b1bc014dfcd21e86c4cb24c6  .github/tactical-planning-new-06.b64' | sha256sum -c -
          echo '5945b2afe5c0846727b2a2cc13e5e551bc5aaa70cc19fc0aa42cde6507359e36  .github/tactical-planning-new-07.b64' | sha256sum -c -
          echo 'c562551ea5f87490db010c8995d48837f5f77d3f40e832af51cb8138ad62af8a  .github/tactical-planning-new-08.b64' | sha256sum -c -
          cat .github/tactical-planning-new-{00..08}.b64 > /tmp/tactical-planning-files.b64
          test "$(wc -c < /tmp/tactical-planning-files.b64)" -eq 29888
          echo '1537c6e8191d257c3fcf2427fedd00f82a49e9523a80228b0429c32ea8233e0a  /tmp/tactical-planning-files.b64' | sha256sum -c -
          base64 -d /tmp/tactical-planning-files.b64 > /tmp/tactical-planning-files.tar.gz
          test "$(wc -c < /tmp/tactical-planning-files.tar.gz)" -eq 22415
          echo '9e9bcc52314f758a3dbd4f5955ff10d26b4d25dc015b18ae12ef8f5dd5d9ca9f  /tmp/tactical-planning-files.tar.gz' | sha256sum -c -
          tar -xzf /tmp/tactical-planning-files.tar.gz
          rm -f .github/tactical-planning-*.b64
          rm -f .github/workflows/export-tactical-planning-base.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Neutral Tactical Planning'
          git push origin HEAD:agent/neutral-tactical-planning
