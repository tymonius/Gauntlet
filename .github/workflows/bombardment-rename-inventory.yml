name: Generate Bombardment Rename Inventory

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'fix/neutral-bombardment'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: fix/neutral-bombardment
          fetch-depth: 0

      - name: Generate rename inventory
        run: python .github/scripts/generate-bombardment-rename-inventory.py

      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/internal/Bombardment_Rename_Inventory.md
          git commit -m "Generate Bombardment rename inventory" || exit 0
          git push origin HEAD:fix/neutral-bombardment
