name: Validate v0.6.3 Last Stand language

on:
  pull_request:
    paths:
      - ".github/workflows/validate-v063-last-stand-language.yml"
      - "docs/Gauntlet_v0.6.3_*.md"
      - "factions/**/index.html"
      - "index.html"
      - "releases/v0.6.3-reconstructed/**"
      - "rulebook/**"
      - "rules-assistant/**"
      - "scripts/*v063*"
      - "scripts/publication-utils.mjs"
      - "start/index.html"
      - "v0.6.3/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate-v063-last-stand-language.yml"
      - "docs/Gauntlet_v0.6.3_*.md"
      - "factions/**/index.html"
      - "index.html"
      - "releases/v0.6.3-reconstructed/**"
      - "rulebook/**"
      - "rules-assistant/**"
      - "scripts/*v063*"
      - "scripts/publication-utils.mjs"
      - "start/index.html"
      - "v0.6.3/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate PR #171 terminology contract
        run: node scripts/validate-v063-last-stand-language.mjs
