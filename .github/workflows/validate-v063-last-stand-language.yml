name: Validate v0.6.3 player rules language

on:
  pull_request:
    paths:
      - ".github/workflows/validate-v063-last-stand-language.yml"
      - "docs/Archive/v0.6.3-development/Gauntlet_v0.6.3_*.md"
      - "docs/recovery/frozen-scripts/v0.6.3/generate-v063-canonical-data-candidate.mjs"
      - "factions/**/index.html"
      - "index.html"
      - "legacy/public-versions/v0.6.3/**"
      - "releases/v0.6.3/**"
      - "rulebook/**"
      - "rules-assistant/**"
      - "scripts/*v063*"
      - "scripts/publication-utils.mjs"
      - "start/index.html"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate-v063-last-stand-language.yml"
      - "docs/Archive/v0.6.3-development/Gauntlet_v0.6.3_*.md"
      - "docs/recovery/frozen-scripts/v0.6.3/generate-v063-canonical-data-candidate.mjs"
      - "factions/**/index.html"
      - "index.html"
      - "legacy/public-versions/v0.6.3/**"
      - "releases/v0.6.3/**"
      - "rulebook/**"
      - "rules-assistant/**"
      - "scripts/*v063*"
      - "scripts/publication-utils.mjs"
      - "start/index.html"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/validate-v063-last-stand-language.yml
            .github/workflows/pr-quality-gate.yml
            .github/workflows/build-clean-v063-booklet.yml
            scripts/validate-v063-last-stand-language.mjs
            scripts/validate-v063-player-rulebook.mjs
            scripts/build-clean-v063-publication-arbiter-web.mjs
            scripts/build-clean-v063-publication-core-web.mjs
            scripts/build-clean-v063-publication-release.mjs
            docs/recovery/frozen-scripts/v0.6.3/generate-v063-canonical-data-candidate.mjs
            scripts/publication-utils.mjs
            rulebook/app.js
            rulebook/player-facing/chapter-11.md
            rulebook/player-facing/corrections.js
            rules-assistant/rules-deterministic-v063.js
            rules-assistant/v063-last-stand-language.js
            rules-assistant/v063-public-corpus.js
            docs/Archive/v0.6.3-development/Gauntlet_v0.6.3_Cross_Surface_Closeout_Matrix.md
            docs/Archive/v0.6.3-development/Gauntlet_v0.6.3_General_Card_Rules_Candidate.md
            docs/Archive/v0.6.3-development/Gauntlet_v0.6.3_Implementation_Ledger.md
            docs/Archive/v0.6.3-development/Gauntlet_v0.6.3_Shared_Rules_Candidate.md
            docs/Archive/v0.6.3-development/Gauntlet_v0.6.3_Shared_Rules_Test_Matrix.md
            index.html
            start/index.html
            factions/military/index.html
            factions/financiers/index.html
            factions/inquisition/index.html
            releases/v0.6.3/Gauntlet_v0.6.3_Rulebook.md
            releases/v0.6.3/Gauntlet_v0.6.3_Canonical_Data.json
            artifacts/reconstruction/v0.6.3-browser-candidate/data/Gauntlet_v0.6.3_Canonical_Data_Candidate.json
            artifacts/reconstruction/clean-v0.6.3/rulebook/Gauntlet_v0.6.3_Rulebook.md
            artifacts/reconstruction/clean-v0.6.3/downstream/canonical-data.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate PR #171 terminology contract
        run: node scripts/validate-v063-last-stand-language.mjs
      - name: Validate player-facing Rulebook layer
        run: node scripts/validate-v063-player-rulebook.mjs
