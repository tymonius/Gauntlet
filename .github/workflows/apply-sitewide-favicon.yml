name: Apply sitewide favicon

on:
  push:
    branches:
      - agent/add-favicons-to-subpages

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-favicons-to-subpages

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply favicon links
        run: node scripts/apply-sitewide-favicon.mjs

      - name: Commit generated HTML updates
        run: |
          if git diff --quiet -- '*.html'; then
            echo "No HTML updates needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' '**/*.html'
          git commit -m "Apply favicon links to static pages"
          git push
