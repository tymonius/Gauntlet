name: Polish Player Guide table tools once

on:
  push:
    branches:
      - docs/player-guide-table-tools

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/player-guide-table-tools
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Make QR grid compatible with the guide renderer
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const guidePath = 'rulebook/player-guide/player-guide.md';
          let guide = fs.readFileSync(guidePath, 'utf8');
          const tableStart = guide.indexOf('|  |  |\n| --- | --- |');
          if (tableStart === -1) throw new Error('Could not find the table-tools grid.');

          const table = [
            '|  |  |',
            '| --- | --- |',
            '| ![QR code for Ask the Chief Justice](/rulebook/assets/qr/chief-justice.svg) **Ask the Chief Justice** **gauntlet.run/rules-arbiter/** **Use when:** a rule, timing question, or card interaction is unclear. Ask in ordinary language and get a player-friendly ruling grounded in the current rules. | ![QR code for Card Reference](/rulebook/assets/qr/card-reference.svg) **Card Reference** **gauntlet.run/card-reference/** **Use when:** you need the exact current text of a card, Leader, Territory, Proposal, or other game object without searching through the rulebook. |',
            '| ![QR code for Full Rules](/rulebook/assets/qr/full-rules.svg) **Full Rules** **gauntlet.run/rulebook/** **Use when:** you want to read the complete rules directly, check a definition, or see the technical rule behind a ruling. | ![QR code for Deckbuilder](/rulebook/assets/qr/deckbuilder.svg) **Deckbuilder** **gauntlet.run/deckbuilder/** **Use when:** you are choosing or changing a Deck, checking Deckbuilding Value and legality, or starting from a recommended starter Deck. |',
            '| ![QR code for Start Playing](/rulebook/assets/qr/start-playing.svg) **Start Playing** **gauntlet.run/start/** **Use when:** someone is new to Gauntlet or needs the guided path through faction choice, Leader choice, starter Decks, and getting a game onto the table. | ![QR code for Start a Playtest](/rulebook/assets/qr/playtest.svg) **Start a Playtest** **gauntlet.run/playtest/** **Use when:** this game is a playtest. Create or join a tracked session so rules questions, results, and feedback can be connected to the game. |',
          ].join('\n');

          guide = `${guide.slice(0, tableStart)}${table}\n`;
          fs.writeFileSync(guidePath, guide);

          const cssPath = 'rulebook/publication.css';
          let css = fs.readFileSync(cssPath, 'utf8');
          if (css.includes('At-the-table QR tool grid')) throw new Error('QR tool-grid CSS already exists.');
          css += `
          
          /* At-the-table QR tool grid */
          .rulebook-content table:has(img[src*="/rulebook/assets/qr/"]) {
            table-layout: fixed;
          }
          .rulebook-content table:has(img[src*="/rulebook/assets/qr/"]) thead {
            display: none;
          }
          .rulebook-content td:has(> img[src*="/rulebook/assets/qr/"]) {
            padding: 18px;
            text-align: center;
          }
          .rulebook-content td:has(> img[src*="/rulebook/assets/qr/"]) > img {
            width: 30mm;
            height: 30mm;
            max-width: 100%;
            margin: 0 auto 10px;
            filter: none;
            mix-blend-mode: normal;
          }
          .rulebook-content td:has(> img[src*="/rulebook/assets/qr/"]) > strong {
            display: block;
            margin-top: 3px;
          }
          .rulebook-content td:has(> img[src*="/rulebook/assets/qr/"]) > strong:nth-of-type(2) {
            color: var(--rulebook-muted);
            font-family: var(--rulebook-ui);
            font-size: 0.76rem;
            font-weight: 650;
          }
          .rulebook-content td:has(> img[src*="/rulebook/assets/qr/"]) > strong:nth-of-type(3) {
            margin-top: 10px;
            color: var(--rulebook-crimson);
            font-family: var(--rulebook-ui);
            font-size: 0.7rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
          }
          `;
          css = css.replace(/^ {10}/gm, '');
          fs.writeFileSync(cssPath, css);
          NODE

      - name: Validate publication integration
        run: |
          node scripts/validate-rules-publication-contract.mjs
          node scripts/validate-rules-publication-scaffolds.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { renderMarkdown } from './rulebook/markdown.js';
          const source = fs.readFileSync('rulebook/player-guide/player-guide.md', 'utf8');
          const rendered = renderMarkdown(source).html;
          if ((rendered.match(/rulebook\/assets\/qr\//g) || []).length !== 6) throw new Error('Rendered guide does not contain exactly six QR images.');
          if (!rendered.includes('Ask the Chief Justice') || !rendered.includes('Start a Playtest')) throw new Error('Rendered table-tools page is incomplete.');
          NODE

      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/polish-player-guide-table-tools-once.yml
          git config user.name 'Gauntlet publication materializer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rulebook/player-guide/player-guide.md rulebook/publication.css .github/workflows/polish-player-guide-table-tools-once.yml
          git commit -m 'Polish at-the-table QR tools layout [table-tools-polished]'
          git push origin HEAD:docs/player-guide-table-tools
