name: Repair Browser Rulebook terminology

on:
  push:
    branches:
      - agent/rebuild-clean-v063-rules-browser
    paths:
      - 'scripts/migrate-browser-rulebook-terminology.mjs'
      - '.github/workflows/migrate-browser-rulebook-terminology.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and validate Browser Rulebook terminology repair
        run: node scripts/migrate-browser-rulebook-terminology.mjs
      - name: Commit repaired Browser Rulebook reconstruction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore Browser Rulebook terminology'
          git push
