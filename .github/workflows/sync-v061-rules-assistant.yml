name: Sync Rules Arbiter to v0.6.1

on:
  push:
    branches:
      - rules/v0.6.1-playtest-revision
    paths:
      - .github/workflows/sync-v061-rules-assistant.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout revision branch
        uses: actions/checkout@v4
        with:
          ref: rules/v0.6.1-playtest-revision

      - name: Update Rules Arbiter source and session context
        run: |
          python - <<'PY'
          from pathlib import Path

          widget_path = Path('rules-assistant/widget.js')
          widget = widget_path.read_text(encoding='utf-8')

          replacements = {
              'version: "v0.6.0",': 'version: "v0.6.1",',
              '"What happens to cards used in battle?",': '"Where do Gambits and Tactics go?",',
              'this.sessionId = getOrCreateSessionId();': 'this.sessionId = getOrCreateSessionId();\n    this.playtestContext = getPlaytestContext();',
              'answer: "Ask me about the v0.6.0 rulebook, cards, Leaders, faction systems, Territories, battle timing, or victory conditions.",': 'answer: "Ask me about the v0.6.1 rulebook, cards, Leaders, faction systems, Territories, Gambits, Tactics, battle timing, or victory conditions.",',
              'sessionId: this.sessionId\n          })': 'sessionId: this.sessionId,\n            rulesVersion: CONFIG.version,\n            playtestSessionId: this.playtestContext.sessionId,\n            sheetSerial: this.playtestContext.sheetSerial\n          })',
              'body: JSON.stringify({ interactionId, rating, comment: String(comment || "").trim() })': 'body: JSON.stringify({\n        interactionId,\n        rating,\n        comment: String(comment || "").trim(),\n        sessionId: this.sessionId,\n        rulesVersion: CONFIG.version,\n        playtestSessionId: this.playtestContext.sessionId,\n        sheetSerial: this.playtestContext.sheetSerial\n      })',
              'inferred: "Interpretation",': 'inferred: "Inferred ruling",',
          }
          for old, new in replacements.items():
              if old not in widget:
                  raise SystemExit(f'Missing widget replacement target: {old[:80]!r}')
              widget = widget.replace(old, new, 1)

          notice_old = 'Answers use the canonical ${escapeHtml(CONFIG.version)} sources. Questions, answers, and optional feedback may be anonymously logged to improve the rules and this tool. Printed rules and component text remain authoritative.'
          notice_new = 'Answers use the canonical ${escapeHtml(CONFIG.version)} sources. Questions, answers, citations, ruling status, and optional feedback may be logged to improve the rules and this tool. When opened from a formal playtest session, the sheet serial and session identifier are included automatically. Printed rules and component text remain authoritative.'
          if notice_old not in widget:
              raise SystemExit('Missing Rules Arbiter notice target')
          widget = widget.replace(notice_old, notice_new, 1)

          helper_anchor = '''function getOrCreateSessionId() {
          '''.replace('          ', '')
          helper = '''function getPlaytestContext() {
            const params = new URLSearchParams(window.location.search);
            const sessionId = firstValidContextValue([
              params.get("playtestSession"),
              params.get("session"),
              readSessionContext("gauntlet_playtest_session_id")
            ]);
            const sheetSerial = firstValidContextValue([
              params.get("sheet"),
              params.get("serial"),
              readSessionContext("gauntlet_playtest_sheet_serial")
            ]);

            if (sessionId) storeSessionContext("gauntlet_playtest_session_id", sessionId);
            if (sheetSerial) storeSessionContext("gauntlet_playtest_sheet_serial", sheetSerial);
            return { sessionId, sheetSerial };
          }

          function firstValidContextValue(values) {
            for (const value of values) {
              const normalized = String(value || "").trim();
              if (/^[a-zA-Z0-9_.:-]{3,120}$/.test(normalized)) return normalized;
            }
            return null;
          }

          function readSessionContext(key) {
            try {
              return sessionStorage.getItem(key);
            } catch {
              return null;
            }
          }

          function storeSessionContext(key, value) {
            try {
              sessionStorage.setItem(key, value);
            } catch {
              // Formal-session linkage is optional when browser storage is unavailable.
            }
          }

          function getOrCreateSessionId() {
          '''.replace('          ', '')
          if helper_anchor not in widget:
              raise SystemExit('Missing playtest-context helper insertion point')
          widget = widget.replace(helper_anchor, helper, 1)
          widget_path.write_text(widget, encoding='utf-8')

          search_path = Path('rules-assistant/local-search.js')
          search = search_path.read_text(encoding='utf-8')
          search = search.replace(
              '  hand: ["normal hand", "battle hand"],',
              '  hand: ["gambit", "reserve", "persistent private cards"],\n'
              '  gambit: ["hand", "graveyard", "set gambit"],\n'
              '  reserve: ["temporary cards", "tactic", "battle draw"],\n'
              '  tactic: ["reserve", "discard pile", "choose tactic"],\n'
              '  aftermath: ["battle result", "destinations", "retreat"],\n'
              '  withdrawal: ["no winner", "no loser", "end battle"],'
          )
          search = search.replace(
              'const CANONICAL_DATA_PATH = "releases/v0.6.0/Gauntlet_v0.6.0_Canonical_Data.json";',
              'const CANONICAL_DATA_PATH = "releases/v0.6.1/Gauntlet_v0.6.1_Canonical_Data.json";'
          )
          search = search.replace(
              'const RULEBOOK_PATH = "releases/v0.6.0/Gauntlet_v0.6.0_Rulebook.md";',
              'const RULEBOOK_PATH = "releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.md";'
          )
          search = search.replace(
              'const RULEBOOK_PDF_PATH = "releases/v0.6.0/Gauntlet_v0.6.0_Rulebook.pdf";',
              'const RULEBOOK_PDF_PATH = "releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.pdf";'
          )
          search = search.replace('canonicalData?.version || "v0.6.0"', 'canonicalData?.version || "v0.6.1"')
          search = search.replace('canonicalData.version || "v0.6.0"', 'canonicalData.version || "v0.6.1"')
          search = search.replace('version = "v0.6.0"', 'version = "v0.6.1"')
          search = search.replace(
              '"action", "battle", "mission", "reminder", "unique_rule"',
              '"action", "terms", "gambit", "tactic", "battle", "mission", "asset", "overlay", "reminder", "unique_rule"'
          )
          search_path.write_text(search, encoding='utf-8')
          PY

      - name: Commit Rules Arbiter update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules-assistant/widget.js rules-assistant/local-search.js
          git commit -m "Sync Rules Arbiter sources and playtest context to v0.6.1"
          git push origin HEAD:rules/v0.6.1-playtest-revision
