name: Rules Arbiter scope refinement retry

on:
  push:
    branches: [rules-arbiter-review-6a0d051b]
    paths:
      - '.github/workflows/rules-arbiter-scope-refinement-retry.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: rules-arbiter-review-6a0d051b
      - name: Repair matcher and retrigger refinement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/rules-arbiter-scope-refinement-6a0d.yml')
          s = p.read_text(encoding='utf-8')
          old = r'/\bdo you know who\s+'
          new = r'/\b(?:Do|do) you know who\s+'
          if old not in s:
              raise SystemExit('Could not find general-knowledge matcher')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/rules-arbiter-scope-refinement-retry.yml
          git config user.name "Tymon Scott"
          git config user.email "54303549+tymonius@users.noreply.github.com"
          git add .github/workflows/rules-arbiter-scope-refinement-6a0d.yml .github/workflows/rules-arbiter-scope-refinement-retry.yml
          git commit -m "Fix scope refinement general-knowledge matcher"
          git push origin HEAD:rules-arbiter-review-6a0d051b
