name: Restore battle commitment order

on:
  push:
    branches:
      - rules/restore-battle-commitment-order
    paths:
      - '.github/workflows/restore-battle-commitment-order.yml'

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rules/restore-battle-commitment-order
          fetch-depth: 0

      - name: Restore attacker-first commitment order
        shell: python
        run: |
          import json
          from pathlib import Path

          def load_json(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def write_json(path, data):
              Path(path).write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def insert_after(mapping, after_key, new_key, value):
              if new_key in mapping:
                  mapping[new_key] = value
                  return mapping
              rebuilt = {}
              inserted = False
              for key, existing in mapping.items():
                  rebuilt[key] = existing
                  if key == after_key:
                      rebuilt[new_key] = value
                      inserted = True
              if not inserted:
                  raise RuntimeError(f'Could not insert {new_key} after missing key {after_key}')
              return rebuilt

          # 1. Restore the shared rule in the complete gameplay authority.
          authority_path = Path('game-data/current-game.json')
          authority = load_json(authority_path)
          battle = authority['gameplay']['battle']
          commitment_order = {
              'gambits': ['attacker', 'defender'],
              'tactics': ['attacker', 'defender'],
              'face_state': 'Commitments are face down unless a rule or effect says otherwise.',
              'text': 'During the normal battle sequence, the attacker sets a Gambit or passes first, then the defender sets a Gambit or passes. After Reserves are formed, the attacker chooses a Tactic or passes first, then the defender chooses a Tactic or passes. A specific rule or effect may change this order or face state.'
          }
          authority['gameplay']['battle'] = insert_after(battle, 'sequence', 'commitment_order', commitment_order)
          provenance = authority['provenance']['currentDevelopmentInputs']
          authority['provenance']['currentDevelopmentInputs'] = insert_after(
              provenance,
              'v072TimingAndCaptureCleanup',
              'v072BattleCommitmentOrderRestoration',
              '/docs/v0.7.2-battle-commitment-order-restoration.json',
          )
          write_json(authority_path, authority)

          # 2. Register the rule as its own stable semantic dependency.
          contract_path = Path('config/rules-surface-contract.json')
          contract = load_json(contract_path)
          registry = contract['ruleRegistry']
          new_rule = {
              'id': 'core.battle.commitment-order',
              'scope': 'core',
              'sources': [
                  {'path': ['gameplay', 'battle', 'commitment_order']}
              ],
          }
          if not any(rule['id'] == new_rule['id'] for rule in registry):
              index = next(i for i, rule in enumerate(registry) if rule['id'] == 'core.battle.sequence') + 1
              registry.insert(index, new_rule)

          battles_chapter = next(
              chapter for chapter in contract['publicationArchitecture']['playerGuide']['chapters']
              if chapter['id'] == 'battles'
          )
          deps = battles_chapter['dependsOn']
          if new_rule['id'] not in deps:
              index = deps.index('core.battle.sequence') + 1
              deps.insert(index, new_rule['id'])
          write_json(contract_path, contract)

          # 3. Make the authority validator fail if the restored rule disappears or drifts.
          validation_path = Path('game-data/current-game-validation.mjs')
          validation = validation_path.read_text(encoding='utf-8')
          helper = '''\nfunction validateBattleCommitmentOrder(authority) {\n  const order = authority.gameplay?.battle?.commitment_order;\n  const expected = ['attacker', 'defender'];\n  const gambits = requireCurrentArray(order?.gambits, 'normal Gambit commitment order');\n  const tactics = requireCurrentArray(order?.tactics, 'normal Tactic commitment order');\n  if (JSON.stringify(gambits) !== JSON.stringify(expected)) {\n    throw new Error('Normal Gambit commitment order must be attacker then defender.');\n  }\n  if (JSON.stringify(tactics) !== JSON.stringify(expected)) {\n    throw new Error('Normal Tactic commitment order must be attacker then defender.');\n  }\n  if (!String(order?.face_state || '').trim() || !String(order?.text || '').trim()) {\n    throw new Error('Battle commitment order must define normal face state and explanatory text.');\n  }\n}\n'''
          if 'function validateBattleCommitmentOrder' not in validation:
              anchor = '\nexport function validateCurrentGameAuthority(authority) {'
              if anchor not in validation:
                  raise RuntimeError('Validation export anchor not found')
              validation = validation.replace(anchor, helper + anchor, 1)
          call_anchor = '  validateTrackerPresentation(authority);\n'
          if '  validateBattleCommitmentOrder(authority);\n' not in validation:
              if call_anchor not in validation:
                  raise RuntimeError('Validation call anchor not found')
              validation = validation.replace(
                  call_anchor,
                  call_anchor + '  validateBattleCommitmentOrder(authority);\n',
                  1,
              )
          validation_path.write_text(validation, encoding='utf-8')

          # 4. Restore the normal order in the new Player's Guide.
          guide_path = Path('rulebook/player-guide/player-guide.md')
          guide = guide_path.read_text(encoding='utf-8')
          old_gambit = '''### 2. Set Gambits\n\nEach player may choose **one eligible card from their Hand** and set it face down as a **Gambit**.\n\nA Gambit is optional. Setting one means risking a card you already had available before the battle.\n'''
          new_gambit = '''### 2. Set Gambits\n\nThe **attacker commits first**: set one eligible card from your Hand face down as a **Gambit**, or pass. Then the defender sets one eligible card from their Hand face down, or passes.\n\nA Gambit is optional. The defender therefore knows whether the attacker committed a Gambit before deciding, but does not know which face-down card it is unless an effect reveals it.\n'''
          old_tactic = '''### 5. Choose Tactics\n\nEach player may choose **one eligible card from their Reserve** and set it face down as a **Tactic**.\n\nLike a Gambit, a Tactic is optional.\n'''
          new_tactic = '''### 5. Choose Tactics\n\nAgain, the **attacker commits first**: choose one eligible card from your Reserve and set it face down as a **Tactic**, or pass. Then the defender chooses one eligible Reserve card face down, or passes.\n\nLike a Gambit, a Tactic is optional. The defender can respond to whether the attacker committed before making their own choice.\n'''
          for old, new, label in [(old_gambit, new_gambit, 'Player Guide Gambit'), (old_tactic, new_tactic, 'Player Guide Tactic')]:
              if old not in guide:
                  raise RuntimeError(f'{label} source block not found')
              guide = guide.replace(old, new, 1)
          guide_path.write_text(guide, encoding='utf-8')

          # 5. Restore the order in the maintained technical rulebook source.
          rulebook_path = Path('rulebook/player-facing/current-rulebook.md')
          rulebook = rulebook_path.read_text(encoding='utf-8')
          old_sequence = '''1. **Onset**\n2. Set Gambits.\n3. Set Hands aside and form Reserves.\n4. Reveal Gambits.\n5. Choose Tactics.\n6. Reveal Tactics.\n7. Determine the Outcome.\n8. Proceed to the **Aftermath**.\n\nTerms, when applicable, resolve during Onset before other pre-Gambit effects.\n'''
          new_sequence = '''1. **Onset**\n2. Set Gambits: the attacker sets a Gambit or passes first, then the defender sets a Gambit or passes.\n3. Set Hands aside and form Reserves.\n4. Reveal Gambits.\n5. Choose Tactics: the attacker chooses a Tactic or passes first, then the defender chooses a Tactic or passes.\n6. Reveal Tactics.\n7. Determine the Outcome.\n8. Proceed to the **Aftermath**.\n\nTerms, when applicable, resolve during Onset before other pre-Gambit effects. Gambits and Tactics are normally committed face down. The defender knows whether the attacker committed or passed before making the corresponding choice. A specific rule or effect may change the commitment order or face state.\n'''
          if old_sequence not in rulebook:
              raise RuntimeError('Maintained rulebook battle sequence block not found')
          rulebook = rulebook.replace(old_sequence, new_sequence, 1)
          rulebook_path.write_text(rulebook, encoding='utf-8')

          # 6. Restore the compact procedure on the universal reference source.
          reference_path = Path('card-design/reference-copy/v0.7.0/universal-reference.md')
          reference = reference_path.read_text(encoding='utf-8')
          old_reference = '''1. **Onset**\n2. Set **Gambits**.\n3. Set Hands aside and form **3-card Reserves**.\n4. Reveal Gambits.\n5. Choose **Tactics**.\n6. Reveal Tactics.\n7. Determine the **Outcome**.\n8. Resolve the **Aftermath**.\n'''
          new_reference = '''1. **Onset**\n2. **Attacker**, then defender: set **Gambit** or pass.\n3. Set Hands aside and form **3-card Reserves**.\n4. Reveal Gambits.\n5. **Attacker**, then defender: choose **Tactic** or pass.\n6. Reveal Tactics.\n7. Determine the **Outcome**.\n8. Resolve the **Aftermath**.\n'''
          if old_reference not in reference:
              raise RuntimeError('Universal reference battle sequence block not found')
          reference = reference.replace(old_reference, new_reference, 1)
          reference_path.write_text(reference, encoding='utf-8')

          # 7. Preserve why this was restored, including surviving rules that depend on it.
          provenance_path = Path('docs/v0.7.2-battle-commitment-order-restoration.json')
          provenance_doc = {
              'schemaVersion': 1,
              'status': 'approved-restoration',
              'appliesTo': 'v0.7.2-candidate',
              'authoritySource': 'game-data/current-game.json',
              'summary': 'Restore the established normal battle commitment order that was omitted from the shared battle definition during rules consolidation.',
              'restoredRule': {
                  'gambits': ['attacker', 'defender'],
                  'tactics': ['attacker', 'defender'],
                  'normalFaceState': 'face down',
                  'overridePolicy': 'A specific rule or effect may change commitment order or face state.'
              },
              'survivingEvidence': [
                  'Watchtower requires the attacker to set their Gambit first, face up.',
                  'Fog of War changes which player sets their Gambit and chooses their Tactic after the opponent.',
                  'Neutral Observers explicitly overrides other Gambit-order effects and does not change Tactic order.',
                  'Intelligence Surveillance has timing after an opposing Gambit or Tactic choice.'
              ],
              'classification': 'Restoration of existing intended behavior; not a new gameplay change.'
          }
          write_json(provenance_path, provenance_doc)

      - name: Commit restoration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add game-data/current-game.json game-data/current-game-validation.mjs config/rules-surface-contract.json rulebook/player-guide/player-guide.md rulebook/player-facing/current-rulebook.md card-design/reference-copy/v0.7.0/universal-reference.md docs/v0.7.2-battle-commitment-order-restoration.json
          git diff --cached --check
          git commit -m "Restore attacker-first battle commitment order"
          git push origin HEAD:rules/restore-battle-commitment-order
