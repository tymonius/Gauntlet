name: Rebuild homepage hero asset

on:
  push:
    branches:
      - fix/homepage-hero-asset
    paths:
      - '.github/workflows/rebuild-homepage-hero.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.hero-fix/**'
      - '.github/workflows/rebuild-homepage-hero.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/homepage-hero-asset

      - name: Reconstruct and validate WebP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          files = sorted(Path('.hero-fix').glob('*.b64'))
          pieces = [path.read_text() for path in files]
          for path, piece in zip(files, pieces):
              print(f'{path}: {len(piece)} characters')

          text = ''.join(pieces)
          alphabet = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          filtered = ''.join(ch for ch in text if ch in alphabet)
          core = filtered.replace('=', '')
          padded = core + '=' * ((4 - len(core) % 4) % 4)
          print(f'filtered base64 length: {len(filtered)}; normalized length: {len(padded)}')

          raw = base64.b64decode(padded)
          digest = hashlib.sha256(raw).hexdigest()
          print(f'decoded bytes: {len(raw)}; sha256: {digest}')
          expected = '7dce4a9721c827267ce99bb29f6650b262a4dec3f6ecab7c43a2e4b95daf7e03'
          if digest != expected:
              raise SystemExit(f'Unexpected hero digest: {digest}')
          if raw[:4] != b'RIFF' or raw[8:12] != b'WEBP':
              raise SystemExit('Rebuilt file is not a valid WebP container')

          Path('images/artwork/site/homepage-hero-three-leaders.webp').write_bytes(raw)
          PY

      - name: Bust stale asset caches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('factions/homepage.css')
          css = path.read_text()
          old = 'homepage-hero-three-leaders.webp")'
          new = 'homepage-hero-three-leaders.webp?v=2")'
          if old not in css and new not in css:
              raise SystemExit('Expected hero URL not found in homepage CSS')
          path.write_text(css.replace(old, new))
          PY

      - name: Remove temporary repair files
        shell: bash
        run: |
          rm -rf .hero-fix
          rm .github/workflows/rebuild-homepage-hero.yml

      - name: Commit repaired asset
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair homepage hero image asset'
          git push origin HEAD:fix/homepage-hero-asset
