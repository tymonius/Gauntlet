name: Export Neutral Valor Base

on:
  pull_request:
    branches:
      - main

jobs:
  export:
    if: github.head_ref == 'agent/neutral-valor'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create engine archive
        run: |
          set -euo pipefail
          tar -czf gauntlet-engine.tar.gz src package.json tsconfig.json
          sha256sum gauntlet-engine.tar.gz > gauntlet-engine.sha256

      - name: Upload engine archive
        uses: actions/upload-artifact@v4
        with:
          name: neutral-valor-base
          path: |
            gauntlet-engine.tar.gz
            gauntlet-engine.sha256
