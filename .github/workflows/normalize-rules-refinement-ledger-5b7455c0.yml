name: Normalize Rules Arbiter ledger 5b7455c0

on:
  push:
    branches:
      - rules-arbiter-review-5b7455c0
    paths:
      - .github/workflows/normalize-rules-refinement-ledger-5b7455c0.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Normalize ledger and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          path = Path('artifacts/rules-refinement/resolution-ledger.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          git config user.name "Tymon Scott"
          git config user.email "54303549+tymonius@users.noreply.github.com"
          git rm .github/workflows/normalize-rules-refinement-ledger-5b7455c0.yml
          git add artifacts/rules-refinement/resolution-ledger.json
          git diff --cached --check
          git commit -m "Preserve refinement ledger Unicode"
          git push origin HEAD:rules-arbiter-review-5b7455c0
