name: Build clean v0.6.3 digital

on:
  pull_request:
    paths:
      - 'src/reconstruction/clean-v063/**'
      - 'artifacts/reconstruction/clean-v0.6.3/digital/**'
      - 'scripts/validate-clean-v063-digital.mjs'
      - '.github/workflows/build-clean-v063-digital.yml'
      - 'artifacts/reconstruction/clean-v0.6.3/rulebook/**'
      - 'artifacts/reconstruction/clean-v0.6.3/complete-authority/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck repository
        run: npm run typecheck

      - name: Run focused clean v0.6.3 digital regressions
        run: npx vitest run src/reconstruction/clean-v063/rules.test.ts src/reconstruction/clean-v063/cards.test.ts

      - name: Validate clean v0.6.3 digital provenance
        run: node scripts/validate-clean-v063-digital.mjs

      - name: Reject whitespace errors
        run: git diff --check HEAD^1 HEAD
