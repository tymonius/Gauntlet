name: Refine Counterattack language

on:
  push:
    branches:
      - rules/player-guide-authority-review
    paths:
      - .github/workflows/refine-counterattack-language.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rules/player-guide-authority-review
      - name: Refine Counterattack wording
        shell: python
        run: |
          from pathlib import Path

          path = Path('rulebook/player-guide/player-guide.md')
          text = path.read_text()
          old = "If your opponent is occupying one of your Territories and you attack them there, you are making a **Counterattack**."
          new = "A **Counterattack** is a battle you start against an opponent who is occupying a Territory you control."
          if old not in text:
              raise SystemExit('Expected Counterattack sentence not found')
          path.write_text(text.replace(old, new, 1))
      - name: Verify diff
        run: git diff --check && git diff -- rulebook/player-guide/player-guide.md
      - name: Commit refinement and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refine-counterattack-language.yml
          git add rulebook/player-guide/player-guide.md
          git commit -m "Clarify Counterattack in Player Guide"
          git push origin HEAD:rules/player-guide-authority-review
