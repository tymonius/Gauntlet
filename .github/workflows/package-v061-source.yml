name: Package v0.6.1 source snapshot

on:
  push:
    branches:
      - rules/v0.6.1-playtest-revision
    paths:
      - ".github/workflows/package-v061-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout revision branch
        uses: actions/checkout@v4
        with:
          ref: rules/v0.6.1-playtest-revision

      - name: Record source revision
        run: git rev-parse HEAD > SOURCE_REVISION.txt

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-v061-source-snapshot
          path: |
            .
            !.git/**
            !node_modules/**
          include-hidden-files: true
          if-no-files-found: error
