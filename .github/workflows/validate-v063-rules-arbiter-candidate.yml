name: Validate v0.6.3 Rules Arbiter candidate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/validate-v063-rules-arbiter-candidate.yml'
      - 'rules-assistant/*v063*'
      - 'rules-assistant/widget.js'
      - 'rules-assistant/worker-entry.js'
      - 'v0.6.3/rules-arbiter/**'
      - 'releases/v0.6.3/**'
      - 'scripts/validate-v063-rules-arbiter-candidate.mjs'
      - 'scripts/validate-v063-published-release.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v063-rules-arbiter-lifecycle-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validation target
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate preserved v0.6.3 candidate implementation
        run: |
          node --check rules-assistant/v063-development-corpus.js
          node --check rules-assistant/rules-deterministic-v063.js
          node --check rules-assistant/worker-v063-candidate.js
          node --check rules-assistant/worker-entry-v063-candidate.js
          npx vitest run rules-assistant/v063-development-corpus.test.mjs rules-assistant/rules-deterministic-v063.test.mjs

      - name: Detect v0.6.3 lifecycle
        id: lifecycle
        run: |
          if [ -e releases/v0.6.3/Gauntlet_v0.6.3_Manifest.json ]; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
          else
            echo 'published=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate published Rules Arbiter lifecycle
        if: steps.lifecycle.outputs.published == 'true'
        run: node scripts/validate-v063-published-release.mjs

      - name: Validate candidate/public boundary before publication
        if: steps.lifecycle.outputs.published != 'true'
        run: node scripts/validate-v063-rules-arbiter-candidate.mjs
