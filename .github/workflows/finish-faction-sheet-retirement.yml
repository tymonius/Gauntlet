name: Finish faction-sheet link retirement

on:
  push:
    branches:
      - chore/retire-printable-faction-sheets
    paths:
      - ".github/workflows/finish-faction-sheet-retirement.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout retirement branch
        uses: actions/checkout@v4
        with:
          ref: chore/retire-printable-faction-sheets

      - name: Remove remaining active faction-sheet links
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = [
              Path('index.html'),
              Path('factions'),
              Path('rulebook'),
              Path('card-reference'),
              Path('deckbuilder'),
              Path('deckbuilder-v0.6'),
              Path('playtest'),
              Path('typography'),
              Path('card-design'),
              Path('rules-assistant'),
          ]

          pages = []
          for root in roots:
              if root.is_file():
                  pages.append(root)
              elif root.is_dir():
                  pages.extend(root.rglob('*.html'))

          total = 0
          for page in sorted(set(pages)):
              original = page.read_text(encoding='utf-8')
              lines = original.splitlines(keepends=True)
              removed = [line for line in lines if 'faction-sheets/' in line]
              if not removed:
                  continue
              page.write_text(''.join(line for line in lines if 'faction-sheets/' not in line), encoding='utf-8')
              total += len(removed)
              print(f'{page}: removed {len(removed)} link line(s)')

          Path('.github/workflows/finish-faction-sheet-retirement.yml').unlink()
          print(f'Removed {total} remaining active faction-sheet link line(s).')
          PY

      - name: Commit final retirement cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove remaining active faction-sheet links"
          git push origin HEAD:chore/retire-printable-faction-sheets
