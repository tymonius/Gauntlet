name: Full regression (PR gate temporary)

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: full-regression-pr-temp-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false pdf-lib

      - name: Validate maintained Vitest classification
        run: node scripts/validate-vitest-classification.mjs

      - name: Run maintained full regression suite
        run: npm run test:full
