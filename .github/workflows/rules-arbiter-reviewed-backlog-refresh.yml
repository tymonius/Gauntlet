name: Refresh reviewed Rules Arbiter backlog

on:
  push:
    branches:
      - ops/rules-arbiter-reviewed-backlog-refresh-20260909c
    paths:
      - '.github/workflows/rules-arbiter-reviewed-backlog-refresh.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read production Rules Arbiter data
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant --remote --config rules-assistant/wrangler.toml --json --command "SELECT id, session_id, previous_interaction_id, sequence_index, created_at, question, answer, game_version, ruling_status, ruling_status_v2, confidence, source_count, review_status, issue_types_json, feedback_rating FROM rules_interactions ORDER BY created_at" > /tmp/interactions.json
          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant --remote --config rules-assistant/wrangler.toml --json --command "SELECT * FROM rules_interaction_diagnostics" > /tmp/diagnostics.json
          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant --remote --config rules-assistant/wrangler.toml --json --command "SELECT * FROM rules_interaction_audits" > /tmp/audits.json
      - name: Rank unresolved reviewed backlog
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { refinementTriage } from './rules-assistant/refinement-triage.js';

          function rows(path) {
            const payload = JSON.parse(fs.readFileSync(path, 'utf8'));
            return (Array.isArray(payload) ? payload : [payload]).flatMap((batch) => Array.isArray(batch?.results) ? batch.results : []);
          }

          const interactions = rows('/tmp/interactions.json');
          const diagnostics = rows('/tmp/diagnostics.json');
          const audits = rows('/tmp/audits.json');
          const auditMap = new Map(audits.map((row) => [String(row.interaction_id || ''), row]));
          const ledger = JSON.parse(fs.readFileSync('artifacts/rules-refinement/resolution-ledger.json', 'utf8'));
          const resolved = new Set(
            ledger.entries
              .filter((entry) => entry?.status === 'resolved')
              .flatMap((entry) => Array.isArray(entry.interactionIds) ? entry.interactionIds : [])
              .map(String)
          );

          const triage = refinementTriage.triageInteractions(
            interactions,
            { diagnostics, audits },
            { scope: 'reviewed_backlog' }
          );
          const remaining = triage.interactions.filter((item) => !resolved.has(item.interactionId));
          const top = remaining.slice(0, 30).map((item) => {
            const audit = auditMap.get(item.interactionId) || {};
            return {
              interactionId: item.interactionId,
              score: item.score,
              priority: item.priority,
              rootCause: item.rootCause,
              question: item.question,
              reviewStatus: item.reviewStatus,
              audit: {
                historicalAccuracy: audit.historical_accuracy || null,
                currentValidity: audit.current_validity || null,
                retrievalAssessment: audit.retrieval_assessment || null,
                classificationAssessment: audit.classification_assessment || null,
                designerReviewRequired: audit.designer_review_required ?? null,
                recommendedAction: audit.recommended_action || null,
                reviewedAgainstVersion: audit.reviewed_against_version || null
              },
              signalCodes: item.signalCodes,
              reasons: item.reasons.slice(0, 5)
            };
          });

          console.log(JSON.stringify({
            productionCounts: {
              interactions: interactions.length,
              diagnostics: diagnostics.length,
              audits: audits.length,
              ledgerResolvedInteractions: resolved.size,
              reviewedTriageEligibleBeforeLedgerFilter: triage.interactions.length,
              unresolvedReviewedAfterLedgerFilter: remaining.length
            },
            top
          }, null, 2));
          NODE
