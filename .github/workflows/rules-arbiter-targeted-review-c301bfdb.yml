name: Rules Arbiter remaining backlog audit

on:
  push:
    branches: [rules-arbiter-other-attention-audit2]
    paths:
      - '.github/workflows/rules-arbiter-targeted-review-c301bfdb.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      REVIEW_DIR: .tmp/rules-arbiter-remaining-review
      TARGET_IDS: "'2a4c793d-21d2-4133-a45d-0a0df4a5ef07','1a7ac447-03b3-4824-8083-7c61f153e97d','daae1140-89aa-463e-8546-7b19fa94fed1','b8ee7052-69dd-41b1-82e9-49032f926d99','4d3d5162-01a6-4f4b-a100-dff6cd4f0bed','b922bfa5-6fce-4567-84b0-8c35fbb4b40e','b2d55ffe-219a-496c-bc22-baac51533e88','eedde1c1-b96f-47ac-a71e-bdf043d1fbdf','0ec2f926-7212-4937-867d-eac92a0a35c6','ca25c695-26be-43c8-ba49-ddae85534fba','6a89266c-60cd-4275-b50e-4bfacb3de30f'"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify production D1 credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

      - name: Read remaining reviewed interactions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REVIEW_DIR"
          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant --remote --config rules-assistant/wrangler.toml --json \
            --command "SELECT * FROM rules_interactions WHERE id IN ($TARGET_IDS) ORDER BY created_at" \
            > "$REVIEW_DIR/interactions.json"
          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant --remote --config rules-assistant/wrangler.toml --json \
            --command "SELECT * FROM rules_interaction_audits WHERE interaction_id IN ($TARGET_IDS)" \
            > "$REVIEW_DIR/audits.json"

      - name: Upload remaining-review bundle
        uses: actions/upload-artifact@v4
        with:
          name: rules-arbiter-remaining-review
          path: .tmp/rules-arbiter-remaining-review
          if-no-files-found: error
          retention-days: 2
