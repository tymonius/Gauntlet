name: Finalize shared authority normalization

on:
  push:
    branches:
      - rules/shared-authority-normalization
    paths:
      - 'scripts/finalize-shared-authority-normalization.mjs'
      - '.github/workflows/finalize-shared-authority-normalization.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout normalization branch
        uses: actions/checkout@v4
        with:
          ref: rules/shared-authority-normalization

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Finalize canonical shared authority
        run: node scripts/finalize-shared-authority-normalization.mjs

      - name: Commit finalized authority
        run: |
          if git diff --quiet -- game-data/current-game.json; then
            echo 'Shared authority already finalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-data/current-game.json
          git commit -m 'Finalize single-source shared authority layout'
          git push origin HEAD:rules/shared-authority-normalization
