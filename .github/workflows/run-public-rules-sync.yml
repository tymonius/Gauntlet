name: Run public rules synchronization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: run-public-rules-sync
  cancel-in-progress: true

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/sync-website-rules-terminology
          fetch-depth: 1

      - name: Reconcile optional renderer variants
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/sync_v061_public_rules.py")
          text = path.read_text(encoding="utf-8")
          obsolete = '''        "faction-sheets/v061-release-runtime.js": [
              ("Supplemental reference — no deckbuilding value", "Supplemental reference — not a Playable Deck card"),
              ("Supplemental tracker — no deckbuilding value", "Supplemental tracker — not a Playable Deck card"),
              ("Supplemental ledger — no deckbuilding value", "Supplemental ledger — not a Playable Deck card"),
              ("Shared supplemental card — no deckbuilding value", "Shared supplemental card — not a Playable Deck card"),
              ("Pair with the incomplete side · no deckbuilding value", "Pair with the incomplete side · not a Playable Deck card"),
              ("Flip when complete · no deckbuilding value", "Flip when complete · not a Playable Deck card"),
          ],
'''
          if obsolete in text:
              path.write_text(text.replace(obsolete, "", 1), encoding="utf-8")
          else:
              print("Optional release-renderer migration block already absent.")
          PY

      - name: Synchronize public website and printable references
        run: |
          python scripts/sync_v061_print_supplementals.py
          python scripts/sync_v061_deckbuilder.py
          python scripts/sync_v061_public_rules.py
          rm -f deckbuilder/.rules-sync-trigger

      - name: Commit synchronized outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/sync_v061_public_rules.py \
            deckbuilder/ \
            start/ \
            playtest/onboarding/ \
            playtest/player-mat/ \
            factions/ \
            faction-sheets/
          if git diff --cached --quiet; then
            echo "No synchronized changes were required."
            exit 0
          fi
          git commit -m "Synchronize public v0.6.1 browser and print rules"
          git pull --rebase origin agent/sync-website-rules-terminology
          git push origin HEAD:agent/sync-website-rules-terminology

      - name: Verify idempotent synchronization
        run: |
          python scripts/sync_v061_print_supplementals.py
          python scripts/sync_v061_deckbuilder.py
          python scripts/sync_v061_public_rules.py
          git diff --exit-code -- scripts/sync_v061_public_rules.py deckbuilder/ start/ playtest/onboarding/ playtest/player-mat/ factions/ faction-sheets/
