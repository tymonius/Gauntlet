name: Rules Arbiter copied-effect refinement d1050264

on:
  push:
    branches: [rules-arbiter-review-d1050264]
    paths:
      - '.github/workflows/rules-arbiter-targeted-review-d1050264.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: rules-arbiter-review-d1050264
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Narrow copied-effect retrieval cue
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('rules-assistant/local-search.js')
          s = p.read_text(encoding='utf-8')
          broad = r"(?=[\s\S]*\b(?:apply|applies|applied|applying|repeat|repeats|repeated|repeating)\b)(?=[\s\S]*\b(?:effects?|opponent(?:['’]s)|another\s+(?:player|card)(?:['’]s)?|other\s+player(?:['’]s)?|source\s+card|as\s+though|as\s+if)\b)"
          narrow = r"(?=[\s\S]*\b(?:apply|applies|applied|applying|repeat|repeats|repeated|repeating)\b)(?=[\s\S]*\b(?:opponent(?:['’]s)|another\s+(?:player|card)(?:['’]s)?|other\s+player(?:['’]s)?|source\s+card|as\s+though|as\s+if)\b)"
          if broad not in s:
              raise SystemExit('Could not find broad copied-effect cue')
          p.write_text(s.replace(broad, narrow, 1), encoding='utf-8')
          PY
      - name: Run focused Rules Arbiter regressions
        run: |
          npx vitest run \
            rules-assistant/v071-copied-effect-retrieval-review.test.mjs \
            rules-assistant/v071-ambiguous-referent-clarification.test.mjs \
            rules-assistant/v071-battle-card-replacement-retrieval.test.mjs \
            rules-assistant/v071-fortifications-tactic-choice-review.test.mjs \
            rules-assistant/v071-short-counterfactual-continuity.test.mjs \
            rules-assistant/v071-strategic-withdrawal-review.test.mjs
      - name: Validate refinement contract
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --check
          python - <<'PY'
          import json, subprocess
          base = subprocess.check_output(['git', 'merge-base', 'HEAD', 'origin/main'], text=True).strip()
          committed = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
          working = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          changed = sorted({p for p in committed + working if not p.startswith('.github/workflows/')})
          with open('changed-files.json', 'w', encoding='utf-8') as fh:
              json.dump(changed, fh)
          print('Refinement files:', *changed, sep='\n- ')
          PY
          node scripts/validate-rules-refinement-source-first.mjs --changed-files changed-files.json
          rm changed-files.json
      - name: Commit narrow cue
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tymon Scott"
          git config user.email "54303549+tymonius@users.noreply.github.com"
          git add rules-assistant/local-search.js
          git diff --cached --check
          git commit -m "Narrow copied-effect retrieval trigger"
          git push origin HEAD:rules-arbiter-review-d1050264
