name: Rules Arbiter retrieval probe d1050264

on:
  push:
    branches: [rules-arbiter-review-d1050264]
    paths:
      - '.github/workflows/rules-arbiter-targeted-review-d1050264.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run retrieval probe
        run: |
          mkdir -p .tmp/d1050264
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { buildRulesCorpus, retrieveRules } from './rules-assistant/local-search.js';

          const canonicalData = JSON.parse(readFileSync('releases/v0.6.3/Gauntlet_v0.6.3_Canonical_Data.json', 'utf8'));
          const rulebookMarkdown = readFileSync('releases/v0.6.3/Gauntlet_v0.6.3_Rulebook.md', 'utf8');
          const corpus = buildRulesCorpus({ canonicalData, rulebookMarkdown });
          const queries = [
            "I reveal Heresy as a Tactic and spend 4 Conviction to apply the Tactic effect of an opponent's Rend the Veil in their Graveyard. Rend the Veil says to choose a card in your Graveyard. Whose Graveyard supplies that second card, and does the opponent's Rend the Veil card move?",
            "If I use Heresy to apply an opponent's Rend the Veil from their Graveyard, whose Graveyard does 'your Graveyard' mean, and does Rend the Veil move?",
            "When I apply another player's card effect, who controls choices using 'your', and does the source card move?"
          ];
          const output = {
            generatedAt: new Date().toISOString(),
            corpusVersion: corpus.version,
            applyingRule: corpus.documents.find((d) => d.id === 'rulebook:applying-and-repeating-another-effect') || null,
            heresy: corpus.documents.find((d) => d.canonicalId === 'card:inquisition-heresy' || d.id === 'card:inquisition-heresy' || d.heading === 'Heresy') || null,
            rendTheVeil: corpus.documents.find((d) => d.canonicalId === 'card:mystics-rend-the-veil' || d.id === 'card:mystics-rend-the-veil' || d.heading === 'Rend the Veil') || null,
            results: queries.map((query) => ({
              query,
              hits: retrieveRules(corpus, query, { limit: 12, excerptLength: 700 }).map(({ canonicalId, score, title, heading, excerpt }) => ({ canonicalId, score, title, heading, excerpt }))
            }))
          };
          writeFileSync('.tmp/d1050264/retrieval-probe.json', `${JSON.stringify(output, null, 2)}\n`, 'utf8');
          console.log(JSON.stringify(output, null, 2));
          NODE
      - name: Upload retrieval probe
        uses: actions/upload-artifact@v4
        with:
          name: rules-arbiter-retrieval-probe-d1050264
          path: .tmp/d1050264/retrieval-probe.json
          if-no-files-found: error
          retention-days: 1
