name: Patch current Rulebook source

on:
  push:
    branches:
      - fix/current-authority-rulebook-source
    paths:
      - .github/workflows/patch-current-rulebook-source.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/patch-current-rulebook-source.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/current-authority-rulebook-source
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install renderer dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Finalize maintained Rulebook source
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          path = Path('rulebook/player-facing/current-rulebook.md')
          manifest = json.loads(Path('game-data/current-game.json').read_text())
          text = path.read_text()

          replacements = [
              (
                  '> **Release candidate.** This view layers the current-development rules over the published v0.6.3 Rulebook. Switch back to **Released v0.6.3** for the published ruleset.',
                  '> **Release candidate.** This is the maintained current-development Rulebook source. Switch back to **Released v0.6.3** for the published ruleset.',
              ),
              ('## Pending Battles, Terms, and Onset', '## Terms and Onset'),
              ('Before a battle begins, a Diplomat may offer **Terms**.', 'During Onset, a Diplomat may offer **Terms**.'),
              (
                  "The opponent may accept, preventing the battle, or refuse and fight under the Proposal's refusal effect.",
                  "The opponent may accept, ending the battle sequence during Onset before Gambits are set, or refuse and fight under the Proposal's refusal effect.",
              ),
              (
                  '**Withdrawal:** Leaving a pending or active battle without determining a winner. Withdrawal is not Fall Back or retreat.',
                  '**Withdrawal:** Leaving a battle sequence without determining a winner. Withdrawal is not Fall Back or retreat.',
              ),
          ]

          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f'Neither old nor accepted replacement text found: {old}')

          text = re.sub(r'\bfaction abilities\b', 'Faction Features', text, flags=re.IGNORECASE)
          text = re.sub(r'\bfaction ability\b', 'Faction Feature', text, flags=re.IGNORECASE)
          text = re.sub(r'\bleader abilities\b', 'Leader Abilities', text, flags=re.IGNORECASE)
          text = re.sub(r'\bleader ability\b', 'Leader Ability', text, flags=re.IGNORECASE)

          def detail_suffix(source):
              return ' · '.join(str(source.get(key, '')).strip() for key in ('cost', 'descriptor') if str(source.get(key, '')).strip())

          def ability_lines(leader):
              ability_sections = [section for section in leader.get('sections', []) if section.get('classification') == 'Leader Ability']
              if len(ability_sections) != 1:
                  raise SystemExit(f"Expected one Leader Ability section for {leader['name']}; found {len(ability_sections)}.")
              section = ability_sections[0]
              items = section.get('items') or []
              if items:
                  lines = []
                  for item in items:
                      suffix = detail_suffix(item)
                      label = f"{item['name']}{' — ' + suffix if suffix else ''}"
                      lines.append(f"> **{label}:** {item['text']}")
                  return section['name'], lines
              suffix = detail_suffix(section)
              label = f"{section['name']}{' — ' + suffix if suffix else ''}"
              return None, [f"> **{label}:** {section.get('text', '').strip()}"]

          for leader in manifest.get('leaders', []):
              section_pattern = re.compile(
                  rf'(^### {re.escape(leader["name"])}\s*$)(.*?)(?=^###\s+|^##\s+|^#\s+|\Z)',
                  re.MULTILINE | re.DOTALL,
              )
              match = section_pattern.search(text)
              if not match:
                  raise SystemExit(f"Rulebook Leader section not found: {leader['name']}")
              body = match.group(2)
              ability_heading, lines = ability_lines(leader)
              quote_block = '\n\n'.join(lines)

              if ability_heading:
                  heading_pattern = re.compile(
                      rf'(^#### {re.escape(ability_heading)}\s*$)(.*?)(?=^####\s+|^###\s+|^##\s+|^#\s+|\Z)',
                      re.MULTILINE | re.DOTALL,
                  )
                  heading_match = heading_pattern.search(body)
                  if not heading_match:
                      raise SystemExit(f"Rulebook grouped Leader Ability heading not found for {leader['name']}: {ability_heading}")
                  trailing = heading_match.group(2)
                  after_quotes = re.sub(r'^(?:\s*>[^\n]*(?:\n|$))+', '', trailing.lstrip(), count=1, flags=re.MULTILINE)
                  replacement = f"{heading_match.group(1)}\n\n{quote_block}\n\n{after_quotes.lstrip()}"
                  body = body[:heading_match.start()] + replacement + body[heading_match.end():]
              else:
                  quote_pattern = re.compile(r'^>\s*\*\*[^\n]+(?:\n(?!\s*$|#{1,4}\s).*)*', re.MULTILINE)
                  quote_match = quote_pattern.search(body)
                  if not quote_match:
                      raise SystemExit(f"Rulebook Leader Ability quote not found for {leader['name']}")
                  body = body[:quote_match.start()] + quote_block + body[quote_match.end():]

              text = text[:match.start()] + match.group(1) + body + text[match.end():]

          figure = '![Card anatomy diagram](/images/rulebook/card-anatomy.png)'
          if figure not in text:
              marker = 'Most ordinary playable cards use the same frame. Read these elements when constructing a Deck and resolving a card in play:\n\n'
              if marker not in text:
                  raise SystemExit('Card Anatomy introduction marker not found.')
              text = text.replace(marker, marker + figure + '\n\n', 1)

          forbidden = [
              r'\bpending\b',
              r'\bFaction Actions?\b',
              r'\bFaction Abilit(?:y|ies)\b',
              r'\bfaction procedure\b',
              r'This view layers the current-development rules over the published v0\.6\.3 Rulebook\.',
          ]
          for pattern in forbidden:
              match = re.search(pattern, text, re.IGNORECASE)
              if match:
                  raise SystemExit(f'Retired current Rulebook text remains: {match.group(0)}')

          path.write_text(text)
          PY

      - name: Render deterministic Card Anatomy figure
        run: node scripts/render-current-card-anatomy.mjs

      - name: Commit maintained source and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rulebook/player-facing/current-rulebook.md images/rulebook/card-anatomy.png
          git rm .github/workflows/patch-current-rulebook-source.yml
          git commit -m "Finalize maintained current Rulebook source"
          git push origin HEAD:fix/current-authority-rulebook-source
