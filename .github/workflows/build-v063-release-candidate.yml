name: Build v0.6.3 source release candidate

on:
  push:
    branches: [agent/v063-print-package-candidate]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-v063-release-candidate.yml'
      - 'scripts/build-v063-release-candidate.mjs'
      - 'scripts/validate-v063-release-candidate.mjs'
      - 'scripts/validate-v063-published-release.mjs'
      - 'artifacts/v0.6.3/release-candidate/**'
      - 'releases/v0.6.3/**'
      - 'v0.6.3/data/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v063-source-lifecycle-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validation target
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Detect v0.6.3 lifecycle
        id: lifecycle
        run: |
          if [ -e releases/v0.6.3/Gauntlet_v0.6.3_Manifest.json ]; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
          else
            echo 'published=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate published release lifecycle
        if: steps.lifecycle.outputs.published == 'true'
        run: node scripts/validate-v063-published-release.mjs

      - name: Validate source candidate lifecycle
        if: steps.lifecycle.outputs.published != 'true'
        run: |
          node scripts/build-v063-release-candidate.mjs --check
          node scripts/validate-v063-release-candidate.mjs
