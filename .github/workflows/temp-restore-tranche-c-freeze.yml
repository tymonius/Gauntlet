name: Temporary restore tranche C frozen revision assertion

on:
  push:
    branches:
      - rules-arbiter-gate3-c-remediation

permissions:
  contents: write

jobs:
  restore-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rules-arbiter-gate3-c-remediation
          fetch-depth: 0

      - name: Restore immutable tranche C assertion
        shell: python
        run: |
          from pathlib import Path
          path = Path("rules-assistant/v071-gate3-blind-c.test.mjs")
          text = path.read_text(encoding="utf-8")
          old = 'const EXPECTED_BEHAVIOR = "v071-qa-20260915-14";'
          new = 'const EXPECTED_BEHAVIOR = "v071-qa-20260914-13";'
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one r14 freeze assertion, found {text.count(old)}.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Remove temporary workflow
        run: rm .github/workflows/temp-restore-tranche-c-freeze.yml

      - name: Commit frozen assertion restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules-assistant/v071-gate3-blind-c.test.mjs .github/workflows/temp-restore-tranche-c-freeze.yml
          git commit -m "Restore immutable tranche C revision assertion"
          git push origin HEAD:rules-arbiter-gate3-c-remediation
