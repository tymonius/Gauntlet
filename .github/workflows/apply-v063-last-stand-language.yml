name: Apply v0.6.3 Last Stand terminology

on:
  push:
    branches:
      - fix/restore-last-stand-terminology
    paths:
      - ".github/workflows/apply-v063-last-stand-language.yml"
      - "scripts/validate-v063-last-stand-language.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-last-stand-terminology
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/apply-v063-last-stand-language.yml
            scripts/validate-v063-last-stand-language.mjs
            rules-assistant/v063-last-stand-language.js
            docs/Gauntlet_v0.6.3_Cross_Surface_Closeout_Matrix.md
            docs/Gauntlet_v0.6.3_General_Card_Rules_Candidate.md
            docs/Gauntlet_v0.6.3_Implementation_Ledger.md
            docs/Gauntlet_v0.6.3_Shared_Rules_Candidate.md
            docs/Gauntlet_v0.6.3_Shared_Rules_Test_Matrix.md
            index.html
            start/index.html
            factions/military/index.html
            releases/v0.6.3-reconstructed/Gauntlet_v0.6.3_Rulebook.md
            releases/v0.6.3-reconstructed/Gauntlet_v0.6.3_Canonical_Data.json
            v0.6.3/data/Gauntlet_v0.6.3_Canonical_Data_Candidate.json
            artifacts/reconstruction/clean-v0.6.3/rulebook/Gauntlet_v0.6.3_Rulebook.md
            artifacts/reconstruction/clean-v0.6.3/downstream/canonical-data.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply allowlisted terminology corrections
        run: node scripts/validate-v063-last-stand-language.mjs --write
      - name: Commit materialized text
        run: |
          if git diff --quiet; then
            echo "No materialized changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/Gauntlet_v0.6.3_Cross_Surface_Closeout_Matrix.md \
            docs/Gauntlet_v0.6.3_General_Card_Rules_Candidate.md \
            docs/Gauntlet_v0.6.3_Implementation_Ledger.md \
            docs/Gauntlet_v0.6.3_Shared_Rules_Candidate.md \
            docs/Gauntlet_v0.6.3_Shared_Rules_Test_Matrix.md \
            index.html \
            start/index.html \
            factions/military/index.html \
            releases/v0.6.3-reconstructed/Gauntlet_v0.6.3_Rulebook.md \
            releases/v0.6.3-reconstructed/Gauntlet_v0.6.3_Canonical_Data.json \
            v0.6.3/data/Gauntlet_v0.6.3_Canonical_Data_Candidate.json
          git commit -m "Materialize PR 171 Last Stand terminology"
          git push origin HEAD:fix/restore-last-stand-terminology
