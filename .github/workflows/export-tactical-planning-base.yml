name: Deploy Tactical Planning

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    if: github.head_ref == 'agent/neutral-tactical-planning'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tactical Planning branch
        uses: actions/checkout@v4
        with:
          ref: agent/neutral-tactical-planning
          fetch-depth: 0

      - name: Verify and deploy source
        run: |
          set -euo pipefail
          echo '7a561503137e71a68ad8acb14789156f8764a51aa53d4296eca4042aa02ffe06  .github/tactical-planning-00.b64' | sha256sum -c -
          echo '54400c575edd5a16a2d4a25ca0dea6c42029b261ab404bb88946c154914487c9  .github/tactical-planning-01a.b64' | sha256sum -c -
          echo '6b0e0100811c531a05dfc2c5722cde4049c4199b9fc93ef03f3cf5c50dfc68f4  .github/tactical-planning-01b.b64' | sha256sum -c -
          echo 'e8858455ec30b16a7d81d1ac861b0c8cd5ed80b072e462cb03a132ef0168aa7d  .github/tactical-planning-02.b64' | sha256sum -c -
          echo 'ba726e3bb4673634dba5d99b1b9b80d64aa857a00f0d749fac6909d478918be7  .github/tactical-planning-03.b64' | sha256sum -c -
          echo 'e4cfce48f79c5af324969519d3dcd1987f3f750f8387386720ea1c1b5a25ee84  .github/tactical-planning-04.b64' | sha256sum -c -
          echo 'bd1918a86ef64355879e9dcdbc310ea3a453122ad23af64fa856f959839cc435  .github/tactical-planning-05.b64' | sha256sum -c -
          echo 'b31a2697cc4a3b6e082d87ef035fa1cfde63dfb9c4df9824c3fa043df0ad58dc  .github/tactical-planning-06.b64' | sha256sum -c -
          echo '335e53b817c84ce88a8c3fb7a3deaa582876042dbc7ebdfbcf0cef61ae28633c  .github/tactical-planning-07.b64' | sha256sum -c -
          echo '15dc794b3775051d3fa05dc00381967981ce615a93f19140c26d46292e9b0cd5  .github/tactical-planning-08.b64' | sha256sum -c -
          echo 'b9cc67ced9374d5fa9076cfa9e0eb6cb3c9b97c455c454fdb1426f716d634a7e  .github/tactical-planning-09.b64' | sha256sum -c -
          echo '1433658ab5e6b75c0111e5d11198a7a0a67347313002c9b4617e001966ed2bdd  .github/tactical-planning-10.b64' | sha256sum -c -
          echo '8eba0392145730321acbcc1f504ad3d9255cb37699a2c1d4a9faaf623656358f  .github/tactical-planning-11.b64' | sha256sum -c -
          echo 'bc9c80c07979a7d2b7d612b73958885ac54273e05ef2b757e53d74be74c9633d  .github/tactical-planning-12.b64' | sha256sum -c -
          echo '1aada4e1f82d1e2b7f3fdda955aa52ff291b416c3ea9c409f9a312a9bd5d948a  .github/tactical-planning-13.b64' | sha256sum -c -
          echo '46892da9fdad04ebae4de9b8d334c1c237bace1526b81fac03feee07fa7ef3f4  .github/tactical-planning-14.b64' | sha256sum -c -
          echo '8a30aa1154082f015f6d61442b8e719cc689b369d39be29fd0b7ebb408d46503  .github/tactical-planning-15.b64' | sha256sum -c -

          cat \
            .github/tactical-planning-00.b64 \
            .github/tactical-planning-01a.b64 \
            .github/tactical-planning-01b.b64 \
            .github/tactical-planning-02.b64 \
            .github/tactical-planning-03.b64 \
            .github/tactical-planning-04.b64 \
            .github/tactical-planning-05.b64 \
            .github/tactical-planning-06.b64 \
            .github/tactical-planning-07.b64 \
            .github/tactical-planning-08.b64 \
            .github/tactical-planning-09.b64 \
            .github/tactical-planning-10.b64 \
            .github/tactical-planning-11.b64 \
            .github/tactical-planning-12.b64 \
            .github/tactical-planning-13.b64 \
            .github/tactical-planning-14.b64 \
            .github/tactical-planning-15.b64 \
            > /tmp/tactical-planning.b64
          test "$(wc -c < /tmp/tactical-planning.b64)" -eq 26272
          echo '75be678808bd147e785792490541f81e374632d4fbd77cd78a3f30f677413591  /tmp/tactical-planning.b64' | sha256sum -c -
          base64 -d /tmp/tactical-planning.b64 > /tmp/tactical-planning.tar.gz
          test "$(wc -c < /tmp/tactical-planning.tar.gz)" -eq 19704
          echo 'e88ac90b1b4fb96cefd033f14f2abe5411a737e7afe1f20f7302828f1ab777e1  /tmp/tactical-planning.tar.gz' | sha256sum -c -
          tar -xzf /tmp/tactical-planning.tar.gz

          rm -f .github/tactical-planning-*.b64
          git fetch origin main
          git checkout origin/main -- .github/workflows/test.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Neutral Tactical Planning'
          git push origin HEAD:agent/neutral-tactical-planning
