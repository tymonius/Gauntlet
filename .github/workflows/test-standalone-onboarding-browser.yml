name: Test standalone new-player onboarding

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'start/index.html'
      - 'start/app.js'
      - 'deckbuilder/index.html'
      - 'deckbuilder/starter-handoff.js'
      - 'deckbuilder/starter-decks.js'
      - 'deckbuilder/starter-decks.json'
      - 'tests/standalone-new-player-onboarding.test.ts'
      - '.github/workflows/test-standalone-onboarding-browser.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'start/index.html'
      - 'start/app.js'
      - 'deckbuilder/index.html'
      - 'deckbuilder/starter-handoff.js'
      - 'deckbuilder/starter-decks.js'
      - 'deckbuilder/starter-decks.json'
      - 'tests/standalone-new-player-onboarding.test.ts'
      - '.github/workflows/test-standalone-onboarding-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  onboarding-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependency
        run: npm install

      - name: Verify onboarding handoff contract
        run: npx vitest run tests/standalone-new-player-onboarding.test.ts
