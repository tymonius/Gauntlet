name: Validate onboarding contract

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  onboarding-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout onboarding surface
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /vitest.config.ts
            /tests/standalone-new-player-onboarding.test.ts
            /index.html
            /start/
            /deckbuilder/
            /game-data/current-game.json
            /rulebook/player-facing/current-rulebook.md

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependency
        run: npm install

      - name: Verify onboarding handoff contract
        run: npx vitest run tests/standalone-new-player-onboarding.test.ts
