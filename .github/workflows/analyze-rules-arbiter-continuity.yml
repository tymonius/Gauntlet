name: Analyze Rules Arbiter continuity backlog

on:
  push:
    branches: [analysis/rules-arbiter-continuity-backlog]
    paths:
      - '.github/workflows/analyze-rules-arbiter-continuity.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OUT_DIR: .tmp/rules-arbiter-continuity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify production D1 credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

      - name: Read only the three active continuity cases and their conversation rows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          IDS="'6d69603b-0299-4029-a325-b45014c8f901','44f5bb3c-dc46-4db8-82c6-6ffb949f4028','5990af8d-4276-41a0-bebf-d4b1ff762e09'"

          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant \
            --remote \
            --config rules-assistant/wrangler.toml \
            --json \
            --command "SELECT id, session_id, sequence_index, created_at, question, answer, game_version, ruling_status, ruling_status_v2, confidence, source_count, review_status, issue_types_json, feedback_rating FROM rules_interactions WHERE session_id IN (SELECT DISTINCT session_id FROM rules_interactions WHERE id IN ($IDS)) ORDER BY session_id, sequence_index, created_at" \
            > "$OUT_DIR/session-rows.raw.json"

          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant \
            --remote \
            --config rules-assistant/wrangler.toml \
            --json \
            --command "SELECT interaction_id, created_at, candidate_sources_json FROM rules_interaction_diagnostics WHERE interaction_id IN ($IDS) ORDER BY created_at DESC" \
            > "$OUT_DIR/diagnostics.raw.json"

          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant \
            --remote \
            --config rules-assistant/wrangler.toml \
            --json \
            --command "SELECT interaction_id, reviewed_at, historical_accuracy, current_validity, retrieval_assessment, classification_assessment, designer_review_required, recommended_action, reviewed_against_version FROM rules_interaction_audits WHERE interaction_id IN ($IDS) ORDER BY reviewed_at DESC" \
            > "$OUT_DIR/audits.raw.json"

      - name: Normalize compact analysis packet
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const dir = process.env.OUT_DIR;
          const unwrap = (path) => {
            const payload = JSON.parse(readFileSync(path, 'utf8'));
            const batches = Array.isArray(payload) ? payload : [payload];
            return batches.flatMap((batch) => Array.isArray(batch?.results) ? batch.results : []);
          };
          const sessions = unwrap(`${dir}/session-rows.raw.json`);
          const diagnostics = unwrap(`${dir}/diagnostics.raw.json`).map((row) => {
            let candidates = [];
            try { candidates = JSON.parse(row.candidate_sources_json || '[]'); } catch {}
            return {
              interaction_id: row.interaction_id,
              created_at: row.created_at,
              candidates: Array.isArray(candidates) ? candidates.map((item) => ({
                canonicalId: String(item?.canonicalId || item?.canonical_id || ''),
                title: String(item?.title || ''),
                kind: String(item?.kind || ''),
                sourcePath: String(item?.sourcePath || item?.source_path || '')
              })).filter((item) => item.canonicalId || item.title || item.sourcePath) : []
            };
          });
          const audits = unwrap(`${dir}/audits.raw.json`);
          writeFileSync(`${dir}/continuity-analysis.json`, JSON.stringify({
            generatedAt: new Date().toISOString(),
            targetInteractionIds: [
              '6d69603b-0299-4029-a325-b45014c8f901',
              '44f5bb3c-dc46-4db8-82c6-6ffb949f4028',
              '5990af8d-4276-41a0-bebf-d4b1ff762e09'
            ],
            sessionRows: sessions,
            diagnostics,
            audits
          }, null, 2));
          NODE

      - name: Upload targeted analysis packet
        uses: actions/upload-artifact@v4
        with:
          name: rules-arbiter-continuity-analysis
          path: .tmp/rules-arbiter-continuity/continuity-analysis.json
          if-no-files-found: error
          retention-days: 1
