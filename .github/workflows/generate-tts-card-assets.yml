name: Generate TTS card assets

on:
  pull_request:
    paths:
      - '.github/workflows/generate-tts-card-assets.yml'
      - 'package.json'
      - 'game-data/**'
      - 'deckbuilder/starter-decks.json'
      - 'docs/v0.6.4-*.json'
      - 'config/release-lifecycle.json'
      - 'config/github-release-contract.json'
      - 'config/tts-component-contract.json'
      - 'config/tts-release-target.json'
      - 'scripts/current-game-authority.mjs'
      - 'scripts/generate-tts-card-assets.mjs'
      - 'scripts/generate-tts-territory-assets.mjs'
      - 'scripts/generate-tts-leader-assets.mjs'
      - 'scripts/generate-tts-starter-decks.mjs'
      - 'scripts/generate-tts-supplemental-assets.mjs'
      - 'scripts/generate-tts-finalized-supplementals.mjs'
      - 'scripts/stage-tts-release-assets.mjs'
      - 'scripts/generate-tts-save.mjs'
      - 'scripts/assemble-tts-supplemental-save.mjs'
      - 'scripts/finalize-tts-save.mjs'
      - 'scripts/promote-tts-save.mjs'
      - 'scripts/check-tts-release-readiness.mjs'
      - 'scripts/tts-current-catalog.mjs'
      - 'scripts/tts-component-contract.mjs'
      - 'scripts/tts-sliding-trackers.mjs'
      - 'tts/**'
      - 'card-design/**'
      - 'releases/**'
      - 'artifacts/reconstruction/**/rulebook/**'
      - 'artifacts/reconstruction/**/faction-guides/**'
      - 'images/Gauntlet.svg'
      - 'images/faction-symbols/**'
      - 'images/artwork/manifest.json'
      - 'images/artwork/cards/**'
      - 'images/artwork/territories/**'
      - 'images/artwork/card-backgrounds/**'
      - 'images/artwork/cardbacks/**'
      - 'images/artwork/supplemental/**'
      - 'images/general.png'
      - 'images/commandant.png'
      - 'images/ambassador.png'
      - 'images/senator.png'
      - 'images/banker.png'
      - 'images/executive.png'
      - 'images/ranger.png'
      - 'images/spymaster.png'
      - 'images/alchemist.png'
      - 'images/spirit walker.png'
      - 'images/grand inquisitor.png'
      - 'images/witch hunter.png'
  workflow_dispatch:
    inputs:
      strict_artwork:
        description: Fail when any playable card lacks artwork
        required: false
        default: false
        type: boolean
      publish_release_assets:
        description: Upload the staged TTS network assets to the current GitHub Release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            package.json
            design-tokens.css
            game-data
            deckbuilder/starter-decks.json
            docs/v0.6.4-card-additions.json
            docs/v0.6.4-rules.json
            docs/v0.6.4-territories.json
            docs/v0.6.4-diplomat-proposals.json
            docs/v0.6.4-arcane-symbol.json
            config/release-lifecycle.json
            config/github-release-contract.json
            config/tts-component-contract.json
            config/tts-release-target.json
            scripts/current-game-authority.mjs
            scripts/generate-tts-card-assets.mjs
            scripts/generate-tts-territory-assets.mjs
            scripts/generate-tts-leader-assets.mjs
            scripts/generate-tts-starter-decks.mjs
            scripts/generate-tts-supplemental-assets.mjs
            scripts/generate-tts-finalized-supplementals.mjs
            scripts/stage-tts-release-assets.mjs
            scripts/generate-tts-save.mjs
            scripts/assemble-tts-supplemental-save.mjs
            scripts/finalize-tts-save.mjs
            scripts/promote-tts-save.mjs
            scripts/check-tts-release-readiness.mjs
            scripts/tts-current-catalog.mjs
            scripts/tts-component-contract.mjs
            scripts/tts-sliding-trackers.mjs
            tts
            card-design
            releases
            artifacts/reconstruction
            images/Gauntlet.svg
            images/faction-symbols
            images/artwork/manifest.json
            images/artwork/cards
            images/artwork/territories
            images/artwork/card-backgrounds
            images/artwork/cardbacks
            images/artwork/supplemental
            images/general.png
            images/commandant.png
            images/ambassador.png
            images/senator.png
            images/banker.png
            images/executive.png
            images/ranger.png
            images/spymaster.png
            images/alchemist.png
            images/spirit walker.png
            images/grand inquisitor.png
            images/witch hunter.png
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Resolve Playwright version
        id: playwright-version
        shell: bash
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Validate current TTS sources
        run: npm run tts:check
      - name: Generate playable card sheets and production backs
        run: npm run tts:cards -- ${{ github.event_name == 'workflow_dispatch' && inputs.strict_artwork && '--strict-art' || '' }}
      - name: Generate Territory sheets
        run: npm run tts:territories
      - name: Generate Leader cards
        run: npm run tts:leaders
      - name: Assemble current starter decks
        run: npm run tts:starters
      - name: Generate ready supplemental components
        run: npm run tts:supplementals
      - name: Generate finalized Proposal, Ledger, and Deed components
        run: npm run tts:finalized-supplementals
      - name: Refresh current Mystics Rite and Ritual components
        run: node tts/render-current-mystics-assets.mjs
      - name: Stage hosted TTS release assets
        run: npm run tts:release:stage
      - name: Generate TTS review scaffold
        run: npm run tts:save
      - name: Assemble ready supplemental components into review scaffold
        run: npm run tts:save:assemble
      - name: Finalize supplemental object presentation
        run: npm run tts:save:finalize
      - name: Apply v0.7.0 TTS QA corrections
        run: node tts/apply-v070-qa-corrections.mjs
      - name: Apply table interaction corrections
        run: node tts/apply-v070-table-interaction-corrections.mjs
      - name: Report TTS release readiness
        run: npm run tts:release:status
      - uses: actions/upload-artifact@v4
        with:
          name: gauntlet-current-tts-card-assets
          path: tts/generated/
          if-no-files-found: error

  publish:
    name: Publish TTS assets to current GitHub Release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release_assets && github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gauntlet-current-tts-card-assets
          path: tts-output
      - name: Upload deterministic TTS network assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find tts-output/release-assets -maxdepth 1 -type f -name 'Gauntlet_*_TTS_Release_Assets.json' -print -quit)"
          test -n "$manifest"
          tag="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(m.releaseTag)" "$manifest")"
          repo="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(m.repository)" "$manifest")"
          test "$repo" = "$GITHUB_REPOSITORY"
          gh release view "$tag" --repo "$repo" >/dev/null
          mapfile -t assets < <(find tts-output/release-assets -maxdepth 1 -type f -print | sort)
          test "${#assets[@]}" -gt 1
          gh release upload "$tag" --repo "$repo" --clobber "${assets[@]}"
      - name: Verify published TTS asset URLs
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find tts-output/release-assets -maxdepth 1 -type f -name 'Gauntlet_*_TTS_Release_Assets.json' -print -quit)"
          node - "$manifest" <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          (async () => {
            for (const asset of manifest.assets) {
              let lastStatus = 0;
              for (let attempt = 1; attempt <= 5; attempt += 1) {
                const response = await fetch(asset.url, { redirect: 'follow' });
                lastStatus = response.status;
                if (response.ok) break;
                if (attempt < 5) await sleep(2000 * attempt);
              }
              if (lastStatus < 200 || lastStatus >= 300) {
                throw new Error(`Published TTS asset is not reachable (${lastStatus}): ${asset.url}`);
              }
            }
            console.log(`Verified ${manifest.assets.length} hosted TTS asset URLs for ${manifest.releaseTag}.`);
          })().catch((error) => {
            console.error(error.stack || error.message || error);
            process.exitCode = 1;
          });
          NODE
