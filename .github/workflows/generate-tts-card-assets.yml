name: Generate TTS card assets

on:
  workflow_dispatch:
    inputs:
      strict_artwork:
        description: Fail when any playable card lacks artwork
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            package.json
            design-tokens.css
            scripts/generate-tts-card-assets.mjs
            scripts/generate-tts-territory-assets.mjs
            tts
            card-design
            releases/v0.6.2/Gauntlet_v0.6.2_Canonical_Data.json
            images/artwork/cards
            images/artwork/card-backgrounds
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Generate playable card sheets
        run: npm run tts:cards -- ${{ inputs.strict_artwork && '--strict-art' || '' }}
      - name: Generate Territory sheet
        run: npm run tts:territories
      - uses: actions/upload-artifact@v4
        with:
          name: gauntlet-v062-tts-card-assets
          path: tts/generated/v0.6.2/
          if-no-files-found: error
