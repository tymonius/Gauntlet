name: Generate TTS card assets

on:
  pull_request:
    paths:
      - '.github/workflows/generate-tts-card-assets.yml'
      - 'package.json'
      - 'game-data/**'
      - 'docs/v0.6.4-*.json'
      - 'config/release-lifecycle.json'
      - 'config/github-release-contract.json'
      - 'config/tts-component-contract.json'
      - 'scripts/current-game-authority.mjs'
      - 'scripts/generate-tts-card-assets.mjs'
      - 'scripts/generate-tts-territory-assets.mjs'
      - 'scripts/generate-tts-environment-assets.mjs'
      - 'scripts/generate-tts-leader-assets.mjs'
      - 'scripts/generate-tts-starter-decks.mjs'
      - 'scripts/generate-tts-supplemental-assets.mjs'
      - 'scripts/generate-tts-finalized-supplementals.mjs'
      - 'scripts/stage-tts-release-assets.mjs'
      - 'scripts/generate-tts-save.mjs'
      - 'scripts/assemble-tts-supplemental-save.mjs'
      - 'scripts/tts-deck-importer.mjs'
      - 'scripts/tts-supplemental-geometry.mjs'
      - 'scripts/promote-tts-save.mjs'
      - 'scripts/check-tts-release-readiness.mjs'
      - 'scripts/tts-current-catalog.mjs'
      - 'scripts/tts-component-contract.mjs'
      - 'scripts/tts-sliding-trackers.mjs'
      - 'tts/**'
      - 'card-design/**'
      - 'releases/**'
      - 'artifacts/reconstruction/**/rulebook/**'
      - 'artifacts/reconstruction/**/faction-guides/**'
      - 'images/Gauntlet.svg'
      - 'images/Gauntlet-G.svg'
      - 'images/faction-symbols/**'
      - 'images/artwork/manifest.json'
      - 'images/artwork/cards/**'
      - 'images/artwork/territories/**'
      - 'images/artwork/card-backgrounds/**'
      - 'images/artwork/cardbacks/**'
      - 'images/artwork/supplemental/**'
      - 'images/general.png'
      - 'images/commandant.png'
      - 'images/ambassador.png'
      - 'images/senator.png'
      - 'images/banker.png'
      - 'images/executive.png'
      - 'images/ranger.png'
      - 'images/spymaster.png'
      - 'images/alchemist.png'
      - 'images/spirit walker.png'
      - 'images/grand inquisitor.png'
      - 'images/witch hunter.png'
  workflow_dispatch:
    inputs:
      strict_artwork:
        description: Fail when any playable card lacks artwork
        required: false
        default: false
        type: boolean
      publish_release_assets:
        description: Upload the staged TTS network assets to the current GitHub Release
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            package.json
            design-tokens.css
            game-data
            docs/v0.6.4-card-additions.json
            docs/v0.6.4-rules.json
            docs/v0.6.4-territories.json
            docs/v0.6.4-diplomat-proposals.json
            docs/v0.6.4-arcane-symbol.json
            config/release-lifecycle.json
            config/github-release-contract.json
            config/tts-component-contract.json
            scripts/current-game-authority.mjs
            rulebook/player-facing/rule-facts.js
            scripts/generate-tts-card-assets.mjs
            scripts/generate-tts-territory-assets.mjs
            scripts/generate-tts-environment-assets.mjs
            scripts/generate-tts-leader-assets.mjs
            scripts/generate-tts-starter-decks.mjs
            scripts/generate-tts-supplemental-assets.mjs
            scripts/generate-tts-finalized-supplementals.mjs
            scripts/stage-tts-release-assets.mjs
            scripts/generate-tts-save.mjs
            scripts/assemble-tts-supplemental-save.mjs
            scripts/tts-deck-importer.mjs
            scripts/tts-supplemental-geometry.mjs
            scripts/promote-tts-save.mjs
            scripts/check-tts-release-readiness.mjs
            scripts/tts-current-catalog.mjs
            scripts/tts-component-contract.mjs
            scripts/tts-sliding-trackers.mjs
            tts
            card-design
            releases
            artifacts/reconstruction
            images/Gauntlet.svg
            images/Gauntlet-G.svg
            images/faction-symbols
            images/artwork/manifest.json
            images/artwork/cards
            images/artwork/territories
            images/artwork/card-backgrounds
            images/artwork/cardbacks
            images/artwork/supplemental
            images/general.png
            images/commandant.png
            images/ambassador.png
            images/senator.png
            images/banker.png
            images/executive.png
            images/ranger.png
            images/spymaster.png
            images/alchemist.png
            images/spirit walker.png
            images/grand inquisitor.png
            images/witch hunter.png

      - name: Determine incremental TTS build scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          seed_run_id=""
          seed_artifact_id=""
          seed_sha=""
          render_cards=false
          render_territories=false
          render_leaders=false
          render_starters=false
          render_supplementals=false
          render_finalized=false
          stage_assets=false
          full_render=false

          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            full_render=true
          else
            runs_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/generate-tts-card-assets.yml/runs?event=pull_request&branch=${SOURCE_BRANCH}&per_page=100")"
            seed_run_id="$(jq -r --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha != $sha and .conclusion == "success")] | sort_by(.run_number) | last | .id // empty' <<<"$runs_json")"

            if [[ -n "$seed_run_id" ]]; then
              seed_run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${seed_run_id}")"
              seed_sha="$(jq -r '.head_sha' <<<"$seed_run_json")"
              artifacts_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${seed_run_id}/artifacts?per_page=100")"
              seed_artifact_id="$(jq -r '.artifacts[] | select(.name == "gauntlet-current-tts-card-assets" and .expired == false) | .id' <<<"$artifacts_json" | head -n1)"
            fi

            if [[ -z "$seed_artifact_id" || -z "$seed_sha" ]]; then
              echo "No reusable prior TTS artifact exists; running a full render."
              full_render=true
            else
              compare_json="$(gh api "/repos/${GITHUB_REPOSITORY}/compare/${seed_sha}...${SOURCE_SHA}")"
              compare_status="$(jq -r '.status' <<<"$compare_json")"
              if [[ "$compare_status" != "ahead" && "$compare_status" != "identical" ]]; then
                echo "Prior successful TTS head ${seed_sha} is not an ancestor-compatible seed (${compare_status}); running a full render."
                full_render=true
              else
                mapfile -t changed_files < <(jq -r '.files[].filename' <<<"$compare_json")
                echo "Incremental TTS scope since successful head ${seed_sha}:"
                printf '  %s\n' "${changed_files[@]:-<none>}"

                for file in "${changed_files[@]}"; do
                  case "$file" in
                    .github/workflows/generate-tts-card-assets.yml|scripts/generate-tts-save.mjs|scripts/assemble-tts-supplemental-save.mjs|scripts/tts-supplemental-geometry.mjs|tts/apply-table-layout.mjs|tts/validate-current-authoritative-save.mjs|tests/tts-*|tests/universal-reference-watermark.test.ts)
                      ;;
                    scripts/generate-tts-finalized-supplementals.mjs|tts/finalized-supplemental-renderer/*)
                      render_finalized=true
                      ;;
                    scripts/generate-tts-supplemental-assets.mjs|scripts/tts-sliding-trackers.mjs|tts/supplemental-renderer/*|card-design/universal-reference.css|card-design/reference-card.js|card-design/reference-card.css|card-design/supplemental-refinements.css|images/Gauntlet-G.svg|images/artwork/supplemental/*)
                      render_supplementals=true
                      ;;
                    scripts/generate-tts-card-assets.mjs|images/artwork/cards/*)
                      render_cards=true
                      ;;
                    scripts/generate-tts-territory-assets.mjs|images/artwork/territories/*)
                      render_territories=true
                      ;;
                    scripts/generate-tts-leader-assets.mjs|images/general.png|images/commandant.png|images/ambassador.png|images/senator.png|images/banker.png|images/executive.png|images/ranger.png|images/spymaster.png|images/alchemist.png|images/spirit\ walker.png|images/grand\ inquisitor.png|images/witch\ hunter.png)
                      render_leaders=true
                      ;;
                    scripts/generate-tts-starter-decks.mjs)
                      render_starters=true
                      ;;
                    scripts/generate-tts-environment-assets.mjs|scripts/stage-tts-release-assets.mjs|tts/assets/environment/*|config/release-lifecycle.json|config/github-release-contract.json)
                      stage_assets=true
                      ;;
                    scripts/check-tts-release-readiness.mjs|scripts/promote-tts-save.mjs)
                      ;;
                    *)
                      # Broad game/card/component changes can fan out across multiple renderers.
                      full_render=true
                      ;;
                  esac
                done
              fi
            fi
          fi

          if [[ "$full_render" == "true" ]]; then
            render_cards=true
            render_territories=true
            render_leaders=true
            render_starters=true
            render_supplementals=true
            render_finalized=true
            stage_assets=true
            seed_artifact_id=""
          else
            # Finalized Proposal/Ledger/Deed assets are additive descendants of
            # the generic supplemental catalog, so rebuild them whenever that
            # base catalog is rebuilt.
            if [[ "$render_supplementals" == "true" ]]; then
              render_finalized=true
            fi
            if [[ "$render_cards" == "true" || "$render_territories" == "true" || "$render_leaders" == "true" ]]; then
              render_starters=true
            fi
            if [[ "$render_cards" == "true" || "$render_territories" == "true" || "$render_leaders" == "true" || "$render_starters" == "true" || "$render_supplementals" == "true" || "$render_finalized" == "true" ]]; then
              stage_assets=true
            fi
          fi

          if [[ "$render_cards" == "true" || "$render_territories" == "true" || "$render_leaders" == "true" || "$render_supplementals" == "true" || "$render_finalized" == "true" || "$stage_assets" == "true" ]]; then
            any_render=true
          else
            any_render=false
          fi

          echo "seed_run_id=$seed_run_id" >> "$GITHUB_OUTPUT"
          echo "seed_artifact_id=$seed_artifact_id" >> "$GITHUB_OUTPUT"
          echo "seed_sha=$seed_sha" >> "$GITHUB_OUTPUT"
          echo "render_cards=$render_cards" >> "$GITHUB_OUTPUT"
          echo "render_territories=$render_territories" >> "$GITHUB_OUTPUT"
          echo "render_leaders=$render_leaders" >> "$GITHUB_OUTPUT"
          echo "render_starters=$render_starters" >> "$GITHUB_OUTPUT"
          echo "render_supplementals=$render_supplementals" >> "$GITHUB_OUTPUT"
          echo "render_finalized=$render_finalized" >> "$GITHUB_OUTPUT"
          echo "stage_assets=$stage_assets" >> "$GITHUB_OUTPUT"
          echo "any_render=$any_render" >> "$GITHUB_OUTPUT"
          echo "full_render=$full_render" >> "$GITHUB_OUTPUT"

          echo "TTS build scope: full=${full_render}, cards=${render_cards}, territories=${render_territories}, leaders=${render_leaders}, starters=${render_starters}, supplementals=${render_supplementals}, finalized=${render_finalized}, stage=${stage_assets}."

      - name: Seed unchanged generated TTS outputs
        if: steps.scope.outputs.seed_artifact_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SEED_ARTIFACT_ID: ${{ steps.scope.outputs.seed_artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Reusing unchanged TTS outputs from artifact ${SEED_ARTIFACT_ID} / head ${{ steps.scope.outputs.seed_sha }}."
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SEED_ARTIFACT_ID}/zip" > /tmp/tts-seed.zip
          mkdir -p tts/generated
          unzip -q /tmp/tts-seed.zip -d tts/generated

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve Playwright version
        if: steps.scope.outputs.any_render == 'true'
        id: playwright-version
        shell: bash
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright Chromium cache
        if: steps.scope.outputs.any_render == 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.scope.outputs.any_render == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Validate current TTS sources
        run: npm run tts:check

      - name: Generate playable card sheets and production backs
        if: steps.scope.outputs.render_cards == 'true'
        run: npm run tts:cards -- ${{ github.event_name == 'workflow_dispatch' && inputs.strict_artwork && '--strict-art' || '' }}

      - name: Generate Territory sheets
        if: steps.scope.outputs.render_territories == 'true'
        run: npm run tts:territories

      - name: Generate Leader cards
        if: steps.scope.outputs.render_leaders == 'true'
        run: npm run tts:leaders

      - name: Assemble current starter decks
        if: steps.scope.outputs.render_starters == 'true'
        run: npm run tts:starters

      - name: Generate ready supplemental components
        if: steps.scope.outputs.render_supplementals == 'true'
        run: npm run tts:supplementals

      - name: Generate finalized Proposal, Ledger, and Deed components
        if: steps.scope.outputs.render_finalized == 'true'
        run: npm run tts:finalized-supplementals

      - name: Stage hosted TTS release assets
        if: steps.scope.outputs.stage_assets == 'true'
        run: npm run tts:release:stage

      - name: Generate authoritative TTS review scaffold
        run: npm run tts:save

      - name: Assemble supplemental starter-kit contents
        run: npm run tts:save:assemble

      - name: Validate authoritative current TTS save contract
        run: node tts/validate-current-authoritative-save.mjs

      - name: Report TTS release readiness
        run: npm run tts:release:status

      - uses: actions/upload-artifact@v4
        with:
          name: gauntlet-current-tts-card-assets
          path: tts/generated/
          if-no-files-found: error

  preview:
    name: Publish TTS PR preview assets
    if: github.event_name == 'pull_request'
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gauntlet-current-tts-card-assets
          path: tts-output

      - name: Prepare immutable PR-preview asset URLs
        id: preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          manifest="$(find tts-output/release-assets -maxdepth 1 -type f -name 'Gauntlet_*_TTS_Release_Assets.json' -print -quit)"
          test -n "$manifest"

          version="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(m.gameVersion)" "$manifest")"
          release_tag="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(m.releaseTag)" "$manifest")"
          preview_tag="tts-${version}-qa-pr-${PR_NUMBER}-${HEAD_SHA:0:12}"
          preview_prefix="https://github.com/${GITHUB_REPOSITORY}/releases/download/${preview_tag}/"
          release_prefix="https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}/"

          scaffold="$(find tts-output -type f -name "Gauntlet_${version}_TTS_Review_Scaffold.json" -print -quit)"
          test -n "$scaffold"

          preview_json="tts-output/Gauntlet_${version}_TTS_PR${PR_NUMBER}_Preview.json"
          PREVIEW_PREFIX="$preview_prefix" RELEASE_PREFIX="$release_prefix" SOURCE="$scaffold" DEST="$preview_json" node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync(process.env.SOURCE, 'utf8');
          if (!source.includes(process.env.RELEASE_PREFIX)) {
            throw new Error(`Review Scaffold does not reference expected release prefix ${process.env.RELEASE_PREFIX}`);
          }
          const rewritten = source.split(process.env.RELEASE_PREFIX).join(process.env.PREVIEW_PREFIX);
          fs.writeFileSync(process.env.DEST, rewritten);
          JSON.parse(rewritten);
          NODE

          PREVIEW_PREFIX="$preview_prefix" RELEASE_PREFIX="$release_prefix" MANIFEST="$manifest" node <<'NODE'
          const fs = require('fs');
          const path = process.env.MANIFEST;
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.preview = {
            kind: 'pull-request',
            pullRequest: Number(process.env.PR_NUMBER || 0) || undefined,
            tag: process.env.PREVIEW_PREFIX.split('/').filter(Boolean).at(-1),
          };
          for (const asset of manifest.assets || []) {
            asset.url = String(asset.url || '').split(process.env.RELEASE_PREFIX).join(process.env.PREVIEW_PREFIX);
          }
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          NODE

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "preview_tag=$preview_tag" >> "$GITHUB_OUTPUT"
          echo "preview_prefix=$preview_prefix" >> "$GITHUB_OUTPUT"
          echo "preview_json=$preview_json" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Publish preview prerelease and assets
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: ${{ steps.preview.outputs.preview_tag }}
          PREVIEW_JSON: ${{ steps.preview.outputs.preview_json }}
          HEAD_SHA: ${{ steps.preview.outputs.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          if ! gh release view "$PREVIEW_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$PREVIEW_TAG"               --repo "$GITHUB_REPOSITORY"               --target "$HEAD_SHA"               --title "TTS QA Preview — PR #$PR_NUMBER @ ${HEAD_SHA:0:12}"               --notes "Immutable Tabletop Simulator QA assets for PR #$PR_NUMBER at commit $HEAD_SHA. Not a game release."               --prerelease
          fi

          mapfile -t network_assets < <(find tts-output/release-assets -maxdepth 1 -type f -print | sort)
          test "${#network_assets[@]}" -gt 1
          gh release upload "$PREVIEW_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${network_assets[@]}" "$PREVIEW_JSON"

      - name: Verify preview JSON and every hosted object URL
        env:
          PREVIEW_TAG: ${{ steps.preview.outputs.preview_tag }}
          PREVIEW_JSON: ${{ steps.preview.outputs.preview_json }}
        shell: bash
        run: |
          set -euo pipefail

          node - "$PREVIEW_JSON" <<'NODE'
          const fs = require('fs');
          const save = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const urls = new Set();

          function visit(value) {
            if (Array.isArray(value)) {
              value.forEach(visit);
              return;
            }
            if (!value || typeof value !== 'object') return;
            for (const child of Object.values(value)) {
              if (typeof child === 'string' && /^https:\/\//i.test(child)) urls.add(child);
              else visit(child);
            }
          }
          visit(save);

          const previewNeedle = `/releases/download/${process.env.PREVIEW_TAG}/`;
          const ttsUrls = [...urls].filter(url => url.includes('/releases/download/'));
          if (!ttsUrls.length) throw new Error('Preview save contains no hosted release asset URLs.');
          if (ttsUrls.some(url => !url.includes(previewNeedle))) {
            throw new Error('Preview save still contains a non-preview GitHub Release asset URL.');
          }

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          (async () => {
            for (const url of ttsUrls) {
              let response;
              for (let attempt = 1; attempt <= 6; attempt += 1) {
                response = await fetch(url, { redirect: 'follow' });
                if (response.ok) break;
                if (attempt < 6) await sleep(1500 * attempt);
              }
              if (!response?.ok) throw new Error(`Preview asset is not reachable (${response?.status || 0}): ${url}`);
            }
            console.log(`Verified ${ttsUrls.length} unique TTS object URLs in the PR preview save.`);
          })().catch(error => {
            console.error(error.stack || error.message || error);
            process.exitCode = 1;
          });
          NODE

  publish:
    name: Publish TTS assets to current GitHub Release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release_assets && github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gauntlet-current-tts-card-assets
          path: tts-output
      - name: Upload deterministic TTS network assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find tts-output/release-assets -maxdepth 1 -type f -name 'Gauntlet_*_TTS_Release_Assets.json' -print -quit)"
          test -n "$manifest"
          tag="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(m.releaseTag)" "$manifest")"
          repo="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(m.repository)" "$manifest")"
          test "$repo" = "$GITHUB_REPOSITORY"
          gh release view "$tag" --repo "$repo" >/dev/null
          mapfile -t assets < <(find tts-output/release-assets -maxdepth 1 -type f -print | sort)
          test "${#assets[@]}" -gt 1
          gh release upload "$tag" --repo "$repo" --clobber "${assets[@]}"
      - name: Verify published TTS asset URLs
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find tts-output/release-assets -maxdepth 1 -type f -name 'Gauntlet_*_TTS_Release_Assets.json' -print -quit)"
          node - "$manifest" <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          (async () => {
            for (const asset of manifest.assets) {
              let lastStatus = 0;
              for (let attempt = 1; attempt <= 5; attempt += 1) {
                const response = await fetch(asset.url, { redirect: 'follow' });
                lastStatus = response.status;
                if (response.ok) break;
                if (attempt < 5) await sleep(2000 * attempt);
              }
              if (lastStatus < 200 || lastStatus >= 300) {
                throw new Error(`Published TTS asset is not reachable (${lastStatus}): ${asset.url}`);
              }
            }
            console.log(`Verified ${manifest.assets.length} hosted TTS asset URLs for ${manifest.releaseTag}.`);
          })().catch((error) => {
            console.error(error.stack || error.message || error);
            process.exitCode = 1;
          });
          NODE
