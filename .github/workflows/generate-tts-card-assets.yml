name: Generate TTS card assets

on:
  pull_request:
    paths:
      - '.github/workflows/generate-tts-card-assets.yml'
      - 'package.json'
      - 'game-data/**'
      - 'deckbuilder/starter-decks.json'
      - 'docs/v0.6.4-*.json'
      - 'config/release-lifecycle.json'
      - 'config/github-release-contract.json'
      - 'config/tts-component-contract.json'
      - 'config/tts-release-target.json'
      - 'scripts/current-game-authority.mjs'
      - 'scripts/generate-tts-card-assets.mjs'
      - 'scripts/generate-tts-territory-assets.mjs'
      - 'scripts/generate-tts-leader-assets.mjs'
      - 'scripts/generate-tts-starter-decks.mjs'
      - 'scripts/generate-tts-supplemental-assets.mjs'
      - 'scripts/generate-tts-finalized-supplementals.mjs'
      - 'scripts/stage-tts-release-assets.mjs'
      - 'scripts/generate-tts-save.mjs'
      - 'scripts/assemble-tts-supplemental-save.mjs'
      - 'scripts/finalize-tts-save.mjs'
      - 'scripts/promote-tts-save.mjs'
      - 'scripts/check-tts-release-readiness.mjs'
      - 'scripts/tts-current-catalog.mjs'
      - 'scripts/tts-component-contract.mjs'
      - 'scripts/tts-sliding-trackers.mjs'
      - 'tts/**'
      - 'card-design/**'
      - 'releases/**'
      - 'artifacts/reconstruction/**/rulebook/**'
      - 'artifacts/reconstruction/**/faction-guides/**'
      - 'images/Gauntlet.svg'
      - 'images/faction-symbols/**'
      - 'images/artwork/manifest.json'
      - 'images/artwork/cards/**'
      - 'images/artwork/territories/**'
      - 'images/artwork/card-backgrounds/**'
      - 'images/artwork/supplemental/**'
      - 'images/general.png'
      - 'images/commandant.png'
      - 'images/ambassador.png'
      - 'images/senator.png'
      - 'images/banker.png'
      - 'images/executive.png'
      - 'images/ranger.png'
      - 'images/spymaster.png'
      - 'images/alchemist.png'
      - 'images/spirit walker.png'
      - 'images/grand inquisitor.png'
      - 'images/witch hunter.png'
  workflow_dispatch:
    inputs:
      strict_artwork:
        description: Fail when any playable card lacks artwork
        required: false
        default: false
        type: boolean
      publish_release_assets:
        description: Upload the staged TTS network assets to the current GitHub Release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            package.json
            design-tokens.css
            game-data
            deckbuilder/starter-decks.json
            docs/v0.6.4-card-additions.json
            docs/v0.6.4-rules.json
            docs/v0.6.4-territories.json
            docs/v0.6.4-diplomat-proposals.json
            docs/v0.6.4-arcane-symbol.json
            config/release-lifecycle.json
            config/github-release-contract.json
            config/tts-component-contract.json
            config/tts-release-target.json
            scripts/current-game-authority.mjs
            scripts/generate-tts-card-assets.mjs
            scripts/generate-tts-territory-assets.mjs
            scripts/generate-tts-leader-assets.mjs
            scripts/generate-tts-starter-decks.mjs
            scripts/generate-tts-supplemental-assets.mjs
            scripts/generate-tts-finalized-supplementals.mjs
            scripts/stage-tts-release-assets.mjs
            scripts/generate-tts-save.mjs
            scripts/assemble-tts-supplemental-save.mjs
            scripts/finalize-tts-save.mjs
            scripts/promote-tts-save.mjs
            scripts/check-tts-release-readiness.mjs
            scripts/tts-current-catalog.mjs
            scripts/tts-component-contract.mjs
            scripts/tts-sliding-trackers.mjs
            tts
            card-design
            releases
            artifacts/reconstruction
            images/Gauntlet.svg
            images/faction-symbols
            images/artwork/manifest.json
            images/artwork/cards
            images/artwork/territories
            images/artwork/card-backgrounds
            images/artwork/supplemental
            images/general.png
            images/commandant.png
            images/ambassador.png
            images/senator.png
            images/banker.png
            images/executive.png
            images/ranger.png
            images/spymaster.png
            images/alchemist.png
            images/spirit walker.png
            images/grand inquisitor.png
            images/witch hunter.png
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Resolve Playwright version
        id: playwright-version
        shell: bash
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Validate current TTS sources
        run: npm run tts:check
      - name: Generate playable card sheets and production backs
        run: npm run tts:cards -- ${{ github.event_name == 'workflow_dispatch' && inputs.strict_artwork && '--strict-art' || '' }}
      - name: Generate Territory sheets
        run: npm run tts:territories
      - name: Generate Leader cards
        run: npm run tts:leaders
      - name: Assemble current starter decks
        run: npm run tts:starters
      - name: Generate ready supplemental components
        run: npm run tts:supplementals
      - name: Generate finalized Proposal, Ledger, and Deed components
        run: npm run tts:finalized-supplementals
      - name: Stage hosted TTS release assets
        run: npm run tts:release:stage
      - name: Generate TTS review scaffold
        run: npm run tts:save
      - name: Assemble ready supplemental components into review scaffold
        run: npm run tts:save:assemble
      - name: Finalize supplemental object presentation
        run: npm run tts:save:finalize
      - name: Report TTS release readiness
        run: npm run tts:release:status
      - uses: actions/upload-artifact@v4
        with:
          name: gauntlet-current-tts-card-assets
          path: tts/generated/
          if-no-files-found: error

  publish:
    name: Publish TTS assets to current GitHub Release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release_assets && github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gauntlet-current-tts-card-assets
          path: tts-output
      - name: Upload deterministic TTS network assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find tts-output/release-assets -maxdepth 1 -type f -name 'Gauntlet_*_TTS_Release_Assets.json' -print -quit)"
          test -n "$manifest"
          tag="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(m.releaseTag)" "$manifest")"
          repo="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(m.repository)" "$manifest")"
          test "$repo" = "$GITHUB_REPOSITORY"
          gh release view "$tag" --repo "$repo" >/dev/null
          mapfile -t assets < <(find tts-output/release-assets -maxdepth 1 -type f -print | sort)
          test "${#assets[@]}" -gt 1
          gh release upload "$tag" --repo "$repo" --clobber "${assets[@]}"
      - name: Verify published TTS asset URLs
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find tts-output/release-assets -maxdepth 1 -type f -name 'Gauntlet_*_TTS_Release_Assets.json' -print -quit)"
          node - "$manifest" <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          (async () => {
            for (const asset of manifest.assets) {
              let lastStatus = 0;
              for (let attempt = 1; attempt <= 5; attempt += 1) {
                const response = await fetch(asset.url, { redirect: 'follow' });
                lastStatus = response.status;
                if (response.ok) break;
                if (attempt < 5) await sleep(2000 * attempt);
              }
              if (lastStatus < 200 || lastStatus >= 300) {
                throw new Error(`Published TTS asset is not reachable (${lastStatus}): ${asset.url}`);
              }
            }
            console.log(`Verified ${manifest.assets.length} hosted TTS asset URLs for ${manifest.releaseTag}.`);
          })().catch((error) => {
            console.error(error.stack || error.message || error);
            process.exitCode = 1;
          });
          NODE


  promote_hosted_v070:
    name: Promote approved v0.7.0 hosted save
    if: github.event_name == 'pull_request' && github.head_ref == 'release/v0.7.0-final-hosted-save'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out hosting branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Check out approved release source
        uses: actions/checkout@v4
        with:
          ref: 914309335eb1cd25f9302a9863458f383b7e5462
          path: release-source
          fetch-depth: 1

      - name: Download approved QA build artifact
        uses: actions/download-artifact@v4
        with:
          name: gauntlet-current-tts-card-assets
          path: release-source/tts/generated
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33107271599

      - name: Run guarded save promotion
        shell: bash
        run: |
          set -euo pipefail
          cd release-source
          node scripts/promote-tts-save.mjs
          test -f tts/generated/v0.7.0/Gauntlet_v0.7.0_TTS_Mod.json

      - name: Promote exact Pages-hosted approved save
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { promoteSaveIdentity } from './release-source/scripts/promote-tts-save.mjs';

          const hostedPath = 'tts/v0.7.0/Gauntlet_v0.7.0_TTS_Mod.json';
          const source = JSON.parse(fs.readFileSync(hostedPath, 'utf8'));
          assert.match(String(source.SaveName || ''), /Review Scaffold/i);
          assert.match(String(source.Note || ''), /review scaffold/i);
          assert.match(String(source.Rules || ''), /review scaffold/i);

          const promoted = promoteSaveIdentity(source, 'v0.7.0');
          assert.equal(promoted.SaveName, 'Gauntlet v0.7.0');
          assert.doesNotMatch(String(promoted.Note || ''), /review scaffold/i);
          assert.doesNotMatch(String(promoted.Rules || ''), /review scaffold/i);

          function withoutIdentity(value) {
            const copy = structuredClone(value);
            delete copy.SaveName;
            delete copy.Note;
            delete copy.Rules;
            return copy;
          }
          assert.deepEqual(
            withoutIdentity(promoted),
            withoutIdentity(source),
            'Final promotion must change only SaveName, Note, and Rules.',
          );

          function urls(value, result = []) {
            if (Array.isArray(value)) {
              for (const item of value) urls(item, result);
            } else if (value && typeof value === 'object') {
              for (const item of Object.values(value)) urls(item, result);
            } else if (typeof value === 'string' && /^https:\/\//i.test(value)) {
              result.push(value);
            }
            return result;
          }
          assert.deepEqual(urls(promoted), urls(source), 'Promotion must preserve every hosted URL exactly.');

          const gatedFinal = JSON.parse(
            fs.readFileSync(
              'release-source/tts/generated/v0.7.0/Gauntlet_v0.7.0_TTS_Mod.json',
              'utf8',
            ),
          );
          assert.equal(gatedFinal.SaveName, promoted.SaveName);
          assert.equal(gatedFinal.Note, promoted.Note);
          assert.equal(gatedFinal.Rules, promoted.Rules);

          fs.writeFileSync(hostedPath, JSON.stringify(promoted, null, 2) + '\n');
          console.log('Promoted exact Pages-hosted v0.7.0 save; all non-identity content and URLs are unchanged.');
          NODE

      - name: Verify and commit hosted final save
        env:
          BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "tts/v0.7.0/Gauntlet_v0.7.0_TTS_Mod.json"

          node <<'NODE'
          const fs = require('fs');
          const save = JSON.parse(fs.readFileSync('tts/v0.7.0/Gauntlet_v0.7.0_TTS_Mod.json', 'utf8'));
          if (save.SaveName !== 'Gauntlet v0.7.0') throw new Error('Final hosted save identity was not applied.');
          if (/review scaffold/i.test(String(save.Note || '')) || /review scaffold/i.test(String(save.Rules || ''))) {
            throw new Error('Review Scaffold identity remains in final hosted save.');
          }
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tts/v0.7.0/Gauntlet_v0.7.0_TTS_Mod.json
          git commit -m "Promote hosted v0.7.0 TTS save identity"
          git push origin "HEAD:$BRANCH"
