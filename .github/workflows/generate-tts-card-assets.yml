name: Generate TTS card assets

on:
  workflow_dispatch:
    inputs:
      strict_artwork:
        description: Fail when any playable card lacks artwork
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Generate card sheets
        run: npm run tts:build -- ${{ inputs.strict_artwork && '--strict-art' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: gauntlet-v061-tts-card-assets
          path: tts/generated/v0.6.1/
          if-no-files-found: error
