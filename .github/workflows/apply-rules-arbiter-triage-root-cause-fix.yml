name: Apply Rules Arbiter triage root-cause fix

on:
  push:
    branches:
      - fix/rules-arbiter-triage-root-causes
    paths:
      - .github/workflows/apply-rules-arbiter-triage-root-cause-fix.yml
      - scripts/apply-rules-triage-fix.mjs

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/rules-arbiter-triage-root-causes
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Apply focused triage correction
        run: node scripts/apply-rules-triage-fix.mjs
      - name: Run Rules Arbiter deterministic suite
        run: npm run test:rules-assistant
      - name: Remove staging helpers
        run: rm .github/workflows/apply-rules-arbiter-triage-root-cause-fix.yml scripts/apply-rules-triage-fix.mjs
      - name: Commit refinement
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Correct Rules Arbiter triage root causes"
          git push origin HEAD:fix/rules-arbiter-triage-root-causes
