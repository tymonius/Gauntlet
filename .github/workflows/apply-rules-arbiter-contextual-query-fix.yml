name: Apply contextual retrieval pivot refinement

on:
  push:
    branches:
      - fix/rules-arbiter-contextual-query-pivots

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rules-arbiter-contextual-query-pivots
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scope retrieval history to genuinely contextual follow-ups
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          worker = Path('rules-assistant/worker-v071.js')
          text = worker.read_text()
          text = text.replace(
              'export const BEHAVIOR_REVISION = "v071-qa-20260906-1";',
              'export const BEHAVIOR_REVISION = "v071-qa-20260906-2";'
          )
          old = '''export function contextualQuery(question, history) {
            const prior = history.slice(-4).map((item) => item.content).filter(Boolean).join(" ").slice(-1800);
            return prior ? `${prior} ${question}` : question;
          }
          '''
          new = '''function isContextDependentQuestion(question) {
            const current = String(question || "").trim().toLowerCase();
            const words = current.match(/[a-z0-9']+/g) || [];
            if (!words.length || words.length > 10) return false;

            const referentCue = /\\b(?:it|its|they|them|their|that|those|this|these|which|same|both|former|latter|there|then|one|ones|again|another|next|else)\\b/.test(current);
            const continuationCue = /^(?:and|but|so|then|also|okay|ok|no|yes|wait|what about|how about)\\b/.test(current);
            const bareQuestionCue = words.length <= 2 && /^(?:where|which|why|when|how|what)\\b/.test(current);
            return referentCue || continuationCue || bareQuestionCue;
          }

          export function contextualQuery(question, history = []) {
            const current = String(question || "").trim();
            if (!current || !Array.isArray(history) || !history.length || !isContextDependentQuestion(current)) {
              return current;
            }
            const prior = history.slice(-2).map((item) => String(item?.content || "").trim()).filter(Boolean).join(" ").slice(-1200);
            return prior ? `${prior} ${current}` : current;
          }
          '''
          if old not in text:
              raise SystemExit('contextualQuery source block did not match')
          worker.write_text(text.replace(old, new))

          intel = Path('rules-assistant/v071-intelligence-interference.test.mjs')
          text = intel.read_text()
          text = text.replace(
              'import { augmentRetrievalForContext } from "./worker-v071.js";',
              'import { augmentRetrievalForContext, contextualQuery } from "./worker-v071.js";'
          )
          text = text.replace(
              '  const raw = retrieveRules(corpus, question, { limit: 10, excerptLength: 1300 });\n  return augmentRetrievalForContext(corpus, question, history, raw).map((source) => source.canonicalId);',
              '  const retrievalQuery = contextualQuery(question, history);\n  const raw = retrieveRules(corpus, retrievalQuery, { limit: 10, excerptLength: 1300 });\n  return augmentRetrievalForContext(corpus, question, history, raw).map((source) => source.canonicalId);'
          )
          text = text.replace(
              '    const raw = retrieveRules(corpus, question, { limit: 10, excerptLength: 1300 });\n    const rawIds = raw.map((source) => source.canonicalId);',
              '    const retrievalQuery = contextualQuery(question, history);\n    expect(retrievalQuery).toBe(question);\n    const raw = retrieveRules(corpus, retrievalQuery, { limit: 10, excerptLength: 1300 });\n    const rawIds = raw.map((source) => source.canonicalId);'
          )
          text = text.replace('v071-qa-20260906-1', 'v071-qa-20260906-2')
          intel.write_text(text)

          retrieval = Path('rules-assistant/v071-retrieval-qa.test.mjs')
          text = retrieval.read_text()
          text = text.replace(
              'import { buildRulesCorpus, retrieveRules } from "./local-search.js";\n',
              'import { buildRulesCorpus, retrieveRules } from "./local-search.js";\nimport { contextualQuery } from "./worker-v071.js";\n'
          )
          old_local = '''function contextualQuery(question, history = []) {
            const prior = history.slice(-4).map((item) => item.content).filter(Boolean).join(" ").slice(-1800);
            return prior ? `${prior} ${question}` : question;
          }

          '''
          if old_local not in text:
              raise SystemExit('retrieval QA contextualQuery block did not match')
          retrieval.write_text(text.replace(old_local, ''))

          foundation = Path('rules-assistant/v071-qa-foundation.test.mjs')
          text = foundation.read_text().replace(
              'export const BEHAVIOR_REVISION = "v071-qa-20260903-11"',
              'export const BEHAVIOR_REVISION = "v071-qa-20260906-2"'
          )
          foundation.write_text(text)

          Path('rules-assistant/v071-contextual-query.test.mjs').write_text('''import { describe, expect, test } from "vitest";
          import { contextualQuery } from "./worker-v071.js";

          describe("v0.7.1 contextual retrieval query", () => {
            const intelligenceHistory = [
              { role: "user", content: "Can I use Interference on that Gambit?" },
              { role: "assistant", content: "Yes, at the applicable Intelligence response timing." }
            ];

            test("does not contaminate a standalone topic pivot with prior conversation", () => {
              const question = "How much does my Deed cost?";
              expect(contextualQuery(question, intelligenceHistory)).toBe(question);
            });

            test("keeps a self-contained named rules question independent of unrelated history", () => {
              const question = "Can Intelligence interfere with a Gambit that was already face up?";
              const history = [
                { role: "user", content: "How does Financial Capacity work?" },
                { role: "assistant", content: "It changes the number of Actions available during the applicable phase." }
              ];
              expect(contextualQuery(question, history)).toBe(question);
            });

            test("uses the immediately preceding exchange for an elliptical referent", () => {
              const history = [
                { role: "user", content: "Tell me about Military Orders." },
                { role: "assistant", content: "Orders are a Military resource." },
                { role: "user", content: "What is different about Gambits and Tactics?" },
                { role: "assistant", content: "They use different battle roles and normal destinations." }
              ];
              const query = contextualQuery("Where do they go?", history);
              expect(query).toContain("What is different about Gambits and Tactics?");
              expect(query).toContain("They use different battle roles and normal destinations.");
              expect(query).toContain("Where do they go?");
              expect(query).not.toContain("Military Orders");
            });

            test("preserves correction fragments that depend on the prior answer", () => {
              const history = [
                { role: "user", content: "What is the difference between a Gambit and a Tactic?" },
                { role: "assistant", content: "They have different battle roles and destinations." }
              ];
              expect(contextualQuery("No, their destinations", history)).toContain("They have different battle roles and destinations.");
            });

            test("treats a bare short question as context-dependent", () => {
              expect(contextualQuery("How much?", intelligenceHistory)).not.toBe("How much?");
            });
          });
          ''')
          PY
      - name: Run deterministic Rules Arbiter regression tests
        run: |
          npm install
          npx vitest run \
            rules-assistant/v071-contextual-query.test.mjs \
            rules-assistant/v071-intelligence-interference.test.mjs \
            rules-assistant/v071-destination-continuity.test.mjs \
            rules-assistant/v071-retrieval-qa.test.mjs \
            rules-assistant/v071-qa-foundation.test.mjs
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-rules-arbiter-contextual-query-fix.yml
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules-assistant .github/workflows/apply-rules-arbiter-contextual-query-fix.yml
          git commit -m "Scope Rules Arbiter retrieval history to follow-ups"
          git push origin HEAD:fix/rules-arbiter-contextual-query-pivots
