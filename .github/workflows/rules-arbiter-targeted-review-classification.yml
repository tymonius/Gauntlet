name: Rules Arbiter finalize classification cluster

on:
  push:
    branches: [rules-arbiter-review-classification-cluster]
    paths:
      - '.github/workflows/rules-arbiter-targeted-review-classification.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Extend existing explicit-classification resolution coverage
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'artifacts/rules-refinement/resolution-ledger.json';
          const ledger = JSON.parse(fs.readFileSync(path, 'utf8'));
          const entry = (ledger.entries || []).find((item) => item.id === 'explicit-classification-discipline-v071');
          if (!entry) throw new Error('explicit-classification-discipline-v071 entry not found');
          const targets = [
            '9681adbb-7183-4562-866b-9b6e23c1b94a',
            '9393cf9e-57ec-46f6-9134-78d5fc724b73',
            '84f90b9a-8fb9-4581-9bb3-5f3c5f635f22',
            '69552fb5-7b50-4702-9eca-f2719877cf2d',
            'f9ca5a9a-1871-4615-aab4-211cf78fe50f',
            '180d2a82-3993-4659-8062-64704a3a8adb',
            '41439b85-86d2-4800-945e-ca23cf8f16d4'
          ];
          const existing = new Set(entry.interactionIds || []);
          for (const id of targets) {
            if (existing.has(id)) throw new Error(`Interaction already covered: ${id}`);
            entry.interactionIds.push(id);
            existing.add(id);
          }
          ledger.updatedAt = new Date().toISOString();
          fs.writeFileSync(path, JSON.stringify(ledger, null, 2) + '\n');
          console.log(`Extended explicit-classification resolution coverage by ${targets.length} interactions.`);
          NODE

      - name: Verify existing classification contract regression
        run: npx vitest run rules-assistant/v071-qa-foundation.test.mjs

      - name: Validate refinement ledger change
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const names = execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' })
            .split(/\r?\n/).map((name) => name.trim()).filter(Boolean);
          writeFileSync('/tmp/changed-files.json', JSON.stringify(names));
          console.log(JSON.stringify(names, null, 2));
          NODE
          node scripts/validate-rules-refinement-source-first.mjs --changed-files /tmp/changed-files.json
          git diff --check

      - name: Commit refinement accounting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tymon Scott"
          git config user.email "54303549+tymonius@users.noreply.github.com"
          git add artifacts/rules-refinement/resolution-ledger.json
          git diff --cached --check
          git commit -m "Record remaining explicit-classification reviews"
          git push origin HEAD:rules-arbiter-review-classification-cluster
