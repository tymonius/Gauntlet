name: Rules Arbiter targeted review classification cluster

on:
  push:
    branches: [rules-arbiter-review-classification-cluster]
    paths:
      - '.github/workflows/rules-arbiter-targeted-review-classification.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      REVIEW_DIR: .tmp/rules-arbiter-targeted-review
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify production D1 credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

      - name: Read classification cluster from production D1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REVIEW_DIR"
          TARGET_IDS="'9681adbb-7183-4562-866b-9b6e23c1b94a','9393cf9e-57ec-46f6-9134-78d5fc724b73','84f90b9a-8fb9-4581-9bb3-5f3c5f635f22','69552fb5-7b50-4702-9eca-f2719877cf2d','f9ca5a9a-1871-4615-aab4-211cf78fe50f','180d2a82-3993-4659-8062-64704a3a8adb','41439b85-86d2-4800-945e-ca23cf8f16d4'"
          SESSION_SUBQUERY="SELECT DISTINCT session_id FROM rules_interactions WHERE id IN ($TARGET_IDS)"
          INTERACTION_SUBQUERY="SELECT id FROM rules_interactions WHERE session_id IN ($SESSION_SUBQUERY)"

          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant --remote --config rules-assistant/wrangler.toml --json \
            --command "SELECT * FROM rules_interactions WHERE session_id IN ($SESSION_SUBQUERY) ORDER BY session_id, sequence_index, created_at" \
            > "$REVIEW_DIR/interactions.json"

          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant --remote --config rules-assistant/wrangler.toml --json \
            --command "SELECT * FROM rules_interaction_sources WHERE interaction_id IN ($INTERACTION_SUBQUERY) ORDER BY interaction_id" \
            > "$REVIEW_DIR/sources.json"

          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant --remote --config rules-assistant/wrangler.toml --json \
            --command "SELECT * FROM rules_interaction_diagnostics WHERE interaction_id IN ($INTERACTION_SUBQUERY) ORDER BY interaction_id, created_at" \
            > "$REVIEW_DIR/diagnostics.json"

          npx --yes wrangler@4 d1 execute gauntlet-rules-assistant --remote --config rules-assistant/wrangler.toml --json \
            --command "SELECT * FROM rules_interaction_audits WHERE interaction_id IN ($INTERACTION_SUBQUERY) ORDER BY interaction_id, reviewed_at" \
            > "$REVIEW_DIR/audits.json"

      - name: Assemble review bundle
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const dir = process.env.REVIEW_DIR;
          const targets = [
            '9681adbb-7183-4562-866b-9b6e23c1b94a',
            '9393cf9e-57ec-46f6-9134-78d5fc724b73',
            '84f90b9a-8fb9-4581-9bb3-5f3c5f635f22',
            '69552fb5-7b50-4702-9eca-f2719877cf2d',
            'f9ca5a9a-1871-4615-aab4-211cf78fe50f',
            '180d2a82-3993-4659-8062-64704a3a8adb',
            '41439b85-86d2-4800-945e-ca23cf8f16d4'
          ];
          const readRows = (name) => {
            const parsed = JSON.parse(fs.readFileSync(path.join(dir, name), 'utf8'));
            const batches = Array.isArray(parsed) ? parsed : [parsed];
            return batches.flatMap((batch) => Array.isArray(batch?.results) ? batch.results : []);
          };
          const bundle = {
            targetInteractionIds: targets,
            interactions: readRows('interactions.json'),
            sources: readRows('sources.json'),
            diagnostics: readRows('diagnostics.json'),
            audits: readRows('audits.json')
          };
          fs.writeFileSync(path.join(dir, 'review-bundle.json'), JSON.stringify(bundle, null, 2) + '\n');
          console.log(JSON.stringify({
            targetInteractionIds: targets,
            interactions: bundle.interactions.length,
            sources: bundle.sources.length,
            diagnostics: bundle.diagnostics.length,
            audits: bundle.audits.length
          }, null, 2));
          NODE

      - name: Upload targeted review bundle
        uses: actions/upload-artifact@v4
        with:
          name: rules-arbiter-targeted-review-classification-cluster
          path: .tmp/rules-arbiter-targeted-review/review-bundle.json
          if-no-files-found: error
          retention-days: 2
