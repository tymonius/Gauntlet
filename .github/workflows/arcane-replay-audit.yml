name: Generate Arcane Replay Audit

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'audit/arcane-replay-capabilities'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/arcane-replay-capabilities
          fetch-depth: 0

      - name: Generate capability matrix
        run: python .github/scripts/generate-arcane-replay-audit.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/internal/Arcane_Knowledge_Replay_Audit.md
          git commit -m "Generate Arcane Knowledge replay audit" || exit 0
          git push origin HEAD:audit/arcane-replay-capabilities
