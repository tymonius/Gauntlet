name: Clarify v0.6.1 Defender's Advantage

on:
  push:
    branches:
      - rules/clarify-v061-defenders-advantage
    paths:
      - .github/workflows/clarify-v061-defenders-advantage.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clarify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: rules/clarify-v061-defenders-advantage
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install document and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer poppler-utils fonts-liberation
          python -m pip install python-docx pypdf pymupdf
          npm install

      - name: Clarify Defender's Advantage in governing sources
        run: |
          python - <<'PY'
          from pathlib import Path

          rulebook = Path("releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.md")
          text = rulebook.read_text(encoding="utf-8")

          replacements = [
              (
                  "A battle begins when one player enters the other's position. The moving player is the attacker and the other player is the defender. First resolve effects that happen as the battle opens. Each player may then set one card from their Hand as a Gambit. Gambits are costly because they normally go to the Graveyard afterward. Next, each player sets their Hand aside and draws three temporary cards to form a Reserve. Reveal Gambits, then each player may choose one Reserve card as a Tactic. Reveal Tactics, resolve the card effects, and roll dice. The higher battle total wins.",
                  "A battle begins when one player enters the other's position. The moving player is the attacker and the other player is the defender. First resolve effects that happen as the battle opens. Each player may then set one card from their Hand as a Gambit. Gambits are costly because they normally go to the Graveyard afterward. Next, each player sets their Hand aside and draws three temporary cards to form a Reserve. Reveal Gambits, then each player may choose one Reserve card as a Tactic. Reveal Tactics, resolve the card effects, and roll dice. The higher battle total wins. If the totals are tied while the defender controls the contested Territory, Defender's Advantage means the defender wins the tie. Defender's Advantage is a tie rule, not the ordinary advantage mechanic that changes how dice are rolled."
              ),
              (
                  "##### Defender's Advantage\n\nIf the battle total is tied while the defender controls the contested Territory, the defender wins. The defender also has Defender's Advantage during a Last Stand.",
                  "##### Defender's Advantage\n\nDefender's Advantage is a tie rule, not an instance of the ordinary advantage mechanic.\n\nIf the battle total is tied while the defender controls the contested Territory, the defender wins. Defender's Advantage does not grant an additional die. The defender also has Defender's Advantage during a Last Stand, so the defender wins tied Last Stand battle totals even though no Territory is contested there."
              ),
              (
                  "To win normally, push the opponent beyond their final Territory, capture that Territory, then advance beyond the column. This begins a Last Stand battle. Win that battle to run the Gauntlet and win the game. The defender is harder to defeat in a Last Stand: they receive Defender's Advantage and +1 to their battle total.",
                  "To win normally, push the opponent beyond their final Territory, capture that Territory, then advance beyond the column. This begins a Last Stand battle. Win that battle to run the Gauntlet and win the game. The defender is harder to defeat in a Last Stand: Defender's Advantage means they win tied battle totals, and they separately add +1 to their battle total."
              ),
              (
                  "- the defender has Defender's Advantage;\n- the defender adds +1 to their battle total; and",
                  "- Defender's Advantage applies, so the defender wins tied battle totals;\n- the defender separately adds +1 to their battle total; and"
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one rulebook match, found {count}: {old[:80]}")
              text = text.replace(old, new, 1)
          rulebook.write_text(text, encoding="utf-8")

          reference = Path("releases/v0.6.1/Gauntlet_v0.6.1_Reference_Guide.md")
          ref_text = reference.read_text(encoding="utf-8")
          old = "5. During the Last Stand, the defender has Defender's Advantage and adds +1 to their battle total."
          new = "5. During the Last Stand, Defender's Advantage means the defender wins ties; separately, the defender adds +1 to their battle total."
          if ref_text.count(old) != 1:
              raise SystemExit("Reference Guide Last Stand marker was not found exactly once")
          reference.write_text(ref_text.replace(old, new, 1), encoding="utf-8")

          test = Path("rules-assistant/v061-defenders-advantage.test.mjs")
          test.write_text('''import { readFileSync } from "node:fs";\nimport { expect, test } from "vitest";\n\nconst rulebook = readFileSync(\n  new URL("../releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.md", import.meta.url),\n  "utf8"\n);\nconst reference = readFileSync(\n  new URL("../releases/v0.6.1/Gauntlet_v0.6.1_Reference_Guide.md", import.meta.url),\n  "utf8"\n);\n\ntest("defines Defender's Advantage as a tie rule rather than ordinary advantage", () => {\n  expect(rulebook).toContain("Defender's Advantage is a tie rule, not an instance of the ordinary advantage mechanic.");\n  expect(rulebook).toContain("Defender's Advantage does not grant an additional die.");\n  expect(rulebook).toContain("If the battle total is tied while the defender controls the contested Territory, the defender wins.");\n});\n\ntest("states the Last Stand tie rule and +1 as separate benefits", () => {\n  expect(rulebook).toContain("Defender's Advantage means they win tied battle totals, and they separately add +1 to their battle total.");\n  expect(rulebook).toContain("Defender's Advantage applies, so the defender wins tied battle totals;");\n  expect(rulebook).toContain("the defender separately adds +1 to their battle total;");\n  expect(reference).toContain("Defender's Advantage means the defender wins ties; separately, the defender adds +1 to their battle total.");\n});\n''', encoding="utf-8")
          PY

      - name: Synchronize browser and Rules Arbiter sources
        run: |
          python scripts/generate_v061_release.py
          python scripts/sync_v061_rules_assistant.py

      - name: Rebuild Rulebook and Reference Guide
        run: python scripts/build_v061_documents.py

      - name: Validate generated documents
        run: |
          pdftotext releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.pdf - | grep -F "Defender's Advantage is a tie rule"
          pdftotext releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.pdf - | grep -F "separately adds +1"
          pdftotext releases/v0.6.1/Gauntlet_v0.6.1_Reference_Guide.pdf - | grep -F "Defender's Advantage means the defender wins ties"
          npm run governance:check
          npm run typecheck
          npm test
          python scripts/generate_v061_release.py --check
          python scripts/validate_v061_release.py --strict-generated

      - name: Commit clarified sources and regenerated documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.md \
            releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.docx \
            releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.pdf \
            releases/v0.6.1/Gauntlet_v0.6.1_Reference_Guide.md \
            releases/v0.6.1/Gauntlet_v0.6.1_Reference_Guide.docx \
            releases/v0.6.1/Gauntlet_v0.6.1_Reference_Guide.pdf \
            rules-assistant/v061-defenders-advantage.test.mjs \
            rules-assistant/widget.js \
            rules-assistant/local-search.js
          if git diff --cached --quiet; then
            echo "No changes produced" >&2
            exit 1
          fi
          git commit -m "Clarify v0.6.1 Defender's Advantage"
          git push origin HEAD:rules/clarify-v061-defenders-advantage
