name: Render homepage card showcase preview

on:
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'homepage-card-showcase.js'
      - 'homepage-card-showcase.css'
      - 'card-design/card-showcase-embed.html'
      - 'media/compositions.json'
      - '.github/workflows/render-homepage-card-showcase-preview.yml'

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/add-seven-card-promotional-showcase'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Render homepage card showcase
        shell: bash
        run: |
          python3 -m http.server 4173 > /tmp/gauntlet-homepage-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1100 }, deviceScaleFactor: 1 });
            await page.goto('http://127.0.0.1:4173/#cards', { waitUntil: 'networkidle' });
            await page.waitForSelector('[data-card-showcase-stage][data-ready="true"]', { timeout: 30000 });
            await page.waitForTimeout(5000);
            const section = page.locator('#cards');
            await section.screenshot({ path: 'homepage-card-showcase-desktop.png' });

            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            await mobile.goto('http://127.0.0.1:4173/#cards', { waitUntil: 'networkidle' });
            await mobile.waitForSelector('[data-card-showcase-stage][data-ready="true"]', { timeout: 30000 });
            await mobile.waitForTimeout(5000);
            await mobile.locator('#cards').screenshot({ path: 'homepage-card-showcase-mobile.png' });
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: homepage-card-showcase-preview
          path: |
            homepage-card-showcase-desktop.png
            homepage-card-showcase-mobile.png
          if-no-files-found: error
