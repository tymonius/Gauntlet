name: Finalize faction authority normalization

on:
  push:
    branches:
      - rules/faction-authority-normalization
    paths:
      - 'scripts/finalize-faction-authority-normalization.mjs'
      - '.github/workflows/finalize-faction-authority-normalization.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout normalization branch
        uses: actions/checkout@v4
        with:
          ref: rules/faction-authority-normalization

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Finalize canonical faction authority layout
        run: node scripts/finalize-faction-authority-normalization.mjs

      - name: Commit finalized authority and registry
        run: |
          if git diff --quiet -- game-data/current-game.json config/rules-surface-contract.json; then
            echo 'Faction authority layout already finalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-data/current-game.json config/rules-surface-contract.json
          git commit -m 'Finalize single-source faction authority layout'
          git push origin HEAD:rules/faction-authority-normalization
