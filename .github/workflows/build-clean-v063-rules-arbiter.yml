name: Build clean v0.6.3 Rules Arbiter

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-clean-v063-rules-arbiter.yml'
      - 'scripts/validate-clean-v063-rules-arbiter.mjs'
      - 'scripts/sync-google-analytics.mjs'
      - 'artifacts/reconstruction/clean-v0.6.3/rules-arbiter/**'
      - 'artifacts/reconstruction/clean-v0.6.3/complete-authority/**'
      - 'artifacts/reconstruction/clean-v0.6.3/rulebook/**'
      - 'artifacts/reconstruction/clean-v0.6.3/downstream/**'
      - 'config/release-lifecycle.json'
      - 'rules-assistant/local-search.js'
      - 'rules-assistant/widget.js'
      - 'rules-assistant/worker-entry.js'
      - 'rules-assistant/worker-v061.js'
      - 'rules-assistant/Rules_Arbiter_Adjudication_Guide.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-v063-rules-arbiter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean Rules Arbiter inputs
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/build-clean-v063-rules-arbiter.yml
            /scripts/validate-clean-v063-rules-arbiter.mjs
            /scripts/sync-google-analytics.mjs
            /config/release-lifecycle.json
            /artifacts/reconstruction/clean-v0.6.3/complete-authority/
            /artifacts/reconstruction/clean-v0.6.3/rulebook/
            /artifacts/reconstruction/clean-v0.6.3/downstream/
            /artifacts/reconstruction/clean-v0.6.3/rules-arbiter/
            /rules-assistant/local-search.js
            /rules-assistant/widget.js
            /rules-assistant/worker-entry.js
            /rules-assistant/worker-v061.js
            /rules-assistant/Rules_Arbiter_Adjudication_Guide.md

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check clean Rules Arbiter JavaScript
        run: |
          node --check artifacts/reconstruction/clean-v0.6.3/rules-arbiter/corpus.js
          node --check artifacts/reconstruction/clean-v0.6.3/rules-arbiter/app.js
          node --check artifacts/reconstruction/clean-v0.6.3/rules-arbiter/worker.js
          node --check scripts/validate-clean-v063-rules-arbiter.mjs
          node --check scripts/sync-google-analytics.mjs

      - name: Validate clean v0.6.3 Rules Arbiter
        run: node scripts/validate-clean-v063-rules-arbiter.mjs

      - name: Verify analytics synchronization
        run: node scripts/sync-google-analytics.mjs --check

      - name: Reject whitespace errors
        run: git diff --check HEAD^1 HEAD
