name: Apply #1666 language cleanup

on:
  push:
    branches:
      - agent/remove-redundant-battle-involving-you

permissions:
  contents: write

jobs:
  apply-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply zero-behavior-change wording replacements
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "game-data/current-game.json": [
                  (
                      "When a printed Territory effect would affect you, your movement, or a battle involving you, ignore that effect until the end of the turn.",
                      "When a printed Territory effect would affect you, your movement, or the battle, ignore that effect until the end of the turn.",
                  ),
                  (
                      "during the Aftermath of a battle involving you",
                      "during the Aftermath",
                  ),
              ],
              "rulebook/player-facing/current-rulebook.md": [
                  (
                      "Before dice are rolled in a battle involving you",
                      "Before dice are rolled",
                  ),
                  (
                      "When a printed Territory effect would affect you, your movement, or a battle involving you, ignore that effect until the end of the turn.",
                      "When a printed Territory effect would affect you, your movement, or the battle, ignore that effect until the end of the turn.",
                  ),
                  (
                      "during the Aftermath of a battle involving you",
                      "during the Aftermath",
                  ),
                  (
                      "During the Aftermath of battles involving you",
                      "During the Aftermath",
                  ),
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              changed = False
              for old, new in edits:
                  count = text.count(old)
                  if count:
                      print(f"{filename}: replacing {count} occurrence(s) of {old!r}")
                      text = text.replace(old, new)
                      changed = True
              if not changed:
                  raise SystemExit(f"Expected at least one #1666 replacement in {filename}")
              lowered = text.lower()
              if "battle involving you" in lowered or "battles involving you" in lowered:
                  raise SystemExit(f"Redundant battle scope remains in {filename}")
              path.write_text(text, encoding="utf-8")

      - name: Remove one-shot workflow and commit cleanup
        run: |
          rm .github/workflows/apply-1666-language-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-data/current-game.json rulebook/player-facing/current-rulebook.md .github/workflows/apply-1666-language-cleanup.yml
          git commit -m "Remove redundant battle scope wording"
          git push
