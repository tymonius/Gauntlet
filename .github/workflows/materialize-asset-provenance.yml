name: Verify Asset Provenance Remediation

on:
  pull_request:
    paths:
      - card-design/deed-ornamental-divider.svg
      - .github/asset-provenance.json
      - .github/asset-provenance-remediation.json
      - .github/scripts/finalize-deed-ornament-provenance.py
      - .github/scripts/materialize-asset-provenance.py
      - .github/workflows/materialize-asset-provenance.yml
      - docs/ASSET_PROVENANCE_AUDIT.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Apply replacement Deed ornament provenance
        run: python .github/scripts/finalize-deed-ornament-provenance.py
      - name: Materialize provenance ledger
        run: python .github/scripts/materialize-asset-provenance.py --write
      - name: Validate asset provenance
        run: python .github/scripts/validate-asset-provenance.py
      - name: Commit materialized provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/asset-provenance-remediation.json .github/asset-provenance.json docs/ASSET_PROVENANCE_AUDIT.md
          if git diff --cached --quiet; then
            echo "No materialization changes."
          else
            git commit -m "Document replacement Deed ornament provenance"
            git push origin HEAD:${{ github.head_ref }}
          fi
