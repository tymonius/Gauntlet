name: Materialize Asset Provenance Remediation

on:
  pull_request:
    paths:
      - .github/asset-provenance.json
      - .github/asset-provenance-remediation.json
      - .github/scripts/materialize-asset-provenance.py
      - .github/workflows/materialize-asset-provenance.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Materialize evidence-backed remediation records
        run: python .github/scripts/materialize-asset-provenance.py --write

      - name: Validate materialized asset provenance
        run: python .github/scripts/validate-asset-provenance.py

      - name: Build unresolved asset inventory
        run: |
          python - <<'PY'
          import collections
          import json
          import pathlib
          import subprocess

          root = pathlib.Path('.')
          policy = json.loads(pathlib.Path('.github/asset-provenance.json').read_text(encoding='utf-8'))
          rules = policy['policy']
          extensions = {ext.lower() for ext in rules['extensions']}
          ignored = tuple(path.rstrip('/') for path in rules.get('ignored_paths', []))
          recorded = {record['path'] for record in policy.get('assets', [])}
          baseline = policy['baseline_commit']

          def git(*args):
              return subprocess.run(['git', *args], check=True, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE).stdout.strip()

          def ignored_path(path):
              return any(path == prefix or path.startswith(prefix + '/') for prefix in ignored)

          governed = set()
          for governed_root in rules['governed_roots']:
              for path in git('ls-files', '--', governed_root).splitlines():
                  if not path or ignored_path(path):
                      continue
                  if pathlib.Path(path).suffix.lower() in extensions and pathlib.Path(path).is_file():
                      governed.add(path)

          unrecorded = sorted(governed - recorded)
          legacy_unresolved = []
          anomalies = []
          for path in unrecorded:
              probe = subprocess.run(['git', 'cat-file', '-e', f'{baseline}:{path}'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              if probe.returncode != 0:
                  anomalies.append({'path': path, 'reason': 'not present at legacy baseline'})
                  continue
              historical = git('rev-parse', f'{baseline}:{path}')
              current = git('hash-object', path)
              if historical == current:
                  legacy_unresolved.append(path)
              else:
                  anomalies.append({'path': path, 'reason': 'differs from legacy baseline without explicit record'})

          groups = collections.Counter()
          for path in legacy_unresolved:
              parts = path.split('/')
              if len(parts) >= 3:
                  group = '/'.join(parts[:2]) + '/'
              elif len(parts) == 2:
                  group = parts[0] + '/(root)'
              else:
                  group = '(root)'
              groups[group] += 1

          report = {
              'governed_current_files': len(governed),
              'explicit_records': len(recorded),
              'legacy_unresolved': len(legacy_unresolved),
              'unrecorded_anomalies': anomalies,
              'legacy_unresolved_by_group': dict(sorted(groups.items())),
              'legacy_unresolved_paths': legacy_unresolved,
          }
          pathlib.Path('unresolved-assets.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({k: v for k, v in report.items() if k != 'legacy_unresolved_paths'}, indent=2))
          PY

      - name: Commit materialized ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/asset-provenance.json
          if git diff --cached --quiet; then
            echo "Ledger already materialized."
          else
            git commit -m "Materialize expanded asset provenance ledger"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Upload materialized ledger and inventory
        uses: actions/upload-artifact@v4
        with:
          name: materialized-asset-provenance
          path: |
            .github/asset-provenance.json
            unresolved-assets.json
