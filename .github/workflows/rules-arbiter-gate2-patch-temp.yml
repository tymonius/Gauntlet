name: Rules Arbiter Gate 2 patch (temporary)

on:
  push:
    branches:
      - rules-arbiter-gate2-live-failures-20260911

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Align candidate Leveraged Buyout rule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rules-arbiter-gate2-live-failures-20260911
      - name: Align candidate authority
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('rulebook/player-facing/current-rulebook.md')
          text = path.read_text()
          old = '- Leveraged Buyout collateral used from battle goes to the Graveyard after the purchase.'
          new = '- Leveraged Buyout collateral used from battle goes to the Graveyard when battle cards are cleared.'
          count = text.count(old)
          assert count == 1, count
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit candidate correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rulebook/player-facing/current-rulebook.md
          git commit -m 'Align Leveraged Buyout collateral timing'
          git push origin HEAD:rules-arbiter-gate2-live-failures-20260911
