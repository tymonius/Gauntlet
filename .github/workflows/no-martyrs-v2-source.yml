name: No Martyrs V2 Source Snapshot

on:
  pull_request:
  push:
    branches:
      - agent/inquisition-no-martyrs-v2

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package source
        run: zip -r no-martyrs-v2-source.zip . -x '.git/*' 'node_modules/*'
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: no-martyrs-v2-source
          path: no-martyrs-v2-source.zip
