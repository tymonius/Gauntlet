name: Diagnose Requisition Staging

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    if: github.head_ref == 'agent/neutral-requisition-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/neutral-requisition-v2
      - name: Inspect staged payload
        run: |
          set +e
          {
            for file in \
              .github/requisition-v2-00.b64 \
              .github/requisition-v2-01.b64 \
              .github/requisition-v2-02.b64 \
              .github/requisition-v2-03.b64; do
              wc -c "$file"
              sha256sum "$file"
            done
            cat \
              .github/requisition-v2-00.b64 \
              .github/requisition-v2-01.b64 \
              .github/requisition-v2-02.b64 \
              .github/requisition-v2-03.b64 \
              > requisition-impl.b64
            printf '%s' 'e/g9/B5+D7+H38Pv4ffwe/hZv/8HtmPUtwAYAQA=' >> requisition-impl.b64
            wc -c requisition-impl.b64
            sha256sum requisition-impl.b64
            base64 -d requisition-impl.b64 > requisition-impl.tar.gz
            echo "decode-exit=$?"
            wc -c requisition-impl.tar.gz
            sha256sum requisition-impl.tar.gz
            tar -tzf requisition-impl.tar.gz
            echo "tar-exit=$?"
          } > requisition-staging-diagnostic.txt 2>&1
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: requisition-staging-diagnostic
          path: requisition-staging-diagnostic.txt
