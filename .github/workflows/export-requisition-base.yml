name: Export Requisition Base

on:
  pull_request:
    branches:
      - main

jobs:
  export:
    if: github.head_ref == 'agent/neutral-requisition-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/neutral-requisition-v2
      - name: Package repository source
        run: |
          zip -qr requisition-base.zip . -x '.git/*' 'requisition-base.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: requisition-base
          path: requisition-base.zip
