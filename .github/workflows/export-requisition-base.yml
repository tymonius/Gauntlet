name: Export Requisition Base

on:
  pull_request:
    branches:
      - main

jobs:
  export:
    if: github.head_ref == 'agent/neutral-requisition-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/neutral-requisition-v2
      - name: Package development source
        run: |
          zip -qr requisition-base.zip \
            src \
            docs \
            package.json \
            package-lock.json \
            tsconfig.json \
            vitest.config.ts \
            .github/workflows/test.yml
      - uses: actions/upload-artifact@v4
        with:
          name: requisition-base-source
          path: requisition-base.zip
