name: Materialize shared authority normalization

on:
  push:
    branches:
      - rules/shared-authority-normalization
    paths:
      - 'scripts/normalize-shared-rules-authority.mjs'
      - 'scripts/validate-shared-rules-authority.mjs'
      - '.github/workflows/materialize-shared-authority-normalization.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout normalization branch
        uses: actions/checkout@v4
        with:
          ref: rules/shared-authority-normalization

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize canonical shared authority
        run: node scripts/normalize-shared-rules-authority.mjs

      - name: Validate canonical shared authority
        run: node scripts/validate-shared-rules-authority.mjs

      - name: Commit normalized authority and registry
        run: |
          if git diff --quiet -- game-data/current-game.json config/rules-surface-contract.json; then
            echo 'Shared authority already normalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-data/current-game.json config/rules-surface-contract.json
          git commit -m 'Materialize shared rules authority normalization'
          git push origin HEAD:rules/shared-authority-normalization
