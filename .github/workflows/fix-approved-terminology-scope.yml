name: Fix approved terminology scope

on:
  push:
    branches:
      - agent/natural-language-cleanup
    paths:
      - scripts/fix_approved_terminology_scope.py
      - .github/workflows/fix-approved-terminology-scope.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/natural-language-cleanup
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply approved scope correction
        run: python scripts/fix_approved_terminology_scope.py

      - name: Synchronize Rulebook
        run: python scripts/sync_v061_rulebook.py

      - name: Regenerate canonical data
        run: |
          python scripts/generate_v061_release.py
          python scripts/generate_v061_release.py --check

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Validate Deckbuilder
        run: npm run test:deckbuilder

      - name: Run full test suite
        run: npm test

      - name: Remove temporary correction files
        run: rm scripts/fix_approved_terminology_scope.py .github/workflows/fix-approved-terminology-scope.yml

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align terminology cleanup with approved scope"
          git push origin HEAD:agent/natural-language-cleanup

# Updating this workflow after creation ensures the push trigger evaluates it.
