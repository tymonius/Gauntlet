name: Temporary Complete Rules reviewed technical migration

on:
  push:
    branches:
      - rules/complete-rules-reviewed-technical

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: rules/complete-rules-reviewed-technical
          fetch-depth: 1

      - name: Convert Complete Rules to reviewed technical publication
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { loadCurrentGameAuthority } from './scripts/current-game-authority.mjs';
          import { fingerprintRuleDependencies } from './packages/rules/publication/rule-dependencies.mjs';

          const contractPath = 'config/rules-surface-contract.json';
          const sourceManifestPath = 'config/rules-publication-sources.json';
          const markdownPath = 'packages/rules/comprehensive/comprehensive-rules.md';
          const validatorPath = 'scripts/validate-rules-publication-contract.mjs';
          const scaffoldPath = 'scripts/validate-rules-publication-scaffolds.mjs';
          const policyPath = 'packages/rules/publication/editorial-policy.md';

          const contract = JSON.parse(await readFile(contractPath, 'utf8'));
          const authority = await loadCurrentGameAuthority();
          const registryById = new Map((contract.ruleRegistry || []).map(rule => [rule.id, rule]));
          const allRuleIds = [...registryById.keys()];
          if (!allRuleIds.length) throw new Error('Rules registry is empty.');

          contract.dependencyModes = {
            direct: contract.dependencyModes.direct,
            reviewedTeaching: contract.dependencyModes.reviewedTeaching,
            reviewedTechnical: 'Human-maintained technical prose declares registered rule dependencies and must be re-reviewed when those dependencies change.',
            procedural: contract.dependencyModes.procedural,
          };

          const comprehensive = contract?.publicationArchitecture?.comprehensiveRules;
          if (!comprehensive) throw new Error('Comprehensive Rules contract is missing.');
          if (comprehensive.dependencyMode !== 'direct') {
            throw new Error(`Expected Comprehensive Rules dependencyMode direct before migration; found ${comprehensive.dependencyMode}.`);
          }
          comprehensive.dependencyMode = 'reviewedTechnical';
          for (const part of comprehensive.parts || []) {
            const dependencies = (part.covers || []).length ? [...part.covers] : [...allRuleIds];
            part.dependsOn = dependencies;
            part.reviewFingerprint = fingerprintRuleDependencies(authority, registryById, dependencies);
          }
          await writeFile(contractPath, `${JSON.stringify(contract, null, 2)}\n`);

          const sourceManifest = JSON.parse(await readFile(sourceManifestPath, 'utf8'));
          const comprehensiveSource = sourceManifest?.surfaces?.['comprehensive-rules'];
          if (!comprehensiveSource) throw new Error('Comprehensive Rules publication source is missing.');
          comprehensiveSource.reviewMarker = 'RULES-REVIEW-MODE:reviewed-technical';
          await writeFile(sourceManifestPath, `${JSON.stringify(sourceManifest, null, 2)}\n`);

          let markdown = await readFile(markdownPath, 'utf8');
          const oldHeader = `<!-- GENERATED FILE: scripts/render-comprehensive-rules.mjs -->\n<!-- DO NOT EDIT DIRECTLY. Change game-data/current-game.json or the renderer, then regenerate. -->\n<!-- RULES-SURFACE:comprehensive-rules -->\n<!-- AUTHORITY:game-data/current-game.json -->\n\n# Comprehensive Gauntlet Rules\n\n> **Player-facing technical rules.** This publication is generated from \`game-data/current-game.json\` through explicit rules-writing templates. It is intended for players resolving exact rules questions, not for exposing the structure of the underlying data model.\n\nThe Comprehensive Rules are the complete technical rules corpus for the current game. The Player's Guide and Faction Guides are teaching surfaces and may simplify presentation, but they do not override these rules or the underlying gameplay authority.`;
          const newHeader = `<!-- RULES-SURFACE:comprehensive-rules -->\n<!-- RULES-REVIEW-MODE:reviewed-technical -->\n<!-- AUTHORITY:game-data/current-game.json -->\n\n# Comprehensive Gauntlet Rules\n\n> **Player-facing technical rules.** This is maintained technical prose for players resolving exact rules questions. Each Part declares registered gameplay dependencies in the rules-surface contract, and CI requires re-review whenever those authority dependencies change.\n\nThe Comprehensive Rules are the complete technical rules corpus for the current game. The Player's Guide and Faction Guides are teaching surfaces and may simplify presentation, but they do not override these rules or the underlying gameplay authority.`;
          if (!markdown.includes(oldHeader)) throw new Error('Generated Comprehensive Rules header anchor not found.');
          markdown = markdown.replace(oldHeader, newHeader);
          await writeFile(markdownPath, markdown);

          let validator = await readFile(validatorPath, 'utf8');
          const reviewedAnchor = `function validateReviewedSection(errors, authority, registryById, section, context, active, editorial = false) {`;
          const reviewedStart = validator.indexOf(reviewedAnchor);
          if (reviewedStart < 0) throw new Error('Reviewed-section validator anchor not found.');
          const contractLoadAnchor = `\nconst contract = JSON.parse(await readFile(resolve(ROOT, CONTRACT_PATH), 'utf8'));`;
          const helperEnd = validator.indexOf(contractLoadAnchor, reviewedStart);
          if (helperEnd < 0) throw new Error('Validator helper boundary not found.');
          const helper = `\n\nfunction validateReviewedTechnicalPart(errors, authority, registryById, part, context, active) {\n  const dependencies = part.dependsOn || [];\n  validateDependencies(errors, registryById, dependencies, context);\n\n  if (!dependencies.length) {\n    fail(errors, \`\${context} is reviewed technical copy but declares no rule dependencies.\`);\n    return;\n  }\n  if (!active) return;\n\n  if (!/^[0-9a-f]{64}$/.test(part.reviewFingerprint || '')) {\n    fail(errors, \`\${context} is active reviewed technical copy but has no valid reviewFingerprint.\`);\n    return;\n  }\n  const expected = fingerprintRuleDependencies(authority, registryById, dependencies);\n  if (part.reviewFingerprint !== expected) {\n    fail(\n      errors,\n      \`\${context} is stale against its authority dependencies. Review the technical prose and refresh its reviewFingerprint.\`,\n    );\n  }\n}\n`;
          if (!validator.includes('function validateReviewedTechnicalPart(')) {
            validator = validator.slice(0, helperEnd) + helper + validator.slice(helperEnd);
          }

          const comprehensiveStart = validator.indexOf(`const comprehensive = contract?.publicationArchitecture?.comprehensiveRules;`);
          const referenceCardsStart = validator.indexOf(`\nconst referenceCards = contract?.otherSurfaces?.referenceCards;`, comprehensiveStart);
          if (comprehensiveStart < 0 || referenceCardsStart < 0) throw new Error('Comprehensive validator block anchors not found.');
          const comprehensiveBlock = `const comprehensive = contract?.publicationArchitecture?.comprehensiveRules;\nif (!comprehensive || comprehensive.kind !== 'technical' || comprehensive.dependencyMode !== 'reviewedTechnical') {\n  fail(errors, 'Comprehensive Rules must be the reviewedTechnical technical surface.');\n} else {\n  const active = comprehensive.status === 'active';\n  const coverIds = [];\n  const partIds = new Set();\n  for (const part of comprehensive.parts || []) {\n    if (partIds.has(part.id)) fail(errors, \`Duplicate Comprehensive Rules part id: \${part.id}.\`);\n    partIds.add(part.id);\n    validateDependencies(errors, registryById, part.covers, \`Comprehensive Rules / \${part.id} coverage\`);\n    validateReviewedTechnicalPart(\n      errors,\n      authority,\n      registryById,\n      part,\n      \`Comprehensive Rules / \${part.id}\`,\n      active,\n    );\n    for (const coverId of part.covers || []) {\n      if (!(part.dependsOn || []).some(dependency => coveredBy(coverId, dependency))) {\n        fail(errors, \`Comprehensive Rules / \${part.id} covers \${coverId} without a matching review dependency.\`);\n      }\n    }\n    coverIds.push(...(part.covers || []));\n  }\n  for (const ruleId of registryById.keys()) {\n    if (!coverIds.some(coverId => coveredBy(ruleId, coverId))) {\n      fail(errors, \`Registered rule \${ruleId} is not assigned to the Comprehensive Rules.\`);\n    }\n  }\n  for (const factionId of authorityFactionIds) {\n    if (!partIds.has(factionId)) {\n      fail(errors, \`Comprehensive Rules are missing a dedicated \${factionId} faction part.\`);\n    }\n  }\n}\n`;
          validator = validator.slice(0, comprehensiveStart) + comprehensiveBlock + validator.slice(referenceCardsStart);
          await writeFile(validatorPath, validator);

          let scaffold = await readFile(scaffoldPath, 'utf8');
          const scaffoldAnchor = `  requireLiteral(errors, markdown, comprehensive.marker, 'Comprehensive Rules');\n  requireLiteral(errors, markdown, authorityMarker, 'Comprehensive Rules');`;
          const scaffoldReplacement = `  requireLiteral(errors, markdown, comprehensive.marker, 'Comprehensive Rules');\n  if (!comprehensive.reviewMarker) {\n    errors.push('Comprehensive Rules source manifest must declare a reviewed-technical reviewMarker.');\n  } else {\n    requireLiteral(errors, markdown, comprehensive.reviewMarker, 'Comprehensive Rules');\n  }\n  requireLiteral(errors, markdown, authorityMarker, 'Comprehensive Rules');`;
          if (!scaffold.includes(scaffoldAnchor)) throw new Error('Comprehensive scaffold anchor not found.');
          scaffold = scaffold.replace(scaffoldAnchor, scaffoldReplacement);
          await writeFile(scaffoldPath, scaffold);

          let policy = await readFile(policyPath, 'utf8');
          const policyAnchor = `- **Comprehensive Rules:** use precise definitions and timing, but keep sentences grammatical and action-oriented. Diagrams may clarify difficult timing or state relationships but never substitute for the exact rule text.`;
          const policyReplacement = `- **Comprehensive Rules:** use precise definitions and timing, but keep sentences grammatical and action-oriented. The prose is maintained and reviewed rather than regenerated wholesale; each technical Part is bound to registered gameplay dependencies by a review fingerprint that must be refreshed only after the affected prose is re-reviewed. Diagrams may clarify difficult timing or state relationships but never substitute for the exact rule text.`;
          if (!policy.includes(policyAnchor)) throw new Error('Editorial policy Comprehensive Rules anchor not found.');
          policy = policy.replace(policyAnchor, policyReplacement);
          await writeFile(policyPath, policy);
          NODE

          rm scripts/render-comprehensive-rules.mjs
          rm scripts/comprehensive-rules-factions.mjs

          node scripts/validate-rules-publication-contract.mjs
          node scripts/validate-rules-publication-scaffolds.mjs

      - name: Remove temporary workflow and commit migration
        run: |
          rm .github/workflows/temporary-comprehensive-reviewed-technical.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Convert Complete Rules to reviewed technical publication"
          git push origin HEAD:rules/complete-rules-reviewed-technical
