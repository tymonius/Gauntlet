name: Apply Shock and Awe retrieval fix

on:
  push:
    branches:
      - fix/rules-arbiter-shock-and-awe

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rules-arbiter-shock-and-awe
      - name: Apply deterministic source-first fix
        shell: python
        run: |
          from pathlib import Path
          import json
          from datetime import datetime, timezone

          worker_path = Path("rules-assistant/worker-v071.js")
          worker = worker_path.read_text()
          if 'const SHOCK_AND_AWE_AUTHORITY_IDS' not in worker:
              old_revision = 'export const BEHAVIOR_REVISION = "v071-qa-20260906-3";'
              new_revision = 'export const BEHAVIOR_REVISION = "v071-qa-20260906-4";'
              if old_revision not in worker:
                  raise SystemExit("Expected behavior revision not found")
              worker = worker.replace(old_revision, new_revision, 1)

              insertion = '''const SHOCK_AND_AWE_AUTHORITY_IDS = [
            "card:military-shock-and-awe",
            "rulebook:conflicting-victory-benefits"
          ];
          '''
              anchor = 'let corpusPromise;'
              if anchor not in worker:
                  raise SystemExit("Corpus promise anchor not found")
              worker = worker.replace(anchor, insertion + anchor, 1)

              start_marker = '  const intelligenceInterferenceFocus = ('
              end_marker = '  if (!preferredAuthorityIds.length) return retrieval;'
              start = worker.find(start_marker)
              end = worker.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit("Retrieval augmentation anchors not found")
              replacement = '''  const intelligenceInterferenceFocus = (
            intelligenceTopic.test(current)
            || (currentWordCount <= 8 && intelligenceTopic.test(recent) && intelligenceFollowupCue)
          ) && intelligenceProcedureSubject;
          const shockAndAweTopic = /\\bshock\\s+and\\s+awe\\b/;
          const shockAndAweFollowupCue = /\\b(?:orders?|move|movement|advance|capture|front line|command|breakthrough|consolidate|retreat|afterward)\\b/.test(current);
          const shockAndAweFocus = shockAndAweTopic.test(current)
            || (currentWordCount <= 8 && shockAndAweTopic.test(recent) && shockAndAweFollowupCue);
          const shockAndAweAuthorityIds = shockAndAweFocus && /\\bwar crimes\\b/.test(combined)
            ? [...SHOCK_AND_AWE_AUTHORITY_IDS, "card:military-war-crimes"]
            : SHOCK_AND_AWE_AUTHORITY_IDS;
          const preferredAuthorityIds = shockAndAweFocus
            ? shockAndAweAuthorityIds
            : intelligenceInterferenceFocus
              ? INTELLIGENCE_INTERFERENCE_AUTHORITY_IDS
              : destinationFocus && battleCardFocus
                ? BATTLE_CARD_DESTINATION_AUTHORITY_IDS
                : [];
          '''
              worker = worker[:start] + replacement + worker[end:]
              worker_path.write_text(worker)

          ledger_path = Path("artifacts/rules-refinement/resolution-ledger.json")
          ledger = json.loads(ledger_path.read_text())
          entry_id = "shock-and-awe-same-victory-retrieval-v071"
          if not any(entry.get("id") == entry_id for entry in ledger.get("entries", [])):
              now = datetime.now(timezone.utc).isoformat(timespec="milliseconds").replace("+00:00", "Z")
              ledger["updatedAt"] = now
              ledger["entries"].append({
                  "id": entry_id,
                  "status": "resolved",
                  "rootCause": "retrieval",
                  "interactionIds": ["bc78898c-a5d8-4009-a314-5c346f54156f"],
                  "resolutionSurface": "arbiter_retrieval",
                  "summary": "Promote the current v0.7.1 Shock and Awe card and Conflicting victory benefits rule for same-victory restriction questions, including terse follow-ups; include War Crimes authority when the overlap is named.",
                  "resolvedAt": now,
                  "binding": {"behaviorRevision": "v071-qa-20260906-4"}
              })
              ledger_path.write_text(json.dumps(ledger, indent=2) + "\n")
      - name: Verify syntax
        run: node --check rules-assistant/worker-v071.js
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "Fix already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules-assistant/worker-v071.js artifacts/rules-refinement/resolution-ledger.json
          git commit -m "Fix Shock and Awe authority retrieval"
          git push origin HEAD:fix/rules-arbiter-shock-and-awe
