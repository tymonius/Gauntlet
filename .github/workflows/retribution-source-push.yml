name: Retribution Source Push

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate-source:
    if: ${{ github.head_ref == 'feature/v070-retribution-lifecycle' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v070-retribution-lifecycle
          fetch-depth: 0
      - name: Reuse validated Retribution patch logic
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/retribution-integration-trigger.yml')
          lines = path.read_text().splitlines()
          marker = '      - name: Apply Retribution source integration'
          start = lines.index(marker)
          run_index = next(
              i for i in range(start + 1, len(lines))
              if lines[i] == '        run: |'
          )
          body = []
          for line in lines[run_index + 1:]:
              if line and not line.startswith('          '):
                  break
              body.append(line[10:] if line.startswith('          ') else '')
          source = '\n'.join(body) + '\n'
          source = '\n'.join(
              line for line in source.splitlines()
              if "Path('.github/workflows/retribution-integration-patch.yml').unlink" not in line
              and "Path('.github/workflows/retribution-integration-trigger.yml').unlink" not in line
          ) + '\n'
          exec(compile(source, str(path), 'exec'), {'__name__': '__main__'})
      - name: Commit source integration only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v070/battle-engine-core.ts \
                  src/v070/assets.ts \
                  src/v070/battle-types.ts \
                  src/v070/battle-engine-prewar-bonds.ts \
                  src/v070/views-core.ts
          git commit -m "Integrate Retribution into Aftermath timing"
          git push origin HEAD:feature/v070-retribution-lifecycle
