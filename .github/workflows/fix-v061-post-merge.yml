name: Fix v0.6.1 post-merge integration

on:
  push:
    branches:
      - rules/v0.6.1-playtest-revision
    paths:
      - ".github/v061-post-merge.trigger"

permissions:
  contents: write

concurrency:
  group: fix-v061-post-merge
  cancel-in-progress: true

jobs:
  fix-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v4
        with:
          ref: rules/v0.6.1-playtest-revision
          fetch-depth: 0

      - name: Apply governed Bombardment rename
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/Gauntlet_v0.6.1_Neutral_Card_Pool.md")
          text = path.read_text(encoding="utf-8")
          count = text.count("Siege Weaponry")
          if count:
              path.write_text(text.replace("Siege Weaponry", "Bombardment"), encoding="utf-8")
              print(f"Replaced {count} obsolete card-name occurrence(s).")
          elif "## Bombardment" not in text:
              raise SystemExit("Neither the obsolete nor current card name was found")
          PY

      - name: Commit source correction safely
        run: |
          git add docs/Gauntlet_v0.6.1_Neutral_Card_Pool.md
          if git diff --cached --quiet; then
            echo "Canonical source already corrected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rename v0.6.1 Siege Weaponry to Bombardment"
          git pull --rebase origin rules/v0.6.1-playtest-revision
          git push origin HEAD:rules/v0.6.1-playtest-revision
