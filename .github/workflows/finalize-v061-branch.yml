name: Restore archived v0.6.0 release PDFs

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/finalize-v061-branch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout revision branch
        uses: actions/checkout@v4
        with:
          ref: rules/v0.6.1-playtest-revision
          fetch-depth: 0

      - name: Restore archived PDFs from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main rules/v0.6.1-playtest-revision
          git checkout origin/main -- releases/v0.6.0/*.pdf
          git diff --exit-code origin/main -- releases/v0.6.0/*.pdf
          git add releases/v0.6.0/*.pdf
          if git diff --cached --quiet; then
            echo "Archived v0.6.0 PDFs already match main."
            exit 0
          fi
          git commit -m "Restore archived v0.6.0 release PDFs [skip ci]"
          git push origin HEAD:rules/v0.6.1-playtest-revision

      - name: Verify renderer guard and archive integrity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main rules/v0.6.1-playtest-revision
          git diff --exit-code origin/main -- releases/v0.6.0/*.pdf
          git grep -n "github.head_ref != 'rules/v0.6.1-playtest-revision'" -- .github/workflows/render-v0.6.0-cards.yml
