name: Finalize v0.6.1 revision branch

on:
  push:
    branches:
      - rules/v0.6.1-playtest-revision
    paths:
      - ".github/workflows/finalize-v061-branch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout revision branch
        uses: actions/checkout@v4
        with:
          ref: rules/v0.6.1-playtest-revision

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build and rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer poppler-utils fonts-liberation
          python -m pip install python-docx pypdf pymupdf
          npm install
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Synchronize Deckbuilder and its v0.6.1 runtime
        run: |
          python scripts/sync_v061_deckbuilder.py
          python - <<'PY'
          from pathlib import Path
          path = Path('deckbuilder/index.html')
          text = path.read_text(encoding='utf-8')
          marker = '  <script src="app.js?v=20260729-1" defer></script>\n'
          insertion = marker + '  <script src="v061-runtime.js?v=20260729-1" defer></script>\n'
          if 'src="v061-runtime.js' not in text:
              if marker not in text:
                  raise SystemExit('Deckbuilder app-script marker not found')
              text = text.replace(marker, insertion, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Generate canonical release data
        run: python scripts/generate_v061_release.py

      - name: Build Rulebook and Reference Guide documents
        run: python scripts/build_v061_documents.py

      - name: Serve repository
        run: python3 -m http.server 8000 >/tmp/gauntlet-http.log 2>&1 &

      - name: Render playtest sheet and player mat
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });

          async function render({ url, viewport, pdfPath, previewPath, landscape = false }) {
            const page = await browser.newPage({ viewport });
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            page.on('console', message => {
              if (message.type() === 'error') errors.push(message.text());
            });
            await page.goto(url, { waitUntil: 'networkidle' });
            await page.screenshot({ path: previewPath, fullPage: true });
            await page.emulateMedia({ media: 'print' });
            await page.pdf({
              path: pdfPath,
              format: 'Letter',
              landscape,
              printBackground: true,
              preferCSSPageSize: true,
              margin: { top: '0', right: '0', bottom: '0', left: '0' }
            });
            await page.close();
            if (errors.length) throw new Error(`${url} errors:\n${errors.join('\n')}`);
          }

          await render({
            url: 'http://127.0.0.1:8000/playtest/?serial=G061-PREVIEW',
            viewport: { width: 1275, height: 1650 },
            pdfPath: 'playtest/Gauntlet_v0.6.1_Playtest_Sheet.pdf',
            previewPath: 'playtest/Gauntlet_v0.6.1_Playtest_Sheet_Preview.png'
          });
          await render({
            url: 'http://127.0.0.1:8000/playtest/player-mat/',
            viewport: { width: 1650, height: 1275 },
            pdfPath: 'playtest/player-mat/Gauntlet_v0.6.1_Player_Mat.pdf',
            previewPath: 'playtest/player-mat/Gauntlet_v0.6.1_Player_Mat_Preview.png',
            landscape: true
          });
          await browser.close();
          NODE

      - name: Validate browser tools
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          for (const viewport of [{ width: 1440, height: 1000 }, { width: 390, height: 844 }]) {
            const pages = [
              ['/rulebook/', '[data-rulebook-content]', ['Gambit', 'Reserve', 'Tactic', 'Aftermath']],
              ['/card-reference/', '#app', ['122', '25']],
              ['/deckbuilder/', '#app', ['v0.6.1', 'Military', 'Diplomats']]
            ];
            for (const [url, selector, required] of pages) {
              const page = await browser.newPage({ viewport });
              const errors = [];
              page.on('pageerror', error => errors.push(error.message));
              page.on('console', message => {
                if (message.type() === 'error') errors.push(message.text());
              });
              const response = await page.goto(`http://127.0.0.1:8000${url}`, { waitUntil: 'networkidle' });
              if (!response?.ok()) throw new Error(`${url} returned ${response?.status()}`);
              await page.waitForSelector(selector);
              const text = await page.locator('body').innerText();
              for (const term of required) {
                if (!text.includes(term)) throw new Error(`${url} missing ${term}`);
              }
              if (text.includes('v0.6.0')) throw new Error(`${url} still identifies v0.6.0`);
              if (errors.length) throw new Error(`${url} browser errors:\n${errors.join('\n')}`);
              await page.close();
            }
          }
          await browser.close();
          NODE

      - name: Run automated tests and release validation
        run: |
          npm run test:rules-assistant
          npm run test:deckbuilder
          python scripts/generate_v061_release.py --check
          python scripts/validate_v061_release.py --strict-generated

      - name: Commit synchronized and generated release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            deckbuilder/ \
            releases/v0.6.1/ \
            playtest/Gauntlet_v0.6.1_Playtest_Sheet.pdf \
            playtest/Gauntlet_v0.6.1_Playtest_Sheet_Preview.png \
            playtest/player-mat/Gauntlet_v0.6.1_Player_Mat.pdf \
            playtest/player-mat/Gauntlet_v0.6.1_Player_Mat_Preview.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Generate and validate v0.6.1 release artifacts"
          git push origin HEAD:rules/v0.6.1-playtest-revision

      - name: Record source revision
        run: git rev-parse HEAD > SOURCE_REVISION.txt

      - name: Upload finalized revision package
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-v061-finalization
          path: |
            SOURCE_REVISION.txt
            releases/v0.6.1/
            playtest/Gauntlet_v0.6.1_Playtest_Sheet.pdf
            playtest/Gauntlet_v0.6.1_Playtest_Sheet_Preview.png
            playtest/player-mat/Gauntlet_v0.6.1_Player_Mat.pdf
            playtest/player-mat/Gauntlet_v0.6.1_Player_Mat_Preview.png
          if-no-files-found: error
