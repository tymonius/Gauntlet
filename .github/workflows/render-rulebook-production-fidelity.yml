name: Render Rulebook production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rulebook-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout preserved v0.6.1 publication system and canonical Rulebook
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/render-rulebook-production-fidelity.yml
            legacy/v0.6.1-rulebook-publication
            releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.md
            images/sketches
            package.json
            package-lock.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install renderer
        run: |
          npm install
          npm install --no-save pdf-lib
          npx playwright install --with-deps chromium

      - name: Build approved proof, fidelity checkpoint, and complete Rulebook
        run: |
          python legacy/v0.6.1-rulebook-publication/rulebook-design/build_proofs.py
          python legacy/v0.6.1-rulebook-publication/rulebook-production/build_fidelity_gate.py
          python legacy/v0.6.1-rulebook-publication/rulebook-production/build_complete_rulebook.py

      - name: Render and compare against approved design
        run: |
          python -m http.server 8000 --directory legacy/v0.6.1-rulebook-publication >/tmp/rulebook-production-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node legacy/v0.6.1-rulebook-publication/rulebook-production/render_fidelity_gate.mjs
          node legacy/v0.6.1-rulebook-publication/rulebook-production/run_rulebook_renderer.mjs

      - name: Validate PDF geometry
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { PDFDocument } from 'pdf-lib';

          async function validate(path, expectedPages, expectedWidth, expectedHeight, label) {
            const pdf = await PDFDocument.load(fs.readFileSync(path));
            if (pdf.getPageCount() !== expectedPages) {
              throw new Error(`${label}: expected ${expectedPages} pages; found ${pdf.getPageCount()}.`);
            }
            for (const [index, page] of pdf.getPages().entries()) {
              const { width, height } = page.getSize();
              if (Math.abs(width - expectedWidth) > 1 || Math.abs(height - expectedHeight) > 1) {
                throw new Error(`${label} page ${index + 1} is ${width} x ${height} pt.`);
              }
            }
          }

          await validate(
            '/tmp/rulebook-production-fidelity/Gauntlet_v0.6.1_Production_Fidelity_Gate.pdf',
            8,
            396,
            612,
            'Fidelity gate',
          );

          const report = JSON.parse(fs.readFileSync('/tmp/rulebook-production/production-report.json', 'utf8'));
          await validate(
            '/tmp/rulebook-production/Gauntlet_v0.6.1_Rulebook.pdf',
            report.outputs.readerPages,
            396,
            612,
            'Reader Rulebook',
          );
          await validate(
            '/tmp/rulebook-production/Gauntlet_v0.6.1_Rulebook_Booklet.pdf',
            report.outputs.bookletSides,
            792,
            612,
            'Imposed booklet',
          );
          NODE

      - name: Upload fidelity checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-v061-rulebook-production-fidelity
          path: /tmp/rulebook-production-fidelity/**
          if-no-files-found: error

      - name: Upload complete production review package
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-v061-rulebook-production-review
          path: /tmp/rulebook-production/**
          if-no-files-found: error
