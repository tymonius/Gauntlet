name: Render Rulebook production fidelity gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/render-rulebook-production-fidelity.yml"
      - "rulebook-production/**"
      - "rulebook-design/**"
      - "images/sketches/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rulebook-production-fidelity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout approved design and production checkpoint
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/render-rulebook-production-fidelity.yml
            rulebook-design
            rulebook-production
            images/sketches
            package.json
            package-lock.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install renderer
        run: |
          npm install
          npm install --no-save pdf-lib
          npx playwright install --with-deps chromium

      - name: Build approved proof and production fidelity checkpoint
        run: |
          python rulebook-design/build_proofs.py
          python rulebook-production/build_fidelity_gate.py

      - name: Render and compare against approved design
        run: |
          python -m http.server 8000 >/tmp/rulebook-fidelity-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node rulebook-production/render_fidelity_gate.mjs

      - name: Validate PDF geometry
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { PDFDocument } from 'pdf-lib';

          const path = '/tmp/rulebook-production-fidelity/Gauntlet_v0.6.1_Production_Fidelity_Gate.pdf';
          const pdf = await PDFDocument.load(fs.readFileSync(path));
          if (pdf.getPageCount() !== 8) {
            throw new Error(`Expected 8 fidelity pages; found ${pdf.getPageCount()}.`);
          }
          for (const [index, page] of pdf.getPages().entries()) {
            const { width, height } = page.getSize();
            if (Math.abs(width - 396) > 1 || Math.abs(height - 612) > 1) {
              throw new Error(`Page ${index + 1} is ${width} x ${height} pt instead of half-letter.`);
            }
          }
          NODE

      - name: Upload fidelity checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-v061-rulebook-production-fidelity
          path: /tmp/rulebook-production-fidelity/**
          if-no-files-found: error
