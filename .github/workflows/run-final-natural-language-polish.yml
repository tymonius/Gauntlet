name: Run final natural-language polish

on:
  push:
    branches:
      - agent/natural-language-cleanup
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  polish:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[natural-polish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/natural-language-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/final_natural_language_polish.py
      - run: |
          python scripts/sync_v061_rulebook.py
          python scripts/normalize_v061_rulebook_content.py
          python scripts/validate_v061_rulebook_content.py
      - run: |
          npm install --no-package-lock
          npm run test:deckbuilder
          npm test
      - run: rm scripts/final_natural_language_polish.py .github/workflows/run-final-natural-language-polish.yml
      - name: Commit final polish
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[natural-polish] Finish natural-language cleanup"
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/natural-language-cleanup
            if git rebase origin/agent/natural-language-cleanup && git push origin HEAD:agent/natural-language-cleanup; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
