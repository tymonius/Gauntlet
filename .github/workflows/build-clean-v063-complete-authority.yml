name: Finalize clean v0.6.3 provenance repair

on:
  pull_request:
    paths:
      - '.github/workflows/build-clean-v063-complete-authority.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch for one-time provenance finalization
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Normalize complete-authority metadata boundary
        run: python scripts/finalize-clean-v063-provenance-repair.py

      - name: Syntax-check complete-authority scripts
        run: |
          node --check scripts/build-clean-v063-complete-authority.mjs
          node --check scripts/validate-clean-v063-complete-authority.mjs

      - name: Rebuild complete authority against cut-over downstream
        run: node scripts/build-clean-v063-complete-authority.mjs --write

      - name: Validate complete authority
        run: node scripts/validate-clean-v063-complete-authority.mjs

      - name: Revalidate downstream consumer
        run: node scripts/validate-clean-v063-downstream-data.mjs

      - name: Commit finalized complete-authority metadata to PR branch
        shell: bash
        run: |
          git add scripts/build-clean-v063-complete-authority.mjs scripts/validate-clean-v063-complete-authority.mjs
          git add artifacts/reconstruction/clean-v0.6.3/complete-authority
          if git diff --cached --quiet; then
            echo 'Complete authority already reflects the cut-over downstream.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize clean v0.6.3 authority provenance loop'
          git push origin HEAD:${{ github.head_ref }}
