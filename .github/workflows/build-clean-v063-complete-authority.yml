name: Retired clean v0.6.3 complete-authority build

# The clean v0.6.3 authority was certified before publication and is now an
# immutable source input to the current release. Rebuilding the prepublication
# authority pipeline during player-facing maintenance would apply obsolete
# lifecycle assumptions, so this automatic workflow is retired.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Authority build is retired
        run: |
          echo "The clean v0.6.3 complete authority is already certified and published."
          echo "Current maintenance must validate against that authority, not rebuild it."
