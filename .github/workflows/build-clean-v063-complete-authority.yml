name: Build clean v0.6.3 complete authority

on:
  pull_request:
    paths:
      - '.github/workflows/build-clean-v063-complete-authority.yml'
      - 'scripts/materialize-v063-finalized-tracker-snapshot.mjs'
      - 'scripts/build-clean-v063-complete-authority.mjs'
      - 'scripts/validate-clean-v063-complete-authority.mjs'
      - 'config/reconstruction-decision-candidates.json'
      - 'config/reconstruction-version-plan.json'
      - 'config/reconstruction-version-resolutions.json'
      - 'config/release-lifecycle.json'
      - 'v0.6.2/data/canonical-data.js'
      - 'docs/Gauntlet_v0.6.2_Shared_Rules_Candidate.md'
      - 'docs/Gauntlet_v0.6.2_Faction_and_Component_Candidate.md'
      - 'docs/Gauntlet_v0.6.2_Faction_Component_Compatibility_Audit.md'
      - 'docs/Gauntlet_v0.6.3_Shared_Rules_Candidate.md'
      - 'docs/Gauntlet_v0.6.3_General_Card_Rules_Candidate.md'
      - 'docs/v063-card-language-overrides/**'
      - 'scripts/*v063*'
      - 'artifacts/reconstruction/clean-v0.6.3/**'
      - 'artifacts/reconstruction/evidence/v0.6.3/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  complete-authority:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize one-time frozen #405 evidence when absent
        if: ${{ hashFiles('artifacts/reconstruction/evidence/v0.6.3/issue-405-finalized-card-tracker.md') == '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/materialize-v063-finalized-tracker-snapshot.mjs

      - name: Apply provenance-proof normalizations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in [
              'scripts/build-clean-v063-complete-authority.mjs',
              'scripts/validate-clean-v063-complete-authority.mjs',
          ]:
              path = Path(name)
              text = path.read_text()
              old = "  'inherits_from', 'release_manifest', 'provenance',\n"
              new = "  'inherits_from', 'release_manifest', 'provenance', 'authority_set_id',\n"
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'Expected provenance-key declaration not found in {name}')
              path.write_text(text)

          path = Path('scripts/build-clean-v063-complete-authority.mjs')
          text = path.read_text()
          old = '''  const expectedTerritories = stripProvenance(
            replaceStrings(structuredClone(v062.territories), "Smuggler's Pass", "Smuggler's Run"),
          );
          assert.deepEqual(
            generatedGameplay.territories,
            expectedTerritories,
            'Territory authority contains a v0.6.3 mutation other than the approved Smuggler title migration.',
          );'''
          new = '''  let expectedTerritories = structuredClone(v062.territories);
          expectedTerritories = replaceStrings(expectedTerritories, 'only one banked Asset they control can be active', 'only 1 of their Assets can be active');
          expectedTerritories = replaceStrings(expectedTerritories, 'all their other banked Assets are inactive', 'their other Assets are inactive');
          expectedTerritories = replaceStrings(expectedTerritories, "Smuggler's Pass", "Smuggler's Run");
          expectedTerritories = stripProvenance(expectedTerritories);
          assert.deepEqual(
            generatedGameplay.territories,
            expectedTerritories,
            'Territory authority contains a v0.6.3 mutation outside the approved Asset-language normalization or Smuggler title migration.',
          );'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Expected Territory proof block not found')
          path.write_text(text)
          PY

      - name: Rebuild complete authority from source lineage
        run: node scripts/build-clean-v063-complete-authority.mjs --write

      - name: Validate complete authority and zero gameplay drift
        run: node scripts/validate-clean-v063-complete-authority.mjs

      - name: Upload complete authority package
        uses: actions/upload-artifact@v4
        with:
          name: clean-v063-complete-authority
          path: |
            artifacts/reconstruction/clean-v0.6.3/complete-authority/
            artifacts/reconstruction/evidence/v0.6.3/issue-405-finalized-card-tracker.md
            artifacts/reconstruction/evidence/v0.6.3/issue-405-finalized-card-tracker.json
          if-no-files-found: error

      - name: Commit certified authority package to PR branch
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          git add scripts/build-clean-v063-complete-authority.mjs scripts/validate-clean-v063-complete-authority.mjs
          git add artifacts/reconstruction/clean-v0.6.3/complete-authority
          git add artifacts/reconstruction/evidence/v0.6.3/issue-405-finalized-card-tracker.md
          git add artifacts/reconstruction/evidence/v0.6.3/issue-405-finalized-card-tracker.json
          if git diff --cached --quiet; then
            echo 'Authority package already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Certify source-regenerated clean v0.6.3 authority'
          git push origin HEAD:${{ github.head_ref }}
