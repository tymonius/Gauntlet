name: Verify faction portraits

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Render corrected faction pages
        run: |
          python3 -m http.server 4173 >/tmp/gauntlet-http.log 2>&1 &
          cat > verify-portraits.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({headless:true});
          const names = ['financiers','mystics','inquisition'];
          const report = {};
          for (const name of names) {
            const page = await browser.newPage({viewport:{width:1365,height:960}});
            await page.goto(`http://127.0.0.1:4173/factions/${name}/`, {waitUntil:'networkidle'});
            report[name] = await page.locator('.hero-leader-art img').evaluateAll(imgs => imgs.map(img => ({
              src: img.getAttribute('src'),
              currentSrc: img.currentSrc,
              naturalWidth: img.naturalWidth,
              naturalHeight: img.naturalHeight,
              cssContent: getComputedStyle(img).content,
              objectFit: getComputedStyle(img).objectFit
            })));
            await page.screenshot({path:`verified-${name}.png`, fullPage:false});
            await page.close();
          }
          fs.writeFileSync('verified-portrait-report.json', JSON.stringify(report,null,2));
          await browser.close();
          JS
          node verify-portraits.mjs
          rm verify-portraits.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: verified-faction-portraits
          path: |
            verified-financiers.png
            verified-mystics.png
            verified-inquisition.png
            verified-portrait-report.json
