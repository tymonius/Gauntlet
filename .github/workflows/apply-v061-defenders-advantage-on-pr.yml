name: Apply v0.6.1 Defender's Advantage clarification

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-v061-defenders-advantage-on-pr.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rules/clarify-v061-defenders-advantage
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer poppler-utils fonts-liberation
          python -m pip install python-docx pypdf pymupdf
          npm install
      - name: Apply clarification
        run: python .github/scripts/apply-v061-defenders-advantage-clarification.py
      - name: Synchronize and rebuild
        run: |
          python scripts/generate_v061_release.py
          python scripts/sync_v061_rules_assistant.py
          python scripts/build_v061_documents.py
      - name: Validate
        run: |
          pdftotext releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.pdf - | grep -F "tie rule, not an instance"
          pdftotext releases/v0.6.1/Gauntlet_v0.6.1_Rulebook.pdf - | grep -F "separately add +1"
          pdftotext releases/v0.6.1/Gauntlet_v0.6.1_Reference_Guide.pdf - | grep -F "Defender's Advantage means the defender wins ties"
          npm run governance:check
          npm run typecheck
          npm test
          python scripts/generate_v061_release.py --check
          python scripts/validate_v061_release.py --strict-generated
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/v0.6.1 rules-assistant/v061-defenders-advantage.test.mjs rules-assistant/widget.js rules-assistant/local-search.js
          git commit -m "Clarify v0.6.1 Defender's Advantage"
          git push origin HEAD:rules/clarify-v061-defenders-advantage
