name: Publish v0.6.2 release package

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/Gauntlet_v0.6.2_*.md"
      - "docs/Gauntlet_v0.6.2_Starter_Decks_Candidate.json"
      - "v0.6.2/**"
      - "releases/v0.6.2/**"
      - "releases/v0.6.3/**"
      - "factions/**"
      - "rules-assistant/**"
      - "src/content/**"
      - "scripts/build-v062-release.mjs"
      - "scripts/build-v062-release-runner.mjs"
      - "scripts/synchronize-v062-public-site.mjs"
      - "scripts/validate-v062-published-release.mjs"
      - "scripts/validate-v062-historical-release.mjs"
      - "package.json"
      - "index.html"
      - ".github/workflows/publish-v062-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-v062-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validation target
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Detect release lifecycle
        id: lifecycle
        run: |
          if [ -e releases/v0.6.3/Gauntlet_v0.6.3_Manifest.json ]; then
            echo 'v063=true' >> "$GITHUB_OUTPUT"
          else
            echo 'v063=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate v0.6.2 historical release after v0.6.3 cutover
        if: steps.lifecycle.outputs.v063 == 'true'
        run: node scripts/validate-v062-historical-release.mjs

      - name: Validate v0.6.2 as current release before v0.6.3 cutover
        if: steps.lifecycle.outputs.v063 != 'true'
        run: |
          npm run release:v062:build
          npm run release:v062:check

      - name: Typecheck
        run: npm run typecheck

      - name: Run complete repository validation
        run: npm test

      - name: Upload immutable v0.6.2 source package
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-v062-release-source
          path: |
            releases/v0.6.2/
            v0.6.2/release-manifest.json
          if-no-files-found: error
