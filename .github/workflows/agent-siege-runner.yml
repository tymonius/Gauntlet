name: Agent Siege Runner

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  implement:
    if: github.event.issue.pull_request && github.event.issue.number == 287 && github.event.comment.body == '/run-siege'
    runs-on: ubuntu-latest
    steps:
      - name: Report start
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 287,
              body: 'Siege validation started.'
            })

      - name: Checkout Siege branch
        uses: actions/checkout@v4
        with:
          ref: agent/neutral-siege-weaponry
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply branch patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/test.yml').read_text()
          marker = "          python - <<'PY'\n"
          if marker not in workflow:
              raise RuntimeError('Siege patch script marker not found')
          block = workflow.split(marker, 1)[1].split('\n          PY', 1)[0]
          exec(compile(textwrap.dedent(block), '<siege-patch>', 'exec'))
          PY

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Commit validated implementation
        shell: bash
        run: |
          rm -f package-lock.json .agent-trigger
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Neutral Siege Weaponry"
          git push origin HEAD:agent/neutral-siege-weaponry

      - name: Report success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 287,
              body: 'Siege validation passed and the implementation commit was pushed.'
            })

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 287,
              body: `Siege validation failed at step: ${context.job}. Review the latest Agent Siege Runner logs.`
            })
