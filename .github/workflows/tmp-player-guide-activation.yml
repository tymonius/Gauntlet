name: Temporary Player Guide activation materializer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-player-guide-activation.yml'
      - 'scripts/tmp-materialize-player-guide-activation.mjs'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'rules/activate-player-guide'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: rules/activate-player-guide
          fetch-depth: 0

      - name: Materialize reviewed-teaching activation
        run: node scripts/tmp-materialize-player-guide-activation.mjs

      - name: Commit generated contract update
        run: |
          if git diff --quiet -- config/rules-surface-contract.json; then
            echo 'Player Guide activation already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/rules-surface-contract.json
          git commit -m 'docs: activate Player Guide review contract'
          git push origin HEAD:rules/activate-player-guide
