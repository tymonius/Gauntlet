name: Apply guarded Rules Arbiter r11 hardening

on:
  push:
    branches:
      - rules-arbiter-r11-hardening
    paths:
      - .github/workflows/r11-self-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rules-arbiter-r11-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify exact reviewed source state
        shell: bash
        run: |
          set -euo pipefail
          expected_base='764677229d17d9d889a855274d1262617d9c6449'
          expected_worker='a42e2b275bc38ac1ed0829374fd34904a8a1a3f8'
          test "$(git rev-parse HEAD^)" = "$expected_base"
          test "$(git hash-object rules-assistant/worker-v071.js)" = "$expected_worker"
          expected='.github/workflows/r11-self-apply.yml'
          test "$(git diff --name-only "$expected_base"..HEAD)" = "$expected"

      - name: Apply r11 hardening and focused regressions
        shell: bash
        run: |
          set -euo pipefail
          git show e287fb4120fc37317c6dc6975aec790fd7a6570e:.github/scripts/apply-r11-hardening.py > /tmp/apply-r11-hardening.py
          python /tmp/apply-r11-hardening.py
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one anchor, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          qa_test = Path('rules-assistant/v071-authorized-qa-bypass.test.mjs')
          replace_once(qa_test, 'RULES_MODEL_REQUESTS_PER_IP_HOUR = "12"', 'RULES_MODEL_REQUESTS_PER_IP_HOUR = "24"', 'QA hourly limit contract')
          replace_once(qa_test, 'RULES_MODEL_REQUESTS_PER_DAY = "50"', 'RULES_MODEL_REQUESTS_PER_DAY = "100"', 'QA daily limit contract')
          replace_once(qa_test, 'RULES_MODEL_REQUESTS_PER_MONTH = "200"', 'RULES_MODEL_REQUESTS_PER_MONTH = "500"', 'QA monthly limit contract')

          effect_test = Path('rules-assistant/v071-printed-effect-labels.test.mjs')
          replace_once(effect_test, 'BEHAVIOR_REVISION = "v071-qa-20260911-4"', 'BEHAVIOR_REVISION = "v071-qa-20260914-11"', 'printed-effect behavior pin')

          buyout_test = Path('rules-assistant/v072-leveraged-buyout-authority.test.mjs')
          replace_once(buyout_test, '../game-data/current-game.json', '../packages/game-data/current-game.json', 'current-game package path')
          PY
          git diff --check
          node --check rules-assistant/worker-v071.js
          node --check rules-assistant/v071-gate3-b-regressions.test.mjs
          grep -F 'const EXPECTED_BEHAVIOR = "v071-qa-20260913-10";' rules-assistant/v071-gate3-blind-b.test.mjs
          grep -F 'export const BEHAVIOR_REVISION = "v071-qa-20260914-11";' rules-assistant/worker-v071.js

      - name: Install dependencies
        run: npm ci

      - name: Run Rules Arbiter tests
        run: npm run test:rules-assistant

      - name: Commit validated r11
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/r11-self-apply.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden Rules Arbiter after Gate 3 blind tranche B'
          git push origin HEAD:rules-arbiter-r11-hardening
