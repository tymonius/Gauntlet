name: Deploy Sabotage

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    if: github.head_ref == 'agent/neutral-sabotage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/neutral-sabotage
          fetch-depth: 0
      - name: Verify and apply rebuilt patch
        run: |
          set -euo pipefail
          cat .github/sabotage-patch-{00..11}.b64 > /tmp/sabotage.patch.b64
          test "$(wc -c < /tmp/sabotage.patch.b64)" = "21196"
          echo "ce50dbf6af50d1715cf45a2a20fcf33221bdd750398c0ede2d134710d7106901  /tmp/sabotage.patch.b64" | sha256sum -c -
          base64 -d /tmp/sabotage.patch.b64 > /tmp/sabotage.patch.gz
          echo "ef9506f839eeae2402fbe5fdb6cd835d1838a2db628e3037116057196e44857f  /tmp/sabotage.patch.gz" | sha256sum -c -
          gzip -t /tmp/sabotage.patch.gz
          gzip -dc /tmp/sabotage.patch.gz > /tmp/sabotage.patch
          echo "00f90dba73ce6a8ee831ecd8a6f0e746ff0010f3a3098a884f43c781eb3e7a0c  /tmp/sabotage.patch" | sha256sum -c -
          git apply --check /tmp/sabotage.patch
          git apply /tmp/sabotage.patch
          rm -f .github/sabotage-patch-{00..11}.b64 .github/workflows/export-sabotage-base.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Neutral Sabotage"
          git push origin HEAD:agent/neutral-sabotage
