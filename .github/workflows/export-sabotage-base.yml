name: Deploy Sabotage

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    if: github.head_ref == 'agent/neutral-sabotage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/neutral-sabotage
          fetch-depth: 0
      - name: Apply staged patch
        run: |
          set -euo pipefail
          if [ ! -f .github/sabotage-patch-00.b64 ]; then
            echo "Sabotage patch already applied."
            exit 0
          fi
          cat \
            .github/sabotage-patch-00.b64 \
            .github/sabotage-patch-01.b64 \
            .github/sabotage-patch-02.b64 \
            .github/sabotage-patch-03.b64 \
            .github/sabotage-patch-04.b64 \
            > /tmp/sabotage.patch.b64
          base64 -d /tmp/sabotage.patch.b64 > /tmp/sabotage.patch.gz
          gzip -t /tmp/sabotage.patch.gz
          gzip -dc /tmp/sabotage.patch.gz > /tmp/sabotage.patch
          git apply --check /tmp/sabotage.patch
          git apply /tmp/sabotage.patch
          rm -f \
            .github/sabotage-patch-00.b64 \
            .github/sabotage-patch-01.b64 \
            .github/sabotage-patch-02.b64 \
            .github/sabotage-patch-03.b64 \
            .github/sabotage-patch-04.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Neutral Sabotage"
          git push origin HEAD:agent/neutral-sabotage
