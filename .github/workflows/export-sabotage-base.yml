name: Export Partial Sabotage Patch

on:
  pull_request:
    branches:
      - main

jobs:
  export:
    if: github.head_ref == 'agent/neutral-sabotage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/neutral-sabotage
      - name: Decode partial patch
        run: |
          set +e
          cat .github/sabotage-patch-0{0..4}.b64 > /tmp/sabotage.patch.b64
          base64 -d /tmp/sabotage.patch.b64 > /tmp/sabotage.patch.gz
          gzip -dc /tmp/sabotage.patch.gz > sabotage-partial.patch
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: sabotage-partial-patch
          path: sabotage-partial.patch
