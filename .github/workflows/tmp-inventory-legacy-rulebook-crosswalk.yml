name: Temporary legacy Rulebook retirement inventory

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-inventory-legacy-rulebook-crosswalk.yml'
      - 'scripts/tmp-inventory-legacy-rulebook-crosswalk.mjs'
      - 'scripts/validate-legacy-rulebook-retirement-crosswalk.mjs'
      - 'rulebook/player-facing/current-rulebook.md'
      - 'config/rules-surface-contract.json'
      - 'config/legacy-rulebook-retirement-crosswalk.json'
      - 'docs/rules/legacy-rulebook-retirement-crosswalk.md'

permissions:
  contents: write

jobs:
  inventory:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'rules/legacy-rulebook-retirement-crosswalk'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: rules/legacy-rulebook-retirement-crosswalk
          fetch-depth: 0
      - name: Materialize legacy retirement crosswalk
        run: node scripts/tmp-inventory-legacy-rulebook-crosswalk.mjs
      - name: Validate retirement crosswalk
        run: node scripts/validate-legacy-rulebook-retirement-crosswalk.mjs
      - name: Commit crosswalk proof
        run: |
          if [ -z "$(git status --porcelain -- config/legacy-rulebook-retirement-crosswalk.json docs/rules/legacy-rulebook-retirement-crosswalk.md)" ]; then
            echo 'Legacy Rulebook retirement proof already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/legacy-rulebook-retirement-crosswalk.json docs/rules/legacy-rulebook-retirement-crosswalk.md
          git commit -m 'docs: prove legacy Rulebook retirement coverage'
          git push origin HEAD:rules/legacy-rulebook-retirement-crosswalk
