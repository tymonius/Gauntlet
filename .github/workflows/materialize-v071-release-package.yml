name: Materialize v0.7.1 release package

on:
  push:
    branches:
      - main
      - release/v0.7.1-finalize
    paths:
      - game-data/**
      - docs/v0.6.4-*.json
      - docs/v0.6.3-starter-decks.json
      - rulebook/**
      - card-design/**
      - images/artwork/cards/**
      - images/artwork/card-backgrounds/**
      - design-tokens.css
      - rulebook-design/**
      - rulebook-production/**
      - scripts/build-v071-release-source.mjs
      - scripts/render-v071-booklet.mjs
      - scripts/build-v063-rulebook-production.py
      - scripts/run-v063-rulebook-renderer.mjs
      - scripts/run-v071-rulebook-renderer.mjs
      - images/sketches/**
      - .github/workflows/materialize-v071-release-package.yml
  pull_request:
    branches:
      - main
    paths:
      - game-data/**
      - docs/v0.6.4-*.json
      - docs/v0.6.3-starter-decks.json
      - rulebook/**
      - card-design/**
      - images/artwork/cards/**
      - images/artwork/card-backgrounds/**
      - design-tokens.css
      - rulebook-design/**
      - rulebook-production/**
      - scripts/build-v071-release-source.mjs
      - scripts/render-v071-booklet.mjs
      - scripts/build-v063-rulebook-production.py
      - scripts/run-v063-rulebook-renderer.mjs
      - scripts/run-v071-rulebook-renderer.mjs
      - images/sketches/**
      - .github/workflows/materialize-v071-release-package.yml

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: materialize-v071-release-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, 'Materialize v0.7.1 release package') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release cutover branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rulebook production dependencies
        run: |
          npm install
          npm install --no-save --package-lock=false pdf-lib
          npx playwright install --with-deps chromium

      - name: Install publication utility font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-inter
          fc-match Inter

      - name: Build v0.7.1 source snapshot
        run: |
          node --check scripts/build-v071-release-source.mjs
          node scripts/build-v071-release-source.mjs

      - name: Render approved v0.7.1 Rulebook booklet
        run: |
          node --check scripts/render-v071-booklet.mjs
          python -m py_compile scripts/build-v063-rulebook-production.py
          node --check scripts/run-v071-rulebook-renderer.mjs
          node scripts/render-v071-booklet.mjs

      - name: Validate materialized release package
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { PDFDocument } from 'pdf-lib';

          const root = 'releases/v0.7.1';
          const names = [
            'Gauntlet_v0.7.1_Rulebook.md',
            'Gauntlet_v0.7.1_Rulebook_Booklet.pdf',
            'Gauntlet_v0.7.1_Card_Anatomy.png',
            'Gauntlet_v0.7.1_Arcane_Trait_Mark.png',
            'Gauntlet_v0.7.1_Canonical_Data.json',
            'Gauntlet_v0.7.1_Starter_Decks.json',
            'Gauntlet_v0.7.1_Source_Provenance.json',
            'Gauntlet_v0.7.1_Manifest.json',
          ];
          for (const name of names) assert(fs.existsSync(`${root}/${name}`), `Missing ${name}`);
          assert(fs.existsSync('v0.7.1/index.html'), 'Missing v0.7.1 release landing page');

          const rulebook = fs.readFileSync(`${root}/Gauntlet_v0.7.1_Rulebook.md`, 'utf8');
          const manifest = JSON.parse(fs.readFileSync(`${root}/Gauntlet_v0.7.1_Manifest.json`, 'utf8'));
          const canonical = JSON.parse(fs.readFileSync(`${root}/Gauntlet_v0.7.1_Canonical_Data.json`, 'utf8'));
          const starters = JSON.parse(fs.readFileSync(`${root}/Gauntlet_v0.7.1_Starter_Decks.json`, 'utf8'));
          const provenance = JSON.parse(fs.readFileSync(`${root}/Gauntlet_v0.7.1_Source_Provenance.json`, 'utf8'));
          assert.equal(manifest.release_version, 'v0.7.1');
          assert.equal(manifest.status, 'current');
          assert.equal(provenance.source_version, 'v0.7.1');
          assert.equal(manifest.authority_set_id, provenance.authority_set_id);
          assert.equal(canonical.gameplay.cards.length, 142);
          assert.equal(canonical.mystics?.rites?.length ?? canonical.mystics?.ritePool?.length, 6);
          assert.equal(canonical.gameplay.territories.length, 25);
          assert.equal(canonical.gameplay.factions.length, 6);
          assert.equal(starters.decks.length, 12);
          const diplomats = canonical.gameplay.factions.find(faction => faction.id === 'diplomats');
          assert.equal(diplomats?.factionRules?.peace_treaty_threshold, 6);
          assert.match(rulebook, /Ratify six(?:<!--[^>]+-->)? different Proposals/);
          assert.match(rulebook, /if six(?:<!--[^>]+-->)? different Proposals are ratified/);
          assert.doesNotMatch(rulebook, /Ratify five different Proposals|if five different Proposals are ratified/);
          assert.match(rulebook, /## Card anatomy/);
          assert.match(rulebook, /!\[Card anatomy diagram\]/);
          assert.match(rulebook, /!\[Arcane trait mark example\]/);
          assert.doesNotMatch(rulebook, /\bpending(?:-|\s+)battles?\b|\bFaction Actions?\b|\bFaction Abilit(?:y|ies)\b|\bfaction procedure\b/i);
          assert(canonical.faction_feature_taxonomy?.actionProfiles?.['1 Action']);
          assert.equal(canonical.leaders.length, 12);
          assert(canonical.leaders.every(leader => Array.isArray(leader.sections) && leader.sections.every(section => !Array.isArray(section) && section.classification && section.name)));
          const intelligence = canonical.gameplay.factions.find(faction => faction.id === 'intelligence');
          assert.equal(intelligence.resource, 'Intel (no maximum)');
          assert.equal(intelligence.progression, 'Operation Progress');
          const mystics = canonical.gameplay.factions.find(faction => faction.id === 'mystics');
          assert.equal(mystics.resource, null);
          assert.equal(mystics.progression, 'Rites');
          assert(fs.statSync(`${root}/Gauntlet_v0.7.1_Card_Anatomy.png`).size > 10000);
          assert(fs.statSync(`${root}/Gauntlet_v0.7.1_Arcane_Trait_Mark.png`).size > 5000);
          assert.equal(manifest.counts.static_figures, 2);

          const pdf = await PDFDocument.load(fs.readFileSync(`${root}/Gauntlet_v0.7.1_Rulebook_Booklet.pdf`));
          assert.equal(pdf.getPageCount(), manifest.pdf_outputs[0].pages);
          console.log(`Validated v0.7.1 package with ${pdf.getPageCount()} booklet sides.`);
          NODE

      - name: Upload v0.7.1 release package preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-v0.7.1-release-package-preview
          path: releases/v0.7.1/**
          if-no-files-found: error

      - name: Prepare protected-main release refresh
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          branch="automation/v071-release-package-refresh"
          files=(
            releases/v0.7.1/Gauntlet_v0.7.1_Rulebook.md
            releases/v0.7.1/Gauntlet_v0.7.1_Rulebook_Booklet.pdf
            releases/v0.7.1/Gauntlet_v0.7.1_Card_Anatomy.png
            releases/v0.7.1/Gauntlet_v0.7.1_Arcane_Trait_Mark.png
            releases/v0.7.1/Gauntlet_v0.7.1_Canonical_Data.json
            releases/v0.7.1/Gauntlet_v0.7.1_Starter_Decks.json
            releases/v0.7.1/Gauntlet_v0.7.1_Source_Provenance.json
            releases/v0.7.1/Gauntlet_v0.7.1_Manifest.json
          )

          if git diff --quiet -- "${files[@]}"; then
            echo "Generated v0.7.1 package already matches main."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add "${files[@]}"
          git commit -m "Refresh v0.7.1 release package"
          git push --force origin "HEAD:$branch"

          compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
          echo "Generated refresh branch: `$branch`" >> "$GITHUB_STEP_SUMMARY"
          echo "Refresh PR: $compare_url" >> "$GITHUB_STEP_SUMMARY"

          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            if gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "Refresh v0.7.1 release package" \
              --body "Automated rematerialization of the current v0.7.1 release package after publication-source changes landed on main. This updates the tracked Rulebook booklet PDF and its manifest/provenance outputs without bypassing protected-main review."; then
              pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
            else
              echo "::warning::GitHub Actions could not open the refresh PR automatically. The branch is ready at $compare_url."
            fi
          fi

          if [[ -n "$pr_number" ]]; then
            echo "Refresh PR #$pr_number is open; dispatching the protected-main checks on the generated head commit."
            gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
            gh workflow run pr-quality-gate.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
            gh workflow run governance-integrity.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          fi

      - name: Commit materialized release package
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/v0.7.1-finalize'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/commit-generated-files.mjs \
            "Materialize v0.7.1 release package" -- \
            releases/v0.7.1/Gauntlet_v0.7.1_Rulebook.md \
            releases/v0.7.1/Gauntlet_v0.7.1_Rulebook_Booklet.pdf \
            releases/v0.7.1/Gauntlet_v0.7.1_Card_Anatomy.png \
            releases/v0.7.1/Gauntlet_v0.7.1_Arcane_Trait_Mark.png \
            releases/v0.7.1/Gauntlet_v0.7.1_Canonical_Data.json \
            releases/v0.7.1/Gauntlet_v0.7.1_Starter_Decks.json \
            releases/v0.7.1/Gauntlet_v0.7.1_Source_Provenance.json \
            releases/v0.7.1/Gauntlet_v0.7.1_Manifest.json