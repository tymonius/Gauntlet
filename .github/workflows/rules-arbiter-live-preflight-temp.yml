name: Rules Arbiter production preflight (temporary)

on:
  push:
    branches:
      - rules-arbiter-live-preflight

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deployed behavior revision and authority set
        shell: bash
        run: |
          set -euo pipefail
          node scripts/resolve-current-live-publication.mjs --plan > "$RUNNER_TEMP/rules-plan.json"
          PLAN_PATH="$RUNNER_TEMP/rules-plan.json" node <<'NODE'
          const fs = require('node:fs');

          const plan = JSON.parse(fs.readFileSync(process.env.PLAN_PATH, 'utf8'));

          async function getJson(label, url) {
            const response = await fetch(url, {
              cache: 'no-store',
              headers: { 'User-Agent': 'Gauntlet-production-preflight' },
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`${label} returned HTTP ${response.status}: ${text.slice(0, 500)}`);
            try {
              return JSON.parse(text);
            } catch {
              throw new Error(`${label} did not return JSON: ${text.slice(0, 500)}`);
            }
          }

          const health = await getJson('Worker health', plan.healthUrl);
          console.log(`Worker behavior revision: ${health.behaviorRevision || 'missing'}`);
          console.log(`Expected behavior revision: ${plan.behaviorRevision}`);
          if (health.behaviorRevision !== plan.behaviorRevision) {
            throw new Error(`Worker behavior revision mismatch: expected ${plan.behaviorRevision}, received ${health.behaviorRevision || 'missing'}`);
          }

          const manifestUrl = new URL(plan.manifestPath, 'https://gauntlet.run/').href;
          const manifest = await getJson('Published manifest', manifestUrl);
          console.log(`Published authority set: ${manifest.authority_set_id || 'missing'}`);
          console.log(`Expected authority set: ${plan.authoritySetId}`);
          if (manifest.authority_set_id !== plan.authoritySetId) {
            throw new Error(`Published authority-set mismatch: expected ${plan.authoritySetId}, received ${manifest.authority_set_id || 'missing'}`);
          }

          const corpus = await getJson('Worker corpus health', plan.corpusHealthUrl);
          console.log(`Worker corpus ok: ${String(corpus.ok)}`);
          console.log(`Worker authority set: ${corpus.authoritySetId || 'missing'}`);
          if (corpus.ok !== true || corpus.authoritySetId !== plan.authoritySetId) {
            throw new Error(`Worker authority-set mismatch: expected ${plan.authoritySetId}, received ${corpus.authoritySetId || 'missing'} (ok=${String(corpus.ok)})`);
          }

          console.log('Production Rules Arbiter preflight passed without paid API calls.');
          NODE
