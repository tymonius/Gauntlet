name: Apply reveal-choice yield fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 1625
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v070-reveal-parity-tranche
          fetch-depth: 1
      - name: Yield reveal choices owned by outer facades
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/v070/battle-engine-reveal-order.ts')
          text = path.read_text()
          old = """        case 'capital_punishment': opened = openV070CapitalPunishmentBattleChoice(state); break;\n      }\n      if (opened) return true;\n      continue;\n"""
          new = """        case 'capital_punishment': opened = openV070CapitalPunishmentBattleChoice(state); break;\n        default:\n          // A later stacked battle facade may own this reveal choice. Yield\n          // instead of spinning here so that outer facade can open it.\n          return true;\n      }\n      if (opened) return true;\n      continue;\n"""
          if old not in text:
              if new in text:
                  print('Reveal-choice yield fix is already present.')
                  raise SystemExit(0)
              raise SystemExit('Expected reveal-choice continuation block was not found.')
          path.write_text(text.replace(old, new, 1))
          PY
          if git diff --quiet -- src/v070/battle-engine-reveal-order.ts; then
            exit 0
          fi
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add src/v070/battle-engine-reveal-order.ts
          git commit -m 'Yield reveal choices to outer battle facades'
          git push origin HEAD:feature/v070-reveal-parity-tranche
