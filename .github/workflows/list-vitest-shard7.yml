name: Isolate Vitest shard 7

on:
  pull_request:

permissions:
  contents: read

jobs:
  isolate:
    if: github.event.pull_request.number == 1625
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run shard 7 without known-good files
        run: |
          timeout --kill-after=10s 90s npx vitest related --run --passWithNoTests \
            --reporter=verbose --shard=7/16 \
            --exclude 'tests/arcane-card-symbol.test.ts' \
            --exclude 'tests/v064-rules-arbiter-onset.test.ts' \
            --exclude 'tests/v064-rules-arbiter-proposals.test.ts' \
            --exclude 'tests/v064-rules-arbiter-territories.test.ts' \
            --exclude 'src/v070/brothers-in-arms-battle.test.ts' \
            --exclude 'src/v070/mystics-leaders.test.ts' \
            --exclude 'src/v070/battle-effects-core-modifiers.test.ts' \
            --exclude 'src/v070/spirit-hollow.test.ts' \
            --exclude 'src/v070/tariffs-battle.test.ts' \
            --exclude 'src/v070/intelligence-leaders.test.ts' \
            --exclude 'src/v070/territory-monastery.test.ts' \
            --exclude 'src/v070/encampment-overlay.test.ts' \
            src/v070/battle-effects-pre-counterworks.ts \
            src/v070/battle-engine-pre-accusation.ts \
            src/v070/battle-negation.ts \
            src/v070/battle-reveal-choices.ts
