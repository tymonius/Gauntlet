name: Trace Counterworks imports

on:
  pull_request:

permissions:
  contents: read

jobs:
  isolate:
    if: github.event.pull_request.number == 1625
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Trace Counterworks test imports
        run: |
          cat > .counterworks-import-debug.ts <<'EOF'
          const modules = [
            './src/content/v070.ts',
            './src/v070/engine.ts',
            './src/v070/turn-engine.ts',
            './src/v070/battle-engine.ts',
            './src/v070/counterworks-battle.ts',
            './src/v070/overlays.ts',
            './src/v070/battle-effects.ts',
            './src/v070/views.ts',
          ];
          for (const modulePath of modules) {
            console.log(`[IMPORT START] ${modulePath}`);
            await import(modulePath);
            console.log(`[IMPORT DONE] ${modulePath}`);
          }
          EOF
          timeout --kill-after=10s 90s npx vite-node .counterworks-import-debug.ts
