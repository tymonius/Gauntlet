name: Isolate Counterworks hang

on:
  pull_request:

permissions:
  contents: read

jobs:
  isolate:
    if: github.event.pull_request.number == 1625
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run Counterworks alone with hang diagnostics
        run: |
          timeout --kill-after=10s 90s npx vitest run src/v070/counterworks-battle.test.ts \
            --reporter=verbose --reporter=hanging-process
