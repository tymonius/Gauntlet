name: Isolate Counterworks tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  isolate:
    if: github.event.pull_request.number == 1625
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: authority
            pattern: locks the handler
          - id: opens-choice
            pattern: opens at the normal reveal stage
          - id: suppress-overlay
            pattern: makes one existing Overlay inactive
          - id: arm-prevention
            pattern: can arm prevention
          - id: prevent-overlay
            pattern: prevents and discards the next opposing Overlay
          - id: friendly-then-opposing
            pattern: does not consume prevention on a friendly Overlay
          - id: invalid-suppression
            pattern: rejects suppression mode
    name: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run isolated Counterworks test
        run: |
          timeout --kill-after=5s 30s npx vitest run src/v070/counterworks-battle.test.ts \
            -t "${{ matrix.pattern }}" --reporter=verbose
