name: Isolate Vitest shard 7

on:
  pull_request:

permissions:
  contents: read

jobs:
  isolate:
    if: github.event.pull_request.number == 1625
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Print every file collected in shard 7
        run: |
          cat > .vitest-shard-debug-reporter.mjs <<'EOF'
          export default class ShardDebugReporter {
            onInit(ctx) {
              this.ctx = ctx;
            }
            onCollected() {
              const files = this.ctx.state.getFiles();
              for (const file of files) console.log(`[COLLECTED] ${file.name}`);
            }
          }
          EOF
          timeout --kill-after=10s 90s npx vitest related --run --passWithNoTests \
            --reporter=./.vitest-shard-debug-reporter.mjs --reporter=verbose \
            --shard=7/16 \
            --exclude 'tests/arcane-card-symbol.test.ts' \
            --exclude 'tests/v064-rules-arbiter-onset.test.ts' \
            --exclude 'tests/v064-rules-arbiter-proposals.test.ts' \
            --exclude 'tests/v064-rules-arbiter-territories.test.ts' \
            src/v070/battle-effects-pre-counterworks.ts \
            src/v070/battle-engine-pre-accusation.ts \
            src/v070/battle-negation.ts \
            src/v070/battle-reveal-choices.ts
