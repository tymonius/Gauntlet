name: Validate v0.6.3 cross-surface closeout

on:
  push:
    branches:
      - agent/v063-cross-surface-closeout
      - agent/v063-final-release-refresh
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/validate-v063-cross-surface-closeout.yml'
      - 'config/release-lifecycle.json'
      - 'config/release-locks.json'
      - 'scripts/validate-release-recovery-state.mjs'
      - 'docs/Gauntlet_v0.6.3_Cross_Surface_Closeout_Matrix.md'
      - 'scripts/build-v063-cross-surface-closeout.mjs'
      - 'scripts/validate-v063-cross-surface-closeout.mjs'
      - 'scripts/**v063**'
      - 'artifacts/v0.6.3/**'
      - 'v0.6.3/**'
      - 'rules-assistant/*v063*'
      - 'src/v063/**'
      - 'src/content/v063.ts'
      - 'images/faction-symbols/**'
      - 'card-design/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v063-cross-surface-closeout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    outputs:
      v063_status: ${{ steps.release.outputs.v063_status }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        name: Read v0.6.3 lifecycle state
        run: |
          status=$(node -e "const l=require('./config/release-lifecycle.json'); process.stdout.write(String(l.releases?.['v0.6.3']?.status || 'missing'))")
          echo "v063_status=$status" >> "$GITHUB_OUTPUT"
          echo "v0.6.3 lifecycle status: $status"

  freeze-withdrawn-evidence:
    needs: lifecycle
    if: needs.lifecycle.outputs.v063_status == 'withdrawn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify withdrawn v0.6.3 cross-surface evidence is immutable
        run: node scripts/validate-release-recovery-state.mjs

  require-explicit-reactivation:
    needs: lifecycle
    if: needs.lifecycle.outputs.v063_status != 'withdrawn'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse implicit reactivation
        run: |
          echo 'v0.6.3 is no longer marked withdrawn, but the historical closeout generator is intentionally frozen during recovery.'
          echo 'Restore/rebuild the active closeout workflow explicitly from docs/recovery/frozen-workflows/validate-v063-cross-surface-closeout.yml or the preserved archive ref only after the clean v0.6.3 reconstruction is ready.'
          exit 1
