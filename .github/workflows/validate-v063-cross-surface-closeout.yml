name: Validate v0.6.3 cross-surface closeout

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/validate-v063-cross-surface-closeout.yml'
      - 'scripts/validate-current-public-contract.mjs'
      - 'releases/v0.6.3-reconstructed/**'
      - 'index.html'
      - 'start/**'
      - 'rulebook/**'
      - 'card-reference/**'
      - 'factions/**'
      - 'deckbuilder/**'
      - 'rules-arbiter/**'
      - 'design-tokens.css'
      - 'images/faction-symbols/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-v063-cross-surface-closeout.yml'
      - 'scripts/validate-current-public-contract.mjs'
      - 'releases/v0.6.3-reconstructed/**'
      - 'index.html'
      - 'start/**'
      - 'rulebook/**'
      - 'card-reference/**'
      - 'factions/**'
      - 'deckbuilder/**'
      - 'rules-arbiter/**'
      - 'design-tokens.css'
      - 'images/faction-symbols/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v063-cross-surface-closeout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-current-public-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current publication
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install contract dependency
        run: npm install --no-save --package-lock=false pdf-lib

      - name: Validate current player-facing publication contract
        run: node scripts/validate-current-public-contract.mjs
