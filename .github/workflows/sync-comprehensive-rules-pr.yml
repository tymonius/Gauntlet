name: Temporary Complete Rules fix

on:
  push:
    branches:
      - rules/complete-rules-core-readability

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: rules/complete-rules-core-readability

      - name: Restore stable section references and remove debug output
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'scripts/render-comprehensive-rules.mjs';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace('### IV.1 Gauntlet, Position, and Front Line', '### IV.1 Gauntlet and Position');
          source = source.replace('### V.2 Gambits, Reserves, and Tactics', '### V.2 Commitment sources and Reserve');
          const noisy = `    console.error('Comprehensive Rules are stale. Run: node scripts/render-comprehensive-rules.mjs --write');\n    console.error('---BEGIN EXPECTED COMPREHENSIVE RULES---');\n    console.error(output);\n    console.error('---END EXPECTED COMPREHENSIVE RULES---');`;
          const quiet = `    console.error('Comprehensive Rules are stale. Run: node scripts/render-comprehensive-rules.mjs --write');`;
          if (source.includes(noisy)) source = source.replace(noisy, quiet);
          fs.writeFileSync(path, source);
          NODE
          node scripts/render-comprehensive-rules.mjs --write

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/render-comprehensive-rules.mjs packages/rules/comprehensive/comprehensive-rules.md
          git commit -m "Preserve Complete Rules section references"
          git push origin HEAD:rules/complete-rules-core-readability
