name: Temporary Complete Rules cleanup

on:
  push:
    branches:
      - rules/complete-rules-core-readability

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: rules/complete-rules-core-readability

      - name: Remove temporary debug output and workflow
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'scripts/render-comprehensive-rules.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const noisy = `    console.error('Comprehensive Rules are stale. Run: node scripts/render-comprehensive-rules.mjs --write');\n    console.error('---BEGIN EXPECTED COMPREHENSIVE RULES---');\n    console.error(output);\n    console.error('---END EXPECTED COMPREHENSIVE RULES---');`;
          const quiet = `    console.error('Comprehensive Rules are stale. Run: node scripts/render-comprehensive-rules.mjs --write');`;
          if (!source.includes(noisy)) throw new Error('Expected temporary debug block was not found.');
          source = source.replace(noisy, quiet);
          fs.writeFileSync(path, source);
          NODE
          git rm .github/workflows/sync-comprehensive-rules-pr.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/render-comprehensive-rules.mjs .github/workflows/sync-comprehensive-rules-pr.yml
          git commit -m "Remove temporary Complete Rules sync tooling"
          git push origin HEAD:rules/complete-rules-core-readability
