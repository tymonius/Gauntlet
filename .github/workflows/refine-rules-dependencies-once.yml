name: Refine rules dependencies once

on:
  push:
    branches:
      - rules/restore-shared-baseline

permissions:
  contents: write

jobs:
  refine:
    if: ${{ !contains(github.event.head_commit.message, '[rules-dependencies-refined]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rules/restore-shared-baseline
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Register granular semantic rules and narrow teaching dependencies
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const contractPath = 'config/rules-surface-contract.json';
          const restorationPath = 'docs/v0.7.2-shared-baseline-restoration.json';
          const contract = JSON.parse(fs.readFileSync(contractPath, 'utf8'));
          const restoration = JSON.parse(fs.readFileSync(restorationPath, 'utf8'));

          const rule = (id, path) => ({
            id,
            scope: 'core',
            sources: [{ path }],
          });

          const newRules = [
            rule('core.turn.sequence', ['gameplay', 'turn', 'sequence']),
            rule('core.turn.draw', ['gameplay', 'turn', 'draw']),
            rule('core.turn.actions', ['gameplay', 'turn', 'actions']),
            rule('core.turn.cleanup', ['gameplay', 'turn', 'cleanup']),
            rule('core.battlefield.position', ['gameplay', 'battlefield', 'position']),
            rule('core.battlefield.movement', ['gameplay', 'battlefield', 'movement_rules']),
            rule('core.battlefield.occupation', ['gameplay', 'battlefield', 'occupation']),
            rule('core.battlefield.counterattack', ['gameplay', 'battlefield', 'counterattack']),
            rule('core.battle.battle-total', ['gameplay', 'battle', 'battle_total']),
            rule('core.battle.advantage-disadvantage', ['gameplay', 'battle', 'advantage_disadvantage']),
            rule('core.battle.normal-result', ['gameplay', 'battle', 'normal_result']),
            rule('core.battle.aftermath', ['gameplay', 'battle', 'aftermath']),
            rule('core.cards.golden-rules', ['gameplay', 'card_rules', 'golden_rules']),
            rule('core.cards.shared-timing', ['gameplay', 'card_rules', 'shared_timing']),
            rule('core.cards.reveal', ['gameplay', 'card_rules', 'reveal']),
            rule('core.cards.negation', ['gameplay', 'card_rules', 'negation']),
            rule('core.cards.replacement', ['gameplay', 'card_rules', 'replacement']),
            rule('core.cards.revising-choice', ['gameplay', 'card_rules', 'revising_choice']),
            rule('core.cards.overlay', ['gameplay', 'card_rules', 'overlay']),
          ];

          const existing = new Set(contract.ruleRegistry.map(item => item.id));
          const additions = newRules.filter(item => !existing.has(item.id));
          const factionStart = contract.ruleRegistry.findIndex(item => item.id.startsWith('faction.'));
          contract.ruleRegistry.splice(factionStart >= 0 ? factionStart : contract.ruleRegistry.length, 0, ...additions);

          const chapter = id => {
            const found = contract.publicationArchitecture.playerGuide.chapters.find(item => item.id === id);
            if (!found) throw new Error(`Missing Player Guide chapter ${id}`);
            return found;
          };

          chapter('turn').dependsOn = [
            'core.turn.sequence',
            'core.turn.draw',
            'core.turn.actions',
            'core.turn.cleanup',
          ];

          chapter('movement').dependsOn = [
            'core.turn',
            'core.battlefield.position',
            'core.battlefield.movement',
            'core.battle.movement-initiation',
          ];

          chapter('battles').dependsOn = [
            'core.battle.sequence',
            'core.battle.onset',
            'core.battle.commitment-order',
            'core.battle.gambit-count',
            'core.battle.tactic-count',
            'core.battle.reserve-size',
            'core.battle.battle-total',
            'core.battle.advantage-disadvantage',
            'core.battle.defensive-edge',
            'core.battle.tiebreak',
            'core.battle.normal-result',
            'core.battle.aftermath',
          ];

          chapter('ground').dependsOn = [
            'core.battlefield.capture',
            'core.battlefield.front-line',
            'core.battlefield.occupation',
          ];

          const part = id => {
            const found = contract.publicationArchitecture.comprehensiveRules.parts.find(item => item.id === id);
            if (!found) throw new Error(`Missing Comprehensive Rules part ${id}`);
            return found;
          };

          part('turn-structure').covers = [
            'core.turn',
            'core.turn.sequence',
            'core.turn.draw',
            'core.turn.actions',
            'core.turn.cleanup',
          ];

          part('movement-battlefield').covers = [
            'core.battlefield',
            'core.battlefield.position',
            'core.battlefield.movement',
            'core.battlefield.occupation',
            'core.battlefield.counterattack',
            'core.battle.movement-initiation',
          ];

          part('battles').covers = [
            'core.battle',
            'core.battle.battle-total',
            'core.battle.advantage-disadvantage',
            'core.battle.normal-result',
            'core.battle.aftermath',
          ];

          part('cards-zones').covers = [
            'core.cards',
            'core.cards.reveal',
          ];

          part('effects-timing').covers = [
            'core.cards.golden-rules',
            'core.cards.shared-timing',
            'core.cards.reveal',
            'core.cards.negation',
            'core.cards.replacement',
            'core.cards.revising-choice',
            'core.battle',
          ];

          part('persistent-shared').covers = [
            'core.cards.overlay',
          ];

          restoration.semanticRuleIds = {
            battle: [
              'core.battle.battle-total',
              'core.battle.advantage-disadvantage',
              'core.battle.normal-result',
              'core.battle.aftermath',
            ],
            turn: [
              'core.turn.draw',
              'core.turn.actions',
              'core.turn.cleanup',
            ],
            battlefield: [
              'core.battlefield.position',
              'core.battlefield.movement',
              'core.battlefield.occupation',
              'core.battlefield.counterattack',
            ],
            cardRules: [
              'core.cards.golden-rules',
              'core.cards.shared-timing',
              'core.cards.reveal',
              'core.cards.negation',
              'core.cards.replacement',
              'core.cards.revising-choice',
              'core.cards.overlay',
            ],
          };
          restoration.supportingPublicationRuleIds = [
            'core.turn.sequence',
          ];

          if (!restoration.restoredConcepts.cardRules.includes('shared golden rules and partial-resolution defaults')) {
            restoration.restoredConcepts.cardRules.unshift('shared golden rules and partial-resolution defaults');
          }

          fs.writeFileSync(contractPath, `${JSON.stringify(contract, null, 2)}\n`);
          fs.writeFileSync(restorationPath, `${JSON.stringify(restoration, null, 2)}\n`);
          NODE

      - name: Validate authority and publication contracts
        run: |
          node scripts/card-authority/validate-current-game.mjs
          node scripts/validate-rules-publication-contract.mjs
          node scripts/validate-rules-publication-scaffolds.mjs

      - name: Commit refinement and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/refine-rules-dependencies-once.yml
          git config user.name 'Gauntlet rules materializer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/rules-surface-contract.json docs/v0.7.2-shared-baseline-restoration.json .github/workflows/refine-rules-dependencies-once.yml
          git commit -m 'Register granular shared rule dependencies [rules-dependencies-refined]'
          git push origin HEAD:rules/restore-shared-baseline
