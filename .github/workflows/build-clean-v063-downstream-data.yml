name: Build clean v0.6.3 downstream data

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/build-clean-v063-downstream-data.mjs
      - scripts/validate-clean-v063-downstream-data.mjs
      - artifacts/reconstruction/clean-v0.6.3/complete-authority/**
      - artifacts/reconstruction/clean-v0.6.3/faction-guides/**
      - artifacts/reconstruction/clean-v0.6.3/rulebook/**
      - artifacts/reconstruction/clean-v0.6.3/downstream/**
      - releases/v0.6.1/Gauntlet_v0.6.1_Canonical_Data.json
      - v0.6.3/data/starter-decks-candidate.js
      - docs/Gauntlet_v0.6.3_Starter_Deck_Finalization.md
      - config/reconstruction-version-plan.json
      - config/reconstruction-version-resolutions.json
      - config/release-lifecycle.json
      - .github/workflows/build-clean-v063-downstream-data.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-v063-downstream-data-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconstruction inputs
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/build-clean-v063-downstream-data.yml
            /scripts/build-clean-v063-downstream-data.mjs
            /scripts/validate-clean-v063-downstream-data.mjs
            /config/reconstruction-version-plan.json
            /config/reconstruction-version-resolutions.json
            /config/release-lifecycle.json
            /artifacts/reconstruction/clean-v0.6.3/complete-authority/
            /artifacts/reconstruction/clean-v0.6.3/faction-guides/
            /artifacts/reconstruction/clean-v0.6.3/rulebook/
            /artifacts/reconstruction/clean-v0.6.3/downstream/
            /releases/v0.6.1/Gauntlet_v0.6.1_Canonical_Data.json
            /v0.6.3/data/starter-decks-candidate.js
            /docs/Gauntlet_v0.6.3_Starter_Deck_Finalization.md

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check downstream scripts
        run: |
          node --check scripts/build-clean-v063-downstream-data.mjs
          node --check scripts/validate-clean-v063-downstream-data.mjs

      - name: Build clean v0.6.3 downstream data
        run: node scripts/build-clean-v063-downstream-data.mjs

      - name: Validate clean v0.6.3 downstream data
        run: node scripts/validate-clean-v063-downstream-data.mjs

      - name: Reject withdrawn candidate from gameplay-bearing outputs
        run: |
          ! grep -F 'artifacts/v0.6.3/release-candidate/Gauntlet_v0.6.3_Canonical_Data.json' artifacts/reconstruction/clean-v0.6.3/downstream/canonical-data.json
          ! grep -F 'artifacts/v0.6.3/release-candidate/Gauntlet_v0.6.3_Canonical_Data.json' artifacts/reconstruction/clean-v0.6.3/downstream/starter-decks.json

      - name: Reject whitespace errors
        run: git diff --check -- artifacts/reconstruction/clean-v0.6.3/downstream

      - name: Require committed deterministic outputs
        run: git diff --exit-code -- artifacts/reconstruction/clean-v0.6.3/downstream
