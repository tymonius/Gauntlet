name = "gauntlet-rules-assistant"
main = "worker-entry.js"
compatibility_date = "2026-07-29"

[vars]
SITE_ORIGIN = "https://gauntlet.run"
ALLOWED_ORIGINS = "https://gauntlet.run,http://localhost:8000,http://127.0.0.1:8000"
OPENAI_MODEL = "gpt-5.6-terra"
OPENAI_REASONING_EFFORT = "low"
RULES_SEMANTIC_PLANNER = "off"
RULES_VERIFIER = "off"
RULES_SOURCE_LIMIT = "8"
RULES_SOURCE_EXCERPT_LENGTH = "1000"
RULES_MODEL_REQUESTS_PER_IP_HOUR = "12"
RULES_MODEL_REQUESTS_PER_DAY = "50"
RULES_MODEL_REQUESTS_PER_MONTH = "200"

[[d1_databases]]
binding = "DB"
database_name = "gauntlet-rules-assistant"
database_id = "92edbc7f-f934-4260-b376-321ae1f02761"
migrations_dir = "migrations"
