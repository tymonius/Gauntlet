name: Build clean v0.6.2 faction authority

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify reconstruction gate
        run: node scripts/validate-reconstruction-version-plan-certified.mjs

      - name: Build clean v0.6.2 faction authorities
        run: node scripts/build-clean-v062-faction-authority.mjs

      - name: Normalize clean v0.6.2 faction authorities
        run: node scripts/normalize-clean-v062-faction-authority.mjs

      - name: Validate clean v0.6.2 faction authorities
        run: node scripts/validate-clean-v062-faction-authority.mjs
