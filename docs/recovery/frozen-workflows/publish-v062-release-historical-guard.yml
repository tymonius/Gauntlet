name: Publish v0.6.2 release package

# v0.6.2 is withdrawn. Keep this workflow available only for an intentional
# historical recovery operation; current-player changes must never invoke it.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v062-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  historical-recovery-only:
    runs-on: ubuntu-latest
    steps:
      - name: Check out requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refuse publication while v0.6.2 remains withdrawn
        run: |
          status=$(node -e "const l=require('./config/release-lifecycle.json'); process.stdout.write(String(l.releases?.['v0.6.2']?.status || 'missing'))")
          echo "v0.6.2 lifecycle status: $status"
          if [[ "$status" == "withdrawn" ]]; then
            node scripts/validate-release-recovery-state.mjs
            echo 'v0.6.2 is withdrawn; historical evidence is intact and no publication was attempted.'
            exit 0
          fi
          echo 'v0.6.2 is no longer withdrawn. A deliberate release-lifecycle change requires a dedicated publication plan rather than reusing this historical workflow.' >&2
          exit 1
