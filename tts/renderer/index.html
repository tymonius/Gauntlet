<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title>Gauntlet playable-card renderer redirect</title>
  <script>
    (() => {
      const target = new URL("/card-design/card-review-render.html", window.location.origin);
      for (const [key, value] of new URLSearchParams(window.location.search)) {
        target.searchParams.append(key, value);
      }
      target.hash = window.location.hash;
      window.location.replace(target);
    })();
  </script>
</head>
<body></body>
</html>
