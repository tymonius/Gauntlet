<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title>Gauntlet playable-card renderer redirect</title>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const card = String(params.get('card') || params.get('id') || '').trim();
      if (!card) {
        document.documentElement.dataset.redirectError = 'missing-card';
        return;
      }
      const target = new URL('/card-design/face-render.html', window.location.origin);
      target.searchParams.set('id', `card:${card}`);
      window.location.replace(target);
    })();
  </script>
</head>
<body></body>
</html>
