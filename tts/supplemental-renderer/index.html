<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title>Gauntlet supplemental renderer redirect</title>
  <script>(() => {
      const params = new URLSearchParams(window.location.search);
      const component = String(params.get('component') || '').trim();
      const side = String(params.get('side') || 'front').trim();
      let kind = '';
      let id = component;
      if (component.startsWith('mystics-rite-')) {
        kind = 'rite';
        id = component.replace(/^mystics-rite-/, '');
      } else if (component.endsWith('-reference') || component === 'universal-reference') {
        kind = 'reference';
      }
      if (!kind || !id) {
        document.documentElement.dataset.redirectError = 'unsupported-component';
        return;
      }
      const target = new URL('/card-design/component-render.html', window.location.origin);
      target.searchParams.set('kind', kind);
      target.searchParams.set('id', id);
      target.searchParams.set('side', side);
      target.searchParams.set('orientation', 'portrait');
      window.location.replace(target);
    })();</script>
</head>
<body></body>
</html>
