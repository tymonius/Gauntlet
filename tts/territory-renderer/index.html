<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title>Gauntlet Territory renderer redirect</title>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const territory = String(params.get('territory') || params.get('id') || '').trim();
      if (!territory) {
        document.documentElement.dataset.redirectError = 'missing-territory';
        return;
      }
      const target = new URL('/card-design/face-render.html', window.location.origin);
      target.searchParams.set('id', `territory:${territory}`);
      window.location.replace(target);
    })();
  </script>
</head>
<body></body>
</html>
