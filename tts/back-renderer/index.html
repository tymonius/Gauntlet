<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title>Gauntlet card-back renderer redirect</title>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const faction = String(params.get('faction') || 'intelligence').trim().toLowerCase() || 'intelligence';
      const target = new URL('/card-design/face-render.html', window.location.origin);
      target.searchParams.set('id', `back:${faction}`);
      window.location.replace(target);
    })();
  </script>
</head>
<body></body>
</html>
