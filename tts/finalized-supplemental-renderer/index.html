<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title>Gauntlet finalized supplemental renderer redirect</title>
  <script>(() => {
      const params = new URLSearchParams(window.location.search);
      const component = String(params.get('component') || '').trim();
      const side = String(params.get('side') || 'front').trim();
      let kind = '';
      let id = component;
      let orientation = 'portrait';
      if (component.startsWith('diplomats-proposal-')) {
        kind = 'proposal';
        id = component.replace(/^diplomats-proposal-/, '');
      } else if (component === 'financiers-capital-ledger') {
        kind = 'supplemental';
      } else if (component === 'financiers-deed') {
        kind = 'supplemental';
        orientation = 'landscape';
      }
      if (!kind || !id) {
        document.documentElement.dataset.redirectError = 'unsupported-component';
        return;
      }
      const target = new URL('/card-design/component-render.html', window.location.origin);
      target.searchParams.set('kind', kind);
      target.searchParams.set('id', id);
      target.searchParams.set('side', side);
      target.searchParams.set('orientation', orientation);
      window.location.replace(target);
    })();</script>
</head>
<body></body>
</html>
