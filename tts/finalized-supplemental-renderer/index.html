<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title>Gauntlet finalized supplemental renderer redirect</title>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const component = String(params.get('component') || '').trim();
      const side = String(params.get('side') || 'front').trim() === 'reverse' ? 'reverse' : 'front';
      if (!component) {
        document.documentElement.dataset.redirectError = 'missing-component';
        return;
      }
      const target = new URL('/card-design/face-render.html', window.location.origin);
      target.searchParams.set('id', `component:${component}:${side}`);
      window.location.replace(target);
    })();
  </script>
</head>
<body></body>
</html>
