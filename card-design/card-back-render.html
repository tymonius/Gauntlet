<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title>Gauntlet card-back render redirect</title>
  <script>
    const source = new URL(window.location.href);
    const target = new URL('/card-design/face-render.html', source.origin);
    target.searchParams.set('id', `back:${source.searchParams.get('faction') || 'intelligence'}`);
    const rules = source.searchParams.get('rules');
    if (rules) target.searchParams.set('rules', rules);
    window.location.replace(target);
  </script>
</head>
<body></body>
</html>
