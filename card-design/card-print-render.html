<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title>Gauntlet canonical render redirect</title>
  <script>
    (() => {
      const target = new URL("/card-design/card-review-render.html", window.location.origin);
      target.search = window.location.search;
      target.hash = window.location.hash;
      window.location.replace(target);
    })();
  </script>
</head>
<body></body>
</html>
